بكستان والكونغو وألمانيا وفرنسا وسويسرا.\n\nتمت مشاركة ممثلي مدرسة يكاترينودار اللاهوتية في هذا الحدث بمساعدة مالية من مؤسسة دعم الثقافة والتراث المسيحي."},"al":{"auto":"Më 17 shkurt 2026, Seminari Teologjik I Orenburgut priti Konferencën V Ndërkombëtare Shkencore dhe Praktike \"Ortodoksia në Rusi dhe jashtë Saj: Teologjia, Historia, kultura, Dialogu Ndërfetar.\"\n\nForumi shkencor jubilar iu kushtua 700 vjetorit të pushimit të Shën Pjetrit, Mitropolitit Të Kievit, Moskës dhe Gjithë Rusisë, dhe 1575 vjetorit të Këshillit Të Katërt Ekumenik.\n\nKonferenca u ndoq nga Peter Irung Willy Jubin, një student i Seminarit Teologjik Yekaterinodar nga Republika Demokratike e Kongos. Ai bëri një prezantim mbi \"Kisha Ortodokse në Republikën Demokratike të Kongos: historia, zhvillimi dhe sfidat moderne.\"\n\nAnëtari i stafit të seminarit R. s. Ivanov prezantoi raportin \"Pritja e parimit kolegjialitas në Teologjinë Katolike post-Konciliare: modele ekleziologjike për pajtimin e pajtueshmërisë me dogmën e parësisë së Papës Romak.\"\n\nKonferenca mblodhi pjesëmarrës nga 9 vende, përfshirë Rusinë, Bjellorusinë, Kazakistanin, Uzbekistanin, Kongon, Gjermaninë, Francën dhe Zvicrën.\n\nPjesëmarrja e përfaqësuesve të Seminarit Teologjik Yekaterinodar në këtë ngjarje u zhvillua me ndihmën financiare të Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë."},"cn":{"auto":"2026年2月17日，奥伦堡神学院主办了\"俄罗斯和国外的正统：神学，历史，文化，宗教间对话\"国际科学与实践会议。\"\n\n禧年科学论坛是为了纪念圣彼得安息700周年，基辅大都会，莫斯科和全俄罗斯，以及第四届大公会议1575周年。\n\n来自刚果民主共和国的Yekaterinodar神学院的学生Peter Irung Willy Jubin出席了会议。 他作了题为\"刚果民主共和国东正教：历史、发展和现代挑战\"的发言。\"\n\n神学院工作人员R.S.伊万诺夫提交了报告\"接受后和解天主教神学的合议原则：调和与罗马教皇至高无上的教条的教会模式。\"\n\n会议汇集了来自9个国家的与会者，包括俄罗斯，白俄罗斯，哈萨克斯坦，乌兹别克斯坦，刚果，德国，法国和瑞士。\n\n叶卡捷琳娜神学院的代表参加了这次活动,是在支持基督教文化和遗产基金会的财政援助下进行的。"},"el":{"auto":"Στις 17 Φεβρουαρίου 2026, το Θεολογικό Σεμινάριο του Όρενμπουργκ φιλοξένησε το Διεθνές Επιστημονικό και πρακτικό συνέδριο \"Ορθοδοξία στη Ρωσία και στο εξωτερικό: Θεολογία, Ιστορία, Πολιτισμός, διαθρησκευτικός διάλογος\".\n\nΤο επιστημονικό φόρουμ του Ιωβηλαίου αφιερώθηκε στην 700η επέτειο της ανάπαυσης του Αγίου Πέτρου, Μητροπολίτη Κιέβου, Μόσχας και όλης της Ρωσίας, και στην 1575η επέτειο της τέταρτης Οικουμενικής Συνόδου.\n\nΣτο Συνέδριο παρευρέθηκε ο Peter Irung Willy Jubin, φοιτητής του θεολογικού σεμιναρίου Yekaterinodar από τη Λαϊκή Δημοκρατία του Κονγκό. Έκανε μια παρουσίαση με θέμα \"Η Ορθόδοξη Εκκλησία στη Λαϊκή Δημοκρατία του Κονγκό: ιστορία, ανάπτυξη και σύγχρονες προκλήσεις\".\n\nΤο μέλος του προσωπικού του σεμιναρίου R. S. Ivanov παρουσίασε την έκθεση \"υποδοχή της αρχής collegialitas στη μετα-Συνοδική καθολική Θεολογία: εκκλησιολογικά μοντέλα για τη συμφιλίωση της συνοδικότητας με το δόγμα της υπεροχής του Ρωμαίου Ποντίφικα\".\n\nΤο συνέδριο συγκέντρωσε συμμετέχοντες από 9 χώρες, συμπεριλαμβανομένης της Ρωσίας, της Λευκορωσίας, του Καζακστάν, του Ουζμπεκιστάν, του Κονγκό, της Γερμανίας, της Γαλλίας και της Ελβετίας.\n\nΗ συμμετοχή εκπροσώπων του θεολογικού σεμιναρίου Yekaterinodar στην εκδήλωση πραγματοποιήθηκε με την οικονομική βοήθεια του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς."},"en":{"auto":"On February 17, 2026, Orenburg Theological Seminary hosted the V International Scientific and Practical Conference \"Orthodoxy in Russia and Abroad: Theology, History, culture, Interreligious Dialogue.\"\n\nThe jubilee Scientific Forum was dedicated to the 700th anniversary of the repose of St. Peter, Metropolitan of Kiev, Moscow and All Russia, and the 1575th anniversary of the Fourth Ecumenical Council.\n\nThe conference was attended by Peter Irung Willy Jubin, a student of the Yekaterinodar Theological Seminary from the Democratic Republic of the Congo. He made a presentation on \"The Orthodox Church in the Democratic Republic of the Congo: history, development and modern challenges.\"\n\nSeminary staff member R.S. Ivanov presented the report \"Reception of the collegialitas principle in post-Conciliar Catholic Theology: ecclesiological models for reconciling conciliarity with the dogma of the primacy of the Roman Pontiff.\"\n\nThe conference brought together participants from 9 countries, including Russia, Belarus, Kazakhstan, Uzbekistan, Congo, Germany, France and Switzerland.\n\nThe participation of representatives of the Yekaterinodar Theological Seminary in the event took place with the financial assistance of the Foundation for the Support of Christian Culture and Heritage."},"fr":{"auto":"Le 17 février 2026, la V conférence scientifique et pratique internationale «l'Orthodoxie en Russie et à l'étranger: théologie, histoire, culture, dialogue interreligieux»a eu lieu au séminaire d'Orenbourg.\n\nLe forum scientifique du Jubilé a été consacré au 700e anniversaire de Saint pierre, métropolite de Kiev, de Moscou et de toute la Russie, et au 1575e anniversaire du IV Concile œcuménique.\n\nPierre Irung Willy Joubin, étudiant au séminaire de Catherine, de la République Démocratique du Congo, a participé à la conférence. Il a fait un exposé intitulé «l'Église orthodoxe en République Démocratique du Congo: histoire, développement et défis contemporains».\n\nL'employé du séminaire R. S. Ivanov a présenté le rapport \" la Réception du principe de collegialitas dans la théologie catholique post-Concile: les modèles ecclésiologiques de l'harmonisation du Concile avec le dogme de la primauté du pontife romain».\n\nLa conférence a réuni des participants de 9 pays, dont la Russie, le Bélarus, le Kazakhstan, l'Ouzbékistan, la RD Congo, l'Allemagne, la France et la Suisse.\n\nLa participation des représentants du séminaire théologique d'ekaterinodar à l'événement a eu lieu avec l'aide financière du Fonds de soutien à la culture chrétienne et au patrimoine."},"ge":{"auto":"2026 წლის 17 თებერვალს ორენბურგის სასულიერო სემინარიამ უმასპინძლა V საერთაშორისო სამეცნიერო და პრაქტიკულ კონფერენციას \"მართლმადიდებლობა რუსეთში და მის ფარგლებს გარეთ: თეოლოგია, ისტორია, კულტურა, რელიგიათაშორისი დიალოგი.\"\n\nსაიუბილეო სამეცნიერო ფორუმი მიეძღვნა კიევის, მოსკოვისა და სრულიად რუსეთის მიტროპოლიტის წმინდა პეტრეს გადაყენების 700 წლისთავს და მეოთხე მსოფლიო კრების 1575 წლისთავს.\n\nკონფერენციას ესწრებოდა კონგოს დემოკრატიული რესპუბლიკის ეკატერინოდარის სასულიერო სემინარიის სტუდენტი პიტერ ირუნგ ვილი ჯუბინი. მან გააკეთა პრეზენტაცია თემაზე \" მართლმადიდებელი ეკლესია კონგოს დემოკრატიულ რესპუბლიკაში: ისტორია, განვითარება და თანამედროვე გამოწვევები.\"\n\nსემინარიის თანამშრომელმა რ.ს. ივანოვმა წარმოადგინა ანგარიში \"კოლეგიალიტასის პრინციპის მიღება პოსტ-კონსილიუმის კათოლიკურ თეოლოგიაში: ეკლესიოლოგიური მოდელები რომის პაპის უპირატესობის დოგმასთან შერიგების მიზნით.\"\n\nკონფერენციაში მონაწილეობა მიიღო 9 ქვეყნის, მათ შორის რუსეთის, ბელარუსის, ყაზახეთის, უზბეკეთის, კონგოს, გერმანიის, საფრანგეთისა და შვეიცარიის მონაწილეებმა.\n\nღონისძიებაში ეკატერინოდარის სასულიერო სემინარიის წარმომადგენლების მონაწილეობა მოხდა ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის ფინანსური დახმარებით."},"he":{"auto":"ב-17 בפברואר 2026 נערכה בסמינר הרוחני של אורנבורג כנס מדעי-מעשי בינלאומי V אורתודוקסיה ברוסיה ובחו \"ל: דת, היסטוריה, תרבות, דיאלוג בין-דתי.\n\nהפורום המדעי של יום השנה היה מוקדש ל-700 שנה להוצאתו של פטרוס הקדוש, מיטרופוליט קייב, מוסקבה וכל רוסיה, ול-1575 שנה לקונבליס האוניברסלי הרביעי.\n\nבכנס השתתף סטודנט של הסמינר הרוחני של קתרינודר פטר אירונג וילי ז ' ובין מהרפובליקה הדמוקרטית של קונגו. הוא נשא את הנאום \"הכנסייה האורתודוכסית ברפובליקה הדמוקרטית של קונגו: היסטוריה, פיתוח ואתגרים מודרניים\".\n\nעובד הסמינר ר. ס. איבנוב הציג את הדו\"ח\" קבלת עקרון collegialitas בתאולוגיה הקתולית הפוסט-קונבלית: מודלים אקלסיולוגיים של הסכמה של הקונבליות עם הדוגמה על פרימאט של הפונטיפיק הרומי\".\n\nהוועידה אספה משתתפים מ-9 מדינות, כולל רוסיה, בלארוס, קזחסטן, אוזבקיסטן, קונגו, גרמניה, צרפת ושווייץ.\n\nהשתתפותם של נציגי הסמינר הרוחני של קתרינודר באירוע התרחשה בסיוע פיננסי של קרן התמיכה בתרבות הנוצרית ובמורשת."},"ja":{"auto":"2026年2月17日、オレンブルク神学校は、V国際科学実践会議「ロシアと海外の正統派：神学、歴史、文化、宗教間対話」を開催しました。\"\n\nジュビリー科学フォーラムは、聖ペテロ、キエフ、モスクワ、全ロシアのメトロポリタンの安息の700周年、および第4エキュメニカル評議会の1575周年に捧げら\n\n会議には、コンゴ民主共和国のエカテリノダール神学校の学生であるPeter Irung Willy Jubinが出席しました。 彼は\"コンゴ民主共和国の正教会：歴史、開発と現代の課題\"についてプレゼンテーションを行いました。\"\n\n神学校のスタッフr.S.イワノフは報告書を発表しました「和解後のカトリック神学における合議主義の受容：ローマ教皇の優位性の教義と和解するた\"\n\nこの会議には、ロシア、ベラルーシ、カザフスタン、ウズベキスタン、コンゴ、ドイツ、フランス、スイスなど9カ国からの参加者が集まりました。\n\nイベントへのエカテリノダール神学校の代表者の参加は、キリスト教文化と遺産の支援のための財団の財政援助を受けて行われました。"},"ru":{"auto":"17 февраля 2026 года в Оренбургской духовной семинарии состоялась V Международная научно-практическая конференция «Православие в России и за рубежом: богословие, история, культура, межрелигиозный диалог».\n\nЮбилейный научный форум был посвящен 700-летию со дня преставления святителя Петра, митрополита Киевского, Московского и всея Руси, и 1575-летию IV Вселенского Собора.\n\nВ конференции принял участие студент Екатеринодарской духовной семинарии Петр Ирунг Вилли Жубин из Демократической Реcпублики Конго. Он выступил с докладом «Православная Церковь в Демократической Республике Конго: история, развитие и современные вызовы».\n\nСотрудник семинарии Р.С. Иванов представил доклад «Рецепция принципа collegialitas в пост-соборном католическом богословии: экклесиологические модели согласования соборности с догматом о примате Римского понтифика».\n\nКонференция собрала участников из 9 стран, включая Россию, Беларусь, Казахстан, Узбекистан, ДР Конго, Германию, Францию и Швейцарию.\n\nУчастие представителей Екатеринодарской духовной семинарии в мероприятии состоялось при финансовом содействии Фонда поддержки христианской культуры и наследия.","manual":"17 февраля 2026 года в Оренбургской духовной семинарии состоялась V Международная научно-практическая конференция «Православие в России и за рубежом: богословие, история, культура, межрелигиозный диалог».\n\nЮбилейный научный форум был посвящен 700-летию со дня преставления святителя Петра, митрополита Киевского, Московского и всея Руси, и 1575-летию IV Вселенского Собора.\n\nВ конференции принял участие студент Екатеринодарской духовной семинарии Петр Ирунг Вилли Жубин из Демократической Реcпублики Конго. Он выступил с докладом «Православная Церковь в Демократической Республике Конго: история, развитие и современные вызовы».\n\nСотрудник семинарии Р.С. Иванов представил доклад «Рецепция принципа collegialitas в пост-соборном католическом богословии: экклесиологические модели согласования соборности с догматом о примате Римского понтифика».\n\nКонференция собрала участников из 9 стран, включая Россию, Беларусь, Казахстан, Узбекистан, ДР Конго, Германию, Францию и Швейцарию.\n\nУчастие представителей Екатеринодарской духовной семинарии в мероприятии состоялось при финансовом содействии Фонда поддержки христианской культуры и наследия."},"sr":{"auto":"17.фебруара 2026. године у Оренбуршкој духовној семинарији одржана је V Међународна научно-практична конференција Православие у Русији и иностранству: богословие, историја, култура, међурелигиозни дијалог.\n\nЈубилејски научни форум је посвећен 700-годишњици од представљања светитеља Петра, митрополита Кијевског, московског и целе Русе, и 1575.годишњици IV свемирског Сабора.\n\nНа конференцији је учествовао Студент Екатеринодарске духовне семинарије Петр Ирунг Вилли Жубин из Демократске Републике Конго. Одржао је говор \"православна црква у Демократској Републици Конго: Историја, развој и савремени изазови\".\n\nРадник семинарије Р.С. Иванов представио је доклад \"Рецепција принципа collegialitas у пост-Саборној католичкој богословији: екклесиолошки модели усаглашавања саборности са догматом о примату Римског понтифика\".\n\nКонференција је окупила учеснике из 9 земаља, укључујући Русију, Белорусију, Казахстан, Узбекистан, ДР Конго, Немачку, Француску и Швајцарску.\n\nУчешће представника Екатеринодарске духовне семинарије у догађају је одржано уз финансијску помоћ Фонда за подршку хришћанске културе и наслеђа."},"tr":{"auto":"17 Şubat 2026'da Orenburg İlahiyat Semineri'nde V. Uluslararası Bilimsel ve Pratik Konferans «Rusya'da ve Yurtdışında Ortodoksluk: Teoloji, Tarih, kültür, Dinler arası diyalog» düzenlendi.\n\nYıldönümü Bilimsel Forumu, Kiev, Moskova ve tüm Rusya Metropoliti Aziz Petrus'un kutsanmasının 700. yıldönümüne ve IV Ekümenik Konseyin 1575. yıldönümüne adanmıştır.\n\nKonferansa Demokratik Kongo Cumhuriyeti'nden Ekaterinodar İlahiyat Semineri öğrencisi Pyotr Irung Willy Zhubin katıldı. «Demokratik Kongo Cumhuriyeti'ndeki Ortodoks Kilisesi: Tarih, Kalkınma ve Çağdaş Zorluklar» başlıklı bir konuşma yaptı.\n\nRuhban okulunun bir çalışanı olan R.S. Ivanov, «Konsey sonrası Katolik Teolojisinde collegialitas ilkesinin Kabulü: Katolikliğin Roma Papazının önceliği dogmasıyla uyumlaştırılmasının eklesiyolojik modelleri» başlıklı bir makale sundu.\n\nKonferans, Rusya, Beyaz Rusya, Kazakistan, Özbekistan, Kongo Demokratik Cumhuriyeti, Almanya, Fransa ve İsviçre dahil olmak üzere 9 ülkeden katılımcıları bir araya getirdi.\n\nYekaterinodar İlahiyat Fakültesi temsilcilerinin etkinliğe katılımı, Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı'nın mali yardımı ile gerçekleşti."}}},"component":"content-flow"},{"images":[{"title":{},"width":920,"chosen":false,"height":518,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/10/image-name_930f5d6f-8f96-4fec-9228-1b0ca4999736","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/10/image-name_02d6c645-4fa9-4993-81c0-2a8a1bad4616"},{"title":{},"width":920,"chosen":false,"height":518,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/10/image-name_4f34ee54-8374-4f95-93c0-b062a9db847d","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/10/image-name_0d8f62b8-5d4a-4b16-b2cc-d2ad4363fbde"},{"title":{},"width":920,"chosen":false,"height":518,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/10/image-name_efce2235-006a-4920-9f89-2ab92b64d40d","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/ "tr":{"auto":"Sırp Patriği, Rosatom devlet şirketi Genel Müdürü Alexei Likhachev'i ödüllendirdi"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/21/image-name_2cb31391-dafc-4c74-8928-ac479eca1ddf","title":{"ae":{"auto":"منح بطريرك صربيا أليكسي ليخاتشيف ، الرئيس التنفيذي لشركة روساتوم الحكومية"},"al":{"auto":"Patriarku I Serbisë dha Alexey Likhachev, CEO I Korporatës Shtetërore Rosatom"},"cn":{"auto":"塞尔维亚族长授予Rosatom国营公司首席执行官Alexey Likhachev"},"el":{"auto":"Ο Πατριάρχης της Σερβίας απένειμε στον Alexey Likhachev, διευθύνοντα σύμβουλο της Rosatom State Corporation"},"en":{"auto":"Patriarch of Serbia awarded Alexey Likhachev, CEO of Rosatom State Corporation"},"fr":{"auto":"Le Patriarche Serbe a décerné le directeur général de la société d'état «Rosatom» Alexei likhachev"},"ge":{"auto":"სერბეთის პატრიარქმა როსტომის სახელმწიფო კორპორაციის აღმასრულებელი დირექტორი ალექსეი ლიხაჩოვი დააჯილდოვა"},"he":{"auto":"הפטריארך הסרבי העניק למנכ \"ל התאגיד\" רוסאטום \"אלכסיי ליחצ' וב"},"ja":{"auto":"セルビアの総主教は、Rosatom State CorporationのCEOであるAlexey Likhachevを授与しました"},"ru":{"auto":"Патриарх Сербский наградил генерального директора госкорпорации «Росатом» Алексея Лихачева","manual":"Патриарх Сербский наградил генерального директора госкорпорации «Росатом» Алексея Лихачева"},"sr":{"auto":"Патријарх српски наградио генералног директора државне корпорације \"Росатом\" Алексеја Лихачева"},"tr":{"auto":"Sırp Patriği, Rosatom devlet şirketi Genel Müdürü Alexei Likhachev'i ödüllendirdi"}},"breakpoint":"main"}],"published_at":"2026-02-21T15:34:36+00:00","updated_at":"2026-02-21T17:49:43.899495+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 21 فبراير 2026 ، منح قداسة البطريرك الصربي بورفيري أليكسي ليخاتشيف ، المدير العام لمؤسسة روساتوم الحكومية للطاقة الذرية ورئيس مؤسسة دعم الثقافة والتراث المسيحي ، وسام القديس الأمير لازاروس في حفل استقبال في منزل القديس بطرس في بلغراد (صربيا).\n\nحصل الرئيس التنفيذي للمؤسسة الحكومية على جائزة الكنيسة العليا تقديرا وامتنانا لسنوات عديدة من المساعدة الخيرية والحب للكنيسة الأرثوذكسية الصربية ، فضلا عن مساهمته الهائلة في تطوير والحفاظ على الثقافة المسيحية والتراث الأرثوذكسي في جميع أنحاء العالم.\n\nوحضر حفل توزيع الجوائز أيضا ناديجدا ليخاتشيفا ، زوجة رئيس روساتوم ، إيجور سكوبينكو ، المدير التنفيذي لمؤسسة دعم الثقافة والتراث المسيحي ، ماريا ديوريك ، مديرة المكتب التمثيلي لمؤسسة روساتوم الحكومية في صربيا ، المطران ستيفان ريميزيان ، نائب بطريرك صربيا ، ممثل الكنيسة الأرثوذكسية الصربية لدى بطريرك موسكو وعموم روسيا ، والأرشمندريت دانيال ، مدير المكتب الإداري البطريركي (جافرانوفيتش) ، رئيس مكتب بطريرك صربيا, رئيس الأساقفة جورج ستويسافليفيتش ، وموظف البطريركية الصربية ميلجان نيكيتوفيتش."},"al":{"auto":"Më 21 shkurt 2026, Shenjtëria E tij Patriarku Porfiry i Serbisë i dha Alexei Likhachev, Drejtor i përgjithshëm i Korporatës Shtetërore Të Energjisë Atomike Rosatom dhe Kryetar i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, Urdhri i Shën Princit Llazar në një pritje Në Shtëpinë E Shën Pjetrit Në Beograd (Serbi).\n\nCEO i korporatës shtetërore iu dha një çmim i lartë i kishës në njohje dhe mirënjohje për ndihmën e tij shumëvjeçare bamirëse dhe dashurinë për Kishën Ortodokse serbe, si dhe për kontributin e tij të madh në zhvillimin dhe ruajtjen e kulturës Së Krishterë dhe trashëgimisë Ortodokse në të gjithë botën.\n\nNë ceremoninë e ndarjes së çmimeve morën pjesë Edhe Nadezhda Likhacheva, gruaja e kreut Të Rosatom, Egor Skopenko, Drejtor Ekzekutiv i Fondacionit Për Mbështetjen E Kulturës Dhe Trashëgimisë Së Krishterë, Maria Deuric, Drejtore e zyrës përfaqësuese Të Korporatës Shtetërore Rosatom Në Serbi, Peshkopi Stefan Remezian, Famullitar I Patriarkut Të Serbisë, përfaqësues i Kishës Ortodokse serbe Te Patriarku I Moskës Dhe I Gjithë Rusisë, Arkimandriti Daniel, Drejtor I Zyrës Administrative Patriarkale (Gavranovich), kreu i Zyrës Së Patriarkut Të Serbisë, Kryeprifti George stoisavljevic, Dhe Punonjës i Patriarkanës Serbe miljan nikitovich."},"cn":{"auto":"2026年2月21日，塞尔维亚宗主教波菲里在贝尔格莱德圣彼得宫举行的招待会上授予罗萨托姆国家原子能公司总干事、支持基督教文化和遗产基金会主席阿列克谢*利哈切夫圣拉撒路亲王勋章。\n\n国营公司的首席执行官被授予高级教会奖,以表彰和感谢他多年对塞尔维亚东正教的慈善援助和热爱,以及他对发展和保存全世界基督教文化和东正教遗产的巨大贡献。\n\n出席颁奖典礼的还有Rosatom负责人的妻子Nadezhda Likhacheva，支持基督教文化和遗产基金会执行董事Egor Skopenko，Rosatom国营公司驻塞尔维亚代表处主任Maria Deuric，塞尔维亚族长牧师Stefan Remezian主教，塞尔维亚东正教会驻莫斯科和全俄罗斯族长代表，Archimandrite Daniel，族长行政办公室主任（Gavranovich），塞尔维亚，大主教george Stoisavljevic和塞尔维亚族长Miljan Nikitovich的雇员。"},"el":{"auto":"Στις 21 Φεβρουαρίου 2026, ο Αγιώτατος Πατριάρχης της Σερβίας Πορφύριος απένειμε στον Αλεξέι Λιχάτσεφ, Γενικό Διευθυντή της κρατικής εταιρείας Ατομικής Ενέργειας Rosatom και πρόεδρο του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και Κληρονομιάς, το Τάγμα του Αγίου Πρίγκιπα Λαζάρου σε δεξίωση στο σπίτι του Αγίου Πέτρου στο Βελιγράδι (Σερβία).\n\nΟ διευθύνων σύμβουλος της κρατικής εταιρείας τιμήθηκε με το βραβείο της ανώτατης εκκλησίας σε αναγνώριση και ευγνωμοσύνη για την πολυετή φιλανθρωπική του βοήθεια και αγάπη για τη Σερβική Ορθόδοξη Εκκλησία, καθώς και για την τεράστια συμβολή του στην ανάπτυξη και διατήρηση του Χριστιανικού Πολιτισμού και της Ορθόδοξης κληρονομιάς σε όλο τον κόσμο.\n\nΣτην τελετή απονομής των βραβείων παρευρέθηκαν επίσης η Ναντέζντα Λιχάτσεβα, σύζυγος του επικεφαλής της Ροζάτομ, Έγκορ Σκοπένκο, Εκτελεστικού Διευθυντή του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, η Μαρία Ντεούριτς, Διευθύντρια του Γραφείου Αντιπροσωπείας της κρατικής εταιρείας Ροζάτομ στη Σερβία, ο Επίσκοπος Στέφαν Ρεμέζιαν, αντιπρόσωπος του Πατριάρχη Σερβίας, εκπρόσωπος της Σερβικής Ορθόδοξης Εκκλησίας στον Πατριάρχη Μόσχας και Πασών των Ρωσιών, ο Αρχιμανδρίτης Δανιήλ, διευθυντής του Πατριαρχικού Διοικητικού γραφείου (Γκαβράνοβιτς), επικεφαλής του Γραφείου του Πατριάρχη Σερβίας, ο Αρχιερέας Γεώργιος στοϊσάβλιεβιτς και υπάλληλος του Σερβικού Πατριαρχείου μίλιαν νικίτοβιτς."},"en":{"auto":"On February 21, 2026, His Holiness Patriarch Porfiry of Serbia awarded Alexei Likhachev, Director General of the Rosatom State Atomic Energy Corporation and Chairman of the Foundation for the Support of Christian Culture and Heritage, the Order of St. Prince Lazarus at a reception at the St. Peter's House in Belgrade (Serbia).\n\nThe CEO of the state corporation was awarded a high church award in recognition and gratitude for his many years of charitable assistance and love for the Serbian Orthodox Church, as well as for his enormous contribution to the development and preservation of Christian culture and Orthodox heritage throughout the world.\n\nThe award ceremony was also attended by Nadezhda Likhacheva, the wife of the head of Rosatom, Egor Skopenko, Executive Director of the Foundation for the Support of Christian Culture and Heritage, Maria Deuric, Director of the representative office of the Rosatom State Corporation in Serbia, Bishop Stefan Remezian, Vicar of the Patriarch of Serbia, representative of the Serbian Orthodox Church to the Patriarch of Moscow and All Russia, Archimandrite Daniel, Director of the Patriarchal Administrative Office (Gavranovich), head of the Office of the Patriarch of Serbia, Archpriest George Stoisavljevic, and employee of the Serbian Patriarchate Miljan Nikitovich."},"fr":{"auto":"Le 21 février 2026, lors d'une réception solennelle à la maison sviatosavv À Belgrade (Serbie), le Patriarche porphyre de Serbie a décerné au directeur général de la société d'état pour l'énergie atomique Rosatom et au président du Fonds de soutien à la culture et au patrimoine chrétiens, Alexei likhachev, l'ordre du Saint-Prince Lazare.\n\nLe directeur général de la société d'état a reçu une haute distinction de l'église en reconnaissance et en reconnaissance de son aide caritative de longue date et de son amour pour l'Église orthodoxe serbe, ainsi que de sa contribution considérable au développement et à la préservation de la culture chrétienne et du patrimoine orthodoxe dans le monde entier.\n\nL'épouse du chef de Rosatom, Nadejda likhacheva, la directrice Exécutive du Fonds de soutien à la culture chrétienne et au patrimoine, Yegor skopenko, la directrice du bureau de représentation de Rosatom en Serbie, Maria Deurić, le vicaire du Patriarche Serbe, le représentant de l'Église orthodoxe serbe auprès du Patriarche de Moscou et de toute la Russie, l'évêque Stefan Remezian, le directeur du Patriarcat de Miljan nikitovitch."},"ge":{"auto":"2026 წლის 21 თებერვალს, მისმა უწმინდესმა პატრიარქმა პორფირიმ სერბეთში დააჯილდოვა ალექსეი ლიხაჩოვი, როსტომის სახელმწიფო ატომური ენერგიის კორპორაციის გენერალური დირექტორი და ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის თავმჯდომარე, წმინდა პრინც ლაზარეს ორდენი ბელგრადში (სერბეთი) წმინდა პეტრეს სახლში გამართულ მიღებაზე.\n\nსახელმწიფო კორპორაციის აღმასრულებელ დირექტორს მიენიჭა მაღალი საეკლესიო ჯილდო აღიარებისა და მადლიერების ნიშნად სერბეთის მართლმადიდებელი ეკლესიის მრავალწლიანი საქველმოქმედო დახმარებისა და სიყვარულისთვის, ასევე მისი უზარმაზარი წვლილისთვის ქრისტიანული კულტურისა და მართლმადიდებლური მემკვიდრეობის განვითარებასა და შენარჩუნებაში.\n\nდაჯილდოების ცერემონიას ასევე ესწრებოდა ნადეჟდა ლიხაჩევა, როსტომის ხელმძღვანელის მეუღლე, ეგორ სკოპენკო, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის აღმასრულებელი დირექტორი, მარია დეურიჩი, სერბეთის როსტომის სახელმწიფო კორპორაციის წარმომადგენლობითი ოფისის დირექტორი, ეპისკოპოსი შტეფან რემეზიანი, სერბეთის პატრიარქის ვიკარი, სერბეთის მართლმადიდებელი ეკლესიის წარმომადგენელი მოსკოვისა და სრულიად რუსეთის პატრიარქისთვის, არქიმანდრიტი დანიელი, საპატრიარქო ადმინისტრაციული ოფისის დირექტორი (გავრანოვიჩი), სერბეთის პატრიარქის ოფისის ხელმძღვანელი, დეკანოზი გიორგი ლიხაჩოვა.სტოისავლევიჩი და სერბეთის საპატრიარქოს თანამშრომელი მილიან ნიკიტოვიჩი."},"he":{"auto":"הפטריארך הקדוש ביותר של פורפירי הסרבי ב-21 בפברואר 2026, בקבלת פנים חגיגית בבית סוויאטוסאב בבלגרד (סרביה), העניק למנכ \"ל התאגיד הממלכתי לאנרגיה אטומית\" רוסאטום \" ויו \"ר קרן התמיכה בתרבות הנוצרית והמורשת אלכסיי ליכצ' וב את מסדר הנסיך הקדוש לזרוס.\n\nמנכ \" ל התאגיד הממלכתי זכה בפרס כנסייתי גבוה כהוקרה ותודה על שנים רבות של סיוע צדקה ואהבה לכנסייה האורתודוכסית הסרבית, ועל תרומתו העצומה לפיתוח ושימור התרבות הנוצרית והמורשת האורתודוכסית ברחבי העולם.\n\nבטקס הפרס נכחו גם אשתו של ראש \"רוסאטום\" נדז 'דה ליחצ' ובה, מנכ \"ל הקרן לתמיכה בתרבות נוצרית ומורשת, יגור סקופנקו, מנהל נציגות התאגיד הממלכתי\" רוסאטום \"בסרביה, מריה דאוריץ', הכומר של הפטריארך הסרבי, נציג הכנסייה האורתודוכסית הסרבית תחת הפטריארך של מוסקבה וכל רוסיה, הבישוף רמזיאנסקי סטפן, מנהל המשרד המינהלי הפטריארכי ארכימנדריט דניאל (גברנוביץ'), ראש הקבינט של הפטריארך הסרבי, פרוטו-הכומר ג ' ורג 'י סטויסאבלביץ' הפטריארכיה הסרבית, מיליאן ניקיטוביץ'."},"ja":{"auto":"2026年2月21日、セルビアのポルフィリ総主教は、ベオグラード(セルビア)の聖ペテロの家でのレセプションで、ロザトム国家原子力公社の局長であり、キリスト教文化遺産支援財団の会長であるアレクセイ・リハチェフに聖ラザロ王子の勲章を授与しました。\n\n国家法人のCEOは、セルビア正教会のための慈善援助と愛の彼の長年のためだけでなく、世界中のキリスト教文化と正教会の遺産の発展と保存への彼の多大な貢献のための認識と感謝の中で高い教会賞を受賞しました。\n\n授賞式には、ロザトムの頭の妻であるNadezhda Likhacheva、キリスト教文化と遺産の支援のための財団のエグゼクティブディレクター、マリアDeuric、セルビアのロザトム州法人の代表事務所のディレクター、司教Stefan Remezian、セルビア総主教の牧師、モスクワ総主教と全ロシア総主教のセルビア正教会の代表、Archimandrite Daniel、総主教行政事務所（Gavranovich）のディレクター、総主教の事務所の長が出席した。セルビアの、大司教ジョージStoisavljevic、およびセルビア総主教Miljan Nikitovichの従業員。"},"ru":{"auto":"Святейший Патриарх Сербский Порфирий 21 февраля 2026 года на торжественном приеме в Святосаввском доме в Белграде (Сербия) наградил генерального директора государственной корпорации по атомной энергии «Росатом» и председателя Фонда поддержки христианской культуры и наследия Алексея Лихачева орденом Святого князя Лазаря.\n\nГенеральный директор госкорпорации был награжден высокой церковной наградой в знак признания и благодарности за многолетнюю благотворительную помощь и любовь к Сербской Православной Церкви, а также за огромный вклад в развитие и сохранение христианской культуры и православного наследия во всем мире.\n\nНа церемонии награждения также присутствовали супруга главы «Росатома» Надежда Лихачева, исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко, директор представительства госкорпорации «Росатом» в Сербии Мария Деурич, викарий Патриарха Сербского, представитель Сербской Православной Церкви при Патриархе Московском и всея Руси епископ Ремезианский Стефан, директор Патриаршего административного офиса архимандрит Даниил (Гавранович), руководитель Кабинета Патриарха Сербского протоиерей Георгий Стоисавлевич и сотрудник Сербского Патриархата Мильян Никитович.","manual":"Святейший Патриарх Сербский Порфирий 21 февраля 2026 года на торжественном приеме в Святосаввском доме в Белграде (Сербия) наградил генерального директора государственной корпорации по атомной энергии «Росатом» и председателя Фонда поддержки христианской культуры и наследия Алексея Лихачева орденом Святого князя Лазаря.\n\nГенеральный директор госкорпорации был награжден высокой церковной наградой в знак признания и благодарности за многолетнюю благотворительную помощь и любовь к Сербской Православной Церкви, а также за огромный вклад в развитие и сохранение христианской культуры и православного наследия во всем мире.\n\nНа церемонии награждения также присутствовали супруга главы «Росатома» Надежда Лихачева, исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко, директор представительства госкорпорации «Росатом» в Сербии Мария Деурич, викарий Патриарха Сербского, представитель Сербской Православной Церкви при Патриархе Московском и всея Руси епископ Ремезианский Стефан, директор Патриаршего административного офиса архимандрит Даниил (Гавранович), руководитель Кабинета Патриарха Сербского протоиерей Георгий Стоисавлевич и сотрудник Сербского Патриархата Мильян Никитович."},"sr":{"auto":"Најсветији Патријарх српски ПОРФИРИЈ 21.фебруара 2026. године на свечаном пријему у Святосаввској кући у Белграду (Србија) наградио је генералног директора државне корпорације за атомску енергију Росатом и председника Фонда за подршку хришћанској култури и наслеђу Алексеја Лихачева орденом Светог кнеза Лазара.\n\nГенерални директор државне корпорације награђен је високом црквеном наградом у знак признања и захвалности за дугогодишњу добротворну помоћ и љубав према Српској Православној Цркви, као и за огроман допринос развоју и очувању хришћанске културе и православне баштине широм света.\n\nНа церемонији доделе награда присуствовали су и супруга главе \"Росатома\" Надежда Лихачева, извршни директор Фонда за подршку хришћанској култури и наслеђу Егор Скопенко, директор Представништва државне корпорације \"Росатом\" у Србији Марија Деурић, викар Патријарха српског, представник Српске Православне Цркве при Патријарху Московском и целе Русије епископ ремезијански Стефан, директор Патријаршијске административне канцеларије архимандрит Данило (Гаврановић), шеф Кабинета Патријарха српског протојереја Георгиј Стоисављевић и службеник Српске Патријаршије Миљан Никитовић."},"tr":{"auto":"Sırp En Kutsal Patriği Porfiri, 21 Şubat 2026'da Belgrad'daki (Sırbistan) Svyatosavvya Evi'ndeki ciddi bir resepsiyonda, Devlet Atom Enerjisi Şirketi Rosatom'un genel müdürüne ve Hıristiyan Kültürü ve Mirasını Destekleme Vakfı Başkanı Alexei Likhaçev'e Kutsal Prens Lazar Nişanı verdi.\n\nDevlet şirketinin genel müdürüne, Sırp Ortodoks Kilisesi'ne yıllarca süren hayırsever yardımları ve sevgisinin yanı sıra dünya çapında Hıristiyan kültürünün ve Ortodoks mirasının gelişmesine ve korunmasına yaptığı büyük katkılardan dolayı takdir ve minnettarlık nedeniyle yüksek kilise ödülü verildi.\n\nÖdül törenine ayrıca Rosatom başkanının eşi Nadezhda Likhaçeva, Hıristiyan Kültürü ve Mirasını Destekleme Vakfı icra direktörü Yegor Skopenko, Sırbistan'daki Rosatom devlet şirketinin temsilciliği direktörü Maria Deurić, Sırbistan Patriği vekili, Moskova Patriği altındaki Sırp Ortodoks Kilisesi temsilcisi ve tüm Rusya Remezian Piskoposu Stefan, Patrik İdari Ofisi müdürü Arşimandrit Daniil (Gavranovich), Sırp Patriği Kabinesinin başkanı Başpiskopo لعاشر ملك أنطاكية وفدا من مؤسسة دعم الثقافة والتراث المسيحي"},"al":{"auto":"Patriarku Gjon X I Antiokisë mori një delegacion nga Fondacioni për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë"},"cn":{"auto":"安提阿族长约翰十世接待了基督教文化和遗产支持基金会的代表团"},"el":{"auto":"Ο Πατριάρχης Ιωάννης Χ της Αντιόχειας έλαβε αντιπροσωπεία από το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς"},"en":{"auto":"Patriarch John X of Antioch received a delegation from the Foundation for the Support of Christian Culture and Heritage"},"fr":{"auto":"Le Patriarche Jean X d'Antioche a reçu une délégation Du fonds de soutien à la culture et au patrimoine chrétiens"},"ge":{"auto":"ანტიოქიის პატრიარქმა იოანე X-მა მიიღო დელეგაცია ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდიდან"},"he":{"auto":"הפטריארך יוחנן העשירי מאנטיוכיה קיבל משלחת של הקרן לתמיכה בתרבות ומורשת נוצרית"},"ja":{"auto":"アンティオキアの総主教ジョンXは、キリスト教の文化と遺産の支援のための財団から代表団を受け取りました"},"ru":{"auto":"Патриарх Антиохийский Иоанн Х принял делегацию Фонда поддержки христианской культуры и наследия","manual":"Патриарх Антиохийский Иоанн Х принял делегацию Фонда поддержки христианской культуры и наследия"},"sr":{"auto":"Антиохијски патријарх Јован Х примио је делегацију фонда за подршку хришћанској култури и наслеђу"},"tr":{"auto":"Antakya Patriği John X, Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'ndan bir delegasyonu kabul etti"}},"breakpoint":"main"}],"published_at":"2026-02-18T09:08:24+00:00","updated_at":"2026-02-18T11:49:08.863919+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 16 فبراير 2026 ، قام وفد من مؤسسة دعم الثقافة والتراث المسيحي ، مع الأرشمندريت فيليب (فاسيلتسيف) ، ممثل بطريرك موسكو وعموم روسيا لدى بطريرك أنطاكية العظمى وكل الشرق ، بتفتيش المبنى حيث من المقرر تنظيم الجامعة الأرثوذكسية. \n\nوبعد التفتيش ، عقد اجتماع مع البطريرك يوحنا العاشر ملك أنطاكية ، تم خلاله مناقشة قضايا التعاون بين البطريركية الأنطاكية والمؤسسة ، ونتائج العمل المشترك خلال العام الماضي وخطط عام 2026.\n \nكما شارك في المحادثة كل من الأرشمندريت فيليب ، ممثل الكنيسة الأرثوذكسية الروسية في دمشق ، ورئيس الأساقفة إيغور ياكيمشوك ، نائب دائرة العلاقات الكنسية الخارجية في بطريركية موسكو ، والعقيد أندريه بودريدينوف ، الملحق الدفاعي بالسفارة الروسية في الجمهورية العربية السورية.\n\nعلى وجه الخصوص ، فإن القضية الأكثر أهمية حاليا هي المساعدة في ترميم كنيسة النبي إيليا في دمشق ، حيث وقع هجوم إرهابي في 22 يونيو 2025 ، وكذلك تصنيع وتسليم الأيقونسطاس والأجراس. \n\nكما تطرق الاجتماع إلى قضايا تقديم المساعدة المالية لرجال الدين في البطريركية الأنطاكية ، وكذلك المساعدة في تجهيز الجامعة الأرثوذكسية المستقبلية ، المقرر افتتاحها بحلول نهاية عام 2026. \n\nبالإضافة إلى ذلك ، ناقش البطريرك جون ، المدير التنفيذي للمؤسسة ونائب رئيس الأساقفة إيغور ياكيمشوك إمكانية تبادل الطلاب بين روسيا ومدرسة البلمند اللاهوتية.\n\nوفي ختام اللقاء ، شكر البطريرك يوحنا العاشر ملك أنطاكية وفد المؤسسة على دعم الثقافة والتراث المسيحي على تعاونهم المثمر على مر السنين ، وأكد على قيمة العلاقة الحميمة التي تطورت بين الكنيسة الأرثوذكسية الأنطاكية والكنيسة الأرثوذكسية الروسية والمؤسسة."},"al":{"auto":"Më 16 shkurt 2026, një delegacion nga Fondacioni për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, së bashku me Arkimandritin Filip (Vasiltsev), përfaqësues i Patriarkut të Moskës dhe Të Gjithë Rusisë Te Patriarku I Antiokisë së madhe dhe Të Gjithë Lindjes, inspektuan ndërtesën Ku është planifikuar Të organizohet Universiteti Ortodoks. \n\nPas inspektimit, u mbajt një takim me Patriarkun Gjon X Të Antiokisë, gjatë të cilit u diskutuan çështjet e bashkëpunimit midis Patriarkanës Antiokiane dhe Fondacionit, rezultatet e punës së përbashkët gjatë vitit të kaluar dhe planet për vitin 2026.\n \nArkimandriti Filip, përfaqësues i Kishës Ortodokse ruse në Damask, Kryeprifti Igor Yakimchuk, Zëvendës i Departamentit të Patriarkanës Së Moskës për Marrëdhëniet E Jashtme Të Kishës dhe Koloneli Andrey Bodredinov, Atashe I Mbrojtjes në Ambasadën ruse Në Republikën Arabe Siriane, gjithashtu morën pjesë në bisedë.\n\nNë veçanti, çështja më e rëndësishme aktualisht është ndihma në restaurimin e kishës Së Profetit Elia në Damask, ku ndodhi një sulm terrorist më 22 qershor 2025, si dhe prodhimi dhe dorëzimi i ikonostasit dhe kambanave. \n\nTakimi preku gjithashtu çështjet e ofrimit të ndihmës financiare për klerikët e Patriarkanës Antiokiane, si dhe ndihmën në pajisjen e universitetit Të ardhshëm Ortodoks, i planifikuar të hapet deri në fund të vitit 2026. \n\nPërveç kësaj, Patriarku Xhon, drejtori ekzekutiv i Fondacionit dhe Zëvendës Kryeprifti I DECR Igor Yakimchuk diskutoi mundësinë e një shkëmbimi studentësh midis Rusisë dhe Seminarit Teologjik Balamand.\n\nNë fund të takimit, Patriarku Gjon X I Antiokisë falënderoi delegacionin e Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë për bashkëpunimin e tyre të frytshëm ndër vite dhe theksoi vlerën e marrëdhënies së ngrohtë që është zhvilluar midis Kishës Ortodokse Të Antiokisë, Kishës Ortodokse ruse dhe Fondacionit."},"cn":{"auto":"2026年2月16日，基督教文化和遗产支持基金会的代表团与莫斯科和全俄罗斯族长代表阿基米德*菲利普（Vasiltsev）一起视察了计划组织东正教大学的建筑。 \n\n视察结束后，与安提阿族长John X举行了一次会议，期间讨论了安提阿族长与基金会之间的合作问题，过去一年联合工作的结果以及2026的计划。\n \n大马士革俄罗斯东正教会代表Archimandrite Philip，莫斯科宗主教对外教会关系部副手Igor Yakimchuk大主教和俄罗斯驻阿拉伯叙利亚共和国大使馆国防武官Andrey Bodredinov上校也参加了\n\n特别是，目前最重要的问题是协助修复大马士革先知以利亚教堂，2025年6月22日发生恐怖袭击，以及圣像屏风和钟声的制造和交付。 \n\n会议还谈到了向安提阿宗主教的神职人员提供财政援助的问题，以及协助装备计划在2026结束时开放的未来东正教大学。 \n\n此外，基金会执行董事兼副总主教伊戈尔*亚基姆丘克（Igor Yakimchuk）的主教约翰（John）讨论了俄罗斯与巴拉曼德神学院（Balamand Theological Seminary）之间进行学生交流的可能性。\n\n在会议结束时，安提阿族长约翰十世感谢基金会代表团支持基督教文化和遗产多年来卓有成效的合作，并强调安提阿东正教会，俄罗斯东正教会和基"},"el":{"auto":"Στις 16 Φεβρουαρίου 2026, αντιπροσωπεία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, μαζί με τον Αρχιμανδρίτη Φίλιππο (Βασίλτσεφ), εκπρόσωπο του Πατριάρχη Μόσχας και Πάσης Ρωσίας στον Πατριάρχη της Μεγάλης Αντιόχειας και όλης της Ανατολής, επιθεώρησαν το κτίριο όπου σχεδιάζεται να οργανωθεί το Ορθόδοξο Πανεπιστήμιο. \n\nΜετά την επιθεώρηση, πραγματοποιήθηκε συνάντηση με τον Πατριάρχη Αντιοχείας Ιωάννη Χ, κατά τη διάρκεια της οποίας συζητήθηκαν θέματα συνεργασίας μεταξύ του Πατριαρχείου της Αντιόχειας και του Ιδρύματος, τα αποτελέσματα των κοινών εργασιών κατά το παρελθόν έτος και τα σχέδια για το 2026.\n \nΣτη συζήτηση συμμετείχαν επίσης ο Αρχιμανδρίτης Φίλιππος, εκπρόσωπος της Ρωσική Ορθόδοξη Εκκλησία στη Δαμασκό, Αρχιερέας Ιγκόρ Γιακίμτσουκ, αναπληρωτής του Τμήματος Εξωτερικών Εκκλησιαστικών Σχέσεων του Πατριαρχείου Μόσχας, και συνταγματάρχης Αντρέι Μποντρεντίνοφ, αμυντικός ακόλουθος στη Ρωσική Πρεσβεία στην Αραβική Δημοκρατία της Συρίας.\n\nΣυγκεκριμένα, το πιο σημαντικό ζήτημα αυτή τη στιγμή είναι η βοήθεια στην αποκατάσταση της εκκλησίας του Προφήτη Ηλία στη Δαμασκό, όπου πραγματοποιήθηκε τρομοκρατική επίθεση στις 22 Ιουνίου 2025, καθώς και η κατασκευή και παράδοση του τέμπλου και των κουδουνιών. \n\nΗ συνάντηση έθιξε επίσης τα θέματα παροχής οικονομικής βοήθειας στον κλήρο του Πατριαρχείου Αντιοχείας, καθώς και βοήθεια στον εξοπλισμό του μελλοντικού Ορθόδοξου πανεπιστημίου, που έχει προγραμματιστεί να ανοίξει μέχρι το τέλος του 2026. \n\nΕπιπλέον, ο Πατριάρχης Ιωάννης, εκτελεστικός διευθυντής του Ιδρύματος και Αναπληρωτής Αρχιερέας του ΤΕΕΣ Ιγκόρ Γιακίμτσουκ συζήτησε τη δυνατότητα ανταλλαγής φοιτητών μεταξύ της Ρωσίας και του θεολογικού σεμιναρίου Μπαλαμάντ.\n\nΣτο τέλος της συνάντησης, ο Πατριάρχης Αντιοχείας Ιωάννης Δ ευχαρίστησε την αντιπροσωπεία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και Κληρονομιάς για την καρποφόρα συνεργασία τους όλα αυτά τα χρόνια και τόνισε την αξία της θερμής σχέσης που έχει αναπτυχθεί μεταξύ της Ορθόδοξης Εκκλησίας της Αντιοχείας, της Ρωσική Ορθόδοξη Εκκλησία και το Ίδρυμα."},"en":{"auto":"On February 16, 2026, a delegation from the Foundation for the Support of Christian Culture and Heritage, together with Archimandrite Philip (Vasiltsev), representative of the Patriarch of Moscow and All Russia to the Patriarch of Great Antioch and All the East, inspected the building where the Orthodox university is planned to be organized. \n\nAfter the inspection, a meeting was held with Patriarch John X of Antioch, during which issues of cooperation between the Antiochian Patriarchate and the Foundation, the results of joint work over the past year and plans for 2026 were discussed.\n \nArchimandrite Philip, representative of the Russian Orthodox Church in Damascus, Archpriest Igor Yakimchuk, Deputy of the Moscow Patriarchate's Department for External Church Relations, and Colonel Andrey Bodredinov, Defense Attache at the Russian Embassy in the Syrian Arab Republic, also took part in the conversation.\n\nIn particular, the most important issue at present is assistance in the restoration of the church of the Prophet Elijah in Damascus, where a terrorist attack took place on June 22, 2025, the manufacture and delivery of the iconostasis and bells. \n\nThe meeting also touched upon the issues of providing financial assistance to the clergy of the Antiochian Patriarchate, as well as assistance in equipping the future Orthodox university, scheduled to open by the end of 2026. \n\nIn addition, Patriarch John, the Foundation's executive director and DECR Deputy Archpriest Igor Yakimchuk discussed the possibility of a student exchange between Russia and Balamand Theological Seminary.\n\nAt the end of the meeting, Patriarch John X of Antioch thanked the delegation of the Foundation for the Support of Christian Culture and Heritage for their fruitful cooperation over the years, and emphasized the value of the warm relationship that has developed between the Orthodox Church of Antioch, the Russian Orthodox Church and the Foundation."},"fr":{"auto":"La délégation du Fonds de soutien à la culture chrétienne et au patrimoine, en collaboration avec le représentant du Patriarche de Moscou et de toute la Russie auprès du Patriarche de la grande Antioche et de tout l'Orient, l'archimandrite Philippe (vasiltsev), a inspecté le bâtiment dans lequel il est prévu d'organiser l'Université orthodoxe le 16 février 2026. \n\nÀ la fin de l'inspection, une réunion a eu lieu avec le Patriarche Jean X d'Antioche, au cours de laquelle les questions de l'interaction du Patriarcat d'Antioche et de la Fondation, les résultats du travail conjoint de l'année Dernière et les plans pour 2026 ont été discutés.\n \nL'archimandrite Philip, représentant de l'Église orthodoxe russe à Damas, l'archiprêtre Igor yakimchuk, adjoint au Département des relations ecclésiastiques extérieures du Patriarcat de Moscou, et le colonel Andrey Bodredinov, attaché à la défense à l'Ambassade de la Fédération de Russie en République arabe syrienne, ont également participé à l'entretien.\n\nEn particulier, la question la plus importante à l'heure actuelle est l'aide à la reconstruction du temple du prophète Elie de Dieu à Damas, où l'attentat a eu lieu le 22 juin 2025, la fabrication et la Livraison de l'iconostase et des cloches. \n\nLa réunion a également abordé les questions de l'aide financière aux membres du clergé du Patriarcat d'Antioche, ainsi que de l'aide à l'équipement de la future Université orthodoxe, qui devrait ouvrir ses portes à la fin de 2026. \n\nEn outre, le Patriarche Jean, le directeur exécutif de la Fondation et l'archiprêtre Igor yakimchuk, adjoint du DREE, ont discuté de la possibilité d'un échange d'étudiants entre la Russie et le séminaire de Balamand.\n\nÀ la fin de la réunion, le Patriarche Jean X d'Antioche a remercié la délégation du Fonds de soutien à la culture chrétienne et au patrimoine pour sa coopération fructueuse de plusieurs années et a souligné la valeur des relations chaleureuses qui se sont développées entre l'Église orthodoxe d'Antioche, l'Église orthodoxe Russe et la Fondation."},"ge":{"auto":"2026 წლის 16 თებერვალს, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დელეგაციამ, მოსკოვისა და სრულიად რუსეთის პატრიარქის წარმომადგენელ არქიმანდრიტ ფილიპესთან (ვასილცევთან) ერთად, დიდი ანტიოქიისა და მთელი აღმოსავლეთის პატრიარქთან, დაათვალიერა შენობა, სადაც დაგეგმილია მართლმადიდებლური უნივერსიტეტის ორგანიზება. \n\nშემოწმების შემდეგ გაიმართა შეხვედრა ანტიოქიის პატრიარქ იოანე X-თან, რომლის დროსაც განიხილეს ანტიოქიის საპატრიარქოსა და ფონდს შორის თანამშრომლობის საკითხები, გასული წლის განმავლობაში ერთობლივი მუშაობის შედეგები და 2026 წლის გეგმები.\n \nსაუბარში ასევე მონაწილეობდნენ არქიმანდრიტი ფილიპე, დამასკოში რუსეთის მართლმადიდებელი ეკლესიის წარმომადგენელი, დეკანოზი იგორ იაკიმჩუკი, მოსკოვის საპატრიარქოს საგარეო საეკლესიო ურთიერთობების დეპარტამენტის მოადგილე და პოლკოვნიკი ანდრეი ბოდრედინოვი, სირიის არაბულ რესპუბლიკაში რუსეთის საელჩოს თავდაცვის ატაშე.\n\nკერძოდ, ამჟამად ყველაზე მნიშვნელოვანი საკითხია დახმარება წინასწარმეტყველ ელიას ეკლესიის აღდგენაში დამასკოში, სადაც 2025 წლის 22 ივნისს მოხდა ტერაქტი, ასევე კანკელისა და ზარების დამზადება და მიწოდება. \n\nშეხვედრაზე საუბარი ასევე შეეხო ანტიოქიის საპატრიარქოს სასულიერო პირებისთვის ფინანსური დახმარების გაწევის, ასევე 2026 წლის ბოლომდე დაგეგმილი მომავალი მართლმადიდებლური უნივერსიტეტის აღჭურვაში დახმარების საკითხებს. \n\nგარდა ამისა, პატრიარქმა იოანემ, ფონდის აღმასრულებელმა დირექტორმა და DECR-ის მოადგილემ დეკანოზმა იგორ იაკიმჩუკმა განიხილეს რუსეთსა და ბალამანდის სასულიერო სემინარიას შორის სტუდენტური გაცვლის შესაძლებლობა.\n\nშეხვედრის დასასრულს ანტიოქიის პატრიარქმა იოანე X-მა მადლობა გადაუხადა ფონდის დელეგაციას ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერისთვის წლების განმავლობაში ნაყოფიერი თანამშრომლობისთვის და ხაზი გაუსვა ანტიოქიის მართლმადიდებლურ ეკლესიას შორის განვითარებული თბილი ურთიერთობის ღირებულებას."},"he":{"auto":"משלחת של הקרן לתמיכה בתרבות ומורשת נוצרית, יחד עם נציג הפטריארך של מוסקבה וכל רוסיה תחת הפטריארך של אנטיוכיה הגדולה וכל המזרח, הארכימנדריט פיליפ (וסילצ ' ב), ב-16 בפברואר 2026, בדקה את הבניין שבו מתוכננת ארגון האוניברסיטה האורתודוכסית. \n\nלאחר סיום הבדיקה התקיימה פגישה עם פטריארך אנטיוכיה יוחנן העשירי, שבמהלכה דנו בענייני שיתוף הפעולה של הפטריארכיה והקרן של אנטיוכיה, תוצאות העבודה המשותפת בשנה שעברה ותוכניות לשנת 2026.\n \nבשיחה השתתפו גם נציג הכנסייה הרוסית האורתודוכסית בדמשק, הארכימנדריט פיליפ, סגן המחלקה לקשרים כנסייתיים חיצוניים של הפטריארכיה במוסקבה, פרוטו-הכומר איגור יקימצ ' וק, וכן נספח ההגנה בשגרירות הפדרציה הרוסית ברפובליקה הערבית הסורית, קולונל אנדריי בודרדינוב.\n\nבפרט, הנושא החשוב ביותר כיום הוא סיוע בשיקום מקדש אליהו הנביא של אלוהים בדמשק, שבו התרחש פיגוע ב-22 ביוני 2025, ייצור ומסירת האיקונוסטס והפעמונים. \n\nבפגישה נגעו גם סוגיות של סיוע כספי לכמרים של הפטריארכיה האנטיוכית, כמו גם סיוע בציוד האוניברסיטה האורתודוקסית העתידית, המתוכננת להיפתח עד סוף 2026. \n\nבנוסף, הפטריארך יוחנן, המנהל המבצעי של הקרן וסגן הכנסייה, פרוטו-הכומר איגור יאקימצ ' וק, דנו באפשרות של חילופי סטודנטים בין רוסיה לסמינר הרוחני של בלמנד.\n\nלסיום הפגישה, הפטריארך יוחנן העשירי מאנטיוכיה הודה למשלחת הקרן לתמיכה בתרבות נוצרית ומורשת על שיתוף הפעולה הפורה שלה במשך שנים רבות, וכן הדגיש במיוחד את ערך היחסים החמים שנוצרו בין הכנסייה האורתודוכסית האנטיוכיתכנסייה האורתודוכסית הרוסית והקרן."},"ja":{"auto":"2026年2月16日、キリスト教文化と遺産の支援のための財団からの代表団は、モスクワ総主教と全ロシア総主教の代表であるArchimandrite Philip(Vasiltsev)と一緒に、大アンティオキア総主教とすべての東の総主教に、正統派大学が組織される予定の建物を検査しました。 \n\n検査の後、アンティオキアのジョンX総主教との会合が開催され、その間にアンティオキア総主教と財団との協力の問題、過去1年間の共同作業の結果、および2026年の計画が議論されました。\n \nダマスカスのロシア正教会の代表である大司教フィリップ、モスクワ総主教庁の外部教会関係部門の副司祭イゴール・ヤキムチュク、シリアアラブ共和国のロシア大使館の防衛大臣であるアンドレイ・ボドレディノフ大佐も会話に参加しました。\n\n特に、現在最も重要な問題は、2025年6月22日にテロ攻撃が行われたダマスカスの預言者エリヤ教会の修復、ならびにイコノスタシスと鐘の製造と配達の支援です。 \n\n会議はまた、アンティオキア総主教区の聖職者に財政援助を提供する問題、ならびに2026年末までに開設される予定の将来の正統派大学を装備する支援についても触れました。 \n\nさらに、総主教ジョン、財団のエグゼクティブディレクターとDECR副大司教イゴールYakimchukは、ロシアとBalamand神学校との間の学生交流の可能性について議論しました。\n\n会議の最後に、アンティオキアのジョンX総主教は、長年にわたる実りある協力のためのキリスト教文化と遺産の支援のための財団の代表団に感謝し、アンティオキア正教会、ロシア正教会と財団の間に発展した温かい関係の価値を強調しました。"},"ru":{"auto":"Делегация Фонда поддержки христианской культуры и наследия совместно с представителем Патриарха Московского и всея Руси при Патриархе Великой Антиохии и всего Востока архимандритом Филиппом (Васильцевым) 16 февраля 2026 года осмотрела здание, в котором планируется организовать православный университет. \n\nПо окончании осмотра состоялась встреча с Патриархом Антиохийским Иоанном Х, в ходе которой были обсуждены вопросы взаимодействия Антиохийского Патриархата и Фонда, итоги совместной работы за прошлый год и планы на 2026 год.\n \nВ беседе также приняли участие представитель Русской Православной Церкви в Дамаске архимандрит Филипп, заместитель Отдела внешних церковных связей Московского Патриархата протоиерей Игорь Якимчук, а также атташе по вопросам обороны при Посольстве Российской Федерации в Сирийской Арабской Республике полковник Андрей Бодрединов.\n\nВ частности, наиболее важным вопросом в настоящее время является оказание помощи в восстановлении храма пророка Божия Илии в Дамаске, в котором 22 июня 2025 года произошел теракт, изготовление и доставка иконостаса и колоколов. \n\nНа встрече также были затронуты вопросы оказания финансовой помощи священнослужителям Антиохийского Патриархата, а также содействия в оснащении будущего православного университета, планируемого к открытию к концу 2026 года. \n\nКроме того, Патриарх Иоанн, исполнительный директор Фонда и заместитель ОВЦС протоиерей Игорь Якимчук обсудили возможность студенческого обмена между Россией и Баламандской духовной семинарией.\n\nВ завершение встречи Патриарх Антиохийский Иоанн Х поблагодарил делегацию Фонда поддержки христианской культуры и наследия за многолетнее плодотворное сотрудничество, а также особо подчеркнул ценность теплых взаимоотношений, сложившихся между Антиохийской Православной Церковью, Русской Православной Церковью и Фондом.","manual":"Делегация Фонда поддержки христианской культуры и наследия совместно с представителем Патриарха Московского и всея Руси при Патриархе Великой Антиохии и всего Востока архимандритом Филиппом (Васильцевым) 16 февраля 2026 года осмотрела здание, в котором планируется организовать православный университет. \n\nПо окончании осмотра состоялась встреча с Патриархом Антиохийским Иоанном Х, в ходе которой были обсуждены вопросы взаимодействия Антиохийского Патриархата и Фонда, итоги совместной работы за прошлый год и планы на 2026 год.\n \nВ беседе также приняли участие представитель Русской Православной Церкви в Дамаске архимандрит Филипп, заместитель Отдела внешних церковных связей Московского Патриархата протоиерей Игорь Якимчук, а также атташе по вопросам обороны при Посольстве Российской Федерации в Сирийской Арабской Республике полковник Андрей Бодрединов.\n\nВ частности, наиболее важным вопросом в настоящее время является оказание помощи в восстановлении храма пророка Божия Илии в Дамаске, в котором 22 июня 2025 года произошел теракт, а также изготовление и доставка иконостаса и колоколов. \n\nНа встрече также были затронуты вопросы оказания финансовой помощи священнослужителям Антиохийского Патриархата, а также содействия в оснащении будущего православного университета, планируемого к открытию к концу 2026 года. \n\nКроме того, Патриарх Иоанн, исполнительный директор Фонда и заместитель ОВЦС протоиерей Игорь Якимчук обсудили возможность студенческого обмена между Россией и Баламандской духовной семинарией.\n\nВ завершение встречи Патриарх Антиохийский Иоанн Х поблагодарил делегацию Фонда поддержки христианской культуры и наследия за многолетнее плодотворное сотрудничество, а также особо подчеркнул ценность теплых взаимоотношений, сложившихся между Антиохийской Православной Церковью, Русской Православной Церковью и Фондом."},"sr":{"auto":"Делегација Фонда за подршку хришћанској култури и наслеђу заједно са представником Патријарха московског и целе Русије при Патријарху Велике Антиохије и целог Истока архимандритом Филипом (Васильцевом) 16.фебруара 2026. године прегледала је зграду у којој се планира организовати православни Универзитет. \n\nНакон завршетка прегледа, одржан је састанак са антиохијским патријархом Јоаном Х, током којег су разматрана питања сарадње Антиохијског патријархата и Фонда, резултати заједничког рада за прошлу годину и планови за 2026.годину.\n \nУ разговору су учествовали и представник Руске Православне Цркве у Дамаску архимандрит Филип, заменик Оддела за спољне црквене везе Московског патријархата протоиереја Игор Јакимчук, као и атташе за питања одбране при Амбасади Руске Федерације у Сиријској Арапској Републици пуковник Андреј Бодрединов.\n\nУ част, најважније питање је сада пружање помоћи у обнављању храма пророка Божијег Илије у Дамаску, у којем је 22.јуна 2025. године дошло до терористичког напада, израде и испоруке иконостаса и звона. \n\nНа састанку су се такође дотакла питања пружања финансијске помоћи свештеницима Антиохијске патријаршије, као и помоћи у опремању будућег православног Универзитета, планираног за отварање до краја 2026.године. \n\nОсим тога, патријарх Јован, извршни директор Фонда и заменик ОВЦС протоиереј Игор Јакимчук разговарали су о могућности студентске размене између Русије и Баламандске духовне семинарије.\n\nНа крају састанка, Антиохијски патријарх Јован Х захвалио је делегацији Фонда за подршку хришћанској култури и наслеђу на дугогодишњој плодној сарадњи, као и посебно нагласио вредност топлих односа који су се формирали између Антиохијске Православне Цркве, Руске Православне Цркве и Фонда."},"tr":{"auto":"Hıristiyan Kültürü ve Mirasını Destekleme Fonu'ndan bir delegasyon, Moskova Patriği ve Büyük Antakya Patriği ve tüm Doğu'daki tüm Rusya temsilcisi Archimandrite Philip (Vasiltsev) ile birlikte, 16 Şubat 2026'da Ortodoks Üniversitesi'nin organize edilmesi planlanan binayı inceledi. \n\nİncelemenin sonunda Antakya Patriği X. John ile Antakya Patrikhanesi ile Vakıf arasındaki etkileşim konularının, geçen yıla ait ortak çalışmanın sonuçlarının ve 2026 yılı planlarının tartışıldığı bir toplantı yapıldı.\n \nSohbete Şam'daki Rus Ortodoks Kilisesi'nin temsilcisi Archimandrite Philip, Moskova Patrikhanesi'nin dış Kilise ilişkileri Bölüm Yardımcısı Başpiskopos Igor Yakimchuk ve Suriye Arap Cumhuriyeti'ndeki Rusya Federasyonu Büyükelçiliği Savunma Ataşesi Albay Andrey Bodredinov da katıldı.\n\nÖzellikle şu anda en önemli konu, 22 Haziran 2025'te ikonostasis ve çanların terör saldırısına uğradığı, üretildiği ve teslim edildiği Şam'daki Tanrı Peygamberi İlyas Tapınağı'nın restorasyonuna yardım edilmesidir. \n\nToplantıda ayrıca Antakya Patrikhanesi din adamlarına maddi yardımın sağlanmasının yanı sıra 2026 yılı sonuna kadar açılması planlanan gelecekteki Ortodoks Üniversitesinin donatılmasına yardımcı olma konularına da değinildi. \n\nBuna ek olarak, Vakfın icra direktörü Patrik John ve OECS Başpiskoposu Yardımcısı Igor Yakimchuk, Rusya ile Balamand İlahiyat Fakültesi arasında öğrenci alışverişi olasılığını tartıştılar.\n\nToplantının sonunda Antakya Patriği X. John, Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı delegasyonuna uzun yıllara dayanan verimli işbirlikleri için teşekkür etti ve ayrıca Antakya Ortodoks Kilisesi ile Rus Ortodoks Kilisesi ile Vakıf arasında gelişen sıcak ilişkilerin değerini özellikle vurguladı."}}},"component":"content-flow"},{"images":[{"title":{},"width":720,"chosen":false,"height":1280,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_7ac61a9e-190a-4f87-b650-e70f6395c6c2","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_1c6cbc91-f4fe-4841-8c7e-e974c7979680"},{"title":{},"width":960,"chosen":false,"height":540,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_6a36321b-b11c-4dad-b2f1-c79484272c17","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_bc00ce0f-8408-4822-bfd7-77c6dd0a5665"},{"title":{},"width":720,"chosen":false,"height":1280,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_e4684e86-f30a-4134-9d42-4da31520b8b3","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-upload ის ცენტრის მეოთხე წლისთავის აღნიშვნაში მიიღო მონაწილეობა"},"he":{"auto":"הקרן השתתפה בחגיגת ארבע השנים של המרכז לתותבות ושיקום"},"ja":{"auto":"財団は、補綴とリハビリテーションセンターの4周年のお祝いに参加しました"},"ru":{"auto":"Фонд принял участие в праздновании четырехлетия Центра протезирования и реабилитации","manual":"Фонд принял участие в праздновании четырехлетия Центра протезирования и реабилитации"},"sr":{"auto":"Фондација је учествовала у прослави четворогодишњег Центра за протетику и рехабилитацију"},"tr":{"auto":"Vakıf, Protez ve Rehabilitasyon Merkezi'nin dört yıllık kutlamalarına katıldı"}},"breakpoint":"main"}],"published_at":"2026-02-18T06:49:34+00:00","updated_at":"2026-02-18T08:52:53.475438+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"شارك وفد من مؤسسة دعم الثقافة والتراث المسيحي ، بقيادة المدير التنفيذي إيجور سكوبينكو ، في حدث رسمي مخصص للذكرى السنوية الرابعة لمركز مسانا للأطراف الصناعية وإعادة التأهيل في دمشق. تم افتتاح المركز رسميا في مارس 2022 بمشاركة المؤسسة.\n\nحضر الحفل البطريرك يوحنا العاشر من أنطاكية ورجال الدين من البطريركية الأنطاكية ، ورئيس الأساقفة إيغور ياكيمشوك ، ونائب رئيس دائرة العلاقات الكنسية الخارجية في بطريركية موسكو ، وإيفجيني كوزلوف ، القائم بأعمال الاتحاد الروسي في سوريا ، ووفد من المؤسسة ، والعقيد أندريه بودريدينوف ، الملحق الدفاعي بسفارة الاتحاد الروسي في الجمهورية العربية السورية ، بالإضافة إلى ممثلين عن الإدارة السورية..\n\nخلال هذا الحدث ، أعرب البطريرك يوحنا عن امتنانه العميق للمؤسسة لدعم الثقافة والتراث المسيحي الذي يمثله إيجور سكوبينكو لمساهمته القيمة ومساعدته في افتتاح وتمويل أنشطة المركز. كدليل على التقدير الخاص ، قدم البطريرك يوحنا إيجور سكوبينكو أيقونة لوالدة الإله ، وقدم المدير التنفيذي للمؤسسة بدوره بطريرك أنطاكية أيقونة القديس سرجيوس رادونيج.\n\nوفي ختام الاحتفال ، توجه وفد المؤسسة إلى كنيسة نبي الله إيليا الأرثوذكسية في دمشق ، حيث فتح انتحاري النار على المصلين في 22 يونيو 2025 أثناء عبادة الأحد ، وبعد ذلك انتحر. نتيجة للهجوم الإرهابي في ذلك اليوم ، قتل 25 شخصا وأصيب أكثر من 60. \n\nتعرف ممثلو المؤسسة على تقدم أعمال التجديد في المعبد. "},"al":{"auto":"Një delegacion i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, i udhëhequr nga Drejtori Ekzekutiv Egor Skopenko, mori pjesë në një ngjarje solemne kushtuar katër vjetorit të Qendrës Së Protetikës Dhe Rehabilitimit Msana në Damask. Qendra u hap zyrtarisht në Mars 2022 me pjesëmarrjen e Fondacionit.\n\nNë këtë ngjarje morën pjesë Patriarku Gjon X I Antiokisë dhe klerikët E Patriarkanës Antiokiane, Kryeprifti Igor Yakimchuk, Nënkryetari i Departamentit Të Patriarkanës Së Moskës për Marrëdhëniet E Jashtme Të Kishës, Evgeny Kozlov, Përgjegjës për punët E Federatës ruse në Siri, një delegacion Nga Fondacioni, Kolonel Andrei Bodredinov, atashe Mbrojtës në Ambasadën e Federatës ruse në Republikën Arabe Siriane, si dhe përfaqësues të administratës Siriane..\n\nGjatë ngjarjes, Patriarku Gjon shprehu mirënjohjen e tij të thellë Për Fondacionin për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë të përfaqësuar nga Egor Skopenko për kontributin dhe ndihmën e tij të paçmuar në hapjen dhe financimin e aktiviteteve të Qendrës. Në shenjë vlerësimi të veçantë, Patriarku Gjon i dhuroi Egor Skopenkos një ikonë të Nënës së Zotit, dhe drejtori ekzekutiv i Fondacionit, nga ana tjetër, i paraqiti Patriarkut Të Antiokisë një ikonë të Shën Sergjit Të Radonezhit.\n\nNë fund të ngjarjes festive, delegacioni I Fondacionit shkoi në kishën Ortodokse të Profetit Të Zotit Elia në Damask, ku më 22 qershor 2025, gjatë adhurimit të së dielës, një sulmues vetëvrasës hapi zjarr ndaj adhuruesve, pas së cilës ai kreu vetëvrasje. Si rezultat i sulmit terrorist atë ditë, 25 njerëz u vranë dhe më shumë se 60 u plagosën. \n\nPërfaqësuesit e Fondacionit u njohën me përparimin e punës së rinovimit në tempull. "},"cn":{"auto":"由执行主任Egor Skopenko领导的基督教文化和遗产支持基金会代表团参加了一个庄严的活动，致力于大马士革Msana假肢和康复中心成立四周年。 该中心于2022年3月在基金会的参与下正式开放。\n\n出席这次活动的有安提阿族长约翰十世和安提阿族长牧师、莫斯科族长对外教会关系部副主席伊戈尔*亚基姆丘克、俄罗斯联邦驻叙利亚临时代办叶夫根尼*科兹洛夫、基金会代表团、俄罗斯联邦驻阿拉伯叙利亚共和国大使馆国防武官安德烈*博德雷迪诺夫上校以及叙利亚政府代表。.\n\n活动期间，宗主教约翰对以Egor Skopenko为代表的基督教文化和遗产的支持基金会表示深切感谢，感谢他在开放和资助中心活动方面的宝贵贡献和协助。 作为特别赞赏的标志，族长约翰向Egor Skopenko赠送了上帝之母的图标，基金会执行主任反过来向安提阿族长赠送了Radonezh的St.Sergius的图标。\n\n在节日活动结束时，基金会代表团前往大马士革上帝以利亚先知东正教会，在那里6月22，2025，在周日崇拜期间，一名自杀式炸弹袭击者向崇拜者开火，之后他 由于当天的恐怖袭击，25人死亡，60多人受伤。 \n\n基金会的代表了解了寺庙装修工作的进展情况。 "},"el":{"auto":"Μια αντιπροσωπεία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, με επικεφαλής τον Εκτελεστικό Διευθυντή Egor Skopenko, συμμετείχε σε επίσημη εκδήλωση αφιερωμένη στην τετραετή επέτειο του Κέντρου Προσθετικής και αποκατάστασης Msana στη Δαμασκό. Το κέντρο άνοιξε επίσημα τον Μάρτιο του 2022 με τη συμμετοχή του Ιδρύματος.\n\nΣτην εκδήλωση παρευρέθηκαν ο Πατριάρχης Αντιοχείας Ιωάννης Δ και κληρικοί του Πατριαρχείου Αντιοχείας, ο Αρχιερέας Ιγκόρ Γιακίμτσουκ, ο Αντιπρόεδρος του Τμήματος Εξωτερικών Εκκλησιαστικών Σχέσεων του Πατριαρχείου Μόσχας, ο Ευγένιος Κοζλόφ, υπεύθυνος Υποθέσεων της Ρωσική Ομοσπονδία στη Συρία, αντιπροσωπεία του Ιδρύματος, συνταγματάρχης Αντρέι Μποντρεντίνοφ, αμυντικός ακόλουθος στην Πρεσβεία της Ρωσική Ομοσπονδία στην Αραβική Δημοκρατία της Συρίας, καθώς και εκπρόσωποι της συριακής Διοίκησης..\n\nΚατά τη διάρκεια της εκδήλωσης, ο Πατριάρχης Ιωάννης εξέφρασε τη βαθιά ευγνωμοσύνη του στο Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς που εκπροσωπεί ο Έγκορ Σκοπένκο για την ανεκτίμητη συμβολή και βοήθεια του στο άνοιγμα και τη χρηματοδότηση των δραστηριοτήτων του Κέντρου. Ως ένδειξη ιδιαίτερης εκτίμησης, ο Πατριάρχης Ιωάννης παρουσίασε στον Έγκορ Σκοπένκο μια εικόνα της Μητέρας του Θεού και ο εκτελεστικός διευθυντής του Ιδρύματος, με τη σειρά του, παρουσίασε στον Πατριάρχη της Αντιόχειας μια εικόνα του Αγίου Σεργίου του Ραντόνεζ.\n\nΣτο τέλος της εορταστικής εκδήλωσης, η αντιπροσωπεία του Ιδρύματος πήγε στην Ορθόδοξη Εκκλησία του Προφήτη Του Θεού Ηλία στη Δαμασκό, όπου στις 22 Ιουνίου 2025, κατά τη διάρκεια της λατρείας της Κυριακής, ένας βομβιστής αυτοκτονίας άνοιξε πυρ εναντίον προσκυνητών, μετά τον οποίο αυτοκτόνησε. Ως αποτέλεσμα της τρομοκρατικής επίθεσης εκείνη την ημέρα, 25 άνθρωποι σκοτώθηκαν και περισσότεροι από 60 τραυματίστηκαν. \n\nΕκπρόσωποι του Ιδρύματος γνώρισαν την πρόοδο των εργασιών ανακαίνισης στο ναό. "},"en":{"auto":"A delegation of the Foundation for the Support of Christian Culture and Heritage, led by Executive Director Egor Skopenko, took part in a solemn event dedicated to the four-year anniversary of the Msana Prosthetics and Rehabilitation Center in Damascus. The Center was officially opened in March 2022 with the participation of the Foundation.\n\nThe event was attended by Patriarch John X of Antioch and clergymen of the Antiochian Patriarchate, Archpriest Igor Yakimchuk, Deputy Chairman of the Moscow Patriarchate's Department for External Church Relations, Evgeny Kozlov, Charge d'affaires of the Russian Federation in Syria, a delegation from the Foundation, Colonel Andrei Bodredinov, Defense attache at the Embassy of the Russian Federation in the Syrian Arab Republic, as well as representatives of the Syrian administration..\n\nDuring the event, Patriarch John expressed his deep gratitude to the Foundation for the Support of Christian Culture and Heritage represented by Egor Skopenko for his invaluable contribution and assistance in opening and financing the Center's activities. As a sign of special appreciation, Patriarch John presented Egor Skopenko with an icon of the Mother of God, and the executive director of the Foundation, in turn, presented the Patriarch of Antioch with an icon of St. Sergius of Radonezh.\n\nAt the end of the festive event, the Foundation's delegation went to the Orthodox church of the Prophet of God Elijah in Damascus, where on June 22, 2025, during Sunday worship, a suicide bomber opened fire on worshippers, after which he committed suicide. As a result of the terrorist attack that day, 25 people were killed and more than 60 were injured. \n\nRepresentatives of the Foundation got acquainted with the progress of the renovation work in the temple. "},"fr":{"auto":"La délégation Du fonds de soutien à la culture chrétienne et au patrimoine, dirigée par le directeur exécutif Yegor skopenko, a participé à l'événement solennel consacré aux Quatre ans du centre de prothèse et de réadaptation Msana à Damas. Le centre a été officiellement ouvert en mars 2022 avec la participation de la Fondation.\n\nLe Patriarche Jean X d \u0026 apos; Antioche et les membres du clergé du Patriarcat d \u0026 apos; Antioche, l \u0026 apos; archiprêtre Igor yakimchuk, vice-président du Département des relations ecclésiastiques extérieures du Patriarcat de Moscou, Yevgeny Kozlov, chargé d \u0026 apos; affaires par intérim de la Fédération de Russie en Syrie, la délégation de la Fondation, le colonel Andrey Bodredinov, attaché à la défense à l \u0026 apos; Ambassade de la Fédération de Russie en République arabe syrienne, ainsi que des représentants de l \u0026 apos; administration syrienne ont participé à l \u0026 apos; événement.\n\nAu cours de l'événement, le Patriarche Jean a exprimé sa profonde gratitude au Fonds de soutien à la culture chrétienne et au patrimoine, représenté par Egor skopenko, pour sa contribution inestimable et son aide à l'ouverture et au financement des activités du Centre. En signe de gratitude particulière, le Patriarche Jean a donné à Egor skopenko l'icône de la Mère de Dieu, et le directeur exécutif de la Fondation a présenté au Patriarche d'Antioche l'icône du révérend Serge de Radonège.\n\nÀ la fin de l'événement festif, la délégation de la Fondation s'est rendue à l'église orthodoxe du prophète Elie de Dieu à Damas, dans laquelle, le 22 juin 2025, lors du culte du dimanche, un kamikaze a ouvert le feu sur les fidèles en prière, après quoi il s'est suicidé. L'attentat a fait 25 morts ce jour-là et plus de 60 blessés. \n\nLes représentants de la Fondation ont pris connaissance de l'état d'avancement des travaux de réparation dans le temple. "},"ge":{"auto":"ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დელეგაციამ, აღმასრულებელი დირექტორის ეგორ სკოპენკოს ხელმძღვანელობით, მონაწილეობა მიიღო დამასკოს Msana პროთეზირებისა და რეაბილიტაციის ცენტრის ოთხი წლისთავისადმი მიძღვნილ საზეიმო ღონისძიებაში. ცენტრი ოფიციალურად გაიხსნა 2022 წლის მარტში ფონდის მონაწილეობით.\n\nღონისძიებას ესწრებოდნენ ანტიოქიის პატრიარქი იოანე X და ანტიოქიის საპატრიარქოს სასულიერო პირები, დეკანოზი იგორ იაკიმჩუკი, მოსკოვის საპატრიარქოს საგარეო საეკლესიო ურთიერთობების დეპარტამენტის თავმჯდომარის მოადგილე ევგენი კოზლოვი, რუსეთის ფედერაციის Charge d ' affaires სირიაში, ფონდის დელეგაცია, პოლკოვნიკი ანდრეი ბოდრედინოვი, თავდაცვის ატაშე რუსეთის ფედერაციის საელჩოში სირიის არაბულ რესპუბლიკაში, ასევე სირიის ადმინისტრაციის წარმომადგენლები..\n\nღონისძიების მსვლელობისას პატრიარქმა იოანემ ღრმა მადლობა გადაუხადა ფონდს ეგორ სკოპენკოს მიერ წარმოდგენილი ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერისთვის ფასდაუდებელი წვლილისა და დახმარებისათვის ცენტრის საქმიანობის გახსნასა და დაფინანსებაში. განსაკუთრებული მადლიერების ნიშნად, პატრიარქმა იოანემ ეგორ სკოპენკოს ღვთისმშობლის ხატი გადასცა, ხოლო ფონდის აღმასრულებელმა დირექტორმა, თავის მხრივ, ანტიოქიის პატრიარქს რადონეჟის წმინდა სერგის ხატი გადასცა.\n\nსადღესასწაულო ღონისძიების ბოლოს ფონდის დელეგაცია დამასკოში, ღვთის წინასწარმეტყველის ელიას მართლმადიდებლურ ეკლესიაში მივიდა, სადაც 2025 წლის 22 ივნისს, საკვირაო ღვთისმსახურების დროს, თვითმკვლელმა ტერორისტმა ცეცხლი გაუხსნა მრევლს, რის შემდეგაც მან თავი მოიკლა. იმ დღეს მომხდარი ტერაქტის შედეგად 25 ადამიანი დაიღუპა და 60-ზე მეტი დაშავდა. \n\nფონდის წარმომადგენლები ტაძარში სარემონტო სამუშაოების მიმდინარეობას გაეცნენ. "},"he":{"auto":"משלחת של קרן תמיכה בתרבות נוצרית ומורשת בראשותו של המנכ \"ל יגור סקופנקו השתתפה באירוע חגיגי, המוקדש לארבע שנות מרכז התותבות והשיקום של\" מסאנה \" בדמשק. המרכז נפתח רשמית במרץ 2022 בהשתתפות הקרן.\n\nבאירוע השתתפו הפטריארך ג 'ון ה' מאנטיוכיה ואנשי הדת של הפטריארכיה של אנטיוכיה, סגן יו \"ר המחלקה ליחסי הכנסייה החיצוניים של הפטריארכיה של מוסקבה, הפרוטו-הכומר איגור יקימצ' וק, הנאמן הזמני לענייני הפדרציה הרוסית בסוריה, יבגני קוזלוב, משלחת הקרן, נספח ההגנה בשגרירות הפדרציה הרוסית ברפובליקה הערבית הסורית, קולונל אנדריי בודרדינוב, ונציגי הממשל הסורי.\n\nבמהלך האירוע, הפטריארך יוחנן הביע תודה עמוקה לקרן התמיכה בתרבות הנוצרית ובמורשת, יגור סקופנקו, על תרומה ועזרה שלא יסולא בפז בפתיחת ומימון פעילות המרכז. כסימן של הערכה מיוחדת, הפטריארך יוחנן נתן לאגור סקופנקו את האייקון של האם של אלוהים, והמנהל המבצעי של הקרן, בתורו, העניק לפטריארך אנטיוכי את האייקון של הקדוש סרג 'י רדונז' י.\n\nלאחר סיום האירוע החגיגי, משלחת הקרן נסעה למקדש האורתודוקסי של אליהו הנביא בדמשק, שבו ב-22 ביוני 2025, במהלך שירות יום ראשון, מחבל מתאבד פתח באש על המתפללים המתפללים, ולאחר מכן ביצע פיצוץ עצמי. בפיגוע באותו יום נהרגו 25 בני אדם, יותר מ -60 נפצעו. \n\nנציגי הקרן הכירו את התקדמות עבודות התיקון במקדש. "},"ja":{"auto":"エゴール・スコペンコ事務局長が率いるキリスト教文化遺産支援財団の代表団は、ダマスカスのMsana義肢リハビリテーションセンターの4周年に捧げられた厳粛なイベントに参加しました。 センターは、財団の参加を得て2022年3月に正式にオープンしました。\n\nこのイベントには、アンティオキア総主教ジョンXとアンティオキア総主教の聖職者、モスクワ総主教の外部教会関係部門の副議長であるIgor Yakimchuk大司教、Evgeny Kozlov、シリアのロシア連邦の担当代理、財団からの代表団、Andrei Bodredinov大佐、シリアアラブ共和国のロシア連邦大使館の防衛アタッシュケース、およびシリア政権の代表者が出席しました。.\n\nイベント中、ジョン総主教は、センターの活動を開始し、資金調達における彼の貴重な貢献と支援のためのエゴールスコペンコによって表されるキリスト教文化と遺産の支援のための財団に深い感謝の意を表明しました。 特別な感謝のしるしとして、総主教ジョンはエゴール・スコペンコに神の母のアイコンを提示し、財団の事務局長はアンティオキア総主教にラドネジの聖セルギウスのアイコンを提示しました。\n\nお祝いのイベントの終わりに、財団の代表団はダマスカスの神の預言者エリヤの正教会に行きました、そこで2025年6月22日、日曜日の礼拝中に、自爆テロ犯が崇拝者に発砲し、その後彼は自殺しました。 その日のテロ攻撃の結果、25人が死亡し、60人以上が負傷した。 \n\n財団の代表者は、寺院の改修工事の進捗状況を知りました。 "},"ru":{"auto":"Делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко приняла участие в торжественном мероприятии, посвященном четырехлетию Центра протезирования и реабилитации «Мсана» в Дамаске. Центр был официально открыт в марте 2022 года при участии Фонда.\n\nВ мероприятии приняли участие Патриарх Антиохийский Иоанн Х и священнослужители Антиохийского Патриархата, заместитель председателя Отдела внешних церковных связей Московского Патриархата протоиерей Игорь Якимчук, временный поверенный в делах Российской Федерации в Сирии Евгений Козлов, делегация Фонда, атташе по вопросам обороны при Посольстве Российской Федерации в Сирийской Арабской Республике полковник Андрей Бодрединов, а также представители сирийской администрации.\n\nВ ходе мероприятия Патриарх Иоанн выразил глубокую благодарность Фонду поддержки христианской культуры и наследия в лице Егора Скопенко за неоценимый вклад и помощь в открытии и финансировании деятельности Центра. В знак особой признательности Патриарх Иоанн подарил Егору Скопенко икону Божией Матери, а исполнительный директор Фонда в свою очередь преподнес Патриарху Антиохийскому икону преподобного Сергия Радонежского.\n\nПо окончании праздничного мероприятия делегация Фонда отправилась в православный храм пророка Божия Илии в Дамаске, в котором 22 июня 2025 года во время воскресного богослужения террорист-смертник открыл огонь по молящимся прихожанам, после чего совершил самоподрыв. В результате теракта в тот день погибли 25 человек, более 60 были ранены. \n\nПредставители Фонда ознакомились с ходом выполнения ремонтных работ в храме. ","manual":"Делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко приняла участие в торжественном мероприятии, посвященном четырехлетию Центра протезирования и реабилитации «Мсана» в Дамаске. Центр был официально открыт в марте 2022 года при участии Фонда.\n\nВ мероприятии приняли участие Патриарх Антиохийский Иоанн Х и священнослужители Антиохийского Патриархата, заместитель председателя Отдела внешних церковных связей Московского Патриархата протоиерей Игорь Якимчук, временный поверенный в делах Российской Федерации в Сирии Евгений Козлов, делегация Фонда, атташе по вопросам обороны при Посольстве Российской Федерации в Сирийской Арабской Республике полковник Андрей Бодрединов, а также представители сирийской администрации.\n\nВ ходе мероприятия Патриарх Иоанн выразил глубокую благодарность Фонду поддержки христианской культуры и наследия в лице Егора Скопенко за неоценимый вклад и помощь в открытии и финансировании деятельности Центра. В знак особой признательности Патриарх Иоанн подарил Егору Скопенко икону Божией Матери, а исполнительный директор Фонда в свою очередь преподнес Патриарху Антиохийскому икону преподобного Сергия Радонежского.\n\nПо окончании праздничного мероприятия делегация Фонда отправилась в православный храм пророка Божия Илии в Дамаске, в котором 22 июня 2025 года во время воскресного богослужения террорист-смертник открыл огонь по молящимся прихожанам, после чего совершил самоподрыв. В результате теракта в тот день погибли 25 человек, более 60 были ранены. \n\nПредставители Фонда ознакомились с ходом выполнения ремонтных работ в храме. "},"sr":{"auto":"Делегација Фонда за подршку хришћанској култури и наслеђу на челу са извршним директором Егором Скопенком учествовала је у свечаном догађају посвећеном четворогодишњем центру за протезирање и рехабилитацију Мсана у Дамаску. Центар је званично отворен у марту 2022.године уз учешће Фондације.\n\nУ догађају су учествовали Антиохијски патријарх Јован Х и свештеници Антиохијске Патријаршије, заменик председника Одељења за спољне црквене везе Московске патријаршије протојереј Игор Јакимчук, привремени отправник послова Руске Федерације у Сирији Евгений Козлов, делегација Фонда, атташе за питања одбране при Амбасади Руске Федерације у Сиријској Арапској Републици пуковник Андреј Бодрединов, као и представници сиријске администрације.\n\nТоком догађаја, патријарх Јован је изразио дубоку захвалност Фонду за подршку хришћанске културе и наслеђа у лику Егора Скопенкоа за непроцењив допринос и помоћ у отварању и финансирању активности Центра. У знак посебне захвалности патријарх Јован је Егору Скопенку поклонио икону Божије мајке, а извршни директор Фонда је у свом реду Патријарху поклонио Антиохијску икону преподобног Сергија Радонежског.\n\nНакон празника, делегација Фонда је отишла у православни храм пророка Божијег Илије у Дамаску, у којем је 22.јуна 2025. године, током недељне богослужења, терорист-самоубица отворио ватру на молитвене приходнике, након чега је извршио самоподрив. У терористичком нападу тог дана погинуло је 25 људи, а више од 60 је рањено. \n\nПредставници Фонда упознали су се са ходом извршења поправних радова у храму. "},"tr":{"auto":"İcra Direktörü Yegor Skopenko başkanlığındaki Hıristiyan Kültürü ve Mirasını Destekleme Fonu'ndan bir heyet, Şam'daki Msana Protez ve Rehabilitasyon Merkezi'nin dört yıllık yıldönümüne adanmış ciddi etkinliğe katıldı. Merkez, Vakfın katılımıyla Mart 2022'de resmi olarak açıldı.\n\nEtkinliğe Antakya Patriği John X ve Antakya Patrikhanesi din adamları, Moskova Patrikhanesi Dış Kilise İlişkileri Dairesi Başkan Yardımcısı Başpiskopos Igor Yakimchuk, Suriye'deki Rusya Federasyonu Maslahatgüzarı Yevgeny Kozlov, Vakıf heyeti, Suriye Arap Cumhuriyeti'ndeki Rusya Federasyonu Büyükelçiliği Savunma Ataşesi Albay Andrey Bodredinov ve Suriye yönetiminin temsilcileri katıldı.\n\nEtkinlik sırasında Patrik John, Yegor Skopenko'nun şahsındaki Hıristiyan Kültürünü ve Mirasını Destekleme Fonu'na, Merkezin açılışına ve finansmanına paha biçilmez katkılarından ve yardımlarından dolayı derin minnettarlığını dile getirdi. Patrik John, özel bir takdirin işareti olarak Yegor Skopenko'ya Tanrı'nın Annesi'nin bir ikonunu sundu ve Vakfın icra direktörü de Antakya Patriği'ne Radonezh'li Saygıdeğer Sergius'un bir ikonunu sundu.\n\nBayram etkinliğinin sonunda Vakfın heyeti, 22 Haziran 2025'te Pazar ayini sırasında bir intihar bombacısının dua eden cemaatçilere ateş açtığı Şam'daki Tanrı Peygamberi İlyas Ortodoks Kilisesi'ne gitti ve ardından kendi kendini cesaretlendirdi. O gün düzenlenen saldırıda 25 kişi öldü, 60'tan fazla kişi yaralandı. \n\nVakfın temsilcileri, tapınaktaki onarım çalışmalarının ilerleyişini tanıdılar. "}}},"component":"content-flow"},{"images":[{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_01c88ff1-e989-4077-a68b-f8bfcf20eeb5","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_d8390ef8-317f-423f-bd51-0d11fe8457b7"},{"title":{},"width":720,"chosen":false,"height":1280,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_14bc2801-9f9b-482a-9754-97627fa37d59","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_8cf671db-e27b-4b60-84a4-d21f622d7f0d"},{"title":{},"width":960,"chosen":false,"height":540,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_36b1f10c-747e-437c-924c-52a5494be80a","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_fcaf91a6-de2b-4373-985b-806968dabccf"},{"title":{},"width":720,"chosen":false,"height":1280,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_a0a01fe3-5ceb-4197-bd67-673020f3ed09","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_4e35cf6b-04bf-4607-9902-a36c20b60019"},{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_5ec6fb56-ecc7-422b-9ace-0a7c7adb834d","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_5ab6ab48-e525-4f24-be88-c70156efd06a"},{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_155210d3-6cec-498b-82b8-a192c93e97c2","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/18/image-name_4a874438-7
