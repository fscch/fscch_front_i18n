 στη Δαμασκό"},"en":{"auto":"The Fund's delegation paid a working visit to Damascus"},"fr":{"auto":"Une délégation de la Fondation a effectué une visite de travail à Damas"},"ge":{"auto":"ფონდის დელეგაცია სამუშაო ვიზიტით დამასკოში იმყოფებოდა"},"he":{"auto":"משלחת הקרן ביקרה בביקור עבודה בדמשק"},"ja":{"auto":"基金の代表団は、ダマスカスへの作業訪問を支払いました"},"ru":{"auto":"Делегация Фонда посетила с рабочим визитом Дамаск","manual":"Делегация Фонда посетила с рабочим визитом Дамаск"},"sr":{"auto":"Делегација Фонда посетила Дамаск у радној посети"},"tr":{"auto":"Vakıf heyeti Şam'ı çalışma ziyareti için ziyaret etti"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_cad07b26-cd7e-488e-8ae8-6301835caa42","title":{"ae":{"auto":"وفد الصندوق يقوم بزيارة عمل إلى دمشق"},"al":{"auto":"Fondi i delegacionit të paguar një vizitë pune në Damask"},"cn":{"auto":"该基金代表团对大马士革进行了工作访问"},"el":{"auto":"Η αντιπροσωπεία του Ταμείου πραγματοποίησε επίσκεψη εργασίας στη Δαμασκό"},"en":{"auto":"The Fund's delegation paid a working visit to Damascus"},"fr":{"auto":"Une délégation de la Fondation a effectué une visite de travail à Damas"},"ge":{"auto":"ფონდის დელეგაცია სამუშაო ვიზიტით დამასკოში იმყოფებოდა"},"he":{"auto":"משלחת הקרן ביקרה בביקור עבודה בדמשק"},"ja":{"auto":"基金の代表団は、ダマスカスへの作業訪問を支払いました"},"ru":{"auto":"Делегация Фонда посетила с рабочим визитом Дамаск","manual":"Делегация Фонда посетила с рабочим визитом Дамаск"},"sr":{"auto":"Делегација Фонда посетила Дамаск у радној посети"},"tr":{"auto":"Vakıf heyeti Şam'ı çalışma ziyareti için ziyaret etti"}},"breakpoint":"main"}],"published_at":"2026-02-17T15:50:07+00:00","updated_at":"2026-02-17T15:54:17.299841+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 16 فبراير 2026 ، قام وفد من مؤسسة دعم الثقافة والتراث المسيحي ، برئاسة المدير التنفيذي إيجور سكوبينكو ، بزيارة عمل إلى مدينة دمشق (سوريا). \n\nكجزء من رحلة العمل ، زار ممثلو المؤسسة مركز مسانا للأطراف الصناعية وإعادة التأهيل في دمشق ، والذي يصادف هذا العام الذكرى الرابعة لافتتاحه. تعرف أعضاء المؤسسة على الوضع الحالي وأنشطة المركز ، وأعربوا عن تقديرهم الكبير لنتائج عمله وناقشوا مع الإدارة آفاق تطوير المؤسسة الطبية. \n\nبالإضافة إلى ذلك ، في نفس اليوم ، التقى وفد من المؤسسة مع الأرشمندريت فيليب (فاسيلتسيف) ، ممثل بطريرك موسكو وكل روسيا لدى بطريرك أنطاكية العظمى وكل الشرق ، في مجمع الكنيسة الأرثوذكسية الروسية في دمشق. خلال المحادثة ، ناقش الطرفان الأنشطة الحالية للمزرعة ، وكذلك قضايا تقديم المساعدة اللازمة."},"al":{"auto":"Më 16 shkurt 2026, një delegacion i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, i kryesuar nga Drejtori Ekzekutiv Egor Skopenko, bëri një vizitë pune në qytetin E Damaskut (Siri). \n\nSi pjesë e udhëtimit të punës, përfaqësuesit e Fondacionit vizituan Qendrën E Protetikës Dhe Rehabilitimit Msana në Damask, e cila këtë vit shënon përvjetorin e katërt të hapjes së saj. Anëtarët e Fondacionit u njohën me gjendjen dhe aktivitetet aktuale të Qendrës, vlerësuan shumë rezultatet e punës së saj dhe diskutuan me menaxhmentin perspektivat për zhvillimin e institucionit mjekësor. \n\nPër më tepër, në të njëjtën ditë, një delegacion i Fondacionit u takua me Arkimandritin Filip (Vasiltsev), përfaqësues i Patriarkut të Moskës dhe Të gjithë Rusisë Te Patriarku i Antiokisë së madhe dhe I Gjithë Lindjes, në kompleksin e Kishës Ortodokse ruse Në Damask. Gjatë bisedës, palët diskutuan aktivitetet aktuale të fermës, si dhe çështjet e ofrimit të ndihmës së nevojshme."},"cn":{"auto":"2026年2月16日，由执行主任叶戈尔*斯科潘科率领的基督教文化和遗产支持基金会代表团对大马士革（叙利亚）进行了工作访问。 \n\n作为工作之旅的一部分，基金会的代表参观了大马士革的Msana假肢和康复中心，今年是该中心开业四周年。 基金会成员了解了该中心的现状和活动，高度赞赏其工作成果，并与管理层讨论了医疗机构的发展前景。 \n\n此外，同一天，基金会的一个代表团在大马士革的俄罗斯东正教大院会见了莫斯科和全俄罗斯族长代表Archimandrite Philip（Vasiltsev）。 在谈话中，双方讨论了农场主目前的活动，以及提供必要援助的问题。"},"el":{"auto":"Στις 16 Φεβρουαρίου 2026, μια αντιπροσωπεία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, με επικεφαλής τον Εκτελεστικό Διευθυντή Egor Skopenko, πραγματοποίησε επίσκεψη εργασίας στην πόλη της Δαμασκού (Συρία). \n\nΣτο πλαίσιο του ταξιδιού εργασίας, εκπρόσωποι του Ιδρύματος επισκέφθηκαν το κέντρο Προσθετικής και αποκατάστασης Msana στη Δαμασκό, το οποίο φέτος σηματοδοτεί την τέταρτη επέτειο από το άνοιγμά του. Τα μέλη του Ιδρύματος γνώρισαν την τρέχουσα κατάσταση και τις δραστηριότητες του Κέντρου, εκτιμούσαν ιδιαίτερα τα αποτελέσματα των εργασιών του και συζήτησαν με τη διοίκηση τις προοπτικές ανάπτυξης του ιατρικού ιδρύματος. \n\nΕπιπλέον, την ίδια ημέρα, αντιπροσωπεία του Ιδρύματος συναντήθηκε με τον Αρχιμανδρίτη Φίλιππο (Βασίλτσεφ), εκπρόσωπο του Πατριάρχη Μόσχας και Πάσης Ρωσίας στον Πατριάρχη μεγάλης Αντιοχείας και Πάσης Ανατολής, στο συγκρότημα της Ρωσική Ορθόδοξη Εκκλησία στη Δαμασκό. Κατά τη διάρκεια της συνομιλίας, τα μέρη συζήτησαν τις τρέχουσες δραστηριότητες του αγροκτήματος, καθώς και θέματα παροχής της απαραίτητης βοήθειας."},"en":{"auto":"On February 16, 2026, a delegation of the Foundation for the Support of Christian Culture and Heritage, headed by Executive Director Egor Skopenko, paid a working visit to the city of Damascus (Syria). \n\nAs part of the working trip, representatives of the Foundation visited the Msana Prosthetics and Rehabilitation Center in Damascus, which this year marks the fourth anniversary of its opening. The members of the Foundation got acquainted with the current state and activities of the Center, highly appreciated the results of its work and discussed with the management the prospects for the development of the medical institution. \n\nIn addition, on the same day, a delegation of the Foundation met with Archimandrite Philip (Vasiltsev), representative of the Patriarch of Moscow and All Russia to the Patriarch of Great Antioch and All the East, at the compound of the Russian Orthodox Church in Damascus. During the conversation, the parties discussed the current activities of the farmstead, as well as issues of providing necessary assistance."},"fr":{"auto":"La délégation du Fonds de soutien à la culture chrétienne et au patrimoine, dirigée par le directeur exécutif Yegor skopenko, a visité la ville de Damas (Syrie) le 16 février 2026. \n\nDans le cadre de cette visite de travail, des représentants de la Fondation se sont rendus au centre de prothèse et de réadaptation Msana à Damas, qui célèbre cette année le quatrième anniversaire de son ouverture. Les membres du Fonds se sont familiarisés avec l \u0026 apos; état d \u0026 apos; avancement et les activités du Centre, ont salué les résultats de ses travaux et ont discuté avec la direction des perspectives de développement de l \u0026 apos; établissement de santé. \n\nEn outre, le même jour, la délégation de la Fondation a rencontré le représentant du Patriarche de Moscou et de toute la Russie auprès du Patriarche de la grande Antioche et de tout l'Orient, l'archimandrite Philip (Vasiltsev), à la cour de l'Église orthodoxe russe à Damas. Dans le cadre de l'entretien, les parties ont discuté des activités en cours de la ferme, ainsi que de la fourniture de l'assistance nécessaire."},"ge":{"auto":"2026 წლის 16 თებერვალს ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დელეგაცია, აღმასრულებელი დირექტორის ეგორ სკოპენკოს ხელმძღვანელობით, სამუშაო ვიზიტით იმყოფებოდა ქალაქ დამასკოში (სირია). \n\nსამუშაო მოგზაურობის ფარგლებში, ფონდის წარმომადგენლები დამასკოში მდებარე Msana Prosthetics and Rehabilitation Center-ს ესტუმრნენ, რომელიც წელს მისი გახსნის მეოთხე წლისთავს აღნიშნავს. ფონდის წევრები გაეცნენ ცენტრის არსებულ მდგომარეობას და საქმიანობას, მაღალი შეფასება მისცეს მისი მუშაობის შედეგებს და მენეჯმენტთან ერთად განიხილეს სამედიცინო დაწესებულების განვითარების პერსპექტივები. \n\nგარდა ამისა, იმავე დღეს ფონდის დელეგაცია შეხვდა არქიმანდრიტ ფილიპეს (ვასილცევი), მოსკოვისა და სრულიად რუსეთის პატრიარქის წარმომადგენელს დიდი ანტიოქიისა და მთელი აღმოსავლეთის პატრიარქთან, დამასკოს რუსეთის მართლმადიდებელი ეკლესიის შენობაში. საუბრის დროს მხარეებმა განიხილეს ფერმერული მეურნეობის მიმდინარე საქმიანობა, ასევე საჭირო დახმარების გაწევის საკითხები."},"he":{"auto":"משלחת של קרן תמיכה בתרבות נוצרית ומורשת בראשות המנהל המבצעי יגור סקופנקו ביקרה בעיר דמשק (סוריה) ב-16 בפברואר 2026. \n\nבמסגרת מסע העבודה ביקרו נציגי הקרן במרכז התותבות והשיקום\" מסאנה \" בדמשק, שחוגג השנה ארבע שנים מאז פתיחתו. חברי הקרן התוודעו למצב הנוכחי ולפעילות המרכז, העריכו מאוד את תוצאות עבודתו ודיברו עם ההנהלה על סיכויי פיתוח המוסד הרפואי. \n\nבנוסף, באותו יום, בחצר הכנסייה האורתודוקסית הרוסית בדמשק, התקיימה פגישה של משלחת הקרן עם נציג הפטריארך של מוסקבה וכל רוסיה, תחת הפטריארך של אנטיוכיה הגדולה וכל המזרח, הארכימנדריט פיליפ (ואסילצ ' ב). במסגרת השיחה, הצדדים דנו בפעילות השוטפת של החצר, כמו גם בנושאים של מתן העזרה הדרושה."},"ja":{"auto":"2026年2月16日、エゴール・スコペンコ事務局長を団長とするキリスト教文化遺産支援財団の代表団がダマスカス市(シリア)を実際に訪問しました。 \n\n作業旅行の一環として、財団の代表者はダマスカスのMsana義肢-リハビリテーションセンターを訪問しました。 財団のメンバーは、センターの現在の状態と活動を知り、その仕事の結果を高く評価し、医療機関の発展の見通しを経営陣と議論しました。 \n\nさらに、同じ日に、財団の代表団は、ダマスカスのロシア正教会の複合施設で、モスクワ総主教と全ロシア総主教の代表であるArchimandrite Philip（Vasiltsev）と会いました。 会話の中で、当事者は農場の現在の活動だけでなく、必要な支援を提供する問題について議論しました。"},"ru":{"auto":"Делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко 16 февраля 2026 года посетила с рабочим визитом город Дамаск (Сирия). \n\nВ рамках рабочей поездки представители Фонда посетили Центр протезирования и реабилитации «Мсана» в Дамаске, который в этом году отмечает четырехлетие с момента открытия. Члены Фонда ознакомились с текущим состоянием и деятельностью Центра, высоко оценили результаты его работы и обсудили с руководством перспективы развития медицинского учреждения. \n\nКроме того, в этот же день на подворье Русской Православной Церкви в Дамаске состоялась встреча делегации Фонда с представителем Патриарха Московского и всея Руси при Патриархе Великой Антиохии и всего Востока архимандритом Филиппом (Васильцевым). В рамках беседы стороны обсудили текущую деятельность подворья, а также вопросы оказания необходимой помощи.","manual":"Делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко 16 февраля 2026 года посетила с рабочим визитом город Дамаск (Сирия). \n\nВ рамках рабочей поездки представители Фонда посетили Центр протезирования и реабилитации «Мсана» в Дамаске, который в этом году отмечает четырехлетие с момента открытия. Члены Фонда ознакомились с текущим состоянием и деятельностью Центра, высоко оценили результаты его работы и обсудили с руководством перспективы развития медицинского учреждения. \n\nКроме того, в этот же день на подворье Русской Православной Церкви в Дамаске состоялась встреча делегации Фонда с представителем Патриарха Московского и всея Руси при Патриархе Великой Антиохии и всего Востока архимандритом Филиппом (Васильцевым). В рамках беседы стороны обсудили текущую деятельность подворья, а также вопросы оказания необходимой помощи."},"sr":{"auto":"Делегација Фонда за подршку хришћанске културе и наслеђа на челу са извршним директором Егором Скопенком посетила је град Дамаск (Сирија) са радном посетом 16.фебруара 2026. године. \n\nКао део радног путовања, представници Фондације посетили су центар за протетику и рехабилитацију Мсана у Дамаску, који ове године обележава четворогодишњицу од отварања. Чланови Фонда су се упознали са текућим стањем и активностима Центра, високо су оценили резултате његовог рада и разговарали са руководством о перспективи развоја медицинске установе. \n\nОсим тога, истог дана на дворишту Руске Православне Цркве у Дамаску одржана је састанак делегације Фонда са представником Патријарха московског и целе Русе при Патријарху Велике Антиохије и целог Истока архимандритом Филипом (Васильцевом). У оквиру разговора, стране су разговарале о текућој активности дворишта, као и о пружању потребне помоћи."},"tr":{"auto":"İcra Direktörü Yegor Skopenko başkanlığındaki Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'ndan bir heyet, 16 Şubat 2026'da Şam şehrini (Suriye) çalışma ziyareti için ziyaret etti. \n\nÇalışma gezisinin bir parçası olarak Vakıf temsilcileri, bu yıl açılışından bu yana dört yılını kutlayan Şam'daki Msana Protez ve Rehabilitasyon Merkezini ziyaret etti. Vakıf üyeleri Merkezin mevcut durumu ve faaliyetleri hakkında bilgi sahibi oldular, çalışmalarının sonuçlarını takdir ettiler ve bir sağlık kurumunun gelişimi için yönetim ile umutları tartıştılar. \n\nAyrıca aynı gün Şam'daki Rus Ortodoks Kilisesi'nin avlusunda, Vakıf delegasyonu, Büyük Antakya Patriği ve tüm Doğu'daki Moskova Patriği ve tüm Rusya temsilcisi Archimandrite Philip (Vasiltsev) ile bir toplantı yaptı. Görüşmenin bir parçası olarak taraflar, avlunun mevcut faaliyetlerini ve gerekli yardımı sağlama konularını tartıştılar."}}},"component":"content-flow"},{"images":[{"title":{},"width":960,"chosen":false,"height":540,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_46e0ccff-5905-4768-8917-4d183604c7ec","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_faf57b40-3bb6-4fdb-bb25-47df447653f4"},{"title":{},"width":720,"chosen":false,"height":1280,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_d1a3052e-7b11-422d-8636-2b0fad79d6ee","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_40d5ca73-0b78-4bd0-8f4a-a00c42878193"},{"title":{},"width":960,"chosen":false,"height":540,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_3eaa78d5-67ea-4482-952e-a437ec48851a","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/17/image-name_670134e5-2114-4c77-b124-1ae1c4332cd9"}],"heading":{},"component":"image-gallery"}],"seo":{"og":{},"html":{}},"settings":{"type":"base","source":{}},"type":"Content::News","country":{"name":{"ae":{"auto":"سوريا"},"al":{"auto":"Siri"},"cn":{"auto" 、キリスト教文化と遺産の支援のための財団によって資金提供されました。"},"ru":{"auto":"Работы по внутреннему благоукрашению собора, которые завершились в конце 2024 года, были профинансированы Фондом поддержки христианской культуры и наследия.","manual":"Работы по внутреннему благоукрашению собора, которые завершились в конце 2024 года, были профинансированы Фондом поддержки христианской культуры и наследия."},"sr":{"auto":"Радови на унутрашњем украшавању Катедрале, који су завршени крајем 2024.године, финансирани су од стране Фонда за подршку хришћанској култури и наслеђу."},"tr":{"auto":"2024 yılının sonunda tamamlanan katedralin iç dekorasyon çalışmaları, Hıristiyan Kültürü ve Mirasını Destekleme Vakfı tarafından finanse edildi."}}},"picture":[{"alt":{"ae":{"auto":"الخدمة في الكاتدرائية في كوسيتش"},"al":{"auto":"Shërbimi Në Katedralen Në Kosice"},"cn":{"auto":"科西策大教堂的服务"},"el":{"auto":"Υπηρεσία στον Καθεδρικό Ναό στο Κόσιτσε"},"en":{"auto":"Service at the Cathedral in Kosice"},"fr":{"auto":"Service à la cathédrale de Košice"},"ge":{"auto":"მსახურება კოსიცის საკათედრო ტაძარში"},"he":{"auto":"שירות בקתדרלה בקושיץ"},"ja":{"auto":"コシツェの大聖堂でのサービス"},"ru":{"auto":"Служба в кафедральном соборе в Кошице","manual":"Служба в кафедральном соборе в Кошице"},"sr":{"auto":"Служба у катедралној катедрали у Кошици"},"tr":{"auto":"Kösice'deki Katedral Katedrali'nde hizmet"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2026/03/04/image-name_9f1b9eec-95e7-4544-bb0e-85094b3a21cc","title":{"ae":{"auto":"الخدمة في الكاتدرائية في كوسيتش"},"al":{"auto":"Shërbimi Në Katedralen Në Kosice"},"cn":{"auto":"科西策大教堂的服务"},"el":{"auto":"Υπηρεσία στον Καθεδρικό Ναό στο Κόσιτσε"},"en":{"auto":"Service at the Cathedral in Kosice"},"fr":{"auto":"Service à la cathédrale de Košice"},"ge":{"auto":"მსახურება კოსიცის საკათედრო ტაძარში"},"he":{"auto":"שירות בקתדרלה בקושיץ"},"ja":{"auto":"コシツェの大聖堂でのサービス"},"ru":{"auto":"Служба в кафедральном соборе в Кошице","manual":"Служба в кафедральном соборе в Кошице"},"sr":{"auto":"Служба у катедралној катедрали у Кошици"},"tr":{"auto":"Kösice'deki Katedral Katedrali'nde hizmet"}},"breakpoint":"main"}],"published_at":"2026-02-15T11:27:27+00:00","updated_at":"2026-03-04T14:38:30.926035+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 15 فبراير ، في أسبوع الدينونة الأخيرة ، بمباركة رئيس الأساقفة جورج ميشالوفو-كوسيتش ، احتفل الأرشمندريت سيرافيم (شيماتوفسكي) ، ممثل الكنيسة الأرثوذكسية للأراضي التشيكية وسلوفاكيا لدى بطريرك موسكو وكل روسيا ، بالقداس الإلهي في الكاتدرائية تكريما لرقاد السيدة العذراء مريم والقديس يوحنا الرحيم والقديسة روزاليا باليرمو في مدينة كوسيتش (سلوفاكيا).\n\nرافق الأرشمندريت سيرافيم رئيس الكاتدرائية ، رئيس الكهنة ماتفي سبيشاك ، ورجال الدين في المعبد. في نهاية الخدمة ، شكر الأرشمندريت سيرافيم رئيس الجامعة والشعب على صلاتهم وتمنى لجميع أولئك الذين يصلون بعون الله وهدايا وفيرة من الرب.\n\n**مساعدة**\n\nتم بناء الكاتدرائية الأرثوذكسية تكريما لانتقال السيدة العذراء مريم في مدينة كوسيتش ، ثاني أكبر مدينة في سلوفاكيا ، على حساب المؤمنين وتم تكريسها في عام 2013 ، لكنها ظلت غير مصبوغة حتى عام 2023. \n\nتم تمويل التجميل الداخلي للكاتدرائية ، الذي اكتمل في نهاية عام 2024 ، من قبل مؤسسة دعم الثقافة والتراث المسيحي. لعب تجميل الكاتدرائية في كوسيتش دورا كبيرا في تعزيز الأرثوذكسية في الجمهورية السلوفاكية. "},"al":{"auto":"Më 15 shkurt, Në Javën e Gjykimit të fundit, Me bekimin e Kryepeshkopit George Të Michalovo-Kosice, Arkimandriti Seraphim (Shemyatovsky), përfaqësues i Kishës Ortodokse të Tokave çeke dhe Sllovakisë Te Patriarku I Moskës dhe I Gjithë Rusisë, festoi Liturgjinë Hyjnore Në Katedrale Për nder Të Fjetjes Së Virgjëreshës Së Bekuar Mari, Shën Gjonit Të Mëshirshëm dhe Shën Rosalia E Palermos në qytetin E Kosice (Sllovaki).\n\nArkimandriti Serafim shoqërohej nga rektori i katedrales, Kryeprifti Matvey Spishak dhe kleri i tempullit. Në fund të shërbimit, Arkimandriti Serafim falënderoi rektorin dhe njerëzit për lutjen e tyre dhe u uroi të gjithë atyre që luteshin ndihmën e Zotit dhe Dhuratat e bollshme nga Zoti.\n\n**Ndihmë**\n\nKatedralja Ortodokse Për nder të Fjetjes së Virgjëreshës Së Bekuar Mari në qytetin E Kosice, qyteti i dytë më i madh në Sllovaki, u ndërtua në kurriz të besimtarëve dhe u shenjtërua në 2013, por mbeti e pa lyer deri në 2023. \n\nZbukurimi i brendshëm i katedrales, i cili përfundoi në fund të vitit 2024, u financua nga Fondacioni për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë. Zbukurimi i Katedrales në Kosice luajti një rol të madh në forcimin e Ortodoksisë në Republikën sllovake. "},"cn":{"auto":"2月15日,在最后审判的一周,在米哈洛沃-科西策大主教乔治的祝福下,捷克土地和斯洛伐克东正教会代表阿基米德里特*塞拉芬(舍米亚托夫斯基)在莫斯科和全俄罗斯主教的祝福下,在大教堂举行了神圣的礼拜仪式,以纪念在科西策市的圣母玛利亚、仁慈的圣约翰和巴勒莫的圣罗萨利亚。\n\nArchimandrite Seraphim由大教堂的校长，Archpriest Matvey Spishak和寺庙的神职人员陪同。 在服务结束时，Archimandrite Seraphim感谢校长和人民的祈祷，并祝愿所有祈祷上帝的帮助和来自主的丰富礼物。\n\n**帮助**\n\n斯洛伐克第二大城市科希策市为纪念圣母玛利亚升天而建的东正教大教堂，以牺牲信徒为代价，并于2013年奉献，但直到2023年仍未上漆。 \n\n大教堂的内部美化工作于2024年底完成，由基督教文化和遗产支持基金会资助。 科希策大教堂的美化对加强斯洛伐克共和国的东正教起到了很大的作用。 "},"el":{"auto":"Στις 15 Φεβρουαρίου, την εβδομάδα της Τελευταίας κρίσης, με την ευλογία του Αρχιεπισκόπου Γεωργίου Μιχαλόβο-Κοσίτσε, ο αρχιμανδρίτης Σεραφείμ (Σεμιατόφσκι), εκπρόσωπος της Ορθόδοξης Εκκλησίας των τσεχικών εδαφών και της Σλοβακίας στον Πατριάρχη Μόσχας και Πάσης Ρωσίας, τέλεσε τη Θεία Λειτουργία στον καθεδρικό ναό προς τιμήν της Κοίμησης της Θεοτόκου, του Αγίου Ιωάννη του Ελεήμονα και της Αγίας Ροζαλίας του Παλέρμο στην πόλη Κοσίτσε (Σλοβακία).\n\nΟ αρχιμανδρίτης Σεραφείμ συνοδευόταν από τον Πρύτανη του καθεδρικού ναού, τον αρχιερέα Ματβέι Σπισάκ, και τον κλήρο του ναού. Στο τέλος της υπηρεσίας, ο αρχιμανδρίτης Σεραφείμ ευχαρίστησε τον Πρύτανη και τον λαό για την προσευχή τους και ευχήθηκε σε όλους εκείνους που προσεύχονταν τη βοήθεια του Θεού και άφθονα δώρα από τον Κύριο.\n\n**Βοήθεια**\n\nΟ Ορθόδοξος Καθεδρικός ναός προς τιμήν της Κοίμησης της Θεοτόκου στην πόλη Κοσίτσε, τη δεύτερη μεγαλύτερη πόλη της Σλοβακίας, χτίστηκε σε βάρος των πιστών και αφιερώθηκε το 2013, αλλά παρέμεινε άβαφος μέχρι το 2023. \n\nΗ εσωτερική ομορφιά του καθεδρικού ναού, η οποία ολοκληρώθηκε στα τέλη του 2024, χρηματοδοτήθηκε από το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς. Η ομορφιά του καθεδρικού ναού στο Κόσιτσε έπαιξε μεγάλο ρόλο στην ενίσχυση της Ορθοδοξίας στη Σλοβακική Δημοκρατία. "},"en":{"auto":"On February 15, in the Week of the Last Judgment, with the blessing of Archbishop George of Michalovo-Kosice, Archimandrite Seraphim (Shemyatovsky), representative of the Orthodox Church of the Czech Lands and Slovakia to the Patriarch of Moscow and All Russia, celebrated the Divine Liturgy at the Cathedral in honor of the Assumption of the Blessed Virgin Mary, St. John the Merciful and St. Rosalia of Palermo in the city of Kosice (Slovakia).\n\nArchimandrite Seraphim was accompanied by the rector of the cathedral, Archpriest Matvey Spishak, and the clergy of the temple. At the end of the service, Archimandrite Seraphim thanked the rector and the people for their prayer and wished all those praying God's help and abundant Gifts from the Lord.\n\n**Help**\n\nThe Orthodox Cathedral in honor of the Assumption of the Blessed Virgin Mary in the city of Kosice, the second largest city in Slovakia, was built at the expense of believers and consecrated in 2013, but remained unpainted until 2023. \n\nThe interior beautification of the cathedral, which was completed at the end of 2024, was funded by the Foundation for the Support of Christian Culture and Heritage. The beautification of the Cathedral in Kosice played a great role in strengthening Orthodoxy in the Slovak Republic. "},"fr":{"auto":"Le 15 février, dans la Semaine du jugement Dernier, avec la bénédiction de l'archevêque Michalowsko-Košice George, le représentant de l'Église orthodoxe des terres Tchèques et de Slovaquie auprès du Patriarche de Moscou et de toute la Russie, l'archimandrite Séraphin (Shemiatovsky) a dirigé la divine liturgie À la cathédrale en l'honneur de l'Assomption de la Sainte vierge, de Saint Jean le miséricordieux et de Sainte Rosalie de Palerme dans la ville de Košice (Slovaquie).\n\nL'archimandrite Séraphin était l'abbé de la cathédrale, l'archiprêtre Matvey Spišak, et les clercs de l'église. À la fin de l'Office, l'archimandrite Séraphin a remercié l'abbé et le peuple pour la prière et a souhaité à tous ceux qui priaient l'aide de Dieu et les Dons abondants du Seigneur.\n\n**Attestation**\n\nLa cathédrale orthodoxe en l'honneur de l'Assomption de la vierge dans la ville de Košice – la deuxième plus grande ville de Slovaquie – a été érigée sur les fonds des croyants et consacrée en 2013, mais jusqu'en 2023, elle est restée sans peinture. \n\nLes travaux de décoration intérieure de la cathédrale, qui se sont achevés fin 2024, ont été financés par le fonds de soutien à la culture chrétienne et au patrimoine. L'embellissement de la cathédrale de Košice a joué un rôle important dans le renforcement de l'Orthodoxie en République slovaque. "},"ge":{"auto":"15 თებერვალს, ბოლო განკითხვის კვირაში, მიხალოვო-კოსიცის მთავარეპისკოპოს გიორგის კურთხევით, არქიმანდრიტმა სერაფიმმა (შემიატოვსკი), ჩეხეთის მიწებისა და სლოვაკეთის მართლმადიდებელი ეკლესიის წარმომადგენელმა მოსკოვისა და სრულიად რუსეთის პატრიარქთან, ტაძარში საღმრთო ლიტურგია აღავლინა ყოვლადწმინდა ღვთისმშობლის მიძინების საპატივცემულოდ, წმინდა იოანე მოწყალე და პალერმოს წმინდა როზალია ქალაქ კოსიცეში (სლოვაკეთი).\n\nარქიმანდრიტ სერაფიმეს თან ახლდა ტაძრის რექტორი, დეკანოზი მატვეი სპიშაკი და ტაძრის სასულიერო პირები. მსახურების დასასრულს არქიმანდრიტმა სერაფიმემ მადლობა გადაუხადა რექტორს და ხალხს ლოცვისთვის და უსურვა ყველა იმ ადამიანს, ვინც ლოცულობდა ღვთის დახმარებას და უფლისგან უხვი საჩუქრებს.\n\n**დახმარება**\n\nსლოვაკეთის სიდიდით მეორე ქალაქ კოსიცეში ყოვლადწმინდა ღვთისმშობლის მიძინების საპატივცემულოდ მართლმადიდებლური ტაძარი მორწმუნეთა ხარჯზე აშენდა და 2013 წელს აკურთხეს, მაგრამ 2023 წლამდე შეუღებავი დარჩა. \n\nტაძრის შიდა გალამაზება, რომელიც დასრულდა 2024 წლის ბოლოს, დაფინანსდა ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის მიერ. კოსიცის საკათედრო ტაძრის გალამაზებამ დიდი როლი ითამაშა სლოვაკეთის რესპუბლიკაში მართლმადიდებლობის გაძლიერებაში. "},"he":{"auto":"ב-15 בפברואר בשבוע על פסק הדין האחרון בברכת הארכיבישוף מיכלובסק-קושיצקי, ג 'ורג', נציג הכנסייה האורתודוכסית של ארצות צ 'כיה וסלובקיה תחת הפטריארך של מוסקבה וכל רוסיה, הארכימנדריט סרפים (שמיאטובסקי) הוביל את הליטורגיה האלוהית בקתדרלה לכבוד הנחת הבתולה הקדושה, סנט ג' ון האדיב וסנט רוזליה מפאלרמה בעיר קושיצה (סלובקיה).\n\nארכימנדריט סרפימוס שירת את ראש הכנסייה, פרוטו-הכומר מאטוויי ספישאק, ואת אנשי הכנסייה. בסוף השירות, הארכימנדרט סרפים הודה למנזר ולעם על התפילה, ואיחל לכל המתפללים את עזרתו של אלוהים ואת המתנות הרבות של האדון.\n\n**עזרה**\n\nהקתדרלה האורתודוקסית לכבוד ההתנשאות של הקדושה בעיר קושיץ, העיר השנייה בגודלה בסלובקיה, נבנתה בכספי המאמינים והוקדשה בשנת 2013, אך עד 2023 נשארה ללא ציור. \n\nעבודות העיטור הפנימי של הקתדרלה, שהסתיימו בסוף 2024, מומנו על ידי הקרן לתמיכה בתרבות ומורשת נוצרית. קישוט הקתדרלה בקושיץ ' שיחק חשיבות רבה לחיזוק האורתודוקסיה ברפובליקה הסלובקית. "},"ja":{"auto":"2月15日、最後の審判の週に、Michalovo-Kosiceのジョージ大司教の祝福を受けて、モスクワと全ロシアの総主教へのチェコの土地とスロバキアの正教会の代表であるArchimandrite Seraphim(Shemyatovsky)は、Kosice市(スロバキア)の聖母マリア、慈悲深い聖ヨハネとパレルモの聖ロザリアの生神女就寝に敬意を表して大聖堂で神の典礼を祝いました。\n\nArchimandrite Seraphimは、大聖堂の学長、大司祭Matvey Spishak、および寺院の聖職者を伴っていました。 奉仕の終わりに、Archimandrite Seraphimは彼らの祈りのために学長と人々に感謝し、神の助けと主からの豊富な贈り物を祈っているすべての人々を望みました。\n\n*•ヘルプ**\n\nスロバキアで2番目に大きい都市であるコシツェ市の聖母マリアの被昇天を記念した正教会の大聖堂は、信者を犠牲にして建てられ、2013年に奉献されましたが、2023年まで塗装されていませんでした。 \n\n2024年末に完成した大聖堂の内部美化は、キリスト教文化と遺産の支援のための財団によって資金提供されました。 コシツェの大聖堂の美化は、スロバキア共和国の正統派を強化する上で大きな役割を果たしました。"},"ru":{"auto":"15 февраля в Неделю о Страшном суде по благословению архиепископа Михаловско-Кошицкого Георгия представитель Православной Церкви Чешских земель и Словакии при Патриархе Московском и всея Руси архимандрит Серафим (Шемятовский) возглавил Божественную Литургию в кафедральном соборе в честь Успения Пресвятой Богородицы, святого Иоанна Милостивого и святой Розалии Палермской в городе Кошице (Словакия).\n\nАрхимандриту Серафиму сослужили настоятель собора протоиерей Матвей Спишак и клирики храма. В конце богослужения архимандрит Серафим поблагодарил настоятеля и народ за молитву и пожелал всем молящимся помощи Божией и обильных Даров от Господа.\n\n**Справка**\n\nПравославный кафедральный собор в честь Успения Пресвятой Богородицы в городе Кошице – втором по величине городе Словакии – был возведен на средства верующих и освящен в 2013 году, однако до 2023 года оставался без росписи. \n\nРаботы по внутреннему благоукрашению собора, которые завершились в конце 2024 года, были профинансированы Фондом поддержки христианской культуры и наследия. Благоукрашение кафедрального собора в Кошице сыграло большое значение для укрепления Православия в Словацкой Республике. ","manual":"15 февраля в Неделю о Страшном суде по благословению архиепископа Михаловско-Кошицкого Георгия представитель Православной Церкви Чешских земель и Словакии при Патриархе Московском и всея Руси архимандрит Серафим (Шемятовский) возглавил Божественную Литургию в кафедральном соборе в честь Успения Пресвятой Богородицы, святого Иоанна Милостивого и святой Розалии Палермской в городе Кошице (Словакия).\n\nАрхимандриту Серафиму сослужили настоятель собора протоиерей Матвей Спишак и клирики храма. В конце богослужения архимандрит Серафим поблагодарил настоятеля и народ за молитву и пожелал всем молящимся помощи Божией и обильных Даров от Господа.\n\n**Справка**\n\nПравославный кафедральный собор в честь Успения Пресвятой Богородицы в городе Кошице – втором по величине городе Словакии – был возведен на средства верующих и освящен в 2013 году, однако до 2023 года оставался без росписи. \n\nРаботы по внутреннему благоукрашению собора, которые завершились в конце 2024 года, были профинансированы Фондом поддержки христианской культуры и наследия. Благоукрашение кафедрального собора в Кошице сыграло большое значение для укрепления Православия в Словацкой Республике. "},"sr":{"auto":"15. фебруара у недељи о Страшном суду по благослову архиепископа Михаловско-Кошицког Георгија, представник Православне Цркве чешких земаља и Словачке при Патријарху Московском и целе Русије архимандрит Серафим (Шемятовски) је предводио Божанску Литургију у кафедралној катедрали у част Успени Пресвете Богородице, Светог Јована Милостивог и свете Розалије Палермске у граду Кошице (Словачка).\n\nАрхимандриту Серафиму су служили настоятел собора протоиереја Матвеј Спишак и клирике храма. На крају богослужења архимандрит Серафим је захвалио настоятељу и народу на молитви и пожелео свима који се моле за помоћ Божију и обилне дарове од Господа.\n\n**Помоћ**\n\nПравославна кафедрална црква у част Успени Пресвете Богородице у Кошицу, другом по величини граду Словачке, подигнута је на средства верника и осветена 2013.године, али је до 2023. године остала без росписе. \n\nРадови на унутрашњем украшавању Катедрале, који су завршени крајем 2024.године, финансирани су од стране Фонда за подршку хришћанској култури и наслеђу. Благоукрашавање кафедралне собе у Кошици одиграло је велико значење за јачање Православља у Словачкој Републици. "},"tr":{"auto":"15 Şubat haftasında, Mikhalovsko-Kösice Başpiskoposu George'un kutsamasıyla, Çek Toprakları ve Slovakya Ortodoks Kilisesi'nin Moskova Patriği ve Tüm Rusya yönetimindeki temsilcisi Archimandrite Seraphim (Shemyatovsky), Kösice şehrinde (Slovakya) Kutsal Meryem Ana'nın Göğe Kabulü, Merhametli Aziz John ve Palerma'lı Aziz Rosalia'nın onuruna Katedral Katedrali'nde İlahi Ayinlere başkanlık etti.\n\nKatedralin başrahibi başrahip Matvey Spishak ve tapınağın din adamları, Archimandrite Seraphim'e hizmet ettiler. İbadetin sonunda Arşimandrit Seraphim, rektöre ve halka duaları için teşekkür etti ve tüm dua edenlere Tanrı'nın yardımını ve Rab'den bol bol armağanlar diledi.\n\n**Bilgi**\n\nSlovakya'nın en büyük ikinci şehri olan Kösic ي كولانتاي ، مع طلاب المدرسة اللاهوتية من الدول الأفريقية ، مع البطريرك البطريركي لأفريقيا ، المطران قسطنطين في القاهرة وشمال إفريقيا.\n\nخلال الاجتماع ، هنأ الأسقف كونستانتين الكاهن فيتالي كولانتاي على تعيينه رئيسا لمدرسة تومسك اللاهوتية وقدم له هدية لا تنسى-صورة منضدية للرب يسوع المسيح. \n\nثم خاطب المطران كونستانتين الإكليريكيين بكلمات ترحيبية ، واستفسر عن أدائهم الأكاديمي ومشاركتهم في طاعة الكنيسة. كما تم إبلاغ فلاديكا بنتائج حج الأطفال إلى دير كهوف دورميتيون بسكوف المقدس ، الذي تم تنظيمه بمساعدة مؤسسة دعم الثقافة والتراث المسيحي. في الاجتماع مع الأسقف الحاكم ، يمكن للطلاب طرح أسئلتهم. في نهاية الاجتماع ، قدم فلاديكا للطلاب أيقونات للقديسين الموقرين بشكل خاص.\n\nفي ذلك المساء أيضا ، قاد البطريرك البطريركي لأفريقيا ، المطران قسطنطين في القاهرة وشمال إفريقيا ، وقفة احتجاجية طوال الليل في كنيسة القديس فيليب ، مطران موسكو ، في مشانسكايا سلوبودا في موسكو. رافق سماحته رئيس مدرسة تومسك اللاهوتية ورجال الدين في الكنيسة. كما صلى الإكليريكيون من مدرسة تومسك اللاهوتية من إفريقيا وآسيا في الخدمة."},"al":{"auto":"Më 31 janar 2026, rektori i Seminarit Teologjik Tomsk, Prifti Vitaly Kollantai, së bashku me studentët e shkollës teologjike nga vendet Afrikane, u takuan me Ekzarkun Patriarkal të Afrikës, Mitropolitin Kostandin të Kajros dhe Afrikën E Veriut.\n\nGjatë takimit, Peshkopi Konstantin uroi Priftin Vitaly Kollantai për emërimin e tij si rektor i Seminarit Teologjik Tomsk dhe i dhuroi atij një dhuratë të paharrueshme – një imazh tavoline të Zotit Jezu Krisht. \n\nMitropoliti Konstantin më pas iu drejtua seminaristëve me fjalë mikpritëse, pyeti për performancën e tyre akademike dhe pjesëmarrjen në bindjet e kishës. Vladyka u informua gjithashtu për rezultatet e pelegrinazhit të fëmijëve në Manastirin E Shpellave Të Fjetjes Së Shenjtë Pskov, të organizuar me ndihmën e Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë. Në takimin me peshkopin në pushtet, studentët mund të bënin pyetjet e tyre. Në fund të takimit, Vladyka u prezantoi studentëve ikona të shenjtorëve veçanërisht të nderuar.\n\nGjithashtu atë mbrëmje, Eksarku Patriarkal i Afrikës, Mitropolit Konstantini i Kajros dhe Afrikës Së Veriut, udhëhoqi një vigjilje gjithë natën në Kishën e Shën Filipit, Mitropolit I Moskës, në Meshchanskaya Sloboda të Moskës. Eminenca e tij u shoqërua nga rektori i Seminarit Teologjik Tomsk dhe kleri i tempullit. Seminaristët nga Seminari Teologjik Tomsk nga Afrika dhe Azia gjithashtu u lutën në shërbim."},"cn":{"auto":"2026年1月31日，托木斯克神学院院长维塔利*科兰泰神父与来自非洲国家的神学院学生一起会见了非洲的宗主教，开罗和北非的君士坦丁大都会。\n\n会议期间，康斯坦丁主教祝贺维塔利*科兰泰神父被任命为托木斯克神学院院长，并送给他一份令人难忘的礼物--主耶稣基督的桌面形象。 \n\n康斯坦丁大都会随后向神学院学生致以欢迎的话语，询问他们的学习成绩和参与教会服从的情况。 Vladyka还被告知在支持基督教文化和遗产基金会的协助下组织的儿童前往圣宿舍普斯科夫洞穴修道院朝圣的结果。 在与执政主教的会面中，学生可以提出他们的问题。 在会议结束时，Vladyka向学生展示了特别受人尊敬的圣人的图标。\n\n同样在那天晚上，非洲的宗主教，开罗和北非的君士坦丁大都会，在莫斯科大都会的圣菲利普教堂，在莫斯科的Meshchanskaya Sloboda举行了通宵守夜。 托木斯克神学院院长和教会的神职人员陪同他的显赫。 来自非洲和亚洲的托木斯克神学院的神学院也在礼拜仪式上祈祷。"},"el":{"auto":"Στις 31 Ιανουαρίου 2026, ο πρύτανης του θεολογικού σεμιναρίου του Τομσκ, ιερέας Βιτάλι Κολλαντάι, μαζί με φοιτητές της Θεολογικής Σχολής από αφρικανικές χώρες, συναντήθηκαν με τον Πατριαρχικό Εξάρχη Αφρικής, Μητροπολίτη Καΐρου και Βόρειας Αφρικής Κωνσταντίνο.\n\nΚατά τη διάρκεια της συνάντησης, ο Επίσκοπος Κωνσταντίνος συγχαίρει τον ιερέα Βιτάλι Κολλαντάι για το διορισμό του ως πρύτανη του θεολογικού σεμιναρίου του Τομσκ και του παρουσίασε ένα αξέχαστο δώρο – μια επιτραπέζια εικόνα του Κυρίου Ιησού Χριστού. \n\nΟ Μητροπολίτης Κωνσταντίνος απευθύνθηκε στη συνέχεια στους ιεροκήρυκες με φιλόξενα λόγια, ρώτησε για τις ακαδημαϊκές τους επιδόσεις και τη συμμετοχή τους στις εκκλησιαστικές υπακοές. Η Βλάντυκα ενημερώθηκε επίσης για τα αποτελέσματα του παιδικού προσκυνήματος στη Μονή Σπηλαίων Ιεράς Κοιμήσεως της Θεοτόκου Πσκοφ, που διοργανώθηκε με τη συνδρομή του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς. Στη συνάντηση με τον κυβερνώντα επίσκοπο, οι μαθητές μπορούσαν να κάνουν τις ερωτήσεις τους. Στο τέλος της συνάντησης, η Βλάντυκα παρουσίασε στους μαθητές εικόνες ιδιαίτερα σεβαστών Αγίων.\n\nΕπίσης εκείνο το βράδυ, ο Πατριαρχικός Εξάρχης της Αφρικής, Μητροπολίτης Καΐρου και Βόρειας Αφρικής Κωνσταντίνος, ηγήθηκε ολονύχτιας αγρυπνίας στην εκκλησία του Αγίου Φιλίππου, Μητροπολίτη Μόσχας, στη Μεσχάνσκαγια Σλόμποδα της Μόσχας. Ο Σεβασμιώτατος συνοδευόταν από τον Πρύτανη του θεολογικού σεμιναρίου του Τομσκ και τον κλήρο της εκκλησίας. Οι ιεροκήρυκες από το Θεολογικό Σεμινάριο του Τομσκ από την Αφρική και την Ασία προσευχήθηκαν επίσης στην υπηρεσία."},"en":{"auto":"On January 31, 2026, the rector of Tomsk Theological Seminary, Priest Vitaly Kollantai, together with students of the theological school from African countries, met with the Patriarchal Exarch of Africa, Metropolitan Constantine of Cairo and North Africa.\n\nDuring the meeting, Bishop Konstantin congratulated Priest Vitaly Kollantai on his appointment as rector of the Tomsk Theological Seminary and presented him with a memorable gift – a tabletop image of the Lord Jesus Christ. \n\nMetropolitan Konstantin then addressed the seminarians with welcoming words, inquired about their academic performance and participation in church obediences. Vladyka was also informed about the results of the children's pilgrimage to the Holy Dormition Pskov Caves Monastery, organized with the assistance of the Foundation for the Support of Christian Culture and Heritage. At the meeting with the ruling bishop, students could ask their questions. At the end of the meeting, Vladyka presented the students with icons of particularly venerated saints.\n\nAlso that evening, the Patriarchal Exarch of Africa, Metropolitan Constantine of Cairo and North Africa, led an all-night vigil at the Church of St. Philip, Metropolitan of Moscow, in the Meshchanskaya Sloboda of Moscow. His Eminence was assisted by the rector of the Tomsk Theological Seminary and the clergy of the temple. Seminarians from Tomsk Theological Seminary from Africa and Asia also prayed at the service."},"fr":{"auto":"Le 31 janvier 2026, le recteur du séminaire théologique de Tomsk, Jeremiah Vitaly Kollantai, avec des étudiants de l'école théologique d'Afrique, a rencontré l'exarque patriarcal d'Afrique, le métropolite du Caire et Constantin d'Afrique du Nord.\n\nAu cours de la réunion, Mgr Constantin a félicité Jérémie Vitaly Kollantai pour sa nomination au poste de recteur du séminaire de Tomsk et lui a remis un cadeau mémorable – une image de table du Seigneur Jésus-Christ. \n\nEn outre, le métropolite Constantin a adressé des mots de bienvenue aux séminaristes, leur a demandé leurs résultats scolaires et leur participation à l'obéissance de l'église. En outre, le Seigneur a été informé des résultats de la visite de pèlerinage des enfants au monastère Saint-Assomption de Pskov-Pechersk, organisé avec l'aide du Fonds de soutien à la culture chrétienne et au patrimoine. Lors d'une réunion avec l'évêque au pouvoir, les étudiants pouvaient poser des questions qui les intéressaient. À la fin de la réunion, le Seigneur a offert aux étudiants des icônes de saints particulièrement honorés.\n\nToujours ce soir-là, dans l'église de Saint-Philippe, le métropolite de Moscou, dans la Sloboda Meshchanskaya de Moscou, la veillée de la nuit était dirigée par l'exarque patriarcal d'Afrique, le métropolite du Caire et Constantin d'Afrique du Nord. Le recteur du séminaire de Tomsk et le clergé de l'église ont servi le souverain éminent. Des séminaristes du séminaire de Tomsk venus d'Afrique et d'Asie ont également prié pour le service."},"ge":{"auto":"2026 წლის 31 იანვარს ტომსკის სასულიერო სემინარიის რექტორი, მღვდელი ვიტალი კოლანტაი, აფრიკის ქვეყნების სასულიერო სკოლის სტუდენტებთან ერთად, შეხვდა აფრიკის პატრიარქალურ ეგზარქს, კაიროსა და ჩრდილოეთ აფრიკის მიტროპოლიტ კონსტანტინეს.\n\nშეხვედრის დროს ეპისკოპოსმა კონსტანტინემ მღვდელ ვიტალი კოლანტაის ტომსკის სასულიერო სემინარიის რექტორად დანიშვნა მიულოცა და სამახსოვრო საჩუქარი – უფალ იესო ქრისტეს მაგიდის გამოსახულება გადასცა. \n\nშემდეგ მიტროპოლიტმა კონსტანტინემ სემინარისტებს მისასალმებელი სიტყვებით მიმართა, დაინტერესდა მათი აკადემიური მოსწრებითა და საეკლესიო მორჩილებებში მონაწილეობით. ვლადიკა ასევე ინფორმირებული იყო ბავშვთა მომლოცველთა მოგზაურობის შედეგების შესახებ წმინდა მიძინების ფსკოვის გამოქვაბულების მონასტერში, რომელიც ორგანიზებული იყო ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დახმარებით. მმართველ ეპისკოპოსთან შეხვედრაზე სტუდენტებს შეეძლოთ თავიანთი კითხვების დასმა. შეხვედრის ბოლოს ვლადიკამ სტუდენტებს განსაკუთრებით პატივცემული წმინდანების ხატები გადასცა.\n\nასევე იმ საღამოს, აფრიკის საპატრიარქო ეგზარქი, კაიროსა და ჩრდილოეთ აფრიკის მიტროპოლიტი კონსტანტინე, მთელი ღამის სიფხიზლეს ატარებდა მოსკოვის მიტროპოლიტის წმინდა ფილიპეს ეკლესიაში, მოსკოვის მეშჩანსკაია სლობოდაში. მისი აღმატებულება თან ახლდა ტომსკის სასულიერო სემინარიის რექტორს და ტაძრის სასულიერო პირებს. სემინარისტები ტომსკის სასულიერო სემინარიიდან აფრიკიდან და აზიიდან ასევე ლოცულობდნენ მსახურებაზე."},"he":{"auto":"ב-31 בינואר 2026 רקטור הסמינר הרוחני של טום, הכומר ויטאלי קולנטאי, יחד עם תלמידי בית הספר הרוחני ממדינות אפריקה, נפגשו עם הפטריארך האקסארך של אפריקה, מיטרופוליט קאהיר וצפון אפריקה קונסטנטין.\n\nבמהלך הפגישה, קונסטנטין בירך את הכומר ויטאלי קולנטאי על מינויו לתפקיד רקטור של הסמינר הרוחני של טום ונתן לו מתנה זיכרון-דמות שולחן של האדון ישוע המשיח. \n\nלאחר מכן, המיטרופוליט קונסטנטין פנה עם מילות ברכה לסמינרים, התעניין בהצלחתם ובהשתתפותם בצייתנות הכנסייה. כמו כן, הודיעו לאדון על תוצאות טיול הפילגרימים של הילדים למנזר הגברים פסקוב-פצ ' ר הקדוש-אוספנסקי, שאורגן בסיוע קרן תמיכה בתרבות הנוצרית ובמורשת. בפגישה עם הבישוף השולט, התלמידים יכלו לשאול שאלות שמעניינות אותם. לאחר סיום הפגישה, האדון נתן לתלמידים אייקונים של קדושים מכובדים במיוחד.\n\nכמו כן, בערב זה במקדש של הקדוש פיליפ, מיטרופוליט מוסקבה, בסלובד משטני של מוסקבה, משמרת כל הלילה הונהגה על ידי אקסארך הפטריארכי של אפריקה, מיטרופוליט קאהיר וצפון אפריקה קונסטנטין. הוד קדושתו של האדון הוגשה על ידי רקטור הסמינר הרוחני של טום והכמרים של המקדש. גם סמינרים של הסמינר הרוחני של טום ממדינות אפריקה ואסיה התפללו לשירות."},"ja":{"auto":"月31日2026、学長のトムスク神学校、神官Vitaly Kollantaiとともに、学生の神学校からアフリカ諸国は、総主教Exarchのアフリカの首都コンスタンティンカイロ北アフリカへと広がりました。\n\n会合では、ビショップコンスタンを祝僧Vitaly Kollantai就任に学長のトムスク神学校とか、思い出に残るギフト–ビーム光線も、テーブルの範囲イメージは、主イエス-キリスト. \n\nメトロポリタンコンスタンティンはその後、歓迎の言葉で神学校に対処し、彼らの学業成績と教会の従順への参加について尋ねました。 Vladykaも知らの結果から、子どもへの巡礼の聖Dormition Pskov洞窟修道院、組織の支援財団の支援のためのキリスト教文化館があります。 この会合での判決にビショップ、学生させることができるなどその質問をします。 末のVladykaの学生のアイコンの中心に崇敬されて来ます\n\nまたその夜、家父長制Exarchのアフリカの首都コンスタンティンのカイロ-北アフリカ、led夜徹夜の聖フィリップ-首都モスクワののMeshchanskaya Slobodaいただけます。 彼の優位の学長のトムスク神学校、聖職者、寺院があります。 アフリカとアジアからのトムスク神学校からの神学校も礼拝で祈りました。"},"ru":{"auto":"31 января 2026 года ректор Томской духовной семинарии иерей Виталий Коллантай совместно со студентами духовной школы из стран Африки встретились с Патриаршим экзархом Африки митрополитом Каирским и Северо-Африканским Константином.\n\nВ ходе встречи владыка Константин поздравил иерея Виталия Коллантай с назначением на должность ректора Томской духовной семинарии и вручил ему памятный подарок – настольный образ Господа Иисуса Христа. \n\nДалее митрополит Константин обратился с приветственными словами к семинаристам, поинтересовался их успеваемостью и участием в церковных послушаниях. Также владыке было сообщено о результатах паломнической поездки ребят в Свято-Успенский Псково-Печерский мужской монастырь, организованной при содействии Фонда поддержки христианской культуры и наследия. На встрече с правящим архиереем студенты могли задать интересующие их вопросы. По окончании встречи владыка подарил студентам иконы особо чтимых святых.\n\nТакже в этот вечер в храме святителя Филиппа, митрополита Московского, в Мещанской Слободе г. Москвы всенощное бдение возглавил Патриарший экзарх Африки митрополит Каирский и Северо-Африканский Константин. Высокопреосвященному владыке сослужил ректор Томской духовной семинарии и духовенство храма. За службой также молились семинаристы Томской духовной семинарии из стран Африки и Азии.","manual":"31 января 2026 года ректор Томской духовной семинарии иерей Виталий Коллантай совместно со студентами духовной школы из стран Африки встретились с Патриаршим экзархом Африки митрополитом Каирским и Северо-Африканским Константином.\n\nВ ходе встречи владыка Константин поздравил иерея Виталия Коллантай с назначением на должность ректора Томской духовной семинарии и вручил ему памятный подарок – настольный образ Господа Иисуса Христа. \n\nДалее митрополит Константин обратился с приветственными словами к семинаристам, поинтересовался их успеваемостью и участием в церковных послушаниях. Также владыке было сообщено о результатах паломнической поездки ребят в Свято-Успенский Псково-Печерский мужской монастырь, организованной при содействии Фонда поддержки христианской культуры и наследия. На встрече с правящим архиереем студенты могли задать интересующие их вопросы. По окончании встречи владыка подарил студентам иконы особо чтимых святых.\n\nТакже в этот вечер в храме святителя Филиппа, митрополита Московского, в Мещанской Слободе г. Москвы всенощное бдение возглавил Патриарший экзарх Африки митрополит Каирский и Северо-Африканский Константин. Высокопреосвященному владыке сослужил ректор Томской духовной семинарии и духовенство храма. За службой также молились семинаристы Томской духовной семинарии из стран Африки и Азии."},"sr":{"auto":"31.јануара 2026. ректор Томске духовне семинарије јереј Виталиј Коллантай заједно са студентима духовне школе из земаља Африке упознао се са Патријаршким екзархом Африке митрополитом Каирским и северноафричким Константином.\n\nТоком састанка, владика Константин је поздравио јереја Виталија Коллантаја са назначењем на позицију ректора Томске духовне семинарије и предао му спомен поклон столну слику Господа Исуса Христа. \n\nДаље је митрополит Константин обратио се семинаристима са поздравним речима, питао се о њиховом успеху и учешћи у црквеним послушањима. Такође, владику је објављено о резултатима ходочасничког путовања дечака у Свето-Успенски Псково-Печерски мушки манастир, организованог уз помоћ Фонда за подршку хришћанске културе и наслеђа. На састанку са владајућим архиерејем студенти су могли да постављају питања која су их интересовала. Након завршетка састанка, Владика је студентима поклонио иконе посебно поштованих светих.\n\nТакође, ове вечери у храму светитеља Филипа, митрополита Московског, у Мещанској слободи у Москви, свеноћно бдење је предводио Патријаршијски Екзарх Африке митрополит Каирски и северноафрички Константин. Високопреосвећеном владику служио је ректор Томске духовне семинарије и свештенство храма. За службом су се молили и семинаристи Томске духовне семинарије из земаља Африке и Азије."},"tr":{"auto":"31 Ocak 2026'da Tomsk İlahiyat Semineri Rektörü Rahip Vitaly Kollantay, Afrika ülkelerinden ilahiyat okulu öğrencileriyle birlikte Afrika Ataerkil Eksarh Kahire Metropoliti ve Kuzey Afrika Konstantin ile bir araya geldi.\n\nToplantı sırasında Lord Konstantin, Rahip Vitali Kollantay'ı Tomsk İlahiyat Semineri'nin rektörlüğüne atandığı için tebrik etti ve ona bir hatıra hediyesi sundu – Rab İsa Mesih'in masaüstü görüntüsü. \n\nAyrıca Büyükşehir Konstantin, seminerlere hoş geldiniz sözleriyle hitap etti, akademik performanslarını ve kilise itaatlerine katılımlarını sordu. Ayrıca, Hıristiyan kültürünü ve Mirasını Destekleme Vakfı'nın yardımıyla düzenlenen çocukların Kutsal Varsayım Pskov-Pechersk Manastırı'na yaptığı hac gezisinin sonuçları da efendiye bildirildi. Yönetici piskoposla yaptığı toplantıda öğrenciler ilgilendikleri soruları sorabilirlerdi. Toplantının sonunda, lord öğrencilere özellikle saygıdeğer azizlerin simgelerini sundu.\n\nAyrıca bu akşam, Moskova Metropoliti St. Philip Kilisesi'nde, Moskova'nın Burjuva Yerleşkesinde, Kahire Metropoliti ve Kuzey Afrika Konstantin, Afrika Ataerkil Eksarhının tüm gece nöbetine başkanlık etti. Tomsk İlahiyat Seminerinin rektörü ve tapınağın din adamları, en muhterem efendiye hizmet etti. Afrika ve Asya ülkelerinden Tomsk İlahiyat Semineri'nin seminerleri de hizmet için dua etti."}}},"component":"content-flow"},{"images":[{"title":{},"width":1024,"chosen":false,"height":576,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_b5295c54-a65f-4683-bace-dceea637f2f4","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_45cc139c-6f68-4bd6-90d3-67c004ab4593"},{"title":{},"width":675,"chosen":false,"height":380,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_8eacf056-a94e-4d21-9229-e69deb3d0b69","thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_e80491c0-db16-4e7f-a84f-c0e6d6d3a22c"},{"title":{},"width":1024,"chosen":false,"height":576,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_1ef3e46a-0d27-4412-9503-93a55fe62e2e","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_54dd194d-c730-450e-883c-882adaf389af"},{"title":{},"width":631,"chosen":false,"height":355,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_954d3288-1819-4311-9435-529fba187d52","thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_71474594-7c04-4d53-855c-ff4397e0cd1f"},{"title":{},"width":1026,"chosen":false,"height":577,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_9520b6da-d350-4a36-8a1c-aa7b0fb7e2bc","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_9f45ea96-7a84-4153-9b4b-cfe39e0a63b9"},{"title":{},"width":900,"chosen":false,"height":506,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_d7c04732-ef3a-456c-810a-820836291590","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_27002c00-de18-4cc9-a30f-3bafdfd18354"},{"title":{},"width":675,"chosen":fal "},"tr":{"auto":"Hristiyan Kültürü ve Mirasını Destekleme Vakfı'nın icra direktörü Yegor Skopenko, Nasıra'daki Meryem Ana'nın Müjdesi Kilisesi'ndeki İlahi Ayinlere katıldı"}},"subtitle":{"ae":{"auto":"تم ترميم الكنيسة بدعم من المؤسسة منذ عام 2023."},"al":{"auto":"Restaurimi i kishës është kryer me mbështetjen e Fondacionit që nga viti 2023."},"cn":{"auto":"自2023年以来，教堂的修复工作一直在基金会的支持下进行。"},"el":{"auto":"Η αποκατάσταση της εκκλησίας πραγματοποιείται με την υποστήριξη του Ιδρύματος από το 2023."},"en":{"auto":"The restoration of the church has been carried out with the support of the Foundation since 2023."},"fr":{"auto":"Les travaux de restauration de l'église ont été menés avec le soutien de la Fondation depuis 2023."},"ge":{"auto":"ეკლესიის რესტავრაცია ფონდის მხარდაჭერით 2023 წლიდან ხორციელდება."},"he":{"auto":"עבודות שיקום הכנסייה נערכו בתמיכת הקרן מאז 2023."},"ja":{"auto":"教会の修復は、2023年から財団の支援を受けて行われています。"},"ru":{"auto":"Работы по реставрации церкви велись при поддержке Фонда с 2023 года.","manual":"Работы по реставрации церкви велись при поддержке Фонда с 2023 года."},"sr":{"auto":"Радови по реставрацији цркве су се водили уз подршку Фонда од 2023.године."},"tr":{"auto":"Kilisenin restorasyon çalışmaları 2023 yılından bu yana Vakfın desteğiyle yürütülmektedir."}}},"picture":[{"alt":{"ae":{"auto":"الخدمة في كنيسة البشارة للسيدة العذراء مريم"},"al":{"auto":"Shërbimi në Kishën e Shpalljes Së Virgjëreshës Së Bekuar Mari"},"cn":{"auto":"在圣母玛利亚报喜教堂服务"},"el":{"auto":"Λειτουργία στην εκκλησία του Ευαγγελισμού της Θεοτόκου"},"en":{"auto":"Service at the Church of the Annunciation of the Blessed Virgin Mary"},"fr":{"auto":"Service dans l'église de l'Annonciation de la bienheureuse vierge"},"ge":{"auto":"ღვთისმსახურება ყოვლადწმინდა ღვთისმშობლის ხარების ეკლესიაში"},"he":{"auto":"שירות במקדש הבשורה של הקדושה"},"ja":{"auto":"祝福された聖母マリアの受胎告知教会での奉仕"},"ru":{"auto":"Служба в храме Благовещения Пресвятой Богородицы","manual":"Служба в храме Благовещения Пресвятой Богородицы"},"sr":{"auto":"Служба у храму Благовести Пресвете Богородице"},"tr":{"auto":"Kutsal Bakire'nin Müjdesi Kilisesi'nde hizmet"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_6ea134ae-edf3-4a51-ad7c-88d9ca5215a4","title":{"ae":{"auto":"الخدمة في كنيسة البشارة للسيدة العذراء مريم"},"al":{"auto":"Shërbimi në Kishën e Shpalljes Së Virgjëreshës Së Bekuar Mari"},"cn":{"auto":"在圣母玛利亚报喜教堂服务"},"el":{"auto":"Λειτουργία στην εκκλησία του Ευαγγελισμού της Θεοτόκου"},"en":{"auto":"Service at the Church of the Annunciation of the Blessed Virgin Mary"},"fr":{"auto":"Service dans l'église de l'Annonciation de la bienheureuse vierge"},"ge":{"auto":"ღვთისმსახურება ყოვლადწმინდა ღვთისმშობლის ხარების ეკლესიაში"},"he":{"auto":"שירות במקדש הבשורה של הקדושה"},"ja":{"auto":"祝福された聖母マリアの受胎告知教会での奉仕"},"ru":{"auto":"Служба в храме Благовещения Пресвятой Богородицы","manual":"Служба в храме Благовещения Пресвятой Богородицы"},"sr":{"auto":"Служба у храму Благовести Пресвете Богородице"},"tr":{"auto":"Kutsal Bakire'nin Müjdesi Kilisesi'nde hizmet"}},"breakpoint":"main"}],"published_at":"2026-02-05T08:43:46+00:00","updated_at":"2026-02-05T08:53:38.166826+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 4 فبراير 2026 ، يوم عيد الرسول تيموثاوس (حوالي 96) ، أقيمت القداس الإلهي في كنيسة البشارة للسيدة العذراء مريم في مدينة الناصرة.  تم الاحتفال بالليتورجيا من قبل المطران سيرياك الناصري والمتروبوليت كيريل من قازان وتتارستان ، وشارك في خدمته الأرشمندريت فاسيان (زمييف) ، رئيس البعثة الكنسية الروسية ، ورجال دين آخرون.\n\nكما شارك إيجور سكوبينكو ، المدير التنفيذي لمؤسسة دعم الثقافة والتراث المسيحي ، في الخدمة.\n\nفي نهاية الليتورجيا ، كرس المطران كيرياك والمتروبوليت كيريل أيقونة والدة الإله \"الربيع الواهب للحياة\" ، الواقعة على أحد جدران كنيسة البشارة. تم صنع صورة الفسيفساء لملكة السماء بأموال من مؤسسة دعم الثقافة والتراث المسيحي.\n\n**مساعدة**\n\nترميم مجمع الدير وكنيسة البشارة على منبع والدة الإله الأقدس في الناصرة* (ملاحظة المحرر-المعروفة أيضا باسم الكنيسة الأرثوذكسية اليونانية لرئيس الملائكة جبرائيل على منبع والدة الإله الأقدس) * أجريت بمشاركة مؤسسة دعم الثقافة والتراث المسيحي منذ عام 2023 وتم الانتهاء منها في عام 2025."},"al":{"auto":"Më 4 shkurt 2026, ditën e festës së Apostullit Timothy (rreth 96), Liturgjia Hyjnore u mbajt në Kishën e Shpalljes së Virgjëreshës Së Bekuar Mari në qytetin E Nazaretit.  Liturgjia u festua nga Mitropolit Cyriak i Nazaretit dhe Mitropolit Kirill i Kazanit dhe Tatarstanit, i shërbyer nga Arkimandriti Vassian (Zmeev), kreu i Misionit Kishtar rus dhe klerikë të tjerë.\n\nEgor Skopenko, Drejtor Ekzekutiv i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, gjithashtu mori pjesë në shërbim.\n\nNë fund të Liturgjisë, Mitropoliti Kiriak dhe Mitropoliti Kirill shenjtëruan ikonën e Nënës së Zotit \"Pranvera Jetëdhënëse\", e vendosur në një nga muret e Kishës së Shpalljes. Imazhi mozaik i Mbretëreshës së Qiellit u bë me fonde nga Fondacioni për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë.\n\n**Ndihmë**\n\nRestaurimi i kompleksit të manastirit dhe Kishës së Shpalljes mbi burimin e Hyjlindëses më të Shenjtë në Nazaret* (shënim i redaktorit – i njohur gjithashtu si Kisha Ortodokse greke E Kryeengjëllit Gabriel mbi burimin e Hyjlindëses më të Shenjtë)* kryer me pjesëmarrjen e Fondacionit Për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë që nga viti 2023 dhe u përfunduan në vitin 2025."},"cn":{"auto":"2026年2月4日，使徒提摩太的节日（约96），神圣的礼拜仪式在拿撒勒市的圣母玛利亚报喜教堂举行。 礼拜仪式由拿撒勒的大都会Cyriak和喀山和鞑靼斯坦的大都会Kirill庆祝，由俄罗斯教会使命负责人Archimandrite Vassian（Zmeev）和其他牧师共同服务。\n\n支持基督教文化和遗产基金会执行主任Egor Skopenko也参加了这项服务。\n\n在礼拜仪式结束时，大都会基里亚克和大都会基里尔奉献了上帝之母的图标\"赋予生命的春天\"，位于天使报喜教堂的一堵墙上。 天堂女王的马赛克形象是由基金会的资金为基督教文化和遗产的支持。\n\n**帮助**\n\n修复位于拿撒勒最神圣的Theotokos源头的修道院建筑群和天使报喜教堂*（编者注–也称为天使长加布里埃尔的希腊东正教教堂，位于最神圣的Theotokos源头）*自2023年起在基督教文化和遗产支持基金会的参与下进行，并于2025年完成。"},"el":{"auto":"Στις 4 Φεβρουαρίου 2026, την ημέρα της γιορτής του Αποστόλου Τιμόθεου (περίπου 96), πραγματοποιήθηκε η Θεία Λειτουργία στην εκκλησία του Ευαγγελισμού της Παναγίας στην πόλη της Ναζαρέτ.  Η λειτουργία εορτάστηκε από τον Μητροπολίτη Κύριακ της Ναζαρέτ και τον Μητροπολίτη Κύριλλο του Καζάν και του Ταταρστάν, που εξυπηρετήθηκαν από τον Αρχιμανδρίτη Βασιανό (Ζμέεφ), επικεφαλής της ρωσική εκκλησιαστική αποστολή, και άλλους κληρικούς.\n\nΟ Egor Skopenko, Εκτελεστικός Διευθυντής του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, συμμετείχε επίσης στην υπηρεσία.\n\nΣτο τέλος της λειτουργίας, ο Μητροπολίτης Κύριακ και ο Μητροπολίτης Κύριλλος αφιέρωσαν την εικόνα της Μητέρας του Θεού \"Η Ζωοδόχος Πηγή\", που βρίσκεται σε έναν από τους τοίχους της Εκκλησίας του Ευαγγελισμού. Η ψηφιδωτή εικόνα της Βασίλισσας του ουρανού έγινε με κεφάλαια από το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς.\n\n**Βοήθεια**\n\nΑποκατάσταση του μοναστηριακού συγκροτήματος και της Εκκλησίας του Ευαγγελισμού της Θεοτόκου πάνω από την πηγή της Παναγίας στη Ναζαρέτ *(περ. εκδ. - επίσης γνωστή ως Ελληνική Ορθόδοξη Εκκλησία του Αρχαγγέλου Γαβριήλ πάνω από την πηγή της Υπεραγίας Θεοτόκου)* διεξήχθησαν με τη συμμετοχή του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς από το 2023 και ολοκληρώθηκαν το 2025."},"en":{"auto":"On February 4, 2026, the feast day of the Apostle Timothy (c. 96), the Divine Liturgy was held at the Church of the Annunciation of the Blessed Virgin Mary in the city of Nazareth. The Liturgy was celebrated by Metropolitan Cyriak of Nazareth and Metropolitan Kirill of Kazan and Tatarstan, co-served by Archimandrite Vassian (Zmeev), head of the Russian Ecclesiastical Mission, and other clergymen.\n\nEgor Skopenko, Executive Director of the Foundation for the Support of Christian Culture and Heritage, also took part in the service.\n\nAt the end of the Liturgy, Metropolitan Kiriak and Metropolitan Kirill consecrated the icon of the Mother of God \"Life-giving Spring\", located on one of the walls of the Church of the Annunciation. The mosaic image of the Queen of Heaven was made with funds from the Foundation for the Support of Christian Culture and Heritage.\n\n**Help**\n\nRestoration of the monastery complex and the Church of the Annunciation over the source of the Most Holy Theotokos in Nazareth* (editor's note – also known as the Greek Orthodox Church of Archangel Gabriel over the source of the Most Holy Theotokos)* conducted with the participation of the Foundation for the Support of Christian Culture and Heritage since 2023 and were completed in 2025."},"fr":{"auto":"Le 4 février 2026, le jour de la mémoire de l'apôtre Timothée (env. 96), a eu lieu la divine liturgie dans l'église de l'Annonciation de la Sainte vierge dans la ville de Nazareth. La liturgie a été accomplie par le métropolite Cyrille de Nazareth et le métropolite Cyrille de Kazan et du Tatarstan, en collaboration avec le chef de la mission spirituelle russe, l'archimandrite vassian (Zmeev) et d'autres membres du clergé.\n\nEgor skopenko, directeur exécutif du Fonds de soutien à la culture chrétienne et au patrimoine, a également participé au culte.\n\nÀ la fin de la Liturgie, le métropolite Cyriaque et le métropolite Cyril ont consacré l'icône de la mère de Dieu «source vivante», située sur l'un des murs de l'église de l'Annonciation. L'image en mosaïque de la Reine du Ciel a été réalisée avec les fonds du Fonds de soutien à la culture et au patrimoine chrétiens.\n\n**Attestation**\n\nTravaux de restauration du complexe monastique et de l'église de l'Annonciation sur la source de la Sainte vierge à Nazareth *(env. - également connu sous le nom de l'église orthodoxe Grecque de l'Archange Gabriel sur la source de la Sainte vierge) * ont été menées avec la participation du Fonds de soutien à la culture et au patrimoine chrétiens depuis 2023 et ont été achevées en 2025."},"ge":{"auto":"2026 წლის 4 თებერვალს, მოციქულ ტიმოთეს დღესასწაულზე (გ. 96), საღმრთო ლიტურგია გაიმართა ქალაქ ნაზარეთის ყოვლადწმინდა ღვთისმშობლის ხარების ეკლესიაში. ღვთისმსახურება აღავლინეს ნაზარეთის მიტროპოლიტმა კირიაკმა და ყაზანისა და თათრეთის მიტროპოლიტმა კირილმა, რომელსაც თანადგომა გაუწია რუსეთის საეკლესიო მისიის ხელმძღვანელმა არქიმანდრიტმა ვასიანმა (ზმეევი) და სხვა სასულიერო პირებმა.\n\nმსახურებაში მონაწილეობა მიიღო ასევე ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის აღმასრულებელმა დირექტორმა ეგორ სკოპენკომ.\n\nლიტურგიის დასასრულს მიტროპოლიტმა კირიაკმა და მიტროპოლიტმა კირილმა ღვთისმშობლის ხატი \"მაცოცხლებელი გაზაფხული\" აკურთხეს, რომელიც ხარების ეკლესიის ერთ-ერთ კედელზე მდებარეობს. ზეცის დედოფლის მოზაიკური გამოსახულება გაკეთდა ფონდიდან ქრისტიანული კულტურისა და მემკვიდრეობის მხარდასაჭერად.\n\n**დახმარება**\n\nსამონასტრო კომპლექსისა და ხარების ეკლესიის აღდგენა ნაზარეთში ყველაზე წმინდა თეოტოკოსის წყაროზე* (რედაქტორის შენიშვნა – ასევე ცნობილია როგორც მთავარანგელოზ გაბრიელის ბერძნული მართლმადიდებლური ეკლესია ყოვლადწმინდა ღვთისმშობლის წყაროზე)* ჩატარდა ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის მონაწილეობით 2023 წლიდან და დასრულდა 2025 წელს."},"he":{"auto":"ב-4 בפברואר 2026, ביום הזיכרון של השליח טימותי (כ-96), נערכה הליטורגיה האלוהית במקדש הבשורה של הקדושה בעיר נצרת. הליטורגיה בוצעה על ידי מיטרופוליט נצרת קיריאק ומיטרופוליט קזאן וטטארסטן קיריל, בתמיכת ראש המשימה הרוחנית הרוסית, הארכימנדריט ואסיאן (זמייב) ואנשי דת אחרים.\n\nגם המנהל המבצעי של קרן התמיכה בתרבות הנוצרית ובמורשת, יגור סקופנקו, השתתף בשירות.\n\nלאחר סיום הליטורגיה, מיטרופוליט קיריאק ומיטרופוליט קיריל הקדשו את האייקון של האם של אלוהים \"מקור החיים\", הממוקם על אחד הקירות של מקדש הבשורה. דמותה המוזיאקית של מלכת השמים נעשתה על ידי קרן תמיכה בתרבות הנוצרית ובמורשת.\n\n**עזרה**\n\nעבודות שיקום של מתחם המנזר וכנסיית הבשורה על מקור הקדושה בנצרת *(פרימ. עורך-הידוע גם בשם הכנסייה היוונית האורתודוכסית של המלאך גבריאל מעל מקור הבתולה הקדושה) * נערכו בהשתתפות הקרן לתמיכה בתרבות ומורשת נוצרית מאז 2023 והושלמו בשנת 2025."},"ja":{"auto":"使徒テモテの饗宴の日である2026年2月4日（c.96）、ナザレ市の聖母マリアの受胎告知教会で神の典礼が開催されました。 典礼は、ナザレのメトロポリタン・キリアクとカザンとタタールスタンのメトロポリタン・キリルによって祝われ、ロシアの教会の使命の長であるArchimandrite Vassian（Zmeev）、およ\n\nキリスト教文化と遺産の支援のための財団のエグゼクティブディレクターであるEgor Skopenkoもこのサービスに参加しました。\n\n典礼の終わりに、メトロポリタンキリアックとメトロポリタンキリルは、受胎告知教会の壁の1つにある神の母「命を与える春」のアイコンを奉献しま 天の女王のモザイク画像は、キリスト教の文化と遺産の支援のための財団からの資金で作られました。\n\n*•ヘルプ**\n\nナザレの最も聖なるテオトコスの源をめぐる修道院の複合体と受胎告知教会の修復*（編集者注–最も聖なるテオトコスの源をめぐる大天使ガブリエルのギリシャ正教教会としても知られています）*2023年以来、キリスト教文化と遺産の支援のための財団の参加を得て行われ、2025年に完成しました。"},"ru":{"auto":"4 февраля 2026 года, в день памяти апостола Тимофея (ок. 96), состоялась Божественная литургия в храме Благовещения Пресвятой Богородицы в городе Назарет. Литургию совершили митрополит Назаретский Кириак и митрополит Казанский и Татарстанский Кирилл в сослужении начальника Русской духовной миссии архимандрита Вассиана (Змеева) и других священнослужителей.\n\nВ богослужении также принял участие исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко.\n\nПо окончании Литургии митрополит Кириак и митрополит Кирилл совершили освящение иконы Божией Матери «Живоносный Источник», расположенной на одной из стен храма Благовещения. Мозаичный образ Царицы Небесной был изготовлен на средства Фонда поддержки христианской культуры и наследия.\n\n**Справка**\n\nРаботы по реставрации монастырского комплекса и церкви Благовещения над источником Пресвятой Богородицы в Назарете *(прим. ред. – известная также как греческая православная церковь Архангела Гавриила над источником Пресвятой Богородицы)* велись при участии Фонда поддержки христианской культуры и наследия с 2023 года и были завершены в 2025 году.","manual":"4 февраля 2026 года, в день памяти апостола Тимофея (ок. 96), состоялась Божественная литургия в храме Благовещения Пресвятой Богородицы в городе Назарет. Литургию совершили митрополит Назаретский Кириак и митрополит Казанский и Татарстанский Кирилл в сослужении начальника Русской духовной миссии архимандрита Вассиана (Змеева) и других священнослужителей.\n\nВ богослужении также принял участие исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко.\n\nПо окончании Литургии митрополит Кириак и митрополит Кирилл совершили освящение иконы Божией Матери «Живоносный Источник», расположенной на одной из стен храма Благовещения. Мозаичный образ Царицы Небесной был изготовлен на средства Фонда поддержки христианской культуры и наследия.\n\n**Справка**\n\nРаботы по реставрации монастырского комплекса и церкви Благовещения над источником Пресвятой Богородицы в Назарете *(прим. ред. – известная также как греческая православная церковь Архангела Гавриила над источником Пресвятой Богородицы)* велись при участии Фонда поддержки христианской культуры и наследия с 2023 года и были завершены в 2025 году."},"sr":{"auto":"4.фебруара 2026. године, на Дан сећања на апостола Тимофеја (око 96), одржана је Божанска Литургија у храму Благовести Пресвете Богородице у граду Назарет. Литургију су извршили Митрополит Назаретски Кириак и митрополит Казански и Татарстански Кирил у заједничкој служби начелника руске духовне мисије архимандрита Васиана (Змејева) и других свештеника.\n\nУ богослужењу је учествовао и извршни директор Фонда за подршку хришћанске културе и наслеђа Егор Скопенко.\n\nНакон Литургије, митрополит Кириак и митрополит Кирил осветили су икону Божије мајке Живоносни извор, која се налази на једном од зидова храма Благовести. Мозаична слика царице небеске је израђена на средства Фонда за подршку хришћанској култури и наслеђу.\n\n**Помоћ**\n\nРадови по реставрацији манастирског комплекса и цркве Благовести над извором Пресвете Богородице у Назарету *(прим. позната и као грчка православна црква Архангела Гаврила над извором Пресвете Богородице) * водила се уз учешће Фонда за подршку хришћанске културе и наслеђа од 2023.године и завршена је 2025. године."},"tr":{"auto":"4 Şubat 2026'da, Havari Timoteos'un anıldığı gün (yaklaşık 96), Nasıra kentindeki Kutsal Bakire'nin Müjde Kilisesi'nde İlahi Ayin düzenlendi. Ayin, Nasıralı Kiriak Metropoliti ve Kazan Metropoliti ve Tataristan Kirill tarafından Rus ruhani misyonunun başı Archimandrite Vassian (Serpantin) ve diğer din adamlarının hizmetlerinde kutlandı.\n\nHristiyan Kültürü ve Mirasını Destekleme Vakfı'nın icra direktörü Yegor Skopenko da hizmete katıldı.\n\nAyinin sonunda, Büyükşehir Kiriakos ve Büyükşehir Kiril, Müjde Tapınağı'nın duvarlarından birinde bulunan Tanrı'nın Annesi «Canlı Kaynak\" simgesinin kutsamasını yaptılar. Cennetin Kraliçesi'nin mozaik görüntüsü, Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı'nın fonlarıyla yapıldı.\n\n**Bilgi**\n\nNasıra'daki Kutsal Bakire'nin kaynağı üzerindeki manastır kompleksinin ve Müjde Kilisesi'nin restorasyonu üzerine çalışmalar * (yakl. - Başmelek Cebrail'in Kutsal Bakire'nin kaynağı üzerindeki Rum Ortodoks Kilisesi olarak da bilinir) * 2023'ten beri Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'nın katılımıyla gerçekleştirildi ve 2025'te tamamlandı."}}},"component":"content-flow"},{"images":[{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_3aa15ca2-0a33-4ffa-ae00-dd74ccb201cf","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_3de3eff8-c457-4ff9-bd8b-f466429fb6ce"},{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_383afb12-3f47-459d-8537-211f2db353d2","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_42f430fc-b9fc-43b9-b3a3-4bfdf29d6ebd"},{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_09776ca6-4226-4d12-9733-80ed4d19274a","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_fc268f33-00ba-4187-83aa-46cb166fa97b"},{"t λησίας του Ευαγγελισμού της Θεοτόκου στην πηγή της Παναγίας στη Ναζαρέτ."},"en":{"auto":"The meeting discussed the results of the Foundation's activities over the past year, current projects of the Foundation, as well as the completion of the restoration of the monastery complex and the Church of the Annunciation over the source of the Blessed Virgin Mary in Nazareth."},"fr":{"auto":"La réunion a discuté des résultats de l'activité de la Fondation au cours de l'année écoulée, des projets en cours de la Fondation, ainsi que de l'achèvement des travaux de restauration du complexe monastique et de l'église de l'Annonciation sur la source de la Sainte vierge à Nazareth."},"ge":{"auto":"შეხვედრაზე განიხილეს ფონდის საქმიანობის შედეგები გასული წლის განმავლობაში, ფონდის მიმდინარე პროექტები, ასევე სამონასტრო კომპლექსისა და ხარების ეკლესიის აღდგენის დასრულება ნაზარეთში ყოვლადწმინდა ღვთისმშობლის წყაროზე."},"he":{"auto":"בפגישה דנו בתוצאות פעילות הקרן בשנה שעברה, בפרויקטים הנוכחיים של הקרן, כמו גם בהשלמת עבודות שיקום של מתחם המנזר וכנסיית הבשורה על מקור הקדושה בנצרת."},"ja":{"auto":"この会議では、過去1年間の財団の活動の結果、財団の現在のプロジェクト、修道院複合施設の修復の完了、ナザレの聖母マリアの源泉に関する受胎告知教会について議論しました。"},"ru":{"auto":"На встрече обсуждались итоги деятельности Фонда за прошлый год, текущие проекты Фонда, а также завершение работ по реставрации монастырского комплекса и церкви Благовещения над источником Пресвятой Богородицы в Назарете.","manual":"На встрече обсуждались итоги деятельности Фонда за прошлый год, текущие проекты Фонда, а также завершение работ по реставрации монастырского комплекса и церкви Благовещения над источником Пресвятой Богородицы в Назарете."},"sr":{"auto":"На састанку су разматрани резултати активности Фонда за прошлу годину, текући пројекти Фонда, као и завршетак радова по реставрацији манастирског комплекса и цркве Благовести над извором Пресвете Богородице у Назарету."},"tr":{"auto":"Toplantıda, Vakfın geçen yılki faaliyetlerinin sonuçları, Vakfın devam eden projeleri ve Nasıra'daki Kutsal Bakire'nin kaynağı üzerindeki manastır kompleksinin ve Müjde Kilisesi'nin restorasyon çalışmalarının tamamlanması tartışıldı."}}},"picture":[{"alt":{"ae":{"auto":"لقاء إيجور سكوبينكو مع البطريرك ثيوفيلوس الثالث من القدس"},"al":{"auto":"Takimi i egor Skopenkos ME Patriarkun Teofil III TË Jeruzalemit"},"cn":{"auto":"Yegor Skopenko与耶路撒冷主教Theophilos III的会面"},"el":{"auto":"Συνάντηση του Γέγκορ Σκόπενκο με τον Πατριάρχη Ιεροσολύμων Θεόφιλο Γ"},"en":{"auto":"Yegor Skopenko's meeting with Patriarch Theophilos III of Jerusalem"},"fr":{"auto":"Rencontre Egor skopenko avec le Patriarche Théophile III de Jérusalem"},"ge":{"auto":"ეგორ სკოპენკოს შეხვედრა იერუსალიმის პატრიარქ თეოფილოს III-თან"},"he":{"auto":"פגישתו של יגור סקופנקו עם הפטריארך הירושלמי תיאופיל השלישי"},"ja":{"auto":"イェゴール・スコペンコとエルサレム総主教テオフィロス3世との会談"},"ru":{"auto":"Встреча Егора Скопенко с Патриархом Иерусалимским Феофилом III","manual":"Встреча Егора Скопенко с Патриархом Иерусалимским Феофилом III"},"sr":{"auto":"Састанак Егора Скопенко Патријарха у Јерусалиму Теофил III"},"tr":{"auto":"Yegor Skopenko'nun Kudüs Patriği Theophilus III ile görüşmesi"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2026/02/05/image-name_e59f7063-cee3-469c-a6b0-26990c10b636","title":{"ae":{"auto":"لقاء إيجور سكوبينكو مع البطريرك ثيوفيلوس الثالث من القدس"},"al":{"auto":"Takimi i egor Skopenkos ME Patriarkun Teofil III TË Jeruzalemit"},"cn":{"auto":"Yegor Skopenko与耶路撒冷主教Theophilos III的会面"},"el":{"auto":"Συνάντηση του Γέγκορ Σκόπενκο με τον Πατριάρχη Ιεροσολύμων Θεόφιλο Γ"},"en":{"auto":"Yegor Skopenko's meeting with Patriarch Theophilos III of Jerusalem"},"fr":{"auto":"Rencontre Egor skopenko avec le Patriarche Théophile III de Jérusalem"},"ge":{"auto":"ეგორ სკოპენკოს შეხვედრა იერუსალიმის პატრიარქ თეოფილოს III-თან"},"he":{"auto":"פגישתו של יגור סקופנקו עם הפטריארך הירושלמי תיאופיל השלישי"},"ja":{"auto":"イェゴール・スコペンコとエルサレム総主教テオフィロス3世との会談"},"ru":{"auto":"Встреча Егора Скопенко с Патриархом Иерусалимским Феофилом III","manual":"Встреча Егора Скопенко с Патриархом Иерусалимским Феофилом III"},"sr":{"auto":"Састанак Егора Скопенка са Јерусалимским патријархом Теофилом ИИИ"},"tr":{"auto":"Yegor Skopenko'nun Kudüs Patriği Theophilus III ile görüşmesi"}},"breakpoint":"main"}],"published_at":"2026-02-05T08:03:31+00:00","updated_at":"2026-02-05T08:54:15.656565+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"قام إيجور سكوبينكو ، المدير التنفيذي لمؤسسة دعم الثقافة والتراث المسيحي ، بزيارة عمل إلى بطريركية القدس في 3 فبراير 2026. كجزء من رحلة عمله ، استقبل إيجور سكوبينكو غبطة البطريرك ثيوفيلوس الثالث ملك القدس. \n\nناقش الاجتماع ، الذي عقد في جو دافئ ، نتائج أنشطة المؤسسة خلال العام الماضي ، والمشاريع الحالية للمؤسسة ، وهي الانتهاء من ترميم مجمع الدير وكنيسة البشارة على منبع السيدة العذراء مريم في الناصرة* (ملاحظة المحرر – المعروفة أيضا باسم الكنيسة الأرثوذكسية اليونانية لرئيس الملائكة جبرائيل على منبع السيدة العذراء مريم)* ، العمل الذي تم تنفيذه بدعم من المؤسسة منذ عام 2023.\n\nوفي ختام اللقاء أعرب غبطة البطريرك عن امتنانه للمدير التنفيذي للمؤسسة على زيارته. بدوره ، قدم إيجور سكوبينكو للبطريرك ثيوفيلوس نسخة هدية من \" لوحة الأيقونات الروسية. مجموعة كبيرة \" ، والتي تحتوي على المجموعة الأكثر اكتمالا من الرموز الأرثوذكسية. "},"al":{"auto":"Egor Skopenko, Drejtor Ekzekutiv i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, bëri një vizitë pune në Patriarkanën e Jeruzalemit më 3 shkurt 2026. Si pjesë e udhëtimit të tij të biznesit, Yegor Skopenko u prit nga Patriarku i Tij I Lumturisë Theophilos III i Jeruzalemit. \n\nTakimi, i mbajtur në një atmosferë të ngrohtë, diskutoi rezultatet e aktiviteteve të Fondacionit gjatë vitit të kaluar, projektet aktuale të Fondacionit, përkatësisht përfundimin e restaurimit të kompleksit të manastirit dhe Kishës së Shpalljes mbi burimin e Virgjëreshës Së Bekuar Mari Në Nazaret* (shënim i redaktorit – i njohur gjithashtu si Kisha Ortodokse greke e Kryeengjëllit Gabriel mbi burimin e Virgjëreshës Së Bekuar Mari)*, puna në të cilën është kryer me mbështetjen e Fondacionit që nga viti 2023.\n\nNë fund të takimit, Patriarku I Tij I Lumtur shprehu mirënjohje Për Drejtorin Ekzekutiv të Fondacionit për vizitën e tij. Egor Skopenko, nga ana tjetër, i dhuroi Patriarkut Theophilus një botim dhuratë të \"pikturës Së Ikonave ruse. Koleksioni i madh\", i cili përmban koleksionin më të plotë të ikonave Ortodokse. "},"cn":{"auto":"支持基督教文化和遗产基金会执行主任Egor Skopenko于2026年2月3日对耶路撒冷宗主教进行了工作访问。 作为他出差的一部分，Yegor Skopenko受到了他的Beatitude族长耶路撒冷的Theophilos III的接待。 \n\n该次会议上，举行了在一个温暖的气氛中，讨论结果的基金会的活动在过去一年里，目前的项目的基础，即完成恢复的修道院和教堂的天使报喜源的圣母玛利亚在拿撒勒*(编者注意--也被称为希腊东正教教堂的天使加布里埃尔源的圣母玛利亚)*、工作上已经进行的支持的基础，因为2023年。\n\n在会议结束时，他的Beatitude族长对基金会执行董事的访问表示感谢。 反过来，Egor Skopenko向族长Theophilus赠送了\"俄罗斯图标绘画\"的礼品版。 大集合\"，其中包含最完整的东正教图标集合。 "},"el":{"auto":"Ο Egor Skopenko, Εκτελεστικός Διευθυντής του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, πραγματοποίησε επίσκεψη εργασίας στο Πατριαρχείο Ιεροσολύμων στις 3 Φεβρουαρίου 2026. Στο πλαίσιο του επαγγελματικού του ταξιδιού, ο Γέγκορ Σκόπενκο έγινε δεκτός από τον Μακαριώτατο Πατριάρχη Ιεροσολύμων Θεόφιλο Γ. \n\nΣτη συνάντηση, η οποία πραγματοποιήθηκε σε ζεστή ατμόσφαιρα, συζητήθηκαν τα αποτελέσματα των δραστηριοτήτων του Ιδρύματος κατά το παρελθόν έτος και τα τρέχοντα έργα του ιδρύματος, δηλαδή η ολοκλήρωση της αποκατάστασης του μοναστηριακού συγκροτήματος και του ναού του Ευαγγελισμού της Θεοτόκου στην πηγή της Παναγίας στη Ναζαρέτ* (περ. εκδ. - επίσης γνωστή ως Ελληνική Ορθόδοξη Εκκλησία του Αρχαγγέλου Γαβριήλ πάνω από την πηγή της Υπεραγίας Θεοτόκου)*, οι εργασίες της οποίας πραγματοποιούνται με την υποστήριξη του Ιδρύματος από το 2023.\n\nΣτο τέλος της συνάντησης, ο Μακαριώτατος Πατριάρχης εξέφρασε την ευγνωμοσύνη του στον Εκτελεστικό Διευθυντή του Ιδρύματος για την επίσκεψή του. Ο Έγκορ Σκόπενκο, με τη σειρά του, παρουσίασε στον Πατριάρχη Θεόφιλο μια έκδοση δώρου της \"ρωσική εικονογραφία. Μεγάλη συλλογή\", η οποία περιέχει την πληρέστερη συλλογή ορθόδοξων εικόνων. "},"en":{"auto":"Egor Skopenko, Executive Director of the Foundation for the Support of Christian Culture and Heritage, paid a working visit to the Jerusalem Patriarchate on February 3, 2026. As part of his business trip, Yegor Skopenko was received by His Beatitude Patriarch Theophilos III of Jerusalem. \n\nThe meeting, held in a warm atmosphere, discussed the results of the Foundation's activities over the past year, current projects of the Foundation, namely the completion of the restoration of the monastery complex and the Church of the Annunciation over the source of the Blessed Virgin Mary in Nazareth* (editor's note – also known as the Greek Orthodox Church of Archangel Gabriel over the source of the Blessed Virgin Mary)*, work on which has been conducted with the support of the Foundation since 2023.\n\nAt the end of the meeting, His Beatitude the Patriarch expressed gratitude to the Executive Director of the Foundation for his visit. Egor Skopenko, in turn, presented Patriarch Theophilus with a gift edition of \"Russian Icon Painting. Big Collection\", which contains the most complete collection of Orthodox icons. "},"fr":{"auto":"Le 3 février 2026, Egor skopenko, directeur exécutif du fonds de soutien à la culture chrétienne et au patrimoine, a visité le Patriarcat de Jérusalem en visite de travail. Dans le cadre d'un voyage d'affaires, Egor skopenko a été reçu par le Patriarche Théophile III de Jérusalem. \n\nLa réunion, qui s'est tenue dans une atmosphère chaleureuse, a discuté des résultats de l'activité de la Fondation au cours de l'année écoulée, des projets en cours de la Fondation, à savoir l'achèvement des travaux de restauration du complexe monastique et de l'église de l'Annonciation sur la source de la Sainte vierge à Nazareth *(env. - également connu sous le nom de l'église orthodoxe Grecque de l'Archange Gabriel sur la source de la Sainte vierge)*, dont les travaux ont été menés avec le soutien de la Fondation depuis 2023.\n\nÀ la fin de la réunion, le bienheureux Patriarche a exprimé sa gratitude au directeur exécutif de la Fondation pour son arrivée. Egor skopenko, à son tour, a présenté au Patriarche Théophile une édition cadeau de l'iconographie russe. Grande collection», qui contient la collection la plus complète d'icônes orthodoxes. "},"ge":{"auto":"ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის აღმასრულებელი დირექტორი ეგორ სკოპენკო 2026 წლის 3 თებერვალს სამუშაო ვიზიტით ეწვია იერუსალიმის საპატრიარქოს. საქმიანი მოგზაურობის ფარგლებში, ეგორ სკოპენკო მიიღო იერუსალიმის უნეტარესმა პატრიარქმა თეოფილოს III-მ. \n\nშეხვედრაზე, რომელიც თბილ ატმოსფეროში გაიმართა, განიხილეს ფონდის საქმიანობის შედეგები გასული წლის განმავლობაში, ფონდის მიმდინარე პროექტები, კერძოდ, სამონასტრო კომპლექსისა და ხარების ეკლესიის აღდგენის დასრულება ყოვლადწმიდა ღვთისმშობლის წყაროზე ნაზარეთში* (რედაქტორის შენიშვნა – ასევე ცნობილი როგორც მთავარანგელოზ გაბრიელის ბერძნული მართლმადიდებლური ეკლესია ყოვლადწმინდა ღვთისმშობლის წყაროზე)*, რომელზეც მუშაობა ჩატარდა ფონდის მხარდაჭერით 2023 წლიდან.\n\nშეხვედრის დასასრულს, მისმა უნეტარესმა პატრიარქმა ფონდის აღმასრულებელ დირექტორს ვიზიტისთვის მადლობა გადაუხადა. ეგორ სკოპენკომ, თავის მხრივ, პატრიარქ თეოფილეს საჩუქრად გადასცა \"რუსული ხატწერის\" გამოცემა. დიდი კოლექცია\", რომელიც შეიცავს მართლმადიდებლური ხატების ყველაზე სრულ კოლექციას. "},"he":{"auto":"המנהל המבצעי של קרן התמיכה בתרבות הנוצרית והמורשת, יגור סקופנקו, ביקר ב-3 בפברואר 2026 בפטריארכיית ירושלים. במסגרת מסע עסקים, יגור סקופנקו התקבל על ידי הפטריארך המבורך ביותר של ירושלים, תיאופיל השלישי. \n\nבפגישה, שהתקיימה באווירה חמה, נדונו תוצאות פעילות הקרן בשנה שעברה, הפרויקטים הנוכחיים של הקרן, כלומר השלמת עבודות שיקום מתחם המנזר וכנסיית הבשורה על מקור הקדושה בנצרת. עורך ידוע גם בשם הכנסייה האורתודוקסית היוונית של המלאך גבריאל על מקור הקדושה)*, עבודות על אשר נערכו בתמיכת הקרן מאז 2023.\n\nלסיום הפגישה, הפטריארך המבורך הביע את תודתו למנכ \" ל הקרן על הגעתו. יגור סקופנקו, בתורו, הציג לפטריארך פיאופיל את המהדורה המתנה של \"האיקונוגרפיה הרוסית\". אוסף גדול, המכיל את האוסף המלא ביותר של אייקונים אורתודוקסיים. "},"ja":{"auto":"キリスト教文化遺産支援財団のエゴール・スコペンコ事務局長は、2026年2月3日にエルサレム総主教庁を実際に訪問しました。 彼の出張の一環として、イェゴール・スコペンコはエルサレムの彼の至福の総主教テオフィロス3世によって受け取られました。 \n\n温かい雰囲気の中で開催された会議では、過去1年間の財団の活動の結果、現在の財団のプロジェクト、すなわち修道院複合体の修復の完了と、ナザレの聖母マリアの源泉をめぐる受胎告知教会*(編集者注–聖母マリアの源泉をめぐる大天使ガブリエルのギリシャ正教会としても知られています)*、2023年から財団の支援を受けて行われている作業について議論しました。\n\n会議の終わりに、彼の至福総主教は彼の訪問のための財団の事務局長に感謝の意を表明しました。 Egor Skopenkoは、順番に、家長Theophilusに「ロシアのアイコン絵画」のギフト版を提示しました。 正統派のアイコンの最も完全なコレクションが含まれている「ビッグコレクション」。 "},"ru":{"auto":"Исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко 3 февраля 2026 года посетил с рабочим визитом Иерусалимский Патриархат. В рамках деловой поездки Егора Скопенко принял Блаженнейший Патриарх Иерусалимский Феофил III. \n\nНа встрече, прошедшей в теплой атмосфере, обсуждались итоги деятельности Фонда за прошлый год, текущие проекты Фонда, а именно завершение работ по реставрации монастырского комплекса и церкви Благовещения над источником Пресвятой Богородицы в Назарете *(прим. ред. – известная также как греческая православная церковь Архангела Гавриила над источником Пресвятой Богородицы)*, работы по которой велись при поддержке Фонда с 2023 года.\n\nВ завершение встречи Блаженнейший Патриарх выразил благодарность исполнительному директору Фонда за приезд. Егор Скопенко в свою очередь преподнес Патриарху Феофилу подарочное издание «Русская иконопись. Большая коллекция», которое содержит в себе самое полное собрание православных икон. ","manual":"Исполнительный директор Фонда поддержки христианской культуры и наследия Егор Скопенко 3 февраля 2026 года посетил с рабочим визитом Иерусалимский Патриархат. В рамках деловой поездки Егора Скопенко принял Блаженнейший Патриарх Иерусалимский Феофил III. \n\nНа встрече, прошедшей в теплой атмосфере, обсуждались итоги деятельности Фонд
