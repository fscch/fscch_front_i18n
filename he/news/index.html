приняли участие в международном форуме в Иркутске"},"sr":{"auto":"Студенти ТДС учествовао на међународном форуму у Иркутску"},"tr":{"auto":"TDS öğrencileri Irkutsk'taki uluslararası Forum'a katıldı"}},"breakpoint":"main"}],"published_at":"2025-11-05T12:57:52+00:00","updated_at":"2025-11-05T14:07:34.534389+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"بمباركة المطران روستيسلاف من تومسك وأسينوفو ، من 30 أكتوبر إلى 4 نوفمبر 2025 ، شاركت مجموعة من الطلاب الدوليين من مدرسة تومسك اللاهوتية ، بقيادة نائب رئيس الجامعة للشؤون الأكاديمية ، القس فيتالي كولانتاي ، في المنتدى الدولي الثاني للشباب الأرثوذكسي \"بروسفيت\". تمت المشاركة في المنتدى بمساعدة مؤسسة دعم الثقافة والتراث المسيحي.\n\nزار الإكليريكيون من تومسك عددا من الأماكن مع شخصيات كنسية وعلمانية معروفة ، بما في ذلك فلاديمير ليغويدا ، رئيس قسم السينودس للعلاقات بين الكنيسة والمجتمع ووسائل الإعلام ، ومرشح العلوم السياسية ، وأستاذ مشارك. خلال الاجتماع ، شارك سنوات خبرته العديدة في المجال الإعلامي وأجاب على العديد من الأسئلة من المشاركين وضيوف المنتدى.\n\nبالإضافة إلى ذلك ، قدم طلاب مدرسة تومسك عروضا حول الإيمان الأرثوذكسي في بلدانهم في المنتدى. تم تقديم المعلومات حول البعثة الأرثوذكسية في باكستان من قبل طالب السنة 2 شهباز زيغام. طلاب السنة 3 تشينياما شيمويموي وسوسبيتر سايسي, وكذلك طلاب السنة 2 زوي جان ماري وديموني تشينكيم بنديكت, تسليم تقارير عن الأرثوذكسية في أفريقيا.\n\nفي المنتدى أيضا ، قام طلاب من فرق مختلفة بعمل العديد من مقاطع الفيديو حول القيم ، وقاموا بجولة في مدينة إيركوتسك وبحيرة بايكال ، وتمكنوا من الصلاة في أضرحة منطقة إيركوتسك الحضرية.\n\nقدم الكاهن فيتالي كولانتاي مدرسة تومسك اللاهوتية في المنتدى. وتحدث عن القبول والإقامة في المدرسة ، وتقاليدها وآفاق التنمية ، والبرامج الجارية وتكييفها للطلاب الدوليين.\n\nيود وفد مدرسة تومسك اللاهوتية أن يشكر منظمي منتدى بروسفيت في شخص الأسقف الحاكم ماكسيميليان ، متروبوليت إيركوتسك وأنجارا ، والملهم والمؤلف الأيديولوجي إيفجينيا كيم ، وكذلك قيادة مؤسسة دعم الثقافة والتراث المسيحي في شخص المدير التنفيذي إيجور سكوبينكو لدعمهم المالي."},"al":{"auto":"Me bekimin e Mitropolitit Rostislav Të Tomsk dhe Asinovo, Nga 30 tetori deri më 4 nëntor 2025, një grup studentësh ndërkombëtarë nga Seminari Teologjik Tomsk, i udhëhequr nga Prorektori për Çështje Akademike, Prifti Vitaly Kollantai, morën pjesë NË Forumin Ii Ndërkombëtar Të Rinisë Ortodokse \"Prosvet\". Pjesëmarrja në forum u zhvillua me ndihmën e Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë.\n\nSeminaristët nga Tomsk vizituan një numër vendesh me figura të njohura kishtare dhe laike, përfshirë Vladimir Legoyda, Kryetar i Departamentit Sinodal për Marrëdhëniet Kishë-Shoqëri dhe Media, Kandidat i Shkencave Politike, Profesor I Asociuar. Gjatë takimit, ai ndau përvojën e tij shumëvjeçare në sferën e medias dhe iu përgjigj pyetjeve të shumta nga pjesëmarrësit dhe mysafirët e forumit.\n\nPërveç kësaj, studentët e Seminarit Tomsk bënë prezantime në forumin mbi besimin Ortodoks në vendet e tyre. Informacioni për misionin Ortodoks në Pakistan u prezantua nga studenti I vitit Të dytë Shahbaz Zaigham. Studentët e vitit të tretë Chinyama Chimwemwe dhe sospeter saisi, si dhe studentët e vitit të dytë Zoe Jean Marie dhe Dimonye Chinechem Benedict, dhanë raporte për Ortodoksinë në Afrikë.\n\nGjithashtu në forum, studentë nga ekipe të ndryshme bënë disa video në lidhje me vlerat, vizituan qytetin E Irkutsk dhe Liqenin Baikal dhe ishin në gjendje të luteshin në faltoret e Zonës Metropolitane Të Irkutsk.\n\nPrifti Vitaly Kollantai prezantoi Seminarin Teologjik Tomsk në forum. Ai foli për pranimin dhe akomodimin në seminar, traditat e tij dhe perspektivat e zhvillimit, programet në vazhdim dhe përshtatjen e tyre për studentët ndërkombëtarë.\n\nDelegacioni I Seminarit Teologjik Tomsk do të donte të falënderonte organizatorët e forumit Prosvet në personin e Peshkopit Në pushtet Maximilian, Mitropoliti I Irkutsk dhe Angara, dhe frymëzuesi ideologjik dhe autori Evgenia Kim, si dhe udhëheqja E Fondacionit Për Mbështetjen E Kulturës Dhe Trashëgimisë Së Krishterë në personin E Drejtorit Ekzekutiv Egor Skopenko për mbështetjen e tyre financiare."},"cn":{"auto":"2025年10月30日至11月4日，在托木斯克和阿西诺沃的大都会罗斯蒂斯拉夫的祝福下，托木斯克神学院的一群国际学生在学术事务副校长维塔利*科兰泰神父的带领下，参加了第二届东正教青年国际论坛\"Provet\"。 在支持基督教文化和遗产基金会的协助下参加了论坛。\n\n来自托木斯克的修生参观了一些着名的教会和世俗人物的场地，包括教会-社会关系和媒体Synodal部门主席Vladimir Legoyda，政治学候选人，副教授。 在会议期间，他分享了他多年在媒体领域的经验，并回答了论坛与会者和嘉宾的许多问题。\n\n此外，托木斯克神学院的学生在论坛上介绍了他们国家的东正教信仰。 关于东正教在巴基斯坦的使命的信息是由二年级学生Shahbazzaigham介绍的。 三年级学生Chinyama Chimwemwe和Sospeter Saisi，以及二年级学生Zoe Jean Marie和Dimonye Chincherem Benedict就非洲的东正教做了演讲。\n\n在论坛上，来自不同团队的学生制作了一些关于价值观的视频，参观了伊尔库茨克市和贝加尔湖，并能够在伊尔库茨克大都会区的圣地祈祷。\n\n牧师维塔利*科兰泰在论坛上介绍了托木斯克神学院. 他谈到了神学院的入学和住宿，它的传统和发展前景，正在进行的项目和他们对国际学生的适应。\n\n托木斯克神学院代表团要感谢Prosvet论坛的组织者，以伊尔库茨克和安加拉的主教马克西米利安的名义，以及意识形态的启发者和作家Evgenia Kim，以及支持基督教文化和遗产基金会的领导，以执行主任Egor Skopenko的名义，感谢他们的财政支持。"},"el":{"auto":"Με την ευλογία του Μητροπολίτη Τομσκ και Ασινόβου Ροστόσλαβ, από τις 30 Οκτωβρίου έως τις 4 Νοεμβρίου 2025, μια ομάδα διεθνών φοιτητών από το Θεολογικό Σεμινάριο του Τομσκ, με επικεφαλής τον αντιπρύτανη Ακαδημαϊκών Υποθέσεων, ιερέα Βιτάλι Κολλαντάι, συμμετείχε στο ΙΙ Διεθνές Φόρουμ Ορθόδοξης Νεολαίας \"Prosvet\". Η συμμετοχή στο φόρουμ πραγματοποιήθηκε με τη βοήθεια του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς.\n\nΟι ιεροκήρυκες από το Τομσκ επισκέφθηκαν διάφορους χώρους με γνωστές εκκλησιαστικές και κοσμικές προσωπικότητες, συμπεριλαμβανομένου του Βλαντιμίρ Λεγκόιντα, προέδρου του Συνοδικού Τμήματος σχέσεων Εκκλησίας-κοινωνίας και των μέσων ενημέρωσης, υποψηφίου Πολιτικών Επιστημών, Αναπληρωτή Καθηγητή. Κατά τη διάρκεια της συνάντησης, μοιράστηκε την πολυετή εμπειρία του στον τομέα των μέσων ενημέρωσης και απάντησε σε πολλές ερωτήσεις από τους συμμετέχοντες και τους επισκέπτες του φόρουμ.\n\nΕπιπλέον, οι μαθητές του σεμιναρίου του Τομσκ έκαναν παρουσιάσεις για την ορθόδοξη πίστη στις χώρες τους στο φόρουμ. Οι πληροφορίες για την Ορθόδοξη αποστολή στο Πακιστάν παρουσιάστηκαν από τον φοιτητή 2ου έτους Shahbaz Zaigham. Οι μαθητές του 3ου έτους Chinyama Chimwemwe και Sospeter Saisi, καθώς και οι μαθητές του 2ου έτους Zoe Jean Marie και Dimonye Chinechem Benedict, έδωσαν εκθέσεις για την Ορθοδοξία στην Αφρική.\n\nΕπίσης στο φόρουμ, μαθητές από διάφορες ομάδες έκαναν πολλά βίντεο σχετικά με τις αξίες, περιόδευσαν την πόλη του Ιρκούτσκ και τη λίμνη Βαϊκάλη και μπόρεσαν να προσευχηθούν στα ιερά της μητροπολιτικής περιοχής του Ιρκούτσκ.\n\nΟ ιερέας Βιτάλι Κολλαντάι παρουσίασε το Θεολογικό Σεμινάριο του Τομσκ στο φόρουμ. Μίλησε για την εισαγωγή και τη διαμονή στο σεμινάριο, τις παραδόσεις και τις προοπτικές ανάπτυξής του, τα τρέχοντα προγράμματα και την προσαρμογή τους για διεθνείς φοιτητές.\n\nΗ αντιπροσωπεία του θεολογικού σεμιναρίου του Τομσκ θα ήθελε να ευχαριστήσει τους διοργανωτές του φόρουμ Prosvet, στο πρόσωπο του κυβερνώντος επισκόπου Μαξιμιλιανού, Μητροπολίτη Ιρκούτσκ και Ανγκάρα, και την ιδεολογική εμπνευστή και συγγραφέα Ευγενία Κιμ, καθώς και την ηγεσία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, στο πρόσωπο του Εκτελεστικού Διευθυντή Egor Skopenko, για την οικονομική τους υποστήριξη."},"en":{"auto":"With the blessing of Metropolitan Rostislav of Tomsk and Asinovo, from October 30 to November 4, 2025, a group of international students from Tomsk Theological Seminary, led by Vice-Rector for Academic Affairs, Priest Vitaly Kollantai, took part in the II International Forum of Orthodox Youth \"Prosvet\". Participation in the forum took place with the assistance of the Foundation for the Support of Christian Culture and Heritage.\n\nSeminarians from Tomsk visited a number of venues with well-known church and secular figures, including Vladimir Legoyda, Chairman of the Synodal Department for Church-Society Relations and the Media, Candidate of Political Sciences, Associate Professor. During the meeting, he shared his many years of experience in the media sphere and answered numerous questions from participants and guests of the forum.\n\nIn addition, students of Tomsk Seminary made presentations on the Orthodox faith in their countries at the forum. The information about the Orthodox mission in Pakistan was presented by the 2nd year student Shahbaz Zaigham. 3rd-year students Chinyama Chimwemwe and Sospeter Saisi, as well as 2nd-year students Zoe Jean Marie and Dimonye Chinechem Benedict, delivered reports on Orthodoxy in Africa.\n\nAlso at the forum, students from various teams made several videos about values, toured the city of Irkutsk and Lake Baikal, and were able to pray at the shrines of the Irkutsk Metropolitan Area.\n\nPriest Vitaly Kollantai presented Tomsk Theological Seminary at the forum. He spoke about admission and accommodation at the seminary, its traditions and development prospects, ongoing programs and their adaptation for international students.\n\nThe delegation of Tomsk Theological Seminary would like to thank the organizers of the Prosvet forum, in the person of the ruling Bishop Maximilian, Metropolitan of Irkutsk and Angara, and the ideological inspirer and author Evgenia Kim, as well as the leadership of the Foundation for the Support of Christian Culture and Heritage, in the person of Executive Director Egor Skopenko, for their financial support."},"fr":{"auto":"Avec la bénédiction du métropolite Rostislav de Tomsk et d'asinovsk, du 30 octobre au 4 novembre 2025, un groupe d'étudiants étrangers du séminaire théologique de Tomsk, dirigé par le vice-recteur pour le travail éducatif, Jeremiah Vitali Kollantai, a participé aux travaux du deuxième forum international de la jeunesse orthodoxe «Illumination». La participation au forum a été facilitée par la Fondation pour la culture et le patrimoine chrétiens.\n\nLes séminaristes de Tomsk ont visité un certain nombre de sites avec des personnalités ecclésiastiques et laïques célèbres, y compris le président du département synodal pour les relations de l'Église avec la société et les médias, le candidat des sciences politiques, le professeur adjoint Vladimir legoyda. Au cours de la réunion, il a partagé ses nombreuses années d'expérience dans le domaine des médias et a répondu à de nombreuses questions des participants et des invités du forum.\n\nEn outre, les étudiants du séminaire de Tomsk ont fait des exposés sur la foi orthodoxe dans leur pays. Des informations sur la mission orthodoxe au Pakistan ont été fournies par un étudiant de deuxième année, Shahbaz Zaigham. Des exposés sur l'Orthodoxie en Afrique ont été présentés par les étudiants de la 3e année, Chinyama Chimwemwe et sospeter Saisi, ainsi que par les étudiants de la 2e année, Zoa Jean Marie et Dimonje Chinecherem Benedict.\n\nÉgalement sur le forum, les étudiants des différentes équipes ont filmé plusieurs vidéos sur les valeurs, visité la ville d'Irkoutsk et le lac Baïkal avec des excursions et ont pu prier près des sanctuaires de la métropole d'Irkoutsk.\n\nLe prêtre Vitaly Kollantai a présenté le séminaire théologique de Tomsk au forum. Il a parlé de l'admission et de la vie au séminaire, de ses traditions et de ses perspectives de développement, des programmes mis en œuvre et de leur adaptation pour les étudiants étrangers.\n\nLa délégation du séminaire de Tomsk remercie chaleureusement les organisateurs du forum «Illumination» en la personne de l'archevêque au pouvoir, le métropolite Maximilien d'Irkoutsk et d'angarsky, ainsi que le cerveau idéologique et l'auteur Evgenia Kim, ainsi que la direction du Fonds de soutien à la culture chrétienne et au patrimoine en la personne du directeur exécutif Egor skopenko pour son soutien financier."},"ge":{"auto":"ტომსკისა და ასინოვოს მიტროპოლიტ როსტისლავის კურთხევით, 2025 წლის 30 ოქტომბრიდან 4 ნოემბრამდე, ტომსკის სასულიერო სემინარიის საერთაშორისო სტუდენტების ჯგუფმა, რომელსაც ხელმძღვანელობდა აკადემიური საკითხების ვიცე-რექტორი, მღვდელი ვიტალი კოლანტაი, მონაწილეობა მიიღო მართლმადიდებელი ახალგაზრდობის II საერთაშორისო ფორუმში \"Prosvet\". ფორუმში მონაწილეობა ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დახმარებით მოხდა.\n\nტომსკის სემინარისტებმა მოინახულეს რიგი ადგილები ცნობილი საეკლესიო და საერო მოღვაწეებით, მათ შორის ვლადიმერ ლეგოიდა, ეკლესია-საზოგადოების ურთიერთობების სინოდალური დეპარტამენტის თავმჯდომარე და მედია, პოლიტიკურ მეცნიერებათა კანდიდატი, ასოცირებული პროფესორი. შეხვედრაზე მან მედიის სფეროში მრავალწლიანი გამოცდილება გაგვიზიარა და ფორუმის მონაწილეებისა და სტუმრების უამრავ კითხვას უპასუხა.\n\nგარდა ამისა, ტომსკის სემინარიის სტუდენტებმა ფორუმზე გააკეთეს პრეზენტაციები მართლმადიდებლური რწმენის შესახებ თავიანთ ქვეყნებში. ინფორმაცია პაკისტანში მართლმადიდებელი მისიის შესახებ წარმოადგინა მე-2 კურსის სტუდენტმა შაჰბაზ ზაიგამმა. მე-3 კურსის სტუდენტებმა ჩინიამა ჩიმუემვემ და სოსპეტერ საისიმ, ასევე მე-2 კურსის სტუდენტებმა ზოე ჟან მარიმ და დიმონიე ჩინჩერემ ბენედიქტმა გააკეთეს პრეზენტაციები აფრიკაში მართლმადიდებლობის შესახებ.\n\nასევე ფორუმზე, სხვადასხვა გუნდის სტუდენტებმა გააკეთეს რამდენიმე ვიდეო ღირებულებების შესახებ, დაათვალიერეს ქალაქი ირკუტსკი და ბაიკალის ტბა და შეძლეს ლოცვა ირკუტსკის მეტროპოლიტენის სალოცავებში.\n\nმღვდელმა ვიტალი კოლანტაიმ ფორუმზე ტომსკის სასულიერო სემინარია წარადგინა. მან სემინარიაში მიღებასა და განთავსებაზე, მის ტრადიციებსა და განვითარების პერსპექტივებზე, მიმდინარე პროგრამებსა და საერთაშორისო სტუდენტებისთვის მათ ადაპტაციაზე ისაუბრა.\n\nტომსკის სასულიერო სემინარიის დელეგაცია მადლობას უხდის პროსვეტის ფორუმის ორგანიზატორებს, მმართველი ეპისკოპოსის მაქსიმილიანის, ირკუტსკისა და ანგარას მიტროპოლიტის, იდეოლოგიური ინსპირატორისა და ავტორის ევგენია კიმის, ასევე ფონდის ხელმძღვანელობას ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერისთვის, აღმასრულებელი დირექტორის ეგორ სკოპენკოს პიროვნებაში, მათი ფინანსური მხარდაჭერისთვის."},"he":{"auto":"בברכתו של מטרופוליטן טומסק ואסינובסקי רוסטיסלב, בין התאריכים 30 באוקטובר ל -4 בנובמבר 2025, קבוצה של סטודנטים זרים בסמינר התיאולוגי של טומסק, בראשות הפרובוקטור לעבודה חינוכית, ג ' רי ויטאלי קולנטאי, השתתפה בפורום הבינלאומי השני של הנוער האורתודוכסי \"פרוש\". ההשתתפות בפורום התקיימה בסיוע הקרן לתמיכה בתרבות הנוצרית ובמורשת.\n\nסמינריסטים מטומסק ביקרו במספר מקומות עם אנשי כנסייה וחילוניים ידועים, כולל יו \" ר המחלקה הסינודלית ליחסי הכנסייה עם החברה והתקשורת, מועמד למדעי המדינה, דוקנט ולדימיר לגויד. במהלך הפגישה הוא שיתף את שנות הניסיון שלו בתחום המדיה וענה על שאלות רבות של משתתפי הפורום ואורחיו.\n\nבנוסף, סטודנטים בסמינר טום הופיעו בפורום עם דוחות על האמונה האורתודוקסית במדינותיהם. מידע על המשימה האורתודוקסית בפקיסטן הוצג על ידי סטודנט שנה 2 שאחבז זייגהם. עם הודעות על האורתודוקסיה באפריקה הופיעו סטודנטים של קורס 3 צ 'יניאמה צ' ימבומווה וסוספטר סאיסי, כמו גם סטודנטים של קורס 2 זואה ג 'אן מארי ודימוניה צ' ינצ ' ר בנדיקט.\n\nכמו כן, בפורום, סטודנטים בצוותים שונים צילמו כמה סרטונים על ערכים, ביקרו בעיר אירקוטסק ובאגם בייקל, כמו גם הצליחו להתפלל ליד מקדשי מיטרופוליה אירקוט.\n\nהכומר ויטאלי קולנטאי הציג בפורום את הסמינר הרוחני של טום. הוא דיבר על קבלה וחיים בסמינר, על המסורות שלו ועל סיכויי הפיתוח שלו, על התוכניות המיושמות ועל התאמתם לסטודנטים בינלאומיים.\n\nמשלחת הסמינר התיאולוגי של טום מודה בלבביות למארגני הפורום \"אור\", המיוצגת על ידי הארכיריאון השולט של מיטרופוליט אירקוטסק ואנגאר מקסימיליאן והמוח והסופר יבגני קים, כמו גם הנהלת הקרן לתמיכה בתרבות הנוצרית והמורשת, המיוצגת על ידי המנכ \" ל יגור סקופנקו, על תמיכתם הכספית."},"ja":{"auto":"2025年10月30日から11月4日まで、トムスクのメトロポリタン・ロスティスラフとアシノヴォの祝福を受けて、教務副学長であるヴィタリー・コランタイ神父が率いるトムスク神学校の留学生グループが、正統派青年「プロスヴェット」の第2回国際フォーラムに参加しました。 フォーラムへの参加は、キリスト教文化と遺産の支援のための財団の支援を受けて行われました。\n\nトムスクからの神学校は、ウラジーミルLegoyda、教会-社会関係とメディアのためのシノダル部門の会長、政治学の候補者、准教授を含む、よく知られている教会と世俗的な人物との会場の数を訪問しました。 会議中、彼はメディア分野での長年の経験を共有し、フォーラムの参加者やゲストからの多数の質問に答えました。\n\nさらに、トムスク神学校の学生は、フォーラムで彼らの国の正統派の信仰について発表しました。 パキスタンでの正教会の使命に関する情報は、2年生のShahbaz Zaighamによって提示されました。 3年生のChinyama ChimwemweとSospeter Saisi、2年生のZoe Jean MarieとDimonye Chinechem Benedictは、アフリカの正統性について報告しました。\n\nまた、フォーラムでは、さまざまなチームの学生が価値観についていくつかのビデオを作成し、イルクーツク市とバイカル湖を見学し、イルクーツク首都圏の神社で祈ることができました。\n\n司祭Vitaly Kollantaiはフォーラムでトムスク神学校を発表しました。 彼は、神学校での入学と宿泊、その伝統と発展の見通し、進行中のプログラムと留学生のための適応について話しました。\n\nトムスク神学校の代表団は、支配的な司教マクシミリアン、イルクーツクとアンガラのメトロポリタン、そしてイデオロギーのインスピレーションと著者エフゲニアキムの人のProsvetフォーラムの主催者、そして彼らの財政的支援のためのエグゼクティブディレクターのエゴールスコペンコの人のキリスト教文化と遺産の支援のための財団のリーダーシップに感謝したいと思います。"},"ru":{"auto":"По благословению митрополита Томского и Асиновского Ростислава с 30 октября по 4 ноября 2025 года группа иностранных студентов Томской духовной семинарии, возглавляемая проректором по учебной работе иереем Виталием Коллантай, приняла участие в работе II Международного форума православной молодежи «Просвет». Участие в форуме состоялось при содействии Фонда поддержки христианской культуры и наследия.\n\nСеминаристы из Томска посетили ряд площадок с известными церковными и светскими деятелями, в том числе с председателем Синодального отдела по взаимоотношениям Церкви с обществом и СМИ, кандидатом политических наук, доцентом Владимиром Легойда. В ходе встречи он поделился своим многолетним опытом работы в медиасфере и ответил на многочисленные вопросы участников и гостей форума.\n\nКроме того, студенты Томской семинарии выступили на форуме с докладами о православной вере в своих странах. Информацию о православной миссии в Пакистане представил студент 2 курса Шахбаз Заигхам. С сообщениями о Православии в Африке выступили студенты 3 курса Чиньяма Чимвемве и Соспетер Саиси, а также студенты 2 курса Зоа Джеан Мари и Димонье Чинечерем Бенедикт.\n\nТакже на форуме студенты в составе различных команд сняли несколько видеороликов о ценностях, посетили с экскурсиями город Иркутск и озеро Байкал, а также смогли помолиться у святынь Иркутской митрополии.\n\nСвященник Виталий Коллантай представил на форуме Томскую духовную семинарию. Он рассказал о поступлении и проживании в семинарии, ее традициях и перспективах развития, реализуемых программах и их адаптации для иностранных студентов.\n\nДелегация Томской духовной семинарии сердечно благодарит организаторов форума «Просвет» в лице правящего архиерея митрополита Иркутского и Ангарского Максимилиана и идейного вдохновителя и автора Евгении Ким, а также руководство Фонда поддержки христианской культуры и наследия в лице исполнительного директора Егора Скопенко за финансовую поддержку.","manual":"По благословению митрополита Томского и Асиновского Ростислава с 30 октября по 4 ноября 2025 года группа иностранных студентов Томской духовной семинарии, возглавляемая проректором по учебной работе иереем Виталием Коллантай, приняла участие в работе II Международного форума православной молодежи «Просвет». Участие в форуме состоялось при содействии Фонда поддержки христианской культуры и наследия.\n\nСеминаристы из Томска посетили ряд площадок с известными церковными и светскими деятелями, в том числе с председателем Синодального отдела по взаимоотношениям Церкви с обществом и СМИ, кандидатом политических наук, доцентом Владимиром Легойда. В ходе встречи он поделился своим многолетним опытом работы в медиасфере и ответил на многочисленные вопросы участников и гостей форума.\n\nКроме того, студенты Томской семинарии выступили на форуме с докладами о православной вере в своих странах. Информацию о православной миссии в Пакистане представил студент 2 курса Шахбаз Заигхам. С сообщениями о Православии в Африке выступили студенты 3 курса Чиньяма Чимвемве и Соспетер Саиси, а также студенты 2 курса Зоа Джеан Мари и Димонье Чинечерем Бенедикт.\n\nТакже на форуме студенты в составе различных команд сняли несколько видеороликов о ценностях, посетили с экскурсиями город Иркутск и озеро Байкал, а также смогли помолиться у святынь Иркутской митрополии.\n\nСвященник Виталий Коллантай представил на форуме Томскую духовную семинарию. Он рассказал о поступлении и проживании в семинарии, ее традициях и перспективах развития, реализуемых программах и их адаптации для иностранных студентов.\n\nДелегация Томской духовной семинарии сердечно благодарит организаторов форума «Просвет» в лице правящего архиерея митрополита Иркутского и Ангарского Максимилиана и идейного вдохновителя и автора Евгении Ким, а также руководство Фонда поддержки христианской культуры и наследия в лице исполнительного директора Егора Скопенко за финансовую помощь."},"sr":{"auto":"По благослову митрополита Томског и Асиновског Ростислава од 30.октобра до 4. новембра 2025. године група страних студената Томске духовне семинарије, коју је предводио проректор за учебни рад иереј Витали Коллантай, учествовала је у раду II Међународног форума православне омладине Просвет. Учешће на форуму је одржано уз помоћ Фонда за подршку хришћанске културе и наслеђа.\n\nСеминаристи из Томска посетили су низ места са познатим црквеним и светским лицима, укључујући и председника Синодалног одељења за односе цркве са друштвом и Медијима, кандидата политичких наука, доцента Владимира Легојда. Током састанка, он је поделио своје дугогодишње искуство у медијској сфери и одговорио на бројна питања учесника и гостију форума.\n\nОсим тога, студенти Томске семинарије су на форуму износили докладе о Православној вери у својим земљама. Информације о православној мисији у Пакистану представио је студент 2. курса Шахбаз Заигхам. Са извештајима о Православији у Африци су се појавили студенти 3. курса Чинјама Чимвемве и Соспетер Саиси, као и студенти 2.курса Зоа Џејан Мари и Димоније Чинечерем Бенедикт.\n\nТакође, на форуму су студенти у складу са различитим тимовима снимили неколико видео записа о вредностима, посетили су са екскурзијама град Иркутск и језеро Байкал, као и могли да се моле код светиња Иркутске Митрополије.\n\nСвештеник Виталиј Коллантай је на форуму представио Томску духовну семинарију. Он је говорио о уласку и боравку у семинарији, њеним традицијама и перспективама развоја, реализованим програмима и њиховој адаптацији за стране студенте.\n\nДелегација Томске духовне семинарије срчано захваљује организаторима форума \"Просвет\" у лику владајућег архиереја митрополита Иркутског и Ангарског Максимилиана и идејског инспиратора и аутора Евгении Ким, као и руководству Фонда за подршку хришћанској култури и наслеђу у лику извршног директора Егора Скопенкоа за финансијску подршку."},"tr":{"auto":"Tomsk Büyükşehir ve Asinovsky Rostislav'ın kutsamasıyla, 30 Ekim - 4 Kasım 2025 tarihleri arasında, eğitim çalışmalarından sorumlu Rektör Yardımcısı Rahip Vitali Kollantay başkanlığındaki Tomsk İlahiyat Fakültesi'nden bir grup yabancı öğrenci, II. Foruma katılım, Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'nın yardımıyla gerçekleşti.\n\nTomsk'tan seminerler, Kilisenin toplum ve medya ile ilişkileri Sinodal Departmanı başkanı, siyaset bilimi adayı, doçent Vladimir Legoida da dahil olmak üzere tanınmış kilise ve laik figürlerle bir dizi mekanı ziyaret ettiler. Toplantı sırasında medya küresindeki uzun yıllara dayanan deneyimini paylaştı ve forum katılımcılarından ve misafirlerinden gelen çok sayıda soruyu yanıtladı.\n\nAyrıca Tomsk Ruhban Okulu'ndaki öğrenciler forumda kendi ülkelerindeki Ortodoks inancı hakkında konuşmalar yaptılar. Pakistan'daki Ortodoks misyonu hakkında bilgi, 2. sınıf öğrencisi Shahbaz Zaigham tarafından sunuldu. 3. sınıf öğrencileri Chinyama Chimwemwe ve Sospeter Saisi ile 2. sınıf öğrencileri Zoa Jeanh Mari ve Dimonye Chinecherem Benedict, Afrika'da Ortodoksluk hakkında raporlar yayınladılar.\n\nAyrıca forumda, çeşitli ekiplerin bir parçası olan öğrenciler değerlerle ilgili birkaç video çektiler, turlarla Irkutsk şehrini ve Baykal Gölü'nü ziyaret ettiler ve Irkutsk metropolünün türbelerinde dua edebildiler.\n\nRahip Vitaly Kollantay, forumda Tomsk İlahiyat Okulu'nu sundu. Seminere kabul ve ikamet, gelenekleri ve gelişim beklentileri, uygulanan programlar ve bunların uluslararası öğrencilere uyarlanması hakkında konuştu.\n\nTomsk İlahiyat Semineri heyeti, Irkutsk Büyükşehir Piskoposu ve Angarsk Maximilian ve ideolojik ilham kaynağı ve yazar Yevgenia Kim'in şahsındaki Spotlight forumunun organizatörlerine ve mali destek için icra direktörü Yegor Skopenko'nun şahsındaki Hıristiyan Kültürü ve Mirasını Destekleme Fonu'nun liderliğine yürekten teşekkür ediyor."}}},"component":"content-flow"},{"images":[{"title":{},"width":1051,"chosen":false,"height":591,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_664665f5-9a27-4f62-be36-ce2dc9af9e50","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_c92e4f9e-394e-473e-9769-84ddfd8c6188"},{"title":{},"width":800,"chosen":false,"height":450,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_5f960797-efa5-4a22-8e83-7d79a8f2c7bb","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_916e71ee-3e42-42e5-aebe-ce96d161be0d"},{"title":{},"width":800,"chosen":false,"height":450,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_d78475b1-000e-4bf1-83d8-db5f63c9acd6","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_93ca7370-a73a-4513-b14c-551a69a348aa"},{"title":{},"width":800,"chosen":false,"height":450,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_ee76b94a-83c4-4e1d-8ca6-1801fc39efc9","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_45c932f5-d7c5-4b14-a929-ec854d26e753"},{"title":{},"width":800,"chosen":false,"height":450,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_29a9ccb0-658b-45fc-a931-7ade3b0d0a61","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_8c019ba8-ac81-4528-8ac1-c2bdcf2bad9c"},{"title":{},"width":800,"chosen":false,"height":450,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_cbb62a69-8945-4081-8838-3af9273d2d3e","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/11/05/image-name_d6277281- diskutuan planet e bashkëpunimit për vitin 2026 dhe ranë dakord për zbatimin e aktiviteteve të përbashkëta në të ardhmen."},"cn":{"auto":"会议期间，双方讨论了黑山、塞尔维亚、斯普斯卡共和国和克罗地亚目前的项目，讨论了2026年的合作计划，并就未来联合活动的实施达成一致。"},"el":{"auto":"Κατά τη διάρκεια της συνάντησης, τα μέρη συζήτησαν τρέχοντα έργα στο Μαυροβούνιο, τη Σερβία, τη Δημοκρατία Σέρπσκα και την Κροατία, συζήτησαν σχέδια συνεργασίας για το 2026 και συμφώνησαν για την υλοποίηση μελλοντικών κοινών δραστηριοτήτων."},"en":{"auto":"During the meeting, the parties discussed current projects in Montenegro, Serbia, Republika Srpska and Croatia, discussed cooperation plans for 2026 and agreed on the implementation of future joint activities."},"fr":{"auto":"Au cours de la réunion, les parties ont discuté des projets en cours sur le territoire du Monténégro, de la Serbie, de la Republika Srpska et de la Croatie, discuté des plans de coopération pour 2026 et convenu de la mise en œuvre d'activités conjointes futures."},"ge":{"auto":"შეხვედრაზე მხარეებმა მონტენეგროში, სერბეთში, რესპუბლიკა სერპსკასა და ხორვატიაში მიმდინარე პროექტები განიხილეს, 2026 წლის თანამშრომლობის გეგმები განიხილეს და სამომავლო ერთობლივი საქმიანობის განხორციელებაზე შეთანხმდნენ."},"he":{"auto":"במהלך הפגישה, הצדדים דנו בפרויקטים מתמשכים בשטחי מונטנגרו, סרביה, הרפובליקה הסרבית וקרואטיה, דנו בתוכניות לשיתוף פעולה לשנת 2026 והסכימו על יישום פעילויות משותפות עתידיות."},"ja":{"auto":"会議中、両当事者はモンテネグロ、セルビア、スルプスカ共和国、クロアチアにおける現在のプロジェクトについて議論し、2026年の協力計画について議論し、将来の共同活動の実施について合意した。"},"ru":{"auto":"В ходе встречи стороны обсудили текущие проекты на территории Черногории, Сербии, Республики Сербской и Хорватии, обсудили планы по сотрудничеству на 2026 год и договорились о реализации будущих совместных мероприятий.","manual":"В ходе встречи стороны обсудили текущие проекты на территории Черногории, Сербии, Республики Сербской и Хорватии, обсудили планы по сотрудничеству на 2026 год и договорились о реализации будущих совместных мероприятий."},"sr":{"auto":"Током састанка стран пенко с Патриархом Порфирием"},"sr":{"auto":"Састанак Егора Скопенка са патријархом Порфиријем"},"tr":{"auto":"Yegor Skopenko'nun Patrik Porfiry ile görüşmesi"}},"breakpoint":"main"}],"published_at":"2025-09-30T09:36:34+00:00","updated_at":"2025-09-30T10:48:47.293349+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في إطار زيارة عمل وفد مؤسسة دعم الثقافة والتراث المسيحي إلى صربيا وجمهورية صربيا ، التقى المدير التنفيذي للمؤسسة ، إيجور سكوبينكو ، مع بطريرك صربيا بورفيري. وعقد الاجتماع في مقر إقامة قداسته في بلغراد. \n\nوحضر الاجتماع أيضا رئيس الكنيسة الأرثوذكسية الصربية ، ورئيس الأساقفة إيرينج من نوفوساد ومتروبوليت باكا ، والأسقف جيراسيم من غورنو كارلوفاتش ، وكذلك زيليكو سيجيتش ، رئيس مكاتب مؤسسة دعم الثقافة والتراث المسيحي في بلغراد وبانيا لوكا (جمهورية صربسكا).\n\nخلال الاجتماع ، الذي عقد في جو دافئ وودي ، تم التطرق إلى قضايا المشاريع الجارية في الجبل الأسود وصربيا وجمهورية صربسكا ، وكذلك مشروع ترميم كنيسة القديس نيكولاس العجائب في مدينة كريكفينيكا التابعة لأبرشية جورنو كارلوفاك* (ملاحظة المحرر-تقع على أراضي كرواتيا)*. بالإضافة إلى ذلك ، ناقش الطرفان خطط التعاون لعام 2026 واتفقا على تنفيذ الأحداث المشتركة المستقبلية ، التي بدأها إيجور سكوبينكو.\n\nأكد البطريرك بورفيري على قيمة العلاقة الحميمة التي تطورت بين الكنيسة الأرثوذكسية الصربية ومؤسسة دعم الثقافة والتراث المسيحي ، وأعرب عن أمله في مزيد من التعاون المثمر."},"al":{"auto":"Si pjesë e vizitës së punës së delegacionit të Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë në Serbi dhe Republikën e Serbisë, Drejtori Ekzekutiv i Fondacionit, Egor Skopenko, u takua me Patriarkun Porfiry të Serbisë. Takimi u zhvillua në rezidencën E Shenjtërisë së tij në Beograd. \n\nNë takim morën pjesë edhe hierarku i Kishës Ortodokse serbe, Kryepeshkopi Irinej i Novosadit dhe Mitropoliti I Bacës, Peshkopi Gerasim I Gorno-Karlovacit, si dhe Zeljko Cejiç, drejtues i zyrave të Fondacionit Për Mbështetjen E Kulturës Dhe Trashëgimisë Së Krishterë Në Beograd dhe Banja Luka (Republika Srpska).\n\nGjatë takimit, i cili u zhvillua në një atmosferë të ngrohtë dhe miqësore, u prekën çështje të projekteve në vazhdim Në Mal të Zi, Serbi dhe Republika Srpska, si dhe projekti për restaurimin E Kishës Së Shën Nikollës Mrekullibërës në qytetin Crikvenica të dioqezës Gorno-Karlovac* (shënim i redaktorit – i vendosur në territorin E Kroacisë). Përveç kësaj, palët diskutuan planet për bashkëpunim për vitin 2026 dhe ranë dakord për zbatimin e ngjarjeve të përbashkëta të ardhshme, të iniciuara nga Egor Skopenko.\n\nPatriarku Porfiry theksoi vlerën e marrëdhënies së ngrohtë që është zhvilluar midis Kishës Ortodokse serbe dhe Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë dhe shprehu shpresën për bashkëpunim të mëtejshëm të frytshëm."},"cn":{"auto":"作为支持基督教文化和遗产基金会代表团对塞尔维亚和塞尔维亚共和国的工作访问的一部分，基金会执行主任Egor Skopenko会见了塞尔维亚的族长Porfiry。 会议在贝尔格莱德教皇陛下的住所举行。 \n\n出席会议的还有塞尔维亚东正教会的教长、新萨德和巴卡大都会的伊里尼大主教、戈尔诺-卡尔洛瓦茨的格拉西姆主教以及贝尔格莱德和巴尼亚卢卡(斯普斯卡共和国)基督教文化和遗产支助基金会办公室主任泽尔科*塞吉奇。\n\n会议在热情友好的气氛中进行,讨论了黑山、塞尔维亚和斯普斯卡共和国正在进行的项目问题,以及恢复戈尔诺-卡尔洛瓦茨教区克里克韦尼察市圣尼古拉斯奇迹工作者教堂的项目*(编者注–位于克罗地亚领土)。 此外，双方讨论了2026年的合作计划，并商定了由Egor Skopenko发起的未来联合活动的实施。\n\n族长Porfiry强调了塞尔维亚东正教会和支持基督教文化和遗产基金会之间发展的温暖关系的价值，并表示希望进一步富有成效的合作。"},"el":{"auto":"Στο πλαίσιο της επίσκεψης εργασίας της αντιπροσωπείας του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς στη Σερβία και τη Δημοκρατία της Σερβίας, ο Εκτελεστικός Διευθυντής του Ιδρύματος, Έγκορ Σκοπένκο, συναντήθηκε με τον Πατριάρχη Σερβίας Πορφίρι. Η συνάντηση πραγματοποιήθηκε στην οικία της Αυτού Αγιότητας στο Βελιγράδι. \n\nΣτη συνάντηση συμμετείχαν επίσης ο Ιεράρχης της Σερβικής Ορθόδοξης Εκκλησίας, ο Αρχιεπίσκοπος Νοβοσάντ και Μητροπολίτης Μπάκα Ειρηναίος, ο Επίσκοπος Γκόρνο-Κάρλοβατς Γεράσιμ, καθώς και ο Ζέλικο Τσέγιτς, επικεφαλής των γραφείων του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς στο Βελιγράδι και τη Μπάνια Λούκα (Δημοκρατία Σέρπσκα).\n\nΚατά τη διάρκεια της συνάντησης, η οποία πραγματοποιήθηκε σε μια ζεστή και φιλική ατμόσφαιρα, συζητήθηκαν θέματα συνεχιζόμενων έργων στο Μαυροβούνιο, τη Σερβία και τη Δημοκρατία Σέρπσκα, καθώς και το έργο για την αποκατάσταση της Εκκλησίας του Αγίου Νικολάου του Θαυματουργού στην πόλη Crikvenica της Επισκοπής Gorno-Karlovac*. ed. - βρίσκεται στο έδαφος της Κροατίας)*. Επιπλέον, τα μέρη συζήτησαν σχέδια συνεργασίας για το 2026 και συμφώνησαν για την εφαρμογή μελλοντικών κοινών εκδηλώσεων, που ξεκίνησε ο Egor Skopenko.\n\nΟ Πατριάρχης Πορφύριος τόνισε την αξία της θερμής σχέσης που έχει αναπτυχθεί μεταξύ της Σερβικής Ορθόδοξης Εκκλησίας και του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς και εξέφρασε την ελπίδα για περαιτέρω γόνιμη συνεργασία."},"en":{"auto":"As part of the working visit of the delegation of the Foundation for the Support of Christian Culture and Heritage to Serbia and the Republic of Serbia, the Executive Director of the Foundation, Egor Skopenko, met with Patriarch Porfiry of Serbia. The meeting took place at the residence of His Holiness in Belgrade. \n\nThe meeting was also attended by the hierarch of the Serbian Orthodox Church, Archbishop Irinej of Novosad and Metropolitan of Baca, Bishop Gerasim of Gorno-Karlovac, as well as Zeljko Cejic, head of the offices of the Foundation for the Support of Christian Culture and Heritage in Belgrade and Banja Luka (Republika Srpska).\n\nDuring the meeting, which took place in a warm and friendly atmosphere, issues of ongoing projects in Montenegro, Serbia and the Republika Srpska, as well as the project to restore the Church of St. Nicholas the Wonderworker in the city of Crikvenica of the Gorno-Karlovac diocese* (editor's note – located on the territory of Croatia) were touched upon*. In addition, the parties discussed plans for cooperation for 2026 and agreed on the implementation of future joint events, initiated by Egor Skopenko.\n\nPatriarch Porfiry emphasized the value of the warm relationship that has developed between the Serbian Orthodox Church and the Foundation for the Support of Christian Culture and Heritage, and expressed hope for further fruitful cooperation."},"fr":{"auto":"Dans le cadre de la visite de travail de la délégation de la Fondation pour la culture et le patrimoine chrétiens en Serbie et en Republika Srpska, le directeur exécutif de la Fondation, Yegor skopenko, a rencontré le Patriarche Serbe porphyre. La réunion a eu lieu à la résidence de sa Sainteté à Belgrade. \n\nLe hiérarque de l'Église orthodoxe serbe, l'archevêque Irénée de Novosadsky et le métropolite de Bach, l'évêque Gerasim de Gorno-Karlovac, ainsi que le chef des bureaux du Fonds de soutien à la culture et au patrimoine chrétiens de Belgrade et de Banja Luka (Republika Srpska), Željko Čeić, ont également participé à la réunion.\n\nLa réunion, qui s'est déroulée dans une atmosphère chaleureuse et amicale, a porté sur les projets en cours au Monténégro, en Serbie et en Republika Srpska, ainsi que sur le projet de restauration de L'église de Saint-Nicolas dans la ville de Crikvenica du diocèse de Gorno-Karlovac *(env. Ed. - situé sur le territoire de la Croatie)*. En outre, les parties ont discuté des plans de coopération pour 2026 et ont convenu de la mise en œuvre de futures activités conjointes, initiées par Egor skopenko.\n\nLe Patriarche porphyre a souligné la valeur des relations chaleureuses entre l'Église orthodoxe serbe et Le fonds de soutien à la culture et au patrimoine chrétiens et a exprimé l'espoir d'une coopération fructueuse."},"ge":{"auto":"სერბეთსა და სერბეთის რესპუბლიკაში ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დელეგაციის სამუშაო ვიზიტის ფარგლებში, ფონდის აღმასრულებელი დირექტორი ეგორ სკოპენკო სერბეთის პატრიარქ პორფირის შეხვდა. შეხვედრა ბელგრადში, უწმინდესის რეზიდენციაში შედგა. \n\nშეხვედრას ასევე ესწრებოდნენ სერბეთის მართლმადიდებელი ეკლესიის იერარქი, ნოვოსადის მთავარეპისკოპოსი ირინეჟი და ბაკას მიტროპოლიტი, გორნო-კარლოვაჩის ეპისკოპოსი გერასიმი, ასევე ზელიკო ცეიჩი, ბელგრადისა და ბანჯა ლუკას ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის ოფისების ხელმძღვანელი (რესპუბლიკა სერპსკა).\n\nშეხვედრის დროს, რომელიც თბილ და მეგობრულ ატმოსფეროში შედგა, შეეხო მონტენეგროში, სერბეთსა და სერბეთის რესპუბლიკაში მიმდინარე პროექტების საკითხებს, ასევე გორნო-კარლოვაჩის ეპარქიის ქალაქ კრიკვენიცაში წმინდა ნიკოლოზ საკვირველთმოქმედის ეკლესიის აღდგენის პროექტს* (რედაქტორის შენიშვნა – მდებარეობს ხორვატიის ტერიტორიაზე). გარდა ამისა, მხარეებმა განიხილეს 2026 წლის თანამშრომლობის გეგმები და შეთანხმდნენ ეგორ სკოპენკოს მიერ ინიცირებული სამომავლო ერთობლივი ღონისძიებების განხორციელებაზე.\n\nპატრიარქმა პორფირიმ ხაზი გაუსვა სერბეთის მართლმადიდებლურ ეკლესიასა და ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის საფუძველს შორის განვითარებული თბილი ურთიერთობის ღირებულებას და იმედი გამოთქვა შემდგომი ნაყოფიერი თანამშრომლობისთვის."},"he":{"auto":"במסגרת ביקור עבודה של משלחת הקרן לתמיכה בתרבות נוצרית ומורשת בסרביה וברפובליקה הסרבית, מנהל הקרן יגור סקופנקו נפגש עם הפטריארך הסרבי פורפירי. הפגישה התקיימה במעון הוד קדושתו בבלגרד. \n\nבפגישה השתתפו גם ההיררכיה של הכנסייה האורתודוכסית הסרבית הארכיבישוף נובוסדסקי והמטרופוליטן באצ 'י אירנאוס, הבישוף גורנו-קרלובצקי גרסים, וראש משרדי הקרן לתמיכה בתרבות ומורשת נוצרית בבלגרד ובאנג' ה לוקה (הרפובליקה הסרבית) ז 'לקו צ 'ייץ'.\n\nבמהלך הפגישה, שהתקיימה באווירה חמה וידידותית, נגעו בסוגיות של פרויקטים מתמשכים במונטנגרו, סרביה ורפובליקה סרפסקה, כמו גם פרויקט לשיקום מקדש סנט ניקולאי הפלא בעיר קריקבניצה של ביוסמת גורנו-קרלובץ *(כ. עורך ממוקם בשטח קרואטיה)*. בנוסף, הצדדים דנו בתוכניות לשיתוף פעולה לשנת 2026 והסכימו על יישום אירועים משותפים עתידיים, שהוזמנו על ידי יגור סקופנקו.\n\nהפטריארך פורפיריוס הדגיש במיוחד את ערך היחסים החמים שנוצרו בין הכנסייה האורתודוקסית הסרבית לבין קרן התמיכה בתרבות הנוצרית והמורשת, והביע תקווה לשיתוף פעולה פורה נוסף."},"ja":{"auto":"セルビアとセルビア共和国へのキリスト教文化と遺産の支援のための財団の代表団の作業訪問の一環として、財団のエグゼクティブディレクター、エゴール・スコペンコは、セルビアの総主教Porfiryと会いました。 会議はベオグラードの法王の住居で行われました。 \n\nこの会議には、セルビア正教会の階層、ノボサドのイリネジ大司教、バカのメトロポリタン、ゴルノ-カルロヴァツのゲラシム司教、ベオグラードとバニャ-ルカ（スルプスカ共和国）のキリスト教文化と遺産支援財団の事務所長であるゼルイコ-セヒッチも出席した。\n\n温かくフレンドリーな雰囲気の中で行われた会議では、モンテネグロ、セルビア、スルプスカ共和国で進行中のプロジェクトの問題だけでなく、ゴルノ-カルロヴァツ教区*のクリクヴェニツァ市の聖ニコラス*ワンダーワーカー教会を復元するプロジェクト（編集者注–クロアチアの領土にあります）に触れました*。 さらに、両当事者は、2026年の協力計画について議論し、Egor Skopenkoによって開始された将来の共同イベントの実施について合意した。\n\nポルフィリ総主教は、セルビア正教会とキリスト教文化と遺産の支援のための財団との間で発展した温かい関係の価値を強調し、さらなる実りある協力への希望を表明しました。"},"ru":{"auto":"В рамках рабочего визита делегации Фонда поддержки христианской культуры и наследия в Сербию и Республику Сербскую исполнительный директор Фонда Егор Скопенко встретился с Патриархом Сербским Порфирием. Встреча прошла в резиденции Его Святейшества в Белграде. \n\nВо встрече также приняли участие иерарх Сербской Православной Церкви архиепископ Новосадский и митрополит Бачский Ириней, епископ Горно-Карловацкий Герасим, а также руководитель офисов Фонда поддержки христианской культуры и наследия в Белграде и Баня-Луке (Республика Сербская) Желько Чейич.\n\nВ ходе встречи, которая прошла в теплой и дружественной атмосфере, были затронуты вопросы текущих проектов в Черногории, Сербии и Республике Сербской, а также проекта по восстановлению храма Святителя Николая Чудотворца в городе Цриквеница Горно-Карловацкой епархии *(прим. ред. – располагается на территории Хорватии)*. Кроме того, стороны обсудили планы по сотрудничеству на 2026 год и договорились о реализации будущих совместных мероприятий, инициатором которых выступил Егор Скопенко.\n\nПатриарх Порфирий особо подчеркнул ценность теплых взаимоотношений, сложившихся между Сербской Православной Церковью и Фондом поддержки христианской культуры и наследия, и выразил надежду на дальнейшее плодотворное сотрудничество.","manual":"В рамках рабочего визита делегации Фонда поддержки христианской культуры и наследия в Сербию и Республику Сербскую исполнительный директор Фонда Егор Скопенко встретился с Патриархом Сербским Порфирием. Встреча прошла в резиденции Его Святейшества в Белграде. \n\nВо встрече также приняли участие иерарх Сербской Православной Церкви архиепископ Новосадский и митрополит Бачский Ириней, епископ Горно-Карловацкий Герасим, а также руководитель офисов Фонда поддержки христианской культуры и наследия в Белграде и Баня-Луке (Республика Сербская) Желько Чейич.\n\nВ ходе встречи, которая прошла в теплой и дружественной атмосфере, были затронуты вопросы текущих проектов в Черногории, Сербии и Республике Сербской, а также проекта по восстановлению храма Святителя Николая Чудотворца в городе Цриквеница Горно-Карловацкой епархии *(прим. ред. – располагается на территории Хорватии)*. Кроме того, стороны обсудили планы по сотрудничеству на 2026 год и договорились о реализации будущих совместных мероприятий, инициатором которых выступил Егор Скопенко.\n\nПатриарх Порфирий особо подчеркнул ценность теплых взаимоотношений, сложившихся между Сербской Православной Церковью и Фондом поддержки христианской культуры и наследия, и выразил надежду на дальнейшее плодотворное сотрудничество."},"sr":{"auto":"У оквиру радне посете делегације Фонда за подршку хришћанској култури и наслеђу Србији и Републици Српској, извршни директор Фонда Егор Скопенко састао се са Патријархом српским Порфиријем. Састанак је одржан у резиденцији Његове Светости у Београду. \n\nНа састанку су учествовали и архијереј Српске православне цркве архиепископ Новосадски и митрополит бачки Иринеј, епископ Горно-Карловачки Герасим, као и руководилац канцеларија Фонда за подршку хришћанској култури и наслеђу у Београду и Бањалуци (Република Српска) Жељко Чејић.\n\nТоком састанка, који је одржан у топлој и пријатељској атмосфери, обрађена су питања текућих пројеката у Црној Гори, Србији и Републици Српској, као и пројекат обнове храма светитеља Николаја Чудотворца у граду Цриквеница Горно-Карловачке епархије *(прим. ред. налази се на територији Хрватске)*. Поред тога, стране су разговарале о плановима за сарадњу за 2026.годину и договориле се о реализацији будућих заједничких активности, чији је иницијатор био Егор Скопенко.\n\nПатријарх Порфирије је посебно нагласио вредност топлих односа између Српске Православне Цркве и Фонда за подршку хришћанској култури и наслеђу и изразио наду у даљу плодну сарадњу."},"tr":{"auto":"Hristiyan Kültürünü ve Mirasını Destekleme Vakfı heyetinin Sırbistan ve Sırbistan Cumhuriyeti'ne yaptığı çalışma ziyareti kapsamında Vakfın icra direktörü Yegor Skopenko, Sırp Patriği Porfiri ile bir araya geldi. Toplantı, Hazretleri Hazretleri'nin Belgrad'daki evinde yapıldı. \n\nToplantıya Sırp Ortodoks Kilisesi hiyerarşisi Novosad Başpiskoposu ve Bačka Metropoliti Irinej, Gorno-Karlovac Piskoposu Gerasim ve Belgrad ve Banja Luka'daki (Sırp Cumhuriyeti) Hıristiyan Kültürü ve Mirasını Destekleme Vakfı ofislerinin başkanı Željko Čejić de katıldı.\n\nSıcak ve samimi bir atmosferde gerçekleşen toplantı sırasında Karadağ, Sırbistan ve Sırp Cumhuriyeti'ndeki devam eden projelerin yanı sıra Gorno-Karlovac Piskoposluğu'ndaki Crikvenica kentindeki Aziz Nikolaos Mucizevi İşçi Kilisesi'ni restore etme projesi konularına değinildi * (Not. - Hırvatistan topraklarında yer almaktadır) *. Ayrıca taraflar, 2026 yılı için işbirliği planlarını tartıştılar ve Yegor Skopenko'nun başlattığı gelecekteki ortak faaliyetlerin uygulanması konusunda anlaştılar.\n\nPatrik Porfiriy, Sırp Ortodoks Kilisesi ile Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı arasında gelişen sıcak ilişkinin değerini özellikle vurguladı ve daha verimli işbirliği umudunu dile getirdi."}}},"component":"content-flow"},{"images":[{"title":{},"width":900,"chosen":false,"height":1600,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/30/image-name_84b0c69d-7ecc-4957-8b48-b1dd44ecdbaf","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/30/image-name_29f3d6bc-3d91-43fd-98f5-c52c86782dcb"}],"heading":{},"component":"image-gallery"}],"seo":{"og":{},"html":{}},"setti
