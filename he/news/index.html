仕と奉献式には、エゴール・スコペンコ事務局長が率いるキリスト教文化遺産支援財団の代表団が出席しました。"},"ru":{"auto":"На богослужении и торжественной церемонии освящения присутствовала делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко.","manual":"На богослужении и торжественной церемонии освящения присутствовала делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко."},"sr":{"auto":"На богослужењу и свечаној церемонији освећења присуствовала је делегација Фонда за подршку хришћанској култури и наслеђу на челу са извршним директором Егором Скопенком."},"tr":{"auto":"İbadete ve kutsama törenine, icra direktörü Yegor Skopenko başkanlığındaki Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'ndan bir heyet katıldı."}}},"picture":[{"alt":{"ae":{"auto":"أول خدمة أسقفية في الكنيسة الروسية الصربية في بانيا لوكا"},"al":{"auto":"Shërbimi i parë episkopal në Kishën ruso-serbe Në Banja Luka"},"cn":{"auto":"巴尼亚卢卡俄罗斯-塞尔维亚教堂的第一次主教服务"},"el":{"auto":"Η πρώτη Επισκοπική λειτουργία στη ρωσική-Σερβική Εκκλησία στη Μπάνια Λούκα"},"en":{"auto":"The first episcopal service at the Russian-Serbian Church in Banja Luka"},"fr":{"auto":"Premier Office épiscopal dans le temple russe-serbe de Banja Luka"},"ge":{"auto":"პირველი საეპისკოპოსო მსახურება რუსულ-სერბულ ეკლესიაში ბანჯა ლუკაში"},"he":{"auto":"שירות הארכיארי הראשון במקדש הרוסי-סרבי בבניה-לוק"},"ja":{"auto":"バニャ-ルカのロシア-セルビア教会での最初の聖公会のサービス"},"ru":{"auto":"Первое архиерейское богослужение в русско-сербском храме в Баня-Луке","manual":"Первое архиерейское богослужение в русско-сербском храме в Баня-Луке"},"sr":{"auto":"Прва архијерејска богослужба у Руско-српском храму у Бањалуци"},"tr":{"auto":"Banja Luka'daki Rus-Sırp kilisesinde piskoposların ilk ibadeti"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_2555b615-00ff-49a5-82df-8ece0c4f4f0a","title":{"ae":{"auto":"أول خدمة أسقفية في الكنيسة الروسية الصربية في بانيا لوكا"},"al":{"auto":"Shërbimi i parë episkopal në Kishën ruso-serbe Në Banja Luka"},"cn":{"auto":"巴尼亚卢卡俄罗斯-塞尔维亚教堂的第一次主教服务"},"el":{"auto":"Η πρώτη Επισκοπική λειτουργία στη ρωσική-Σερβική Εκκλησία στη Μπάνια Λούκα"},"en":{"auto":"The first episcopal service at the Russian-Serbian Church in Banja Luka"},"fr":{"auto":"Premier Office épiscopal dans le temple russe-serbe de Banja Luka"},"ge":{"auto":"პირველი საეპისკოპოსო მსახურება რუსულ-სერბულ ეკლესიაში ბანჯა ლუკაში"},"he":{"auto":"שירות הארכיארי הראשון במקדש הרוסי-סרבי בבניה-לוק"},"ja":{"auto":"バニャ-ルカのロシア-セルビア教会での最初の聖公会のサービス"},"ru":{"auto":"Первое архиерейское богослужение в русско-сербском храме в Баня-Луке","manual":"Первое архиерейское богослужение в русско-сербском храме в Баня-Луке"},"sr":{"auto":"Прва архијерејска богослужба у Руско-српском храму у Бањалуци"},"tr":{"auto":"Banja Luka'daki Rus-Sırp kilisesinde piskoposların ilk ibadeti"}},"breakpoint":"main"}],"published_at":"2025-09-26T15:03:41+00:00","updated_at":"2025-09-29T13:49:58.131806+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"أقيمت الخدمة الأسقفية الأولى وحفل التكريس الرسمي للكنيسة الروسية الصربية لتجلي المخلص في 21 سبتمبر 2025 ، في عيد ميلاد السيدة العذراء مريم ، في بانيا لوكا (جمهورية صربسكا ، البوسنة والهرسك).\n\nقاد القداس الإلهي وطقوس تكريس الكنيسة الأسقف إفرايم من بانيا لوكا ، الذي شارك في خدمته الأسقف سافا من ماركي ، ونائب أبرشية بانيا لوكا ، ورجال الدين في كنيسة تجلي المخلص ، بالإضافة إلى ممثلين آخرين لرجال الدين في الكنيسة الأرثوذكسية الصربية.\n\nوحضر الخدمة الأسقفية وحفل التكريس رئيس جمهورية صربسكا ميلوراد دوديك ، والسفير فوق العادة والمفوض للاتحاد الروسي لدى البوسنة والهرسك إيغور كالابوخوف ، وعمدة بانيا لوكا دراشكو ستانيفوكوفيتش ، وأعضاء البرلمان ، ووفد من مؤسسة دعم الثقافة والتراث المسيحيين بقيادة المدير التنفيذي إيجور سكوبينكو ، ورئيس مكتبي مؤسسة دعم الثقافة والتراث المسيحي في بلغراد وبانيا لوكا زيليكو سيجيتش ، فضلا عن العديد من المؤمنين.\n\nبعد الخدمة ، أقيمت وجبة احتفالية مع رئيس جمهورية صربسكا ، ميلوراد دوديك ، والأسقف إفريم من بانيا لوكا ، قدم خلالها المدير التنفيذي للمؤسسة ، إيجور سكوبينكو ، عشرة أيقونات لأبرشية بانيا لوكا التابعة للكنيسة الأرثوذكسية الصربية.\n\nشكر ميلوراد دوديك روسيا ومؤسسة دعم الثقافة والتراث المسيحي على دعمهما الشامل في بناء كنيسة التجلي وأعرب عن ثقته في أن هذه الكنيسة ستصبح رمزا للصداقة الروسية الصربية.\n \nبدوره ، أعرب الأسقف إفرايم عن امتنانه الخاص للمؤسسة التي يمثلها إيجور سكوبينكو لمساهمته في بناء الكنيسة الروسية الصربية ، وكذلك في تعزيز العلاقات الودية الدافئة بين الشعبين الأرثوذكس. كدليل على التقدير العميق لعمله ، قدم فلاديكا إفرايم إيجور سكوبينكو مع اثنين من الرموز – تجلي الرب (تكريما لعيد الراعي الرئيسي للمعبد) وحاملي العاطفة الملكية المقدسة (العائلة المالكة) ، الذين يكرس المعبد الروسي الصربي لذكراه.\n\nبالإضافة إلى ذلك ، تم تكريم إيجور سكوبينكو ليصبح الأب الروحي لـ 11 صلبا لكنيسة التجلي ، والتي تم صنعها ونقلها إلى بانيا لوكا بدعم مالي من المؤسسة.\n\n**مساعدة**\n\nتم بناء تجلي الكنيسة الروسية الصربية في بانيا لوكا والمركز الروحي والثقافي لأبرشية بانيا لوكا التابعة للكنيسة الأرثوذكسية الصربية وفقا لمشروع تم إعداده في 2017-2018 من قبل متخصصين في مارشي بناء على الحلول المعمارية لدير تشودوف في موسكو. \n\nالكنيسة مكرسة لذكرى القديس نيكولاس الثاني وعائلته ولديها ثلاث مصليات: باسم تجلي الرب وحاملي الآلام الملكية والقديس بطرس الأكبر. سمعان وسافا من صربيا ، مؤسسي سلالة نيمانيتش.\n\nبدأ العمل في بناء المعبد في عام 2018 واكتمل في عام 2024. يجري العمل حاليا على الديكور الداخلي للمعبد.\n\nفي أوائل عام 2024 ، تلقت أبرشية بانيا لوكا 11 صليبا للكنيسة الروسية الصربية ، والتي صنعتها شركة بريدسافا للبناء والترميم. تم تمويل العمل على تصنيع ونقل الصلبان من قبل مؤسسة دعم الثقافة والتراث المسيحي.\n\nعشية الخدمة الإلهية الأسقفية الأولى ، في 15 سبتمبر 2025 ، تم تكريس القباب و 11 صلبا لتجلي الكنيسة الروسية الصربية."},"al":{"auto":"Shërbimi i parë episkopal dhe ceremonia solemne e shenjtërimit të Kishës ruso-serbe të Shndërrimit të Shpëtimtarit u zhvillua më 21 shtator 2025, në festën e Lindjes së Virgjëreshës Së Bekuar Mari, në Banja Luka (Republika Srpska, Bosnje Dhe Hercegovina).\n\nLiturgjia Hyjnore dhe riti i shenjtërimit të kishës u drejtuan nga Peshkopi Efraim I Banja Lukës, i shërbyer nga Peshkopi Sava I Marche, Famullitar i Dioqezës Së Banja Lukës, klerikët e Kishës Së Shpërfytyrimit Të Shpëtimtarit, Si dhe përfaqësues të tjerë të klerit të Kishës Ortodokse serbe.\n\nNë shërbimin episkopal Dhe ceremoninë e shenjtërimit morën pjesë Presidenti I Republikës Srpska Milorad Dodik, Ambasadori I Jashtëzakonshëm dhe Fuqiplotë i Federatës ruse Në Bosnje Dhe Hercegovinë Igor Kalabukhov, Kryetari I Bashkisë Së Banja Luka Drashko Stanivukovich, anëtarë Të Parlamentit, një delegacion nga Fondacioni Për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë të udhëhequr nga Drejtori Ekzekutiv Egor Skopenko, kreu i zyrave të Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë Në Beograd dhe Banja Luka Zeljko\n\nPas shërbimit, u mbajt një vakt festiv me Presidentin e Republikës Srpska, Milorad Dodik dhe Peshkopin Efrem Të Banja Lukës, gjatë së cilës Drejtori Ekzekutiv i Fondacionit, Egor Skopenko, paraqiti dhjetë ikona Në Dioqezën E Banja Lukës të Kishës Ortodokse serbe.\n\nMilorad Dodik falënderoi Rusinë dhe Fondacionin për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë për mbështetjen e tyre gjithëpërfshirëse në ndërtimin e Kishës Së Shpërfytyrimit dhe shprehu besimin se kjo kishë do të bëhet simbol i miqësisë ruso-serbe.\n \nPeshkopi Ephraim, nga ana tjetër, shprehu mirënjohje të veçantë Për Fondacionin e përfaqësuar nga Egor Skopenko për kontributin e tij në ndërtimin e kishës ruso-serbe, si dhe për forcimin e marrëdhënieve të ngrohta miqësore midis dy popujve Ortodoksë. Në shenjë vlerësimi të thellë për punët e tij, Vladyka Ephraim i dhuroi Egor Skopenko dy ikona – Shpërfytyrimin e Zotit (për nder të festës kryesore patronale të tempullit) dhe Bartësit E Pasionit Të Shenjtë Mbretëror (Familja Mbretërore), kujtimit të të cilit i kushtohet tempulli ruso-serb.\n\nPër më tepër, Egor Skopenko u nderua të bëhej kumbari i 11 kryqeve të Kishës Së Shpërfytyrimit, të cilat u bënë dhe u transportuan në Banja Luka me mbështetjen financiare të Fondacionit.\n\n**Ndihmë**\n\nShndërrimi i Kishës ruso-serbe në Banja Luka dhe Qendra Shpirtërore dhe Kulturore e Dioqezës Banja Luka të Kishës Ortodokse serbe u ndërtuan sipas një projekti të përgatitur në 2017-2018 nga specialistë të MARCHI bazuar në zgjidhjet arkitektonike të Manastirit Chudov në Moskë. \n\nKisha i kushtohet kujtimit të Shën Nikollës II dhe familjes së tij dhe ka tre kapela: në emër të Shpërfytyrimit të Zotit, Bartësve Të Pasionit Mbretëror dhe Shën Pjetrit të madh. Simeon dhe Savva të Serbisë, themeluesit e dinastisë Nemanich.\n\nPuna për ndërtimin e tempullit filloi në 2018 dhe përfundoi në 2024. Aktualisht po punohet për dekorimin e brendshëm të tempullit.\n\nNë fillim të vitit 2024, dioqeza Banja Luka mori 11 kryqe për kishën ruso-serbe, të cilat u bënë nga Kompania E ndërtimit dhe restaurimit Predsava. Puna për prodhimin dhe transportin e kryqve u financua nga Fondacioni për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë.\n\nNë prag të shërbimit të parë hyjnor episkopal, më 15 shtator 2025, u shenjtëruan kupolat dhe 11 kryqe për Shndërrimin e Kishës ruso-serbe."},"cn":{"auto":"2025年9月21日，在巴尼亚卢卡（波斯尼亚和黑塞哥维那斯普斯卡共和国）举行了第一次圣职仪式和俄罗斯-塞尔维亚救世主变形教会的庄严奉献仪式。\n\n教会的神圣礼拜仪式和奉献仪式由巴尼亚卢卡的以法莲主教领导，由马尔凯主教萨瓦、巴尼亚卢卡教区牧师、救世主变形教会的神职人员以及塞尔维亚正\n\n斯普斯卡共和国总统米洛拉德*多迪克、俄罗斯联邦驻波斯尼亚和黑塞哥维那特命全权大使伊戈尔*卡拉布霍夫、巴尼亚卢卡*德拉什科*斯坦尼沃科维奇市长、议员、基督教文化和遗产支持基金会执行主任叶戈尔*斯科潘科率领的代表团、贝尔格莱德基督教文化和遗产支持基金会办公室主任和巴尼亚卢卡*泽尔科*塞吉奇以及众多信徒出席了主教服务和献祭仪式。\n\n仪式结束后，与斯普斯卡共和国总统米洛拉德*多迪克和巴尼亚卢卡主教埃夫雷姆举行了节日晚宴，基金会执行主任埃戈尔*斯科彭科向塞尔维亚东正教会巴尼亚卢卡教区赠送了十个圣像。\n\nMilorad Dodik感谢俄罗斯和基督教文化和遗产支持基金会对变形教堂建设的全面支持，并表示相信这座教堂将成为俄罗斯-塞尔维亚友谊的象征。\n \n反过来，ephraim主教对Egor Skopenko代表的基金会表示特别感谢，感谢他为俄罗斯-塞尔维亚教会的建设做出了贡献，以及加强两个东正教人民之间的热情友好关系。 弗拉迪卡*以法莲（Vladyka Ephraim）向叶戈尔*斯科彭科（Egor Skopenko）赠送了两个圣像--上帝的变形（为了纪念寺庙的主要父系盛宴）和神圣的皇家激情承载者（王室），这两个圣像是俄罗斯–塞尔维亚神庙献给他们的。\n\n此外，Egor Skopenko很荣幸成为变形教会的11十字架的教父，这些十字架是在基金会的财政支持下制作并运送到巴尼亚卢卡的。\n\n**帮助**\n\n巴尼亚卢卡的俄罗斯-塞尔维亚教堂的变形和塞尔维亚东正教巴尼亚卢卡教区的精神和文化中心是根据MARCHI专家根据莫斯科Chudov修道院建筑解决方案在2017-2018 \n\n该教堂致力于纪念圣尼古拉斯二世及其家人，并有三个小教堂：以主的变形，皇家激情承载者和圣彼得大帝的名义。 塞尔维亚的Simeon和Savva，Nemanich王朝的创始人。\n\n寺庙的建设工作始于2018年，并于2024年完成。 目前正在进行寺庙内部装饰的工作。\n\n在2024早期，巴尼亚卢卡教区收到了俄罗斯-塞尔维亚教堂的11十字架，这些十字架由Predsava建筑和修复公司制作。 十字架的制造和运输工作由基督教文化和遗产支持基金会资助。\n\n在第一次主教神圣服务的前夕，2025年9月15日，俄罗斯-塞尔维亚教会变形的圆顶和11个十字架被奉献。"},"el":{"auto":"Η πρώτη Επισκοπική λειτουργία και η επίσημη τελετή αφιέρωσης της Ρωσική-Σερβικής Εκκλησίας της Μεταμόρφωσης του Σωτήρος πραγματοποιήθηκαν στις 21 Σεπτεμβρίου 2025, στην εορτή της Γεννήσεως της Παναγίας, στη Μπάνια Λούκα (Δημοκρατία Σέρπσκα, Βοσνία και Ερζεγοβίνη).\n\nΗ Θεία Λειτουργία και η ιεροτελεστία του Αγιασμού της εκκλησίας καθοδηγήθηκαν από τον Επίσκοπο Εφραίμ της Μπάνια Λούκα, τον Συν-υπηρετούμενο από τον Επίσκοπο Σάβα του Μάρκε, τον εφημέριο της Επισκοπής της Μπάνια Λούκα, τον κλήρο της Εκκλησίας Μεταμόρφωσης του Σωτήρος, καθώς και άλλους εκπροσώπους του κλήρου της Σερβικής Ορθόδοξης Εκκλησίας.\n\nΣτην επισκοπική λειτουργία και στην τελετή αφιέρωσης παρευρέθηκαν ο Πρόεδρος της Δημοκρατίας Σέρπσκα Μίλοραντ Ντόντικ, ο Έκτακτος και Πληρεξούσιος Πρέσβης της Ρωσική Ομοσπονδία στη Βοσνία-Ερζεγοβίνη Ιγκόρ Καλαμπουκόφ, ο δήμαρχος της Μπάνια Λούκα Ντράσκο Στανιβούκοβιτς, μέλη του Κοινοβουλίου, αντιπροσωπεία του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς με επικεφαλής τον Εκτελεστικό Διευθυντή Έγκορ Σκόπενκο, επικεφαλής των γραφείων του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς στο Βελιγράδι και τη Μπάνια Λούκα Ζέλικο Τσέγιτς, καθώς και πολυάριθμοι πιστοί.\n\nΜετά την τελετή, πραγματοποιήθηκε ένα εορταστικό γεύμα με τον Πρόεδρο της Δημοκρατίας Σέρπσκα, Μίλοραντ Ντόντικ, και τον Επίσκοπο Εφρέμ της Μπάνια Λούκα, κατά τη διάρκεια του οποίου ο Εκτελεστικός Διευθυντής του Ιδρύματος, Έγκορ Σκόπενκο, παρουσίασε δέκα εικόνες στη μητρόπολη Μπάνια Λούκα της Σερβικής Ορθόδοξης Εκκλησίας.\n\nΟ Μίλοραντ Ντόντικ ευχαρίστησε τη Ρωσία και το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και Κληρονομιάς για την ολοκληρωμένη υποστήριξή τους στην κατασκευή της Εκκλησίας της Μεταμόρφωσης και εξέφρασε την πεποίθηση ότι αυτή η εκκλησία θα γίνει σύμβολο ρωσική-Σερβική φιλία.\n \nΟ επίσκοπος Εφραίμ, με τη σειρά του, εξέφρασε ιδιαίτερη ευγνωμοσύνη στο ίδρυμα που εκπροσωπούσε ο Έγκορ Σκοπένκο για τη συμβολή του στην οικοδόμηση της Ρωσική-Σερβικής Εκκλησίας, καθώς και στην ενίσχυση των θερμών φιλικών σχέσεων μεταξύ των δύο Ορθοδόξων λαών. Ως ένδειξη βαθιάς εκτίμησης για τους κόπους του, η Βλάντυκα Εφραίμ παρουσίασε στον Έγκορ Σκόπενκο δύο εικόνες – τη μεταμόρφωση του Κυρίου (προς τιμήν της κύριας πανηγυρικής γιορτής του ναού) και τους ιερούς βασιλικούς Παθοφόρους (βασιλική οικογένεια), στη μνήμη των οποίων είναι αφιερωμένος ο ρωσική-σερβικός Ναός.\n\nΕπιπλέον, ο Egor Skopenko τιμήθηκε να γίνει ο νονός των 11 σταυρών της Εκκλησίας Μεταμόρφωσης, οι οποίοι κατασκευάστηκαν και μεταφέρθηκαν στη Μπάνια Λούκα με την οικονομική υποστήριξη του Ιδρύματος.\n\n**Βοήθεια**\n\nΗ μεταμόρφωση της Ρωσική-Σερβικής Εκκλησίας στη Μπάνια Λούκα και το πνευματικό και Πολιτιστικό Κέντρο της Επισκοπής Μπάνια Λούκα της Σερβικής Ορθόδοξης Εκκλησίας χτίστηκαν σύμφωνα με ένα έργο που εκπονήθηκε το 2017-2018 από ειδικούς του Μάρκι με βάση αρχιτεκτονικές λύσεις της Μονής Τσούντοφ στη Μόσχα. \n\nΗ εκκλησία είναι αφιερωμένη στη μνήμη του Αγίου Νικολάου Β ' και της οικογένειάς του και έχει τρία παρεκκλήσια: στο όνομα της Μεταμόρφωσης του Κυρίου, των βασιλικών παθών και του Αγίου Πέτρου του Μεγάλου. Συμεών και Σάββα της Σερβίας, οι ιδρυτές της δυναστείας Νεμάνιτς.\n\nΟι εργασίες για την κατασκευή του ναού ξεκίνησαν το 2018 και ολοκληρώθηκαν το 2024. Επί του παρόντος βρίσκονται σε εξέλιξη εργασίες για την εσωτερική διακόσμηση του ναού.\n\nΣτις αρχές του 2024, η επισκοπή της Μπάνια Λούκα έλαβε 11 σταυρούς για τη ρωσική-Σερβική εκκλησία, οι οποίοι κατασκευάστηκαν από την εταιρεία κατασκευής και αποκατάστασης Predsava. Οι εργασίες για την κατασκευή και τη μεταφορά σταυρών χρηματοδοτήθηκαν από το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς.\n\nΤην παραμονή της πρώτης Επισκοπικής Θείας Λειτουργίας, στις 15 Σεπτεμβρίου 2025, αφιερώθηκαν οι θόλοι και 11 σταυροί για τη μεταμόρφωση της Ρωσική-Σερβικής Εκκλησίας."},"en":{"auto":"The first episcopal service and the solemn consecration ceremony of the Russian-Serbian Church of the Transfiguration of the Savior took place on September 21, 2025, on the feast of the Nativity of the Blessed Virgin Mary, in Banja Luka (Republika Srpska, Bosnia and Herzegovina).\n\nThe Divine Liturgy and the rite of consecration of the church were led by Bishop Ephraim of Banja Luka, co-served by Bishop Sava of Marche, Vicar of the Diocese of Banja Luka, the clergy of the Transfiguration Church of the Savior, as well as other representatives of the clergy of the Serbian Orthodox Church.\n\nThe episcopal service and the consecration ceremony were attended by President of the Republika Srpska Milorad Dodik, Ambassador Extraordinary and Plenipotentiary of the Russian Federation to Bosnia and Herzegovina Igor Kalabukhov, Mayor of Banja Luka Drashko Stanivukovich, members of Parliament, a delegation from the Foundation for the Support of Christian Culture and Heritage led by Executive Director Egor Skopenko, head of the offices of the Foundation for the Support of Christian Culture and Heritage in Belgrade and Banja Luka Zeljko Cejic, as well as numerous believers.\n\nAfter the service, a festive meal was held with the President of the Republika Srpska, Milorad Dodik, and Bishop Efrem of Banja Luka, during which the Executive Director of the Foundation, Egor Skopenko, presented ten icons to the Diocese of Banja Luka of the Serbian Orthodox Church.\n\nMilorad Dodik thanked Russia and the Foundation for the Support of Christian Culture and Heritage for their comprehensive support in the construction of the Transfiguration Church and expressed confidence that this church will become a symbol of Russian-Serbian friendship.\n \nBishop Ephraim, in turn, expressed special gratitude to the Foundation represented by Egor Skopenko for his contribution to the construction of the Russian-Serbian church, as well as to the strengthening of warm friendly relations between the two Orthodox peoples. As a sign of deep appreciation for his labors, Vladyka Ephraim presented Egor Skopenko with two icons – the Transfiguration of the Lord (in honor of the main patronal feast of the temple) and the Holy Royal Passion-Bearers (the Royal Family), to whose memory the Russian-Serbian temple is dedicated.\n\nIn addition, Egor Skopenko was honored to become the godfather of 11 crosses of the Transfiguration Church, which were made and transported to Banja Luka with the financial support of the Foundation.\n\n**Help**\n\nThe Transfiguration of the Russian-Serbian Church in Banja Luka and the Spiritual and Cultural Center of the Banja Luka Diocese of the Serbian Orthodox Church were built according to a project prepared in 2017-2018 by specialists of the MARCHI based on architectural solutions of the Chudov Monastery in Moscow. \n\nThe church is dedicated to the memory of St. Nicholas II and his family and has three chapels: in the name of the Transfiguration of the Lord, the Royal Passion-Bearers and St. Peter the Great. Simeon and Savva of Serbia, the founders of the Nemanich dynasty.\n\nWork on the construction of the temple began in 2018 and was completed in 2024. Work is currently underway on the interior decoration of the temple.\n\nIn early 2024, the Banja Luka diocese received 11 crosses for the Russian-Serbian church, which were made by the Predsava construction and restoration company. The work on the manufacture and transportation of crosses was funded by the Foundation for the Support of Christian Culture and Heritage.\n\nOn the eve of the first episcopal divine service, on September 15, 2025, the domes and 11 crosses for the Transfiguration of the Russian-Serbian Church were consecrated."},"fr":{"auto":"Le premier service épiscopal et la cérémonie solennelle de consécration de l'église russe-serbe de la transfiguration ont eu lieu le 21 septembre 2025, à la fête de la Nativité de la Sainte vierge, à Banja Luka (Republika Srpska, Bosnie-Herzégovine).\n\nLa divine liturgie et l'Office de consécration de l'église ont été dirigés par l'évêque de Banja Luka Efrem en tant que vicaire du diocèse de Banja Luka, l'évêque de Marchan Savva, la prêtrise de l'église de la transfiguration et d'autres représentants du clergé de l'Église orthodoxe serbe.\n\nLe Président de la Republika Srpska, Milorad Dodik, l'Ambassadeur extraordinaire et plénipotentiaire de la Fédération de Russie en Bosnie-Herzégovine, Igor kalabukhov, le maire de Banja Luka, Draško Stanivuković, des députés du Parlement, une délégation du fonds de soutien à la culture et au patrimoine chrétiens dirigée par le directeur exécutif Yegor skopenko, le chef des bureaux du Fonds de soutien à la culture et au patrimoine chrétiens de Belgrade et de Banja Luka, Željko Čeijić, ainsi que de nombreux fidèles ont assisté à l'Office épiscopal et à la cérémonie de consécration.\n\nAprès l'Office, un repas de fête a eu lieu avec le Président de la Republika Srpska, Milorad Dodik, et l'évêque de Banja Luka, Efrem, au cours duquel le directeur exécutif de la Fondation, Yegor skopenko, a offert dix icônes au diocèse de Banja Luka de l'Église orthodoxe serbe.\n\nMilorad Dodik a remercié la Russie et Le fonds de soutien à la culture chrétienne et au patrimoine pour leur soutien total à la construction du temple de la transfiguration et a exprimé sa confiance que ce temple deviendrait un symbole de l'amitié russe-serbe.\n \nMgr Efrem, à son tour, a exprimé sa gratitude particulière à la Fondation en la personne d'Egor skopenko pour sa contribution à la construction de l'église russe-serbe, ainsi qu'au renforcement des relations amicales chaleureuses entre les deux peuples orthodoxes. En signe de profonde gratitude pour les travaux, Mgr Efrem a donné à Egor skopenko deux icônes – la transfiguration du Seigneur (en l'honneur de la fête principale du trône du temple) et les Saints des patriciens royaux (famille Royale), dont la mémoire est dédiée au temple russe-serbe.\n\nEn outre, Egor skopenko a été honoré de devenir le parrain des 11 Croix de l'église de la transfiguration du Sauveur, qui ont été fabriquées et transportées à Banja Luka avec le soutien financier de la Fondation.\n\n**Attestation**\n\nL'église russe-serbe de la transfiguration à Banja Luka et le centre Spirituel et culturel du diocèse de Banja Luka de l'Église orthodoxe serbe ont été construits selon un projet préparé en 2017-2018 par les spécialistes de marha sur la base des solutions architecturales du monastère de Chudov à Moscou. \n\nL'église est dédiée à la mémoire du Saint-Tsar Nicolas II et de sa famille et comporte trois chapelles: au nom de la transfiguration du Seigneur, des passionnés royaux et des saints. Siméon et Sava Serbes, ancêtres de la dynastie nemanich.\n\nLes travaux de construction du temple ont commencé en 2018 et se sont terminés en 2024. Actuellement, les travaux de décoration intérieure du temple sont en cours.\n\nAu début de 2024, le diocèse de Banja Luka a reçu 11 Croix pour le temple russe-serbe, qui ont été fabriquées par la société de construction et de restauration predslava. Les travaux de fabrication et de transport des Croix ont été financés par le fonds de soutien à la culture chrétienne et au patrimoine.\n\nÀ la veille du premier Office épiscopal, le 15 septembre 2025, a eu lieu la consécration des dômes et des Croix 11 pour l'église russe-serbe de la transfiguration."},"ge":{"auto":"პირველი საეპისკოპოსო მსახურება და მაცხოვრის ფერისცვალების რუსულ-სერბული ეკლესიის საზეიმო კურთხევის ცერემონია გაიმართა 2025 წლის 21 სექტემბერს, ყოვლადწმინდა ღვთისმშობლის შობის დღესასწაულზე, ბანჯა ლუკაში (რესპუბლიკა სერპსკა, ბოსნია და ჰერცეგოვინა).\n\nსაღმრთო ლიტურგიას და ეკლესიის კურთხევის რიტუალს ხელმძღვანელობდა ბანჯა ლუკას ეპისკოპოსი ეფრემი, რომელსაც ემსახურებოდა მარკეს ეპისკოპოსი სავა, ბანჯა ლუკას ეპარქიის ვიკარი, მაცხოვრის ფერისცვალების ეკლესიის სასულიერო პირები, ასევე სერბეთის მართლმადიდებელი ეკლესიის სასულიერო პირების სხვა წარმომადგენლები.\n\nსაეპისკოპოსო მსახურებას და კურთხევის ცერემონიას ესწრებოდნენ სერბეთის რესპუბლიკის პრეზიდენტი მილორად დოდიკი, რუსეთის ფედერაციის საგანგებო და სრულუფლებიანი ელჩი ბოსნია და ჰერცეგოვინაში იგორ კალაბუხოვი, ბანჯა ლუკა დრაშკო სტანივუკოვიჩის მერი, პარლამენტის წევრები, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დელეგაცია აღმასრულებელი დირექტორის ეგორ სკოპენკოს ხელმძღვანელობით, ბელგრადისა და ბანჯა ლუკა ზელჯკო ცეიჩის ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის ოფისის ხელმძღვანელი.\n\nმსახურების შემდეგ სადღესასწაულო კვება გაიმართა სერბეთის რესპუბლიკის პრეზიდენტთან, მილორად დოდიკთან და ბანჯა ლუკას ეპისკოპოს ეფრემთან, რომლის დროსაც ფონდის აღმასრულებელმა დირექტორმა ეგორ სკოპენკომ სერბეთის მართლმადიდებელი ეკლესიის ბანჯა ლუკას ეპარქიას ათი ხატი გადასცა.\n\nმილორად დოდიკმა მადლობა გადაუხადა რუსეთს და ფონდს ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერისთვის ფერისცვალების ეკლესიის მშენებლობაში ყოვლისმომცველი მხარდაჭერისთვის და გამოთქვა რწმენა, რომ ეს ეკლესია გახდება რუსეთ-სერბეთის მეგობრობის სიმბოლო.\n \nეპისკოპოსმა ეფრემმა, თავის მხრივ, განსაკუთრებული მადლობა გადაუხადა ეგორ სკოპენკოს მიერ წარმოდგენილ ფონდს რუსულ-სერბული ეკლესიის მშენებლობაში შეტანილი წვლილისთვის, ასევე ორ მართლმადიდებელ ხალხს შორის თბილი მეგობრული ურთიერთობების განმტკიცებისთვის. თავისი შრომისადმი ღრმა მადლიერების ნიშნად, ვლადიკა ეფრემმა ეგორ სკოპენკოს წარუდგინა ორი ხატი-უფლის ფერისცვალება (ტაძრის მთავარი პატრონული დღესასწაულის საპატივცემულოდ) და წმინდა სამეფო ვნების მატარებელი (სამეფო ოჯახი), რომლის ხსოვნას ეძღვნება რუსულ-სერბული ტაძარი.\n\nგარდა ამისა, ეგორ სკოპენკოს პატივი მიენიჭა გამხდარიყო ფერისცვალების ეკლესიის 11 ჯვრის ნათლია, რომლებიც ფონდის ფინანსური მხარდაჭერით გაკეთდა და გადაიტანეს ბანჯა ლუკაში.\n\n**დახმარება**\n\nბანჯა ლუკას რუსულ-სერბული ეკლესიის ფერისცვალება და სერბეთის მართლმადიდებელი ეკლესიის ბანჯა ლუკას ეპარქიის სულიერი და კულტურული ცენტრი აშენდა 2017-2018 წლებში მომზადებული პროექტის მიხედვით, რომელიც მარჩის სპეციალისტებმა მოამზადეს მოსკოვში ჩუდოვის მონასტრის არქიტექტურული გადაწყვეტილებების საფუძველზე. \n\nეკლესია ეძღვნება წმინდა ნიკოლოზ II-ისა და მისი ოჯახის ხსოვნას და აქვს სამი სამლოცველო: უფლის ფერისცვალების, სამეფო ვნების მატარებლებისა და წმინდა პეტრე დიდის სახელით. სიმეონი და სერბეთის სავვა, ნემანიჩების დინასტიის დამფუძნებლები.\n\nტაძრის მშენებლობის სამუშაოები 2018 წელს დაიწყო და 2024 წელს დასრულდა. ამჟამად მიმდინარეობს სამუშაოები ტაძრის ინტერიერის გაფორმებაზე.\n\n2024 წლის დასაწყისში ბანჯა ლუკას ეპარქიამ მიიღო 11 ჯვარი რუსულ-სერბული ეკლესიისთვის, რომლებიც დამზადებული იყო პრედსავას სამშენებლო და რესტავრაციის კომპანიის მიერ. ჯვრების დამზადებისა და ტრანსპორტირების სამუშაოები დაფინანსდა ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის მიერ.\n\nპირველი საეპისკოპოსო საღმრთო მსახურების წინა დღეს, 2025 წლის 15 სექტემბერს, აკურთხეს გუმბათები და 11 ჯვარი რუსულ-სერბული ეკლესიის ფერისცვალებისთვის."},"he":{"auto":"עבודת הדת הארכיארית הראשונה וטקס הקדושת המקדש הרוסי-סרבי של ספאסו-פרוברג ' ינס נערכו ב-21 בספטמבר 2025, בחג חג המולד של הקדושה, בבניה-לוק (רפובליקה סרבית, בוסניה והרצגובינה).\n\nהליטורגיה האלוהית ודרגת הקדושת הכנסייה הובילו על ידי הבישוף של באנה-לוק, אפרים, בתמיכת הקצין של האפיסקופייה של באנה-לוק, הבישוף סאווה מרצ 'אן, הכמרים של מקדש ספאסו-פרומברג' ינס, כמו גם נציגים אחרים של הכמרים של הכנסייה האורתודוקסית הסרבית.\n\nבטקס פולחן הבישופים וטקס ההקדשה השתתף נשיא הרפובליקה הסרבית, מילורד דודיק, שגריר יוצא דופן ומלא סמכות של הפדרציה הרוסית בבוסניה והרצגובינה איגור קלבוחוב, ראש עיריית באניה לוקה דרשקו סטניבוקוביץ', חברי פרלמנט, משלחת הקרן לתמיכה בתרבות נוצרית ומורשת בראשות המנכ \"ל יגור סקופנקו, ראש משרדי הקרן לתמיכה בתרבות נוצרית ומורשת בבלגרד ובאניה לוקה ז 'לקו צ 'ייץ', כמו גם מאמינים רבים.\n\nלאחר הפולחן התקיימה ארוחה חגיגית עם נשיא הרפובליקה הסרבית, מילורד דודיק, והבישוף באנה לוקסקי אפרים, שבמהלכה העניק מנכ \" ל הקרן, יגור סקופנקו, עשרה אייקונים כמתנה לדיופית באנה לוק של הכנסייה האורתודוכסית הסרבית.\n\nמילורד דודיק הודה לרוסיה ולקרן התמיכה בתרבות הנוצרית ובמורשת על מתן תמיכה מקיפה בבניית מקדש ספאסו-פרומברג ' ינס והביע ביטחון כי המקדש הזה יהפוך לסמל של ידידות רוסית-סרבית.\n \nאדון אפרים, בתורו, הביע תודה מיוחדת לקרן, בדמותו של יגור סקופנקו, על תרומתו לבניית הכנסייה הרוסית-סרבית, כמו גם לחיזוק היחסים הידידותיים החמים בין שני העמים האורתודוקסיים. כסימן של הכרת תודה עמוקה על עבודותיו, אדון אפרים נתן לאגור סקופנקו שני אייקונים של התגלמות האל (לכבוד חג הכס הראשי של המקדש) ושל הקדושים הסבלנים המלכותיים (משפחת המלך), שזכרם מוקדש למקדש הרוסי-סרבי.\n\nבנוסף, יגור סקופנקו זכה לכבוד להיות קומ של 11 צלבי מקדש ספאסו-פרומברג ' ינס, אשר יוצרו והועברו לבניה-לוקה בתמיכה כספית של הקרן.\n\n**עזרה**\n\nהכנסייה הרוסית-סרבית של ספא-פרוברג 'ינס בבניה-לוק והמרכז הרוחני-תרבותי של ביה\" ס באניה-לוק של הכנסייה האורתודוקסית הסרבית נבנו על פי פרויקט שהוכן בשנת 2017-2018 על בסיס פתרונות אדריכליים של מנזר צ ' ודוב במוסקבה. \n\nהמקדש מוקדש לזכרו של המלך הקדוש ניקולאי השני ומשפחתו ויש לו שלושה תוספים: בשם התגלמות האל, הסבלנים המלכותיים ושל סנט. סימונה וסאווה הסרבים, המייסדים של שושלת נמאניץ'.\n\nעבודות בניית המקדש החלו בשנת 2018 והסתיימו בשנת 2024. כיום מתבצעות עבודות על העיצוב הפנימי של המקדש.\n\nבתחילת 2024 קיבלה ביה \" ס באנה-לוק 11 צלבים עבור הכנסייה הרוסית-סרבית, אשר יוצרו על ידי חברת הבנייה והשיקום \"פרדסלאב\". עבודות הייצור וההובלה של הצלבים מומנו על ידי הקרן לתמיכה בתרבות ומורשת נוצרית.\n\nלקראת שירות הארכיארי הראשון, ב-15 בספטמבר 2025, נערך הקדושת הכיפות ו-11 צלבים עבור הכנסייה הרוסית-סרבית של ספאסו-פרומברג ' י."},"ja":{"auto":"救い主の変容のロシア-セルビア教会の最初の聖公会の奉仕と厳粛な奉献式は、2025年9月21日、バニャルカ（ボスニア・ヘルツェゴビナ共和国スルプスカ）で、祝せられた聖母マリアのキリスト降誕の饗宴で行われました。\n\n神の典礼と教会の奉献の儀式は、バニャ・ルカのエフライム司教、マルケのサヴァ司教、バニャ・ルカ教区の牧師、救い主の変容教会の聖職者、およびセルビア正教会の聖職者の他の代表者によって共同で奉仕されました。\n\n聖公会のサービスと奉献式は、ボスニア-ヘルツェゴビナイゴールKalabukhov、バニャルカDrashko Stanivukovichの市長、議会のメンバー、エグゼクティブディレクター Egor Skopenko、ベオグラードとバニャルカZeljko Cejic、だけでなく、多くの信者。\n\n礼拝の後、スルプスカ共和国の大統領、ミロラド・ドディク、バニャ・ルカのエフレム司教とお祝いの食事が行われ、その間、財団のエグゼクティブディレクター、エゴール・スコペンコは、セルビア正教会のバニャ・ルカの教区に10のアイコンを提示しました。\n\nMilorad Dodikは、変容教会の建設における包括的な支援のために、ロシアとキリスト教文化と遺産の支援のための財団に感謝し、この教会がロシア-セルビアの友情の象徴となることを自信を表明した。\n \nエフライム司教は、ロシア-セルビア教会の建設に貢献したエゴール-スコペンコに代表される財団に特別な感謝の意を表明し、両正教会の人々の間の温かい友好関係の強化にも貢献した。 彼の労働に対する深い感謝の印として、Vladyka EphraimはEgor Skopenkoに2つのアイコンを提示しました–主の変容（寺院の主な後援の饗宴に敬意を表して）と聖王室の受難者（王室）、その記憶にロシア-セルビアの寺院が捧げられています。\n\nさらに、Egor Skopenkoは、財団の財政的支援を受けて作られ、Banja Lukaに運ばれた変容教会の11の十字架のゴッドファーザーになることを光栄に思っていました。\n\n*•ヘルプ**\n\nBanja Lukaのロシア-セルビア教会の変容とセルビア正教会のBanja Luka教区の精神的および文化的中心は、モスクワのChudov修道院の建築的解決策に基づいてMARCHIの専門家によって2017-2018年に準備されたプロジェクトに従って建てられました。 \n\n教会は聖ニコラス2世と彼の家族の記憶に捧げられており、3つの礼拝堂があります：主の変容の名の下に、王室の情熱を持った人と聖ペテロ大王。 ネマニッチ王朝の創設者であるセルビアのシメオンとサヴァ。\n\n寺院の建設作業は2018年に始まり、2024年に完了しました。 現在、寺院の室内装飾に関する作業が進行中です。\n\n2024年初頭、バニャ・ルカ教区はロシア・セルビア教会のために11個の十字架を受け取りました。これはPredsava construction and restoration companyによって作られました。 十字架の製造と輸送に関する作業は、キリスト教文化と遺産の支援のための財団によって資金提供されました。\n\n最初の聖公会の神聖な奉仕の前夜、2025年9月15日に、ロシア-セルビア教会の変容のためのドームと11の十字架が奉献されました。"},"ru":{"auto":"Первое архиерейское богослужение и торжественная церемония освящения Спасо-Преображенского русско-сербского храма состоялись 21 сентября 2025 года, в праздник Рождества Пресвятой Богородицы, в Баня-Луке (Республика Сербская, Босния и Герцеговина).\n\nБожественную литургию и чин освящения храма возглавил епископ Баня-Лукский Ефрем в сослужении викария Баня-Лукской епархии епископа Марчанского Саввы, священства Спасо-Преображенского храма, а также других представителей духовенства Сербской Православной Церкви.\n\nНа архиерейском богослужении и церемонии освящения присутствовал Президент Республики Сербской Милорад Додик, Чрезвычайный и Полномочный Посол РФ в Боснии и Герцеговине Игорь Калабухов, мэр города Баня-Лука Драшко Станивукович, депутаты парламента, делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко, руководитель офисов Фонда поддержки христианской культуры и наследия в Белграде и Баня-Луке Желько Чейич, а также многочисленные верующие.\n\nПосле богослужения состоялась праздничная трапеза с Президентом Республики Сербской Милорадом Додиком и епископом Баня-Лукским Ефремом, во время которой исполнительный директор Фонда Егор Скопенко преподнес в дар Баня-Лукской епархии Сербской Православной Церкви десять икон.\n\nМилорад Додик поблагодарил Россию и Фонд поддержки христианской культуры и наследия за оказание всесторонней поддержки в строительстве Спасо-Преображенского храма и выразил уверенность, что этот храм станет символом русско-сербской дружбы.\n \nВладыка Ефрем в свою очередь выразил особую благодарность Фонду в лице Егора Скопенко за вклад в строительство русско-сербского храма, а также в укрепление теплых дружественных отношений между двумя православными народами. В знак глубокой признательности за труды владыка Ефрем подарил Егору Скопенко две иконы – Преображения Господня (в честь главного престольного праздника храма) и Святых Царственных Страстотерпцев (Царской семьи), памяти которых и посвящен русско-сербский храм.\n\nКроме того, Егор Скопенко был удостоен чести стать кумом 11 крестов Спасо-Преображенского храма, которые были изготовлены и транспортированы в Баня-Луку при финансовой поддержке Фонда.\n\n**Справка**\n\nСпасо-Преображенский русско-сербский храм в Баня-Луке и Духовно-культурный центр Баня-Лукской епархии Сербской Православной Церкви возведен по проекту, подготовленному в 2017-2018 годах специалистами МАРХИ на основе архитектурных решений Чудова монастыря в Москве. \n\nХрам посвящен памяти святого Царя Николая II и его семьи и имеет три придела: во имя Преображения Господня, Царственных страстотерпцев и свв. Симеона и Саввы Сербских, родоначальников династии Неманичей.\n\nРаботы по строительству храма начались в 2018 году и завершились в 2024 году. В настоящее время ведутся работы по внутренней отделке храма.\n\nВ начале 2024 года Баня-Лукская епархия получила 11 крестов для русско-сербского храма, которые были изготовлены строительно-реставрационной компанией «Предслава». Работы по изготовлению и транспортировке крестов были профинансированы Фондом поддержки христианской культуры и наследия.\n\nВ преддверии первого архиерейского богослужения, 15 сентября 2025 года, состоялось освящение куполов и 11 крестов для Спасо-Преображенского русско-сербского храма.","manual":"Первое архиерейское богослужение и торжественная церемония освящения Спасо-Преображенского русско-сербского храма состоялись 21 сентября 2025 года, в праздник Рождества Пресвятой Богородицы, в Баня-Луке (Республика Сербская, Босния и Герцеговина).\n\nБожественную литургию и чин освящения храма возглавил епископ Баня-Лукский Ефрем в сослужении викария Баня-Лукской епархии епископа Марчанского Саввы, священства Спасо-Преображенского храма, а также других представителей духовенства Сербской Православной Церкви.\n\nНа архиерейском богослужении и церемонии освящения присутствовал Президент Республики Сербской Милорад Додик, Чрезвычайный и Полномочный Посол РФ в Боснии и Герцеговине Игорь Калабухов, мэр города Баня-Лука Драшко Станивукович, депутаты парламента, делегация Фонда поддержки христианской культуры и наследия во главе с исполнительным директором Егором Скопенко, руководитель офисов Фонда поддержки христианской культуры и наследия в Белграде и Баня-Луке Желько Чейич, а также многочисленные верующие.\n\nПосле богослужения состоялась праздничная трапеза с Президентом Республики Сербской Милорадом Додиком и епископом Баня-Лукским Ефремом, во время которой исполнительный директор Фонда Егор Скопенко преподнес в дар Баня-Лукской епархии Сербской Православной Церкви десять икон.\n\nМилорад Додик поблагодарил Россию и Фонд поддержки христианской культуры и наследия за оказание всесторонней поддержки в строительстве Спасо-Преображенского храма и выразил уверенность, что этот храм станет символом русско-сербской дружбы.\n \nВладыка Ефрем в свою очередь выразил особую благодарность Фонду в лице Егора Скопенко за вклад в строительство русско-сербского храма, а также в укрепление теплых дружественных отношений между двумя православными народами. В знак глубокой признательности за труды владыка Ефрем подарил Егору Скопенко две иконы – Преображения Господня (в честь главного престольного праздника храма) и Святых Царственных Страстотерпцев (Царской семьи), памяти которых и посвящен русско-сербский храм.\n\nКроме того, Егор Скопенко был удостоен чести стать кумом 11 крестов Спасо-Преображенского храма, которые были изготовлены и транспортированы в Баня-Луку при финансовой поддержке Фонда.\n\n**Справка**\n\nСпасо-Преображенский русско-сербский храм в Баня-Луке и Духовно-культурный центр Баня-Лукской епархии Сербской Православной Церкви возведен по проекту, подготовленному в 2017-2018 годах специалистами МАРХИ на основе архитектурных решений Чудова монастыря в Москве. \n\nХрам посвящен памяти святого Царя Николая II и его семьи и имеет три придела: во имя Преображения Господня, Царственных страстотерпцев и свв. Симеона и Саввы Сербских, родоначальников династии Неманичей.\n\nРаботы по строительству храма начались в 2018 году и завершились в 2024 году. В настоящее время ведутся работы по внутренней отделке храма.\n\nВ начале 2024 года Баня-Лукская епархия получила 11 крестов для русско-сербского храма, которые были изготовлены строительно-реставрационной компанией «Предслава». Работы по изготовлению и транспортировке крестов были профинансированы Фондом поддержки христианской культуры и наследия.\n\nВ преддверии первого архиерейского богослужения, 15 сентября 2025 года, состоялось освящение куполов и 11 крестов для Спасо-Преображенского русско-сербского храма."},"sr":{"auto":"Прва архиерејска богослужба и свечана церемонија освећења Спасо-Преображенског руско-српског храма одржана је 21.септембра 2025. године, на празник Рождества Пресвете Богородице, у Бања-Луку (Республика Српска, Босна и Херцеговина).\n\nБожанску Литургију и чин освећења храма предводио је епископ Бања-Лукски Ефрем у заједничкој служби викарија Бања-Лукске епархије епископа Марчанског Саве, свештенства Спасо-Преображенског храма, као и других представника духовенства Српске Православне Цркве.\n\nНа архијерејској богослужењу и церемонији освећења присуствовао је председник Републике Српске Милорад Додик, ванредни и опуномоћени амбасадор Русије у Босни и Херцеговини Игор Калабухов, градоначелник Града Бања-Лука Драшко Станивукович, посланици парламента, делегација фонда за подршку хришћанској култури и наслеђу на челу са извршним директором Егором Скопенком, шеф Канцеларија Фонда за подршку хришћанској култури и наслеђу у Београду и Бањалуци Жељко Чејић, као и бројни верници.\n\nНакон богослужења, одржана је празнична трапеза са председником Републике Српске Милорадом Додиком и епископом Банја-Лукским Ефремом, током које је извршни директор Фонда Егор Скопенко поклонио десет икона банја-Лукској Епархији Српске Православне Цркве.\n\nМилорад Додик је захвалио Русији и Фондацији за подршку хришћанској култури и наслеђу за пружање свеобухватне подршке у изградњи Спасо-Преображенског храма и изразио уверење да ће овај храм постати симбол руско-српског пријатељства.\n \nВладар Ефрем је у свом реду изразио посебну захвалност Фонду у лику Егора Скопенкоа за допринос изградњи руско-српског храма, као и у јачању топлих пријатељских односа између два православна народа. У знак дубоке захвалности за рад, владика Ефрем је Егору Скопенку поклонио две иконе Преображења Господњег (у част главног престолног празника храма) и Светих царских Страстотерпца (царске породице), чије је сећање посвећен руско-српски храм.\n\nОсим тога, Егор Скопенко је добио част да постане кум 11 крстова Спасо-Преображенског храма, који су направљени и транспортовани у Бања-Луку уз финансијску подршку Фонда.\n\n**Помоћ**\n\nСпасо-Преображенски руско-српски храм у Бања-Луку и Духовно-културни центар Бања-Лукске епархије Српске Православне Цркве подигнут је по пројекту припремљеном 2017.-2018. године од стране стручњака МАРХЕ на основу архитектонских решења Чудовог манастира у Москви. \n\nХрам је посвећен сећању на Светог цара Николаја II и његову породицу и има три придела: у име Преображења Господњег, царских страстотерпца и Св. Симеона и Саве српских, родоначалника династије Немањића.\n\nРадови на изградњи храма почели су 2018.године и завршени 2024. године. У овом тренутку се раде на унутрашњем уређењу храма.\n\nПочетком 2024.године Банја-Лукска епархија је добила 11 крстова за руско-српски храм, које је израдила грађевинско-реставрациона компанија Предслава. Радови на изради и транспорту крстова финансирани су од стране Фонда за подршку хришћанској култури и наслеђу.\n\nУочи прве архиерејске богослужења, 15.септембра 2025. године, одржано је осветљење купола и 11 крстова за Спасо-Преображенски руско-српски храм."},"tr":{"auto":"Başkalaşım Rus-Sırp Kilisesi'nin ilk piskoposlar ibadeti ve Kutsal Bakire'nin Doğuşu bayramı'nda 21 Eylül 2025'te Banja Luka'da (Sırp Cumhuriyeti, Bosna-Hersek) kutsama töreni düzenlendi.\n\nTapınağın ilahi ayinine ve kutsama törenine, Banja Luksk Piskoposu Ephraim, Banja Luksk piskoposluğunun papazı Marcansky Sava, Başkalaşım Kilisesi'nin rahipliği ve Sırp Ortodoks Kilisesi'nin din adamlarının diğer temsilcilerinin hizmetlerinde başkanlık etti.\n\nPiskoposların ibadetine ve kutsama törenine Sırbistan Cumhuriyeti Cumhurbaşkanı Milorad Dodik, Rusya Federasyonu'nun Bosna-Hersek Büyükelçisi Olağanüstü ve Tam Yetkili Igor Kalabukhov, Banja Luka Draško Stanivuković Belediye Başkanı, parlamento üyeleri, icra direktörü Yegor Skopenko başkanlığındaki Hıristiyan Kültürü ve Mirasını Destekleme Fonu'ndan bir delegasyon, Belgrad ve Banja Luka Željko Čejić'teki Hıristiyan Kültürü ve Mirasını Destekleme Fonu'nun ofisleri başkanı ve çok sayıda sadık katıldı.\n\nAyinin ardından, Sırp Cumhuriyeti Cumhurbaşkanı Milorad Dodik ve Banja Luksk Piskoposu Efrem ile bir kutlama yemeği düzenlendi ve bu sırada Vakfın icra direktörü Yegor Skopenko, Banja Luksk Piskoposluğuna Sırp Ortodoks Kilisesi'ne on ikon bağışladı.\n\nMilorad Dodik, Başkalaşım Tapınağı'nın inşasına kapsamlı destek sağladıkları için Rusya'ya ve Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'na teşekkür etti ve bu tapınağın Rus-Sırp dostluğunun sembolü olacağına olan güvenini dile getirdi.\n \nBuna karşılık Lord Efrem, Rus-Sırp tapınağının inşasına katkılarından ve iki Ortodoks halkı arasındaki sıcak dostane ilişkilerin güçlendirilmesine Yegor Skopenko'nun şahsındaki Vakfa özel teşekkürlerini dile getirdi. Efrayim, emekleri için derin bir minnettarlığın işareti olarak, Egor Skopenko'ya iki simge verdi - Rab'bin Başkalaşımları (tapınağın ana koruyucu bayramının şerefine) ve Rus-Sırp tapınağının anısına adandığı Kutsal Kraliyet Tutkularının (Kraliyet ailesi).\n\nAyrıca Yegor Skopenko'ya, Fonun mali desteğiyle Banya Luka'ya imal edilen ve taşınan Başkalaşım Kilisesi'nin 11 haçının kumru olma onuru verildi.\n\n**Bilgi**\n\nBanja Luka'daki Başkalaşım Rus-Sırp Kilisesi ve Sırp Ortodoks Kilisesi'nin Banja Lukskaya Piskoposluğunun Manevi ve Kültürel Merkezi, Moskova'daki Chudov Manastırı'nın mimari kararlarına dayanarak MARHA uzmanları tarafından 2017-2018'de hazırlanan bir projeye göre inşa edildi. \n\nAziz Çar Nicholas II ve ailesinin anısına adanmıştır ve üç yan şapeli vardır: Rab'bin Başkalaşımı, Kraliyet Tutkuları Taşıyıcıları ve Kutsal emirler adına. Nemanjić hanedanının ataları olan Sırplı Simeon ve Sava'nın\n\nTapınağın inşaat çalışmaları 2018 yılında başlamış ve 2024 yılında tamamlanmıştır. Şu anda tapınağın iç dekorasyonu üzerinde çalışmalar devam etmektedir.\n\n2024 yılının başında Banja Lukskaya Piskoposluğu, inşaat ve restorasyon şirketi «Predslava» tarafından yapılan Rus-Sırp tapınağı için 11 haç aldı. Haçların üretimi ve nakliyesi çalışmaları, Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı tarafından finanse edildi.\n\nPiskoposların ilk ibadetinin arifesinde, 15 Eylül 2025'te, Başkalaşım Rus-Sırp Kilisesi için kubbelerin ve 11 haçın kutsanması gerçekleşti."}}},"component":"content-flow"},{"images":[{"title":{},"width":4030,"chosen":false,"height":2267,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_4cfc3273-5e21-465f-b60e-47c3f6a84857","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_6140e244-773c-4a4c-968f-818725ad7ae8"},{"title":{},"width":1152,"chosen":false,"height":2048,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_1b369d23-07fc-45fa-8b72-848684c5952b","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_4c96a0fe-8d76-46f2-9fd8-37433c0c6233"},{"title":{},"width":5765,"chosen":false,"height":3243,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_31f88e22-93fa-419a-8364-bb2d5cfc8960","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_627d2cc4-3720-41c0-ad23-f7f4710187bc"},{"title":{},"width":5111,"chosen":false,"height":2875,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_99fd0aca-fdd4-4477-a1ce-c9ae46e5620f","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_4b1038bd-eba5-4e62-9370-6b84f7e349eb"},{"title":{},"width":3087,"chosen":false,"height":1736,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_53a922de-4c6b-45d9-89b3-d103a260cf2e","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26/image-name_7d279068-b78d-4271-afe7-b0a406830625"},{"title":{},"width":5538,"chosen":false,"height":3115,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/26 ワ総主教区の忠実な人たちの世話を担当する司祭Georgy Sergeyevが出席しました。"},"ru":{"auto":"Мероприятие прошло при участии ответственного за окормление верующих Московского Патриархата на территории Турецкой Республики священника Георгия Сергеева.","manual":"Мероприятие прошло при участии ответственного за окормление верующих Московского Патриархата на территории Турецкой Республики священника Георгия Сергеева."},"sr":{"auto":"Догађај је одржан уз учешће свештеника Георгија Сергејева, одговорног за храњење верника Московске Патријаршије на територији Турске Републике."},"tr":{"auto":"Etkinlik, Türkiye Cumhuriyeti topraklarındaki Moskova Patrikhanesi sadıklarının beslenmesinden sorumlu Rahip Georgy Sergeev'in katılımıyla gerçekleşti."}}},"picture":[{"alt":{"ae":{"auto":"بوزيستفينايا-ليتورجيا-سوفيرشينا-22-سينتيابريا"},"al":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"cn":{"auto":"bozhestvennaya-礼仪宫-sovershena-22-sentyabrya"},"el":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"en":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"fr":{"auto":"bozhestvennaya-liturgie-sovershena-22 ans-sentyabrya"},"ge":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"he":{"auto":"בוז ' סטוונייה-ליטורגיה-סוברשנה-22-סנטיאבריה"},"ja":{"auto":"ボジェストヴェンナヤ-リトルギヤ-ソヴェルシェナ-22-センティヤブリヤ"},"ru":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya","manual":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"sr":{"auto":"Божанска Литургија-савршена-22. септембра"},"tr":{"auto":"bozhestvennaya-ayin-sovershena-22-sentyabrya"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/23/image-name_f51937ab-73b2-4f49-b974-5a1ddb0f11a4","title":{"ae":{"auto":"بوزيستفينايا-ليتورجيا-سوفيرشينا-22-سينتيابريا"},"al":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"cn":{"auto":"bozhestvennaya-礼仪宫-sovershena-22-sentyabrya"},"el":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"en":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"fr":{"auto":"bozhestvennaya-liturgie-sovershena-22 ans-sentyabrya"},"ge":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"he":{"auto":"בוז ' סטוונייה-ליטורגיה-סוברשנה-22-סנטיאבריה"},"ja":{"auto":"ボジェストヴェンナヤ-リトルギヤ-ソヴェルシェナ-22-センティヤブリヤ"},"ru":{"auto":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya","manual":"bozhestvennaya-liturgiya-sovershena-22-sentyabrya"},"sr":{"auto":"Божанска Литургија-савршена-22. септембра"},"tr":{"auto":"bozhestvennaya-ayin-sovershena-22-sentyabrya"}},"breakpoint":"main"}],"published_at":"2025-09-23T13:49:35+00:00","updated_at":"2025-09-23T14:54:00.381655+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 22 سبتمبر ، يوم ذكرى الأجداد الصالحين يواكيم وآنا وإحياء ذكرى المجمع المسكوني الثالث (431) ، احتفل الكاهن جورجي سيرجيف ، المسؤول عن تنظيم رعاية المؤمنين من بطريركية موسكو في أراضي جمهورية تركيا ، بالقداس الإلهي في كنيسة والدة الإله الأقدس في أفسس ، حيث عقد المجلس.\n\nحضر الخدمة الحجاج الذين وصلوا من اسطنبول وإزمير وكوساداسي. تلقى معظمهم بالتواصل من أسرار المسيح المقدسة.\n\nفي نهاية الليتورجيا ، خاطب الأب جورج المؤمنين بخطاب شرح فيه معنى المجمع المسكوني الثالث.\n\nشكر الكاهن وزارة الثقافة والسياحة التركية على السماح بخدمات العبادة في كنيسة السيدة العذراء مريم الواقعة في مدينة أفسس المتحفية ، وكذلك رئيس جمعية سولجينتسين لدراسة اللغة والثقافة الروسية في إزمير ، أ. ف. بونوماريف ، لمساعدته في تنظيم حج المؤمنين."},"al":{"auto":"Më 22 shtator, dita e kujtimit të Paraardhësve të drejtë Joachim dhe Anna dhe përkujtimi i Këshillit Iii Ekumenik (431), Prifti Georgy Sergeyev, përgjegjës për organizimin e kujdesit të besimtarëve Të Patriarkanës Së Moskës në territorin E Republikës Së Turqisë, festoi Liturgjinë Hyjnore Në Kishën E Hyjlindëses më të Shenjtë Në Efes, ku U Mbajt Këshilli.\n\nNë këtë shërbim morën pjesë pelegrinë që mbërritën nga Stambolli, Izmiri dhe Kusadasi. Shumica e tyre morën kungimin E Mistereve të Shenjta të Krishtit.\n\nNë fund të Liturgjisë, At Gjergji iu drejtua besimtarëve me një fjalim në të cilin shpjegoi kuptimin e Këshillit Të Tretë Ekumenik.\n\nPrifti falënderoi Ministrinë turke të Kulturës dhe Turizmit për lejimin e shërbimeve të adhurimit në Kishën E Virgjëreshës Së Bekuar Mari që ndodhet në qytetin muze Të Efesit, si dhe kryetarin e Shoqatës Solzhenitsyn për Studimin e Gjuhës dhe Kulturës ruse Në Izmir, A. V. Ponomarev, për ndihmën e tij në organizimin e pelegrinazhit të besimtarëve."},"cn":{"auto":"9月22日，纪念正义祖先约阿希姆和安娜的日子以及纪念第三次大公会议（431），负责组织在土耳其共和国境内照顾莫斯科宗主教信徒的牧师Georgy Sergeyev在以弗所最神圣的Theotokos教堂庆祝神圣礼拜仪式，该教堂在以弗所举行。\n\n从伊斯坦布尔，伊兹密尔和库萨达斯抵达的朝圣者参加了这项服务。 他们中的大多数人接受了基督神圣奥秘的交流。\n\n在礼拜仪式结束时，乔治神父向信徒发表讲话，解释了第三次大公会议的意义。\n\n牧师感谢土耳其文化和旅游部允许在位于博物馆城市以弗所的圣母玛利亚教堂进行礼拜仪式，以及索尔仁尼琴俄罗斯语言和文化研究学会主席，A.V."},"el":{"auto":"Στις 22 Σεπτεμβρίου, Ημέρα της μνήμης των δίκαιων προγόνων Ιωακείμ και Άννας και της μνήμης της Γ Οικουμενικής Συνόδου (431), ο ιερέας Γκεόργκι Σεργκέγιεφ, υπεύθυνος για την οργάνωση της φροντίδας των πιστών του Πατριαρχείου Μόσχας στο έδαφος της Δημοκρατίας της Τουρκίας, γιόρτασε τη Θεία Λειτουργία στην Εκκλησία της Αγίας Θεοτόκου στην Έφεσο, όπου πραγματοποιήθηκε η Σύνοδος.\n\nΣτην υπηρεσία παρευρέθηκαν προσκυνητές που έφτασαν από την Κωνσταντινούπολη, τη Σμύρνη και το Κουσάντασι. Οι περισσότεροι από αυτούς έλαβαν κοινωνία των Αγίων Μυστηρίων του Χριστού.\n\nΣτο τέλος της λειτουργίας, Ο πατέρας Γεώργιος απευθύνθηκε στους πιστούς με μια ομιλία στην οποία εξήγησε την έννοια της Τρίτης Οικουμενικής Συνόδου.\n\nΟ ιερέας ευχαρίστησε το τουρκικό Υπουργείο Πολιτισμού και Τουρισμού που επέτρεψε υπηρεσίες λατρείας στην Εκκλησία της Παναγίας που βρίσκεται στην πόλη-μουσείο της Εφέσου, καθώς και τον πρόεδρο της εταιρείας Σολζενίτσιν για τη μελέτη της ρωσική γλώσσα και τον πολιτισμό στη Σμύρνη, Α.Β. Πονομάρεφ, για τη βοήθειά του στην οργάνωση του προσκυνήματος των πιστών."},"en":{"auto":"On September 22, the day of the memory of the righteous Forefathers Joachim and Anna and the commemoration of the III Ecumenical Council (431), Priest Georgy Sergeyev, responsible for organizing the care of the faithful of the Moscow Patriarchate in the territory of the Republic of Turkey, celebrated the Divine Liturgy at the Church of the Most Holy Theotokos in Ephesus, where the Council was held.\n\nThe service was attended by pilgrims who arrived from Istanbul, Izmir and Kusadasi. Most of them received communion of the Holy Mysteries of Christ.\n\nAt the end of the Liturgy, Father George addressed the faithful with a speech in which he explained the meaning of the Third Ecumenical Council.\n\nThe priest thanked the Turkish Ministry of Culture and Tourism for allowing worship services at the Church of the Blessed Virgin Mary located in the museum city of Ephesus, as well as the chairman of the Solzhenitsyn Society for the Study of Russian Language and Culture in Izmir, A.V. Ponomarev, for his help in organizing the pilgrimage of believers."},"fr":{"auto":"Le 22 septembre, le jour de la mémoire des justes, le Prêtre Joakim et Anna et les souvenirs du III Concile œcuménique (431), responsable de l'organisation de l'alimentation des fidèles du Patriarcat de Moscou sur le territoire de la République Turque, le prêtre Gueorgui Sergeev a célébré la divine liturgie dans l'église de la Sainte vierge à Éphèse,\n\nLe culte a été visité par des pèlerins venus d'Istanbul, Izmir et kusadas. La plupart d'entre eux ont pris part Aux saints mystères du Christ.\n\nÀ la fin de la Liturgie, le père Georges s'adressa aux croyants avec un mot dans lequel il expliqua la signification du III Concile œcuménique.\n\nLe clergé a remercié le ministère turc de la culture et du Tourisme pour l'autorisation d'accomplir le culte dans l'église de la Sainte vierge, située dans la ville-musée d'Éphèse, ainsi que le président de la société d'étude de la russe et de la culture A. I. Soljenitsyne à Izmir A. V. Ponomarev pour son aide dans l'organisation du pèlerinage des croyants."},"ge":{"auto":"22 სექტემბერს, დღეს მეხსიერება წინაპრებთან Joachim და ანა და ხსენების III მსოფლიო საბჭოს (431), მღვდელი გიორგი Sergeyev, პასუხისმგებელი ორგანიზება ზრუნვა ერთგული მოსკოვის საპატრიარქოს ტერიტორიაზე თურქეთის რესპუბლიკის, განთქმული საღმრთო ლიტურგიის დროს ეკლესიაში ყველაზე წმინდა Theotokos წელს ეფესოში, სადაც საბჭოს სხდომა გაიმართა.\n\nმომსახურების ესწრებოდნენ მომლოცველთა რომელიც ჩამოვიდა სტამბულიდან, იზმირიდან და ეგვიპტე. ყველაზე მეტად მათ მიიღეს ზიარების წმინდა საიდუმლო ქრისტეს.\n\nბოლოს წირვა, მამა გიორგი მიმართა ერთგული გამოსვლისას, სადაც მან განმარტა, რას ნიშნავს მესამე მსოფლიო საბჭო.\n\nმღვდელი მადლობა გადაუხადა თურქეთის კულტურისა და ტურიზმის სამინისტროს, რომელიც საშუალებას წირვის დროს ეკლესია ყოვლადწმიდა ღვთისმშობლის მდებარეობს მუზეუმი ქალაქ ეფესოში, ისევე, როგორც თავმჯდომარის, სოლჟენიცინის საზოგადოება შესწავლა რუსული ენის და კულტურის იზმირი, a. v. Ponomarev, მისი დახმარება ორგანიზება მომლოცველები მორწმუნე."},"he":{"auto":"ב-22 בספטמבר, יום הזיכרון של אלוהים צדיקים יואקים ואנה וזיכרונות המועצה האקומנית השלישית (431), האחראי על ארגון האכלה של המאמינים של הפטריארכיה של מוסקבה בשטח הרפובליקה הטורקית, הכומר ג ' ורג ' י סרגייב ביצע את הליטורגיה האלוהית במקדש הבתולה הקדושה באפסוס, שם התקיימה המועצה.\n\nהפולחן ביקר עולי רגל שהגיעו מאיסטנבול, איזמיר וקוסאדאס. רובם השתתפו במסתורי המשיח הקדושים.\n\nלאחר סיום הליטורגיה, האב ג ' ורג ' י פנה למאמינים עם מילה שבה הסביר את משמעות המועצה האוניברסלית השלישית.\n\nאיש הדת הודה למשרד התרבות והתיירות של טורקיה על אישור הפולחן במקדש של הבתולה הקדושה, הממוקם בעיר המוזיאון של אפסוס, כמו גם יו \"ר החברה לחקר השפה והתרבות הרוסית על שם א.א. סולז' ניצין באיזמיר א. ו. פונומרב על עזרתו בארגון העלייה לרגל של המאמינים."},"ja":{"auto":"9月22日、正義の先祖ヨアヒムとアンナの記憶の日とIIIエキュメニカル評議会(431)の記念日、トルコ共和国の領土でモスクワ総主教区の忠実なの世話を組織する責任がある司祭Georgy Sergeyevは、評議会が開催されたエフェソスの最も神聖なTheotokosの教会で神の典礼を祝いました。\n\nこのサービスには、イスタンブール、イズミル、クシャダスから到着した巡礼者が出席しました。 彼らのほとんどは、キリストの聖なる謎の聖体拝領を受けました。\n\n典礼の終わりに、ジョージ神父は彼が第3エキュメニカル評議会の意味を説明したスピーチで忠実な人たちに演説しました。\n\n司祭は、エフェソスの博物館市にある祝福された聖母マリアの教会で礼拝を許可したトルコ文化観光省と、イズミルのロシア語と文化の研究のためのソルジェニツィン協会の会長、A.V.ポノマレフに感謝し、信者の巡礼を組織する上での彼の助けに感謝しました。"},"ru":{"auto":"22 сентября, в день памяти праведных Богоотец Иоакима и Анны и воспоминания III Вселенского Собора (431), ответственный за организацию окормления верующих Московского Патриархата на территории Турецкой Республики священник Георгий Сергеев совершил Божественную литургию в храме Пресвятой Богородицы в Эфесе, где проходил Собор.\n\nБогослужение посетили паломники, прибывшие из Стамбула, Измира и Кушадас. Большинство из них причастились Святых Христовых Таин.\n\nПо окончании Литургии отец Георгий обратился к верующим со словом, в котором разъяснил значение III Вселенского собора.\n\nСвященнослужитель поблагодарил Министерство культуры и туризма Турции за разрешение на совершение богослужения в храме Пресвятой Богородицы, расположенном в городе-музее Эфес, а также председателя Общества изучения русского языка и культуры имени А.И. Солженицына в Измире А.В. Пономарева за помощь в организации паломничества верующих.","manual":"22 сентября, в день памяти праведных Богоотец Иоакима и Анны и воспоминания III Вселенского Собора (431), ответственный за организацию окормления верующих Московского Патриархата на территории Турецкой Республики священник Георгий Сергеев совершил Божественную литургию в храме Пресвятой Богородицы в Эфесе, где проходил Собор.\n\nБогослужение посетили паломники, прибывшие из Стамбула, Измира и Кушадас. Большинство из них причастились Святых Христовых Таин.\n\nПо окончании Литургии отец Георгий обратился к верующим со словом, в котором разъяснил значение III Вселенского собора.\n\nСвященнослужитель поблагодарил Министерство культуры и туризма Турции за разрешение на совершение богослужения в храме Пресвятой Богородицы, расположенном в городе-музее Эфес, а также председателя Общества изучения русского языка и культуры имени А.И. Солженицына в Измире А.В. Пономарева за помощь в организации паломничества верующих."},"sr":{"auto":"22. септембра, на Дан сећања на праведнике, Богоотец Јоакима и Анне и сећања III световног Сабора (431), свештеник Георгиј Сергеев, одговоран за организацију храњења верника Московског патријархата на територији Турске Републике, извршио је Божанску Литургију у храму Пресвете Богородице у Ефесу, где је одржан Сабор.\n\nБогослужење су посетили ходочасници који су дошли из Истанбула, Измира и Кушадаса. Већина њих је била причешћена Светим Христовим Тајнама.\n\nНакон Литургије, отац Георгије се обратио верницима са речју у којој је објаснио значење III световног Сабора.\n\nСвештеник је захвалио Министарству културе и туризма Турске за дозволу за богослужење у храму Пресвете Богородице, који се налази у граду-музеју Ефес, као и председнику Друштва за проучавање руског језика и културе имени А.и. Солженицына у Измиру А. В. Пономарева за помоћ у организацији ходочашћа верника."},"tr":{"auto":"22 Eylül'de, dürüstlerin anısına, Joachim ve Anna'nın Tanrısallığı ve Türkiye Cumhuriyeti topraklarında Moskova Patrikhanesi sadıklarının beslenmesini organize etmekten sorumlu III Ekümenik Konseyin Anıları (431), Rahip Georgy Sergeev, Konseyin düzenlendiği Efes'teki Meryem Ana Kilisesi'nde İlahi Ayini kutladı.\n\nİbadete İstanbul, İzmir ve Kuşadası'ndan gelen hacılar katıldı. Çoğu, Mesih'in Kutsal Gizemlerini kutsadı.\n\nAyinin sonunda Peder George, III Ekümenik Konseyin anlamını açıkladığı bir sözle inananlara seslendi.\n\nDin adamı, Türkiye Kültür ve Turizm Bakanlığı'na Efes Şehir-Müzesinde bulunan Meryem Ana Kilisesi'nde ibadet izni verdiği için ve İzmir'deki A.I. Solzhenitsyn Rus Dili ve Kültürü Çalışmaları Derneği Başkanı AV Ponomarev'e inananların hac ziyaretinin düzenlenmesine yardım ettiği için teşekkür etti."}}},"component":"content-flow"},{"images":[{"title":{},"width":911,"chosen":false,"height":512,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/23/image-name_432720af-8f30-47db-8c1f-5df449efe69c","selected":false,"thu Валаамский монастырь"},"sr":{"auto":"Студенти МДА посетили манастир Валаам"},"tr":{"auto":"MDA öğrencileri Valaam Manastırı'nı ziyaret etti"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_ecc78a1a-dffb-442b-b897-ab015bdce23c","title":{"ae":{"auto":"طلبة دكتوراه في الطب يزورون دير بلعام"},"al":{"auto":"STUDENTËT E MD vizituan Manastirin Valaam"},"cn":{"auto":"医学博士学生参观瓦拉姆修道院"},"el":{"auto":"Οι μαθητές του MD επισκέφθηκαν το Μοναστήρι του Βαλαάμ"},"en":{"auto":"MD students visited Valaam Monastery"},"fr":{"auto":"Les étudiants de MDA ont visité le monastère de Valaam"},"ge":{"auto":"MD სტუდენტები ეწვივნენ ვალაამის მონასტერს"},"he":{"auto":"תלמידי מד \" א ביקרו במנזר בלעם"},"ja":{"auto":"MDの学生はヴァラーム修道院を訪問しました"},"ru":{"auto":"Студенты МДА посетили Валаамский монастырь","manual":"Студенты МДА посетили Валаамский монастырь"},"sr":{"auto":"Студенти МДА посетили манастир Валаам"},"tr":{"auto":"MDA öğrencileri Valaam Manastırı'nı ziyaret etti"}},"breakpoint":"main"}],"published_at":"2025-09-11T08:30:33+00:00","updated_at":"2025-09-11T10:34:58.9798+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"قام الطلاب الدوليون في أكاديمية موسكو اللاهوتية بزيارة دير فالعام. ورافق ستة طلاب من الفلبين وموريشيوس والغابون وكينيا وأيرلندا رئيس القسم الدولي للأكاديمية ، س. أ. فينوغرادوف.\n\nبدأت رحلة الحج من قبل الإدارة الدولية للأكاديمية بمساعدة مؤسسة دعم الثقافة والتراث المسيحي ، التي نظمها مركز الحج في بطريركية موسكو.\n\nخلال الرحلة ، زار الحجاج الحوزة المركزية لدير فالعام ، فضلا عن العديد من النساك ، بما في ذلك الدير باسم القديس ألكسندر سفيرسكي في جزيرة القديس بطرس ، وصلى في الخدمات الرهبانية والتقى مع إخوة الدير. \n\nتركت الرحلة انطباعات لا تنسى لجميع المشاركين فيها.\n\nيود المشاركون في الحج أن يشكروا إيجور سكوبينكو ، المدير التنفيذي لمؤسسة دعم الثقافة والتراث المسيحي ، وموظفي المؤسسة على فرصة القيام بهذه الرحلة ، وكذلك هيروديكون سرجيوس (توركيف) ، المدير العام لمركز الحج بطريركية موسكو ، يا.جالتشينكو ، نائب المدير العام ، وموظفي مركز تنظيم الحج."},"al":{"auto":"Studentët ndërkombëtarë të Akademisë Teologjike të Moskës (MDA) vizituan Manastirin Valaam. Gjashtë studentë nga Filipinet, Mauritius, Gabon, Kenia dhe Irlanda u shoqëruan nga kreu i Departamentit Ndërkombëtar të Akademisë, S. A. Vinogradov.\n\nUdhëtimi i pelegrinazhit u iniciua nga Departamenti Ndërkombëtar i Akademisë me ndihmën e Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, të organizuar nga Qendra E Pelegrinazhit të Patriarkanës së Moskës.\n\nGjatë udhëtimit, pelegrinët vizituan pasurinë qendrore të Manastirit Valaam, si dhe hermitages e saj të shumta, duke përfshirë manastirin në emër të Shën Aleksandrit Svirsky në Ishullin E Shën Pjetrit, u lutën në shërbimet monastike dhe u takuan me vëllezërit e manastirit. \n\nUdhëtimi la përshtypje të paharrueshme për të gjithë pjesëmarrësit e tij.\n\nPjesëmarrësit e pelegrinazhit dëshirojnë të falënderojnë Egor Skopenko, Drejtor Ekzekutiv i Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, dhe stafin e Fondacionit për mundësinë për të bërë një udhëtim të tillë, si Dhe Hierodeacon Sergius (Turkeev), Drejtor I Përgjithshëm I Qendrës Së Pelegrinazhit Të Patriarkanës Së Moskës, Ya.V. Galchenko, Zëvendës Drejtor I përgjithshëm dhe stafi i qendrës për organizimin e pelegrinazhit."},"cn":{"auto":"莫斯科神学院（MDA）的国际学生参观了瓦拉姆修道院。 来自菲律宾、毛里求斯、加蓬、肯尼亚和爱尔兰的六名学生由学院国际系主任S.A.Vinogradov陪同。\n\n朝圣之旅是由学院国际部在支持基督教文化和遗产基金会的帮助下发起的，由莫斯科宗主教朝圣中心组织。\n\n在旅途中，朝圣者参观了Valaam修道院的中央庄园，以及众多的隐士，包括圣彼得岛上以St.Alexander Svirsky名义的修道院，在修道院服务中祈祷并会见了修道院的弟兄们。 \n\n这次旅行给所有参与者留下了难忘的印象。\n\n朝圣的参与者要感谢支持基督教文化和遗产基金会执行主任Egor Skopenko，以及基金会工作人员有机会进行这样的旅行，以及莫斯科宗主教朝圣中心总干事Hierodeacon Sergiy（V.Galchenko，副总干事和组织朝圣中心的工作人员。"},"el":{"auto":"Διεθνείς φοιτητές της Θεολογικής Ακαδημίας της Μόσχας (MDA) επισκέφθηκαν τη Μονή Βαλαάμ. Έξι φοιτητές από τις Φιλιππίνες, τον Μαυρίκιο, τη Γκαμπόν, την Κένυα και την Ιρλανδία συνοδεύονταν από τον επικεφαλής του Διεθνούς Τμήματος της Ακαδημίας, s.a. Vinogradov.\n\nΤο προσκυνηματικό ταξίδι ξεκίνησε από το Διεθνές Τμήμα της Ακαδημίας με τη βοήθεια του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, που διοργανώθηκε από το κέντρο προσκυνήματος του Πατριαρχείου Μόσχας.\n\nΚατά τη διάρκεια του ταξιδιού, Οι προσκυνητές επισκέφτηκαν το κεντρικό κτήμα της Μονής Βαλαάμ, καθώς και τα πολυάριθμα ερημητήρια του, συμπεριλαμβανομένου του μοναστηριού του Αγίου Αλεξάνδρου Σβίρσκι στο νησί του Αγίου Πέτρου, προσευχήθηκαν σε μοναστικές υπηρεσίες και συναντήθηκαν με τους αδελφούς του μοναστηριού. \n\nΤο ταξίδι άφησε αξέχαστες εντυπώσεις για όλους τους συμμετέχοντες.\n\nΟι συμμετέχοντες στο προσκύνημα θα ήθελαν να ευχαριστήσουν τον Egor Skopenko, Εκτελεστικό Διευθυντή του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς, και το προσωπικό του Ιδρύματος για την ευκαιρία να πραγματοποιήσουν ένα τέτοιο ταξίδι, καθώς και τον ιεροδιάκονο Sergius (Turkeev), Γενικό Διευθυντή του Κέντρου προσκυνήματος του Πατριαρχείου Μόσχας, Ya.v. Galchenko, Αναπληρωτής Γενικός Διευθυντής, και το προσωπικό του κέντρου οργάνωσης του προσκυνήματος."},"en":{"auto":"International students of the Moscow Theological Academy (MDA) visited the Valaam Monastery. Six students from the Philippines, Mauritius, Gabon, Kenya and Ireland were accompanied by the head of the International Department of the Academy, S.A. Vinogradov.\n\nThe pilgrimage trip was initiated by the International Department of the Academy with the help of the Foundation for the Support of Christian Culture and Heritage, organized by the Pilgrimage Center of the Moscow Patriarchate.\n\nDuring the trip, the pilgrims visited the central estate of the Valaam Monastery, as well as its numerous hermitages, including the monastery in the name of St. Alexander Svirsky on St. Peter's Island, prayed at monastic services and met with the brethren of the monastery. \n\nThe trip left unforgettable impressions for all its participants.\n\nThe participants of the pilgrimage would like to thank Egor Skopenko, Executive Director of the Foundation for the Support of Christian Culture and Heritage, and the staff of the Foundation for the opportunity to make such a trip, as well as Hierodeacon Sergiy (Turkeev), General Director of the Moscow Patriarchate Pilgrimage Center, Ya.V. Galchenko, Deputy General Director, and the staff of the center for organizing the pilgrimage."},"fr":{"auto":"Les étudiants étrangers de l'Académie spirituelle de Moscou (MDA) ont visité le monastère de Valaam. Six étudiants des Philippines, de Maurice, du Gabon, du Kenya et d'Irlande étaient accompagnés par le chef de la division Internationale de l'Académie, S. A. Vinogradov.\n\nLe voyage de pèlerinage a eu lieu à l'initiative du département International de l'Académie avec l'aide du Fonds de soutien à la culture chrétienne et au patrimoine, le centre de Pèlerinage du Patriarcat de Moscou a organisé le voyage.\n\nAu cours du voyage, les pèlerins ont visité le domaine central du monastère de Valaam, ainsi que ses nombreux ermitages, y compris l'Ermitage au nom du révérend Alexandre Svirsky sur l'île Sainte, ont prié pour les Offices du monastère et ont rencontré la fraternité du monastère. \n\nLe voyage a laissé à tous ses participants une expérience inoubliable.\n\nLes participants au pèlerinage remercient Egor skopenko, directeur exécutif du Fonds de soutien à la culture chrétienne et au patrimoine, et le personnel de la Fondation pour la possibilité d'un tel voyage, ainsi que le directeur général du centre de Pèlerinage du Patriarcat de Moscou, l'hiérodiacre Serge (Turkeyev), le directeur général adjoint I. V. galchenko et le personnel du centre pour l'organisation du pèlerinage."},"ge":{"auto":"ვალაამის მონასტერს მოსკოვის სასულიერო აკადემიის (MDA) საერთაშორისო სტუდენტები ეწვივნენ. ექვსი სტუდენტი ფილიპინებიდან, მაურიციუსიდან, გაბონიდან, კენიიდან და ირლანდიიდან თან ახლდა აკადემიის საერთაშორისო დეპარტამენტის ხელმძღვანელს, ს.ა. ვინოგრადოვს.\n\nმომლოცველთა მოგზაურობა აკადემიის საერთაშორისო დეპარტამენტის ინიციატივით, მოსკოვის საპატრიარქოს მომლოცველთა ცენტრის ორგანიზებით, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის დახმარებით განხორციელდა.\n\nმოგზაურობის დროს მომლოცველები ეწვივნენ ვალაამის მონასტრის ცენტრალურ მამულს, ასევე მის მრავალრიცხოვან მოღვაწეებს, მათ შორის წმინდა ალექსანდრე სვირსკის სახელობის მონასტერს წმინდა პეტრეს კუნძულზე, ლოცულობდნენ სამონასტრო მსახურებებზე და შეხვდნენ მონასტრის ძმებს. \n\nმოგზაურობამ დაუვიწყარი შთაბეჭდილებები დატოვა მისი ყველა მონაწილისთვის.\n\nმომლოცველთა მონაწილეებს მინდა მადლობა გადავუხადო ეგორ სკოპენკოს, ფონდის აღმასრულებელ დირექტორს ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერისთვის და ფონდის თანამშრომლებს ასეთი მოგზაურობის შესაძლებლობისთვის, ასევე იეროდიაკონ სერგის (თურქეევი), მოსკოვის საპატრიარქოს მომლოცველთა ცენტრის გენერალური დირექტორი, ია.ვ.გალჩენკო, გენერალური დირექტორის მოადგილე და მომლოცველთა ორგანიზების ცენტრის თანამშრომლები."},"he":{"auto":"סטודנטים זרים של האקדמיה הרוחנית של מוסקבה (MDA) ביקרו במנזר וולאם. שישה סטודנטים מהפיליפינים, מאוריציוס, גבון, קניה ואירלנד ליוו את ראש המחלקה הבינלאומית של האקדמיה, ס.א. וינוגרדוב.\n\nמסע הצליינים התקיים ביוזמת המחלקה הבינלאומית של האקדמיה בעזרת קרן תמיכה בתרבות הנוצרית והמורשת, ארגון הטיול עוסק במרכז הצליינים של הפטריארכאט של מוסקבה.\n\nבמהלך הנסיעה, עולי הרגל ביקרו באחוזה המרכזית של מנזר וולאאם, כמו גם סקיטים רבים שלו, כולל סקיט בשם הקדוש אלכסנדר סווירסקי באי הקדוש, התפללו עבור שירותי המנזר ונפגשו עם האחים של המנזר. \n\nהטיול הותיר את כל משתתפיו בחוויות בלתי נשכחות.\n\nמשתתפי העלייה לרגל מודים למנכ \"ל הקרן לתמיכה בתרבות ומורשת נוצרית יגור סקופנקו ולעובדי הקרן על האפשרות לבצע טיול כזה, כמו גם למנכ\" ל מרכז העלייה לרגל של הפטריארכיה במוסקבה הירודיאקון סרג 'י (טורקייב), סגן המנכ\" ל י.ו. גלצ ' נקו ועובדי המרכז על ארגון העלייה לרגל."},"ja":{"auto":"モスクワ神学アカデミー（MDA）の留学生がヴァラーム修道院を訪れました。 フィリピン、モーリシャス、ガボン、ケニア、アイルランドからの6人の学生には、アカデミーの国際部門の長であるS.A.Vinogradovが同行しました。\n\n巡礼旅行は、モスクワ総主教区の巡礼センターが主催するキリスト教文化と遺産の支援のための財団の助けを借りて、アカデミーの国際部門によって開始されました。\n\n旅行中、巡礼者はヴァラーム修道院の中央地所と、聖ペテロ島の聖アレクサンドル・スヴィルスキーの名の修道院を含む数多くの隠者を訪れ、修道院の礼拝で祈り、修道院の兄弟たちと会いました。 \n\nこの旅行は、すべての参加者に忘れられない印象を残しました。\n\n巡礼の参加者は、キリスト教文化と遺産の支援のための財団のエグゼクティブディレクターであるEgor Skopenkoと、そのような旅行をする機会のための財団のスタッフ、そしてモスクワ総主教巡礼センター、Yaの総監督であるHierodeacon Sergius(Turkeev)に感謝したいと思います。V.Galchenko、次長、および巡礼を整理するためのセンターのスタッフ。"},"ru":{"auto":"Иностранные студенты Московской духовной академии (МДА) посетили Валаамский монастырь. Шесть студентов из Филиппин, Маврикия, Габона, Кении и Ирландии сопровождал руководитель Международного отдела Академии С.А. Виноградов.\n\nПаломническая поездка состоялась по инициативе Международного отдела Академии при помощи Фонда поддержки христианской культуры и наследия, организацией поездки занимался Паломнический центр Московского Патриархата.\n\nВ ходе поездки паломники посетили центральную усадьбу Валаамского монастыря, а также его многочисленные скиты, включая скит во имя преподобного Александра Свирского на острове Святом, молились за монастырскими богослужениями и встречались с братией обители. \n\nПоездка оставила у всех ее участников незабываемые впечатления.\n\nУчастники паломничества благодарят исполнительного директора Фонда поддержки христианской культуры и наследия Егора Скопенко и сотрудников Фонда за возможность осуществления такой поездки, а также генерального директора Паломнического центра Московского Патриархата иеродиакона Сергия (Туркеева), заместителя генерального директора Я.В. Гальченко и сотрудников центра за организацию паломничества.","manual":"Иностранные студенты Московской духовной академии (МДА) посетили Валаамский монастырь. Шесть студентов из Филиппин, Маврикия, Габона, Кении и Ирландии сопровождал руководитель Международного отдела Академии С.А. Виноградов.\n\nПаломническая поездка состоялась по инициативе Международного отдела Академии при помощи Фонда поддержки христианской культуры и наследия, организацией поездки занимался Паломнический центр Московского Патриархата.\n\nВ ходе поездки паломники посетили центральную усадьбу Валаамского монастыря, а также его многочисленные скиты, включая скит во имя преподобного Александра Свирского на острове Святом, молились за монастырскими богослужениями и встречались с братией обители. \n\nПоездка оставила у всех ее участников незабываемые впечатления.\n\nУчастники паломничества благодарят исполнительного директора Фонда поддержки христианской культуры и наследия Егора Скопенко и сотрудников Фонда за возможность осуществления такой поездки, а также генерального директора Паломнического центра Московского Патриархата иеродиакона Сергия (Туркеева), заместителя генерального директора Я.В. Гальченко и сотрудников центра за организацию паломничества."},"sr":{"auto":"Страни студенти Московске духовне академије (МДА) посетили су Валаамски манастир. Шест студената из Филипина, Маврикија, Габона, Кеније и Ирске пратио је руководилац Међународног одељења Академије С.А. Виноградов.\n\nПаломничко путовање је одржано по иницијативи Међународног одељења Академије уз помоћ Фонда за подршку хришћанске културе и наслеђа, организацијом путовања се бавио Паломнички центар Московског патријархата.\n\nТоком путовања, ходочасници су посетили централну усадницу Валаамског манастира, као и његове бројне Ските, укључујући скит у име преподобног Александра Свирског на острву светом, молили су се за манастирске богослужења и срели се са браћом обитеља. \n\nПутовање је оставило незаборавно искуство за све њене учеснике.\n\nУчесници ходочашћа захваљују извршном директору Фонда за подршку хришћанској култури и наслеђу Егору Скопенку и запосленима Фонда за могућност таквог путовања, као и генералном директору ходочасничког центра Московске Патријаршије иеродијакону Сергију (Туркејеву), заменику генералног директора Ј.В. Галченку и запосленима центра за организацију ходочашћа."},"tr":{"auto":"Moskova İlahiyat Akademisi'nin (MDA) yabancı öğrencileri Valaamsky Manastırı'nı ziyaret etti. Filipinler, Mauritius, Gabon, Kenya ve İrlanda'dan altı öğrenciye Akademinin Uluslararası bölüm başkanı S.A. Vinogradov eşlik etti.\n\nHac gezisi, Akademinin Uluslararası Bölümünün girişimiyle, Hıristiyan Kültürünü ve Mirasını Destekleme Fonu'nun yardımıyla gerçekleşti ve Moskova Patrikhanesi Hac Merkezi geziyi organize etti.\n\nYolculuk sırasında hacılar, Valaam Manastırı'nın merkezi malikanesinin yanı sıra Aziz Adası'ndaki Svirsky Rahip Alexander adına bir inziva yeri de dahil olmak üzere birçok inzivasını ziyaret ettiler, manastır ibadetleri için dua ettiler ve manastırın kardeşliği ile buluştular. \n\nYolculuk, tüm katılımcılarına unutulmaz bir deneyim yaşattı.\n\nHac ziyaretine katılanlar, Hıristiyan Kültürü ve Mirasını Destekleme Vakfı İcra Direktörü Yegor Skopenko'ya ve Vakıf çalışanlarına böyle bir gezi yapma imkanı için, ayrıca Moskova Patrikhanesi Hierodeacon Sergiy (Turkeyev) Hac Merkezi Genel Müdürü, genel müdür Yardımcısı Ya.v. Galchenko ve merkez personeline hac ziyaretini organize ettikleri için teşekkür ediyorlar."}}},"component":"content-flow"},{"images":[{"title":{},"width":1255,"chosen":false,"height":706,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_77ef4f24-27b0-4037-87a8-8e5524998cc0","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_54b4b878-07d0-40f0-81bc-cc8e748c095b"},{"title":{},"width":1138,"chosen":false,"height":640,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_6c04c3ee-f50f-4512-9fb0-1f958b97e64f","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_c70b577c-c842-41c9-a18c-80b3d75f35df"},{"title":{},"width":1138,"chosen":false,"height":640,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/11/image-name_655c031c-665d-4927-9046-920dec8a9745","selected":false,"thumbnail":"https://storage.y
