стном ходе","manual":"Иностранные студенты НУПДС приняли участие в крестном ходе"},"sr":{"auto":"Међународни студенти НУПДС-а учествовали су у крстовом току"},"tr":{"auto":"NUPDS'DEKİ uluslararası öğrenciler haç kursuna katıldı"}},"breakpoint":"main"}],"published_at":"2025-09-08T09:04:04+00:00","updated_at":"2025-09-10T09:51:56.929996+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"في 7 سبتمبر 2025 ، شارك طلاب ومعلمو مدرسة نيكولو أوغريش اللاهوتية ، في عيد كاتدرائية قديسي موسكو ، في موكب على مستوى موسكو. وكان من بين الإكليريكيين 13 طالبا أجنبيا من 7 دول أفريقية.\n\nقاد مجموعة الإكليريكيين القائم بأعمال رئيس الجامعة ، هيرومونك لوك (برونسكي). من بين المعلمين ، ضم الموكب ، بقيادة قداسة البطريرك كيريل من موسكو وعموم روسيا ، نائب رئيس الجامعة للبحوث ، الكاهن فلاديمير أليوشكوف ، رئيس قسم التعليم الإضافي ، الكاهن سيرجي شيلوف ، سكرتير المجلس الأكاديمي ، الكاهن يفغيني يريجين ، الكاهن فاديم فانكوف ، نائب رئيس الجامعة بالوكالة للعمل التربوي ، الشماس أوليغ بتوشكين.\n\nعلى طول الطريق ، غنى الطلاب تراتيل وترانيم المديح."},"al":{"auto":"Më 7 shtator 2025, studentët dhe mësuesit e Seminarit Teologjik Nikolo-Ugresh, në festën e Katedrales së Shenjtorëve të Moskës, morën pjesë në një procesion Në Të gjithë Moskën. Ndër seminaristët ishin 13 studentë të huaj nga 7 vende Afrikane.\n\nGrupi i seminaristëve u drejtua nga ushtruesi i detyrës së rektorit, Hieromonk Luka (Pronsky). Ndër mësuesit, procesioni, i udhëhequr nga Shenjtëria E tij Patriarku Kirill i Moskës dhe I Gjithë Rusisë, përfshinte Zëvendës-Rektorin Në Detyrë për Kërkime, Priftin Vladimir Alyoshkov, Kreun e Departamentit të Arsimit Shtesë, Priftin Sergiy Shilov, Sekretarin E Këshillit Akademik, Priftin Evgeny Yerygin, Priftin Vadim Vankov, zëvendës-rektorin Në Detyrë Për Punë Arsimore, Dhjakun Oleg Ptushkin.\n\nGjatë rrugës, studentët kënduan himne dhe himne lavdërimi."},"cn":{"auto":"2025年9月7日，Nikolo-Ugresh神学院的学生和教师在莫斯科圣徒大教堂的盛宴上参加了莫斯科范围内的游行。 其中有来自7个非洲国家的13名外国学生。\n\n神学院的小组由代理校长Hieromonk Luke（Pronsky）领导。 在教师中，由莫斯科和全俄罗斯的主教基里尔领导的游行队伍包括代理研究副校长Vladimir Alyoshkov牧师，附加教育系主任，Sergiy Shilov牧师，学术委员会秘书，Evgeny Yerygin牧师，Vadim Vankov牧师，代教育工作副校长，执事Oleg Ptushkin。\n\n一路上，学生们唱着赞美诗和赞美诗。"},"el":{"auto":"Στις 7 Σεπτεμβρίου 2025, μαθητές και δάσκαλοι του θεολογικού σεμιναρίου Νικολό-Ουγκρές, στη γιορτή του καθεδρικού ναού των Αγίων της Μόσχας, συμμετείχαν σε πομπή σε όλη τη Μόσχα. Μεταξύ των σεμιναρίων ήταν 13 ξένοι φοιτητές από 7 αφρικανικές χώρες.\n\nΗ ομάδα των σεμιναρίων ήταν υπό την ηγεσία του ενεργού πρύτανη, Ιερομόναχου Λουκά (Pronsky). Μεταξύ των δασκάλων, η πομπή, με επικεφαλής τον Αγιότατο Πατριάρχη Μόσχας και Πασών των Ρωσιών Κύριλλο, περιελάμβανε τον αναπληρωτή αντιπρύτανη Έρευνας, τον ιερέα Βλαντιμίρ Αλιόσκοφ, επικεφαλής του Τμήματος πρόσθετης εκπαίδευσης, τον ιερέα Σεργκί Σίλοφ, Γραμματέα του Ακαδημαϊκού Συμβουλίου, τον ιερέα Ευγένιο Γερίγκιν, τον ιερέα Βαντίμ Βάνκοφ, αναπληρωτή αντιπρύτανη εκπαιδευτικού έργου, Διάκονο Όλεγκ Πτουσκίν.\n\nΣτην πορεία, οι μαθητές τραγούδησαν ύμνους και ύμνους επαίνους."},"en":{"auto":"On September 7, 2025, students and teachers of the Nikolo-Ugresh Theological Seminary, on the feast of the Cathedral of Moscow Saints, took part in a Moscow-wide procession. Among the seminarians were 13 foreign students from 7 African countries.\n\nThe group of seminarians was led by the acting rector, Hieromonk Luke (Pronsky). Among the teachers, the procession, led by His Holiness Patriarch Kirill of Moscow and All Russia, included Acting Vice-Rector for Research, Priest Vladimir Alyoshkov, Head of the Department of Additional Education, Priest Sergiy Shilov, Secretary of the Academic Council, Priest Evgeny Yerygin, Priest Vadim Vankov, Acting Vice-rector for Educational Work, Deacon Oleg Ptushkin.\n\nAlong the way, the students sang hymns and hymns of praise."},"fr":{"auto":"Le 7 septembre 2025, à l'occasion de la fête de la Cathédrale des saints de Moscou, les étudiants et les enseignants du séminaire théologique Nikolo-Ugresh ont participé à la procession générale de Moscou. Parmi les séminaristes se trouvaient 13 étudiants étrangers de 7 pays africains.\n\nLe groupe de séminaristes était dirigé par le recteur par intérim Jérôme Luca (Pronsky). Parmi les enseignants, le vice-recteur par intérim pour les activités scientifiques, Jeremiah Vladimir aleshkov, le chef du Département de l'éducation supplémentaire, Jeremiah Sergey Shilov, le secrétaire du conseil Scientifique, Jeremiah Evgeny erygin, Jeremiah Vadim vankov, le vice-recteur par intérim pour le travail éducatif, le diacre Oleg Ptushkin.\n\nEn chemin, les élèves chantaient des hymnes et des louanges."},"ge":{"auto":"2025 წლის 7 სექტემბერს ნიკოლო-უგრეშის სასულიერო სემინარიის სტუდენტებმა და მასწავლებლებმა, მოსკოვის წმინდანთა საკათედრო ტაძრის დღესასწაულზე, მონაწილეობა მიიღეს მოსკოვის მასშტაბით მსვლელობაში. სემინარისტებს შორის იყო 13 უცხოელი სტუდენტი 7 აფრიკული ქვეყნიდან.\n\nსემინარისტთა ჯგუფს ხელმძღვანელობდა რექტორის მოვალეობის შემსრულებელი, იერომონქ ლუკა (პრონსკი). მასწავლებლებს შორის, მსვლელობაში, რომელსაც ხელმძღვანელობდა მოსკოვისა და სრულიად რუსეთის უწმინდესი პატრიარქი კირილი, შედიოდა კვლევის ვიცე-რექტორის მოვალეობის შემსრულებელი, მღვდელი ვლადიმერ ალიოშკოვი, დამატებითი განათლების დეპარტამენტის ხელმძღვანელი, მღვდელი სერგი შილოვი, აკადემიური საბჭოს მდივანი, მღვდელი ევგენი იერიგინი, მღვდელი ვადიმ ვანკოვი, საგანმანათლებლო საქმიანობის ვიცე-რექტორის მოვალეობის შემსრულებელი, დიაკონი ოლეგ პტუშკინი.\n\nგზად მოსწავლეები საგალობლებსა და საგალობლებს მღეროდნენ."},"he":{"auto":"סטודנטים ומורים בסמינריה הרוחנית של ניקולו-אוגרש ב-7 בספטמבר 2025, בחג קתדרלת הקדושים במוסקבה, השתתפו במסע הצלב של מוסקבה. בין הסמינרים היו 13 סטודנטים זרים מ-7 מדינות אפריקה.\n\nקבוצת הסמינרים הובלת על ידי מפקד הרקטור, הירומון לוק (פרונסקי). בין המורים בצלב, שבראשם היה הפטריארך הקדוש ביותר של מוסקבה וכל רוסיה, קיריל, עברו: סגן נשיא לפעילות מדעית, הכומר ולדימיר אלשקוב, ראש המחלקה לחינוך נוסף, הכומר סרג ' י שילוב, מזכיר המועצה המדעית, הכומר יבגני יוריגין, הכומר ואדים ונקוב, סגן נשיא לעבודה חינוכית, הדיקון אולג פטושקין.\n\nלאורך הדרך, התלמידים שרו מזמורים ותהילה."},"ja":{"auto":"2025年9月7日、モスクワ聖人大聖堂の饗宴にあるニコロ・ウグレシュ神学校の学生と教師が、モスクワ全体の行列に参加しました。 セミナリアンの中には、アフリカ7カ国からの13人の外国人学生がいました。\n\n神学校のグループは、牧師の代理であるHieromonk Luke（Pronsky）によって率いられました。 教師の間では、モスクワと全ロシアの彼の聖総主教キリルが率いる行列は、研究のための副学長、司祭ウラジミールAlyoshkov、追加教育部門の長、司祭Sergiy Shilov、学術評議会の長官、司祭Evgeny Yerygin、司祭Vadim Vankov、教育作業のための副学長、Deacon Oleg Ptushkinが含まれていた。\n\n途中で、生徒たちは賛美歌と賛美の賛美歌を歌いました。"},"ru":{"auto":"Студенты и преподаватели Николо-Угрешской духовной семинарии 7 сентября 2025 года, в праздник Собора Московских святых, приняли участие в общемосковском крестном ходе. В числе семинаристов были и 13 иностранных студентов из 7 стран Африки.\n\nГруппу семинаристов возглавил и.о. ректора иеромонах Лука (Пронских). В числе преподавателей крестным ходом, во главе которого был Святейший Патриарх Московский и всея Руси Кирилл, прошли: и.о. проректора по научной деятельности иерей Владимир Алёшков, руководитель Отдела дополнительного образования иерей Сергий Шилов, секретарь Учёного совета иерей Евгений Ерыгин, иерей Вадим Ваньков, и.о. проректора по воспитательной работе диакон Олег Птушкин.\n\nПо пути следования студенты пели гимны и славословия.","manual":"Студенты и преподаватели Николо-Угрешской духовной семинарии 7 сентября 2025 года, в праздник Собора Московских святых, приняли участие в общемосковском крестном ходе. В числе семинаристов были и 13 иностранных студентов из 7 стран Африки.\n\nГруппу семинаристов возглавил и.о. ректора иеромонах Лука (Пронских). В числе преподавателей крестным ходом, во главе которого был Святейший Патриарх Московский и всея Руси Кирилл, прошли: и.о. проректора по научной деятельности иерей Владимир Алёшков, руководитель Отдела дополнительного образования иерей Сергий Шилов, секретарь Учёного совета иерей Евгений Ерыгин, иерей Вадим Ваньков, и.о. проректора по воспитательной работе диакон Олег Птушкин.\n\nПо пути следования студенты пели гимны и славословия."},"sr":{"auto":"Студенти и наставници Николо-Угрешске духовне семинарије 7.септембра 2025. године, на празник Собора Московских светих, учествовали су у општемосковском крстовом току. Међу семинаристима је било и 13 страних студената из 7 земаља Африке.\n\nГрупу семинариста је предводио и.о. ректора иеромонах Лука (Пронских). Међу наставницима крстом, на чијем је челу био најсветији Патријарх московски и целе Русије Кирил, прошли су: и.о. проректора за научне активности иереј Владимир Алешков, руководилац Одељења за додатно образовање иереј Сергиј Шилов, секретар Научног савета иереј Евгений Еригин, иереј Вадим Ваньков, и. о. проректор за воспитанички рад диакон Олег Птушкин.\n\nНа путу су студенти певали химне и Славословље."},"tr":{"auto":"Moskova Azizler Katedrali'nin bayram günü olan 7 Eylül 2025'te Nikolo-Ugreshsk İlahiyat Semineri'nin öğrencileri ve öğretmenleri, Moskova Genel Haç kursuna katıldı. Seminerler arasında Afrika'nın 7 ülkesinden 13 yabancı öğrenci de vardı.\n\nBir grup seminer, vekilharç Vekili Luke'un (Pronskiy) Hieromonk rektörü tarafından yönetildi. Moskova ve tüm Rusya'nın en Kutsal Patriği Kirill'in başında olduğu alaydaki öğretmenler arasında şunlar vardı: bilimsel faaliyetlerden sorumlu rektör yardımcısı vekili Rahip Vladimir Aleshkov, ileri eğitim Departmanı başkanı Rahip Sergiy Shilov, Bilim Konseyi Sekreteri Rahip Yevgeny Yerygin, Rahip Vadim Vankov, vekil vekili eğitim çalışmalarından sorumlu rektör yardımcısı Deacon Oleg Ptushkin.\n\nYolda öğrenciler ilahiler ve ilahiler söylediler."}}},"component":"content-flow"},{"images":[{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/08/image-name_a137eff7-c77c-4080-b555-f3f99f633aac","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/08/image-name_0ce552fc-f01b-4f5a-8876-4e609da158e3"},{"titl 、21歳のミシェルは腕の重度の粉砕骨折を負い、シリアでは治療できませんでした。"},"ru":{"auto":"В результате теракта 21-летний Мишель получил тяжелейший оскольчатый перелом руки, сложное лечение которого в Сирии провести не могли.","manual":"В результате теракта 21-летний Мишель получил тяжелейший оскольчатый перелом руки, сложное лечение которого в Сирии провести не могли."},"sr":{"auto":"У терористичком нападу, 21-годишњи Мишел је добио најтежи осколчани прелом руке, чији сложени третман у Сирији није могао да се спроведе."},"tr":{"auto":"Terörist saldırının bir sonucu olarak, 21 yaşındaki Michelle, Suriye'de karmaşık tedavisi yapılamayan kolunda en ciddi kırığa uğradı."}}},"picture":[{"alt":{"ae":{"auto":"يقدم الصندوق المساعدة الطبية لضحية الهجوم الإرهابي في المعبد السوري"},"al":{"auto":"Fondi ofron ndihmë mjekësore për viktimën e sulmit terrorist në tempullin Sirian"},"cn":{"auto":"该基金为叙利亚寺庙恐怖袭击的受害者提供医疗援助"},"el":{"auto":"Το Ταμείο παρέχει ιατρική βοήθεια στο θύμα της τρομοκρατικής επίθεσης στο Συριακό ναό"},"en":{"auto":"The Fund provides medical assistance to the victim of the terrorist attack in the Syrian temple"},"fr":{"auto":"Aide Médicale à la victime d'un attentat dans un temple syrien"},"ge":{"auto":"ფონდი სირიის ტაძარში მომხდარი ტერაქტის მსხვერპლს სამედიცინო დახმარებას უწევს"},"he":{"auto":"קרן סיוע רפואי לנפגע בפיגוע במקדש הסורי"},"ja":{"auto":"この基金は、シリアの寺院でのテロ攻撃の犠牲者に医療援助を提供しています"},"ru":{"auto":"Оказание Фондом медпомощи пострадавшему в теракте в сирийском храме","manual":"Оказание Фондом медпомощи пострадавшему в теракте в сирийском храме"},"sr":{"auto":"Фондација за медицинску помоћ повређеној у терористичком нападу у сиријском храму"},"tr":{"auto":"Suriye Tapınağındaki terör saldırısında kurbana tıbbi yardım Fonu sağlanması"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_a8f9c081-c69e-449e-a47a-44b26cf2faea","title":{"ae":{"auto":"يقدم الصندوق المساعدة الطبية لضحية الهجوم الإرهابي في المعبد السوري"},"al":{"auto":"Fondi ofron ndihmë mjekësore për viktimën e sulmit terrorist në tempullin Sirian"},"cn":{"auto":"该基金为叙利亚寺庙恐怖袭击的受害者提供医疗援助"},"el":{"auto":"Το Ταμείο παρέχει ιατρική βοήθεια στο θύμα της τρομοκρατικής επίθεσης στο Συριακό ναό"},"en":{"auto":"The Fund provides medical assistance to the victim of the terrorist attack in the Syrian temple"},"fr":{"auto":"Aide Médicale à la victime d'un attentat dans un temple syrien"},"ge":{"auto":"ფონდი სირიის ტაძარში მომხდარი ტერაქტის მსხვერპლს სამედიცინო დახმარებას უწევს"},"he":{"auto":"קרן סיוע רפואי לנפגע בפיגוע במקדש הסורי"},"ja":{"auto":"この基金は、シリアの寺院でのテロ攻撃の犠牲者に医療援助を提供しています"},"ru":{"auto":"Оказание Фондом медпомощи пострадавшему в теракте в сирийском храме","manual":"Оказание Фондом медпомощи пострадавшему в теракте в сирийском храме"},"sr":{"auto":"Фондација за медицинску помоћ повређеној у терористичком нападу у сиријском храму"},"tr":{"auto":"Suriye Tapınağındaki terör saldırısında kurbana tıbbi yardım Fonu sağlanması"}},"breakpoint":"main"}],"published_at":"2025-09-01T10:03:03+00:00","updated_at":"2025-09-01T11:54:08.467462+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"نظمت بطريركية موسكو ، بمساعدة مالية من مؤسسة دعم الثقافة والتراث المسيحي ، وصول الضحية وإقامتها في موسكو.\n\nنتيجة للهجوم الإرهابي في 22 يونيو 2025 في الكنيسة الأرثوذكسية للنبي إيليا في دمشق ، أصيب ميشيل البالغ من العمر 21 عاما بكسر شديد في ذراعه. كان بحاجة إلى علاج ترميمي معقد ، لا يمكن إجراؤه في سوريا.\n\n\"جاء ميشيل إلى روسيا بناء على طلب غبطة البطريرك يوحنا العاشر من أنطاكية العظمى وكل الشرق إلى قداسة البطريرك كيريل من موسكو وكل روسيا. يشتهر مستشفى سانت أليكسي متروبوليتان تشيرش بقسم الصدمات القوي \" ، قال كبير أطباء المستشفى ، أ. زاروف.\n\nفي 22 أغسطس ، خضع المريض لعملية جراحية. أجرت رئيسة مركز جراحة اليد المجهرية والجراحة الترميمية والتجميلية في مستشفى سانت أليكسي ، أخصائية الرضوح ف. أ. كالانتيرسكايا عملية معقدة على العظام والأنسجة الرخوة في ساعدها الأيسر ، والتي تضررت نتيجة الإصابة.\n\nتقدم الكنيسة الأرثوذكسية الروسية بانتظام المساعدة للكنيسة الأنطاكية الأرثوذكسية في الأمور المتعلقة بالرعاية الطبية للضحايا. على وجه الخصوص ، في عام 2022 ، تم افتتاح مركز لإعادة تأهيل الأطفال والأطراف الصناعية للمرضى الصغار المصابين في القتال في مجمع الكنيسة الأرثوذكسية الروسية في دمشق بمشاركة مؤسسة دعم الثقافة والتراث المسيحي. وفي العام نفسه ، استضاف مستشفى سانت أليكسي وفدا من الأطباء من المستشفى البطريركي\" الحصن \" من سوريا.\n\n**مساعدة**\n\nفي 22 يونيو 2025 ، خلال قداس يوم الأحد في الكنيسة الأرثوذكسية للنبي إيليا في دمشق ، فتح انتحاري النار على المصلين ، وبعد ذلك انتحر. نتيجة للهجوم الإرهابي ، قتل 25 شخصا وأصيب أكثر من 60."},"al":{"auto":"Departamenti për Marrëdhëniet E Jashtme Të Kishës (DECR) Patriarkana E Moskës, me ndihmën financiare të Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, organizoi ardhjen dhe qëndrimin e viktimës në Moskë.\n\nSi rezultat i sulmit terrorist më 22 qershor 2025 në kishën Ortodokse të Profetit Elia në Damask, 21-vjeçari Michel pësoi një thyerje të rëndë të krahut të tij. Ai kishte nevojë për trajtim kompleks rindërtues, i cili nuk mund të kryhej në Siri.\n\n\"Michel erdhi në Rusi me kërkesën e Patriarkut të Tij Të Lumturisë John X të Antiokisë së madhe dhe në Të gjithë Lindjen E Shenjtërisë Së tij Patriarkut Kirill të Moskës dhe Të gjithë Rusisë. Spitali I Kishës Metropolitane të shën Aleksit është i famshëm për departamentin e tij të fortë të traumës,\" tha mjeku kryesor i spitalit, A. y. Zarov.\n\nMë 22 gusht, pacienti iu nënshtrua një operacioni. Kreu i Qendrës Për Mikrokirurgji Dore, Kirurgji Rindërtuese dhe Plastike në Spitalin E Shën Aleksit, traumatologu V. a. Kalantyrskaya kreu një operacion kompleks në kockat dhe indet e buta të parakrahut të saj të majtë, të dëmtuar si rezultat i lëndimit.\n\nKisha Ortodokse ruse rregullisht i jep ndihmë Kishës Ortodokse Antiokiane në çështjet që lidhen me kujdesin mjekësor për viktimat. Në veçanti, në vitin 2022, Një Qendër Për Rehabilitimin e Fëmijëve dhe Protezat për pacientët e rinj të plagosur në luftime u hap në Kompleksin e Kishës Ortodokse ruse në Damask me pjesëmarrjen e Fondacionit për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë. Në të njëjtin vit, Spitali I Shën Aleksit priti një delegacion mjekësh nga Spitali Patriarkal \"Al-Hosn\" nga Siria.\n\n**Ndihmë**\n\nMë 22 qershor 2025, gjatë një shërbimi të së dielës në Kishën Ortodokse Të Profetit Elia në Damask, një sulmues vetëvrasës hapi zjarr ndaj adhuruesve, pas së cilës ai kreu vetëvrasje. Si rezultat i sulmit terrorist, 25 njerëz u vranë dhe më shumë se 60 u plagosën."},"cn":{"auto":"对外教会关系部（DECR）莫斯科宗主教在支持基督教文化和遗产基金会的财政援助下，组织了受害者抵达和停留在莫斯科。\n\n由于2025年6月22日在大马士革先知以利亚东正教会发生的恐怖袭击，21岁的米歇尔手臂严重粉碎性骨折。 他需要复杂的重建治疗，这在叙利亚无法进行。\n\n\"米歇尔来到俄罗斯在他的Beatitude族长约翰十世的大安提阿和整个东方的莫斯科和全俄罗斯的尊者族长基里尔的请求。 圣阿列克谢大都会教堂医院以其强大的创伤部门而闻名，\"该医院的主任医师A.Y.Zarov说。\n\n8月22日，患者接受了手术。 圣阿列克谢医院手部显微外科，重建和整形外科中心的负责人，创伤学家V.A.Kalantyrskaya对她的左前臂的骨骼和软组织进行了复杂的手术，由于受伤而受损。\n\n俄罗斯东正教会定期向安提阿东正教会提供有关受害者医疗的援助。 特别是，在2022中，在支持基督教文化和遗产基金会的参与下，在大马士革的俄罗斯东正教大院开设了一个在战斗中受伤的年轻患者的儿童康复和假肢 同年，圣阿列克谢医院接待了来自叙利亚父权制医院\"Al-Hosn\"的医生代表团。\n\n**帮助**\n\n2025年6月22日，在大马士革先知以利亚东正教会的主日崇拜中，一名自杀式炸弹袭击者向崇拜者开火，之后他自杀身亡。 恐怖袭击造成25人死亡，60多人受伤。"},"el":{"auto":"Το Τμήμα Εξωτερικών Εκκλησιαστικών Σχέσεων (ΤΕΕΣ) του Πατριαρχείου Μόσχας, με την οικονομική συνδρομή του Ιδρύματος στήριξης του Χριστιανικού Πολιτισμού και κληρονομιάς, οργάνωσε την άφιξη και παραμονή του θύματος στη Μόσχα.\n\nΩς αποτέλεσμα της τρομοκρατικής επίθεσης στις 22 Ιουνίου 2025 στην Ορθόδοξη Εκκλησία του Προφήτη Ηλία στη Δαμασκό, ο 21χρονος Μισέλ υπέστη σοβαρό θρυμματισμένο κάταγμα στο χέρι του. Χρειαζόταν πολύπλοκη επανορθωτική θεραπεία, η οποία δεν μπορούσε να πραγματοποιηθεί στη Συρία.\n\n\"Ο Μισέλ ήρθε στη Ρωσία κατόπιν αιτήματος του Μακαριωτάτου Πατριάρχη της Μεγάλης Αντιόχειας και Πάσης Ανατολής Ιωάννη Χ προς τον Αγιώτατο Πατριάρχη Μόσχας και Πάσης Ρωσίας Κύριλλο. Το Νοσοκομείο της Μητροπολιτικής Εκκλησίας του Αγίου Αλεξίου φημίζεται για το ισχυρό τμήμα τραυμάτων του\", δήλωσε ο επικεφαλής γιατρός του Νοσοκομείου, Α.Γ. Ζαρόφ.\n\nΣτις 22 Αυγούστου, ο ασθενής υποβλήθηκε σε χειρουργική επέμβαση. Ο επικεφαλής του Κέντρου Μικροχειρουργικής χεριών, Επανορθωτικής και Πλαστικής Χειρουργικής στο Νοσοκομείο St.Alexy, τραυματολόγος V. A. Kalantyrskaya πραγματοποίησε μια πολύπλοκη επέμβαση στα οστά και τους μαλακούς ιστούς του αριστερού αντιβραχίου της, που υπέστη βλάβη ως αποτέλεσμα τραυματισμού.\n\nΗ Ρωσική Ορθόδοξη Εκκλησία παρέχει τακτικά βοήθεια στην Ορθόδοξη Εκκλησία της Αντιόχειας σε θέματα που σχετίζονται με την ιατρική περίθαλψη των θυμάτων. Συγκεκριμένα, το 2022, ένα Κέντρο Αποκατάστασης Παιδιών και προσθετικής για νέους ασθενείς που τραυματίστηκαν στις μάχες άνοιξε στο συγκρότημα της Ρωσική Ορθόδοξη Εκκλησία στη Δαμασκό με τη συμμετοχή του Ιδρύματος για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς. Την ίδια χρονιά, το Νοσοκομείο του Αγίου Αλεξίου φιλοξένησε αντιπροσωπεία γιατρών από το Πατριαρχικό νοσοκομείο \"Αλ-Χοσν\" από τη Συρία.\n\n**Βοήθεια**\n\nΣτις 22 Ιουνίου 2025, κατά τη διάρκεια Κυριακάτικης λειτουργίας στην Ορθόδοξη Εκκλησία του Προφήτη Ηλία στη Δαμασκό, ένας βομβιστής αυτοκτονίας άνοιξε πυρ εναντίον πιστών, μετά τον οποίο αυτοκτόνησε. Ως αποτέλεσμα της τρομοκρατικής επίθεσης, 25 άνθρωποι σκοτώθηκαν και περισσότεροι από 60 τραυματίστηκαν."},"en":{"auto":"Department for External Church Relations (DECR) The Moscow Patriarchate, with the financial assistance of the Foundation for the Support of Christian Culture and Heritage, organized the arrival and stay of the victim in Moscow.\n\nAs a result of the terrorist attack on June 22, 2025 at the Orthodox church of the Prophet Elijah in Damascus, 21-year-old Michel suffered a severe comminuted fracture of his arm. He needed complex reconstructive treatment, which could not be carried out in Syria.\n\n\"Michel came to Russia at the request of His Beatitude Patriarch John X of Great Antioch and All the East to His Holiness Patriarch Kirill of Moscow and All Russia. St. Alexy's Metropolitan Church Hospital is famous for its strong trauma department,\" said the hospital's chief physician, A.Y. Zarov.\n\nOn August 22, the patient underwent surgery. The head of the Center for Hand Microsurgery, Reconstructive and Plastic Surgery at St. Alexy's Hospital, traumatologist V.A. Kalantyrskaya performed a complex operation on the bones and soft tissues of her left forearm, damaged as a result of injury.\n\nThe Russian Orthodox Church regularly provides assistance to the Orthodox Church of Antioch in matters related to medical care for victims. In particular, in 2022, a Center for Child Rehabilitation and Prosthetics for young patients injured in the fighting was opened at the Compound of the Russian Orthodox Church in Damascus with the participation of the Foundation for the Support of Christian Culture and Heritage. In the same year, St. Alexy's Hospital hosted a delegation of doctors from the Patriarchal Hospital \"Al-Hosn\" from Syria.\n\n**Help**\n\nOn June 22, 2025, during a Sunday service at the Orthodox Church of the Prophet Elijah in Damascus, a suicide bomber opened fire on worshippers, after which he committed suicide. As a result of the terrorist attack, 25 people were killed and more than 60 injured."},"fr":{"auto":"Le département des relations ecclésiastiques extérieures du Patriarcat de Moscou, avec l'aide financière du Fonds de soutien à la culture chrétienne et au patrimoine, a organisé l'arrivée et le séjour de la victime à Moscou.\n\nÀ la suite de l'attentat du 22 juin 2025 dans l'église orthodoxe du prophète Élie à Damas, Michel, âgé de 21 ans, a subi une grave fracture fracturée du bras. Il avait besoin d'un traitement de reconstruction complexe, qui ne pouvait pas être effectué en Syrie.\n\n\"Michel s'est retrouvé en Russie à la demande du Patriarche de la grande Antioche et de tout l'Orient Jean X au Patriarche Cyrille de Moscou et de toute la Russie. L'hôpital de l'église de la capitale Saint-Alexis est célèbre pour un fort service de traumatologie\", a déclaré le médecin en chef de l'hôpital A. zarov.\n\nLe 22 août, le patient a été opéré. Le chef du Centre de microchirurgie de la main, de la chirurgie reconstructive et plastique de L'hôpital Saint-Alexis, le traumatologue Va Kalantyrskaya a effectué une opération complexe sur les OS et les tissus mous de l'avant-bras gauche, endommagés à la suite de la blessure.\n\nL \u0026 apos; Église orthodoxe russe apporte régulièrement son concours à l \u0026 apos; Église orthodoxe d \u0026 apos; Antioche en ce qui concerne l \u0026 apos; assistance médicale aux victimes. En particulier, en 2022, un Centre de réadaptation et de prothèses pédiatriques pour les jeunes patients blessés au cours des combats a été ouvert dans le cadre de l'église orthodoxe Russe de Damas, avec la participation du Fonds de soutien à la culture et au patrimoine chrétiens. La même année, L'hôpital Saint-Alexis accueillait une délégation de médecins de l'hôpital patriarcal Al-Hosn de Syrie.\n\n**Attestation**\n\nLe 22 juin 2025, lors de l'Office du dimanche dans l'église orthodoxe du prophète Élie à Damas, un kamikaze a ouvert le feu sur les fidèles en prière, après quoi il s'est suicidé. L'attentat a fait 25 morts et plus de 60 blessés."},"ge":{"auto":"საგარეო საეკლესიო ურთიერთობების დეპარტამენტმა (DECR) მოსკოვის საპატრიარქომ, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის ფინანსური დახმარებით, მოაწყო მსხვერპლის ჩამოსვლა და დარჩენა მოსკოვში.\n\n2025 წლის 22 ივნისს, დამასკოში, წინასწარმეტყველ ელიას მართლმადიდებლურ ეკლესიაში მომხდარი ტერაქტის შედეგად, 21 წლის მიშელს ხელის მძიმე მოტეხილობა აღენიშნებოდა. მას სჭირდებოდა კომპლექსური რეკონსტრუქციული მკურნალობა, რომელიც სირიაში ვერ განხორციელდა.\n\n\"მიშელი რუსეთში მოვიდა დიდი ანტიოქიის უნეტარესი პატრიარქის იოანე X-ისა და მთელი აღმოსავლეთის თხოვნით მოსკოვისა და სრულიად რუსეთის უწმინდესი პატრიარქის კირილის თხოვნით. წმინდა ალექსის მიტროპოლიტის ეკლესიის საავადმყოფო ცნობილია ძლიერი ტრავმის განყოფილებით.\"\n\n22 აგვისტოს პაციენტს ოპერაცია ჩაუტარდა. წმინდა ალექსის საავადმყოფოს ხელის მიკროქირურგიის, რეკონსტრუქციული და პლასტიკური ქირურგიის ცენტრის ხელმძღვანელმა, ტრავმატოლოგმა ვ.ა. კალანტირსკაიამ ჩაატარა რთული ოპერაცია მარცხენა წინამხრის ძვლებზე და რბილ ქსოვილებზე, დაზიანებული ტრავმის შედეგად.\n\nრუსეთის მართლმადიდებელი ეკლესია რეგულარულად უწევს დახმარებას ანტიოქიის მართლმადიდებლურ ეკლესიას მსხვერპლთა სამედიცინო მომსახურებასთან დაკავშირებულ საკითხებში. კერძოდ, 2022 წელს დამასკოში, რუსეთის მართლმადიდებელი ეკლესიის შენობაში, ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდის მონაწილეობით, საბრძოლო მოქმედებებში დაშავებული ახალგაზრდა პაციენტების ბავშვთა რეაბილიტაციისა და პროთეზირების ცენტრი გაიხსნა. იმავე წელს, წმინდა ალექსის საავადმყოფომ სირიიდან საპატრიარქო საავადმყოფოს \"ალ-ჰოსნის\" ექიმების დელეგაციას უმასპინძლა.\n\n**დახმარება**\n\n2025 წლის 22 ივნისს, დამასკოში, წინასწარმეტყველ ელიას მართლმადიდებლურ ეკლესიაში საკვირაო მსახურების დროს, თვითმკვლელმა ტერორისტმა ცეცხლი გაუხსნა მრევლს, რის შემდეგაც მან თავი მოიკლა. ტერაქტის შედეგად 25 ადამიანი დაიღუპა და 60-ზე მეტი დაშავდა."},"he":{"auto":"מחלקת הקשרים הכנסייתיים החיצוניים של הפטריארכאט של מוסקבה, בסיוע פיננסי של קרן התמיכה בתרבות הנוצרית והמורשת, ארגנה את הגעתו והשהייה של הנפגע במוסקבה.\n\nכתוצאה מהפיגוע ב-22 ביוני 2025 במקדש האורתודוקסי של הנביא אליהו בדמשק, מישל בן ה-21 סבל משבר חמור ביד. הוא נזקק לטיפול שיקום מורכב, שלא ניתן היה לבצע בסוריה.\n\nמישל הגיע לרוסיה לבקשתו של הפטריארך המבורך ביותר של אנטיוכיה הגדולה ושל כל המזרח, יוחנן העשירי, לפטריארך הקדוש ביותר של מוסקבה וכל רוסיה, קירל. בית החולים הכנסייתי של סנט אלקסיוס מפורסם במחלקה טראומטית חזקה, ציין הרופא הראשי של בית החולים א. י. זארוב.\n\nב-22 באוגוסט נותח המטופל. מנהל המרכז למיקרוכירורגיה של היד, ניתוחים משחזרים ופלסטיים של בית החולים סנט אלכסיה, הרופא-טראומטולוג ו. א. קלנטירסקה ביצע ניתוח מורכב על העצמות והרקמות הרכות של הזרוע השמאלית, שנפגעו כתוצאה מפציעה.\n\nהכנסייה האורתודוקסית הרוסית מסייעת באופן קבוע לכנסייה האורתודוקסית של אנטיוכיה בנושאים הקשורים לטיפול רפואי לנפגעים. בפרט, בשנת 2022 בחצר הכנסייה האורתודוקסית הרוסית בדמשק, בהשתתפות קרן תמיכה בתרבות נוצרית ומורשת, נפתח מרכז שיקום ילדים ופרוטזה לחולים קטנים שנפצעו במהלך פעולות הלחימה. באותה שנה, בית החולים של אלקסיוס הקדוש קיבל משלחת של רופאים מבית החולים הפטריארכי \"אל-חוסן\" מסוריה.\n\n**עזרה**\n\nב-22 ביוני 2025 במהלך שירות יום ראשון במקדש האורתודוקסי של הנביא אליהו בדמשק, מחבל מתאבד פתח באש על קהילת המתפללים, ולאחר מכן פרץ בעצמו. כתוצאה מהפיגוע נהרגו 25 בני אדם, יותר מ-60 נפצעו."},"ja":{"auto":"外部教会関係省(DECR)モスクワ総主教区は、キリスト教文化と遺産の支援のための財団の財政援助を受けて、モスクワでの犠牲者の到着と滞在を組織しました。\n\nダマスカスの預言者エリヤの正教会での2025年6月22日のテロ攻撃の結果、21歳のミシェルは腕の重度の粉砕骨折を負いました。 彼は複雑な再建治療を必要としていましたが、これはシリアでは実施できませんでした。\n\n」ミシェルは、彼の至福の総主教ジョンXの要請でロシアに来ました偉大なアンティオキアとすべての東の彼の聖さ総主教キリルへモスクワと全ロ 聖アレクシーズ-メトロポリタン教会病院は、その強力な外傷部門で有名です\"と病院の主任医師、A.Y.Zarovは言いました。\n\n8月22日、患者は手術を受けました。 St.Alexyの病院での手のマイクロサージェリー、再建および形成手術のためのセンターの頭、外傷学者V.A.Kalantyrskayaは、怪我の結果として損傷した左前腕の骨および軟組織に複雑な手術を行った。\n\nロシア正教会は、犠牲者のための医療に関連する問題において、アンティオキア正教会に定期的に支援を提供しています。 特に、2022年には、キリスト教文化と遺産の支援のための財団の参加を得て、ダマスカスのロシア正教会の複合施設で、戦闘で負傷した若い患者のための子供のリハビリテーションと補綴物のためのセンターが開かれました。 同じ年に、聖アレクシー病院はシリアからの家父長病院「アルホスン」からの医師の代表団を主催しました。\n\n*•ヘルプ**\n\n2025年6月22日、ダマスカスの預言者エリヤの正教会での日曜日の礼拝中に、自爆テロ犯が崇拝者に発砲し、その後彼は自殺しました。 テロ攻撃の結果、25人が死亡し、60人以上が負傷した。"},"ru":{"auto":"Отдел внешних церковных связей (ОВЦС) Московского Патриархата при финансовом содействии Фонда поддержки христианской культуры и наследия организовал приезд и пребывание пострадавшего в Москве.\n\nВ результате теракта 22 июня 2025 года в православном храме пророка Илии в Дамаске 21-летний Мишель получил тяжелейший оскольчатый перелом руки. Ему требовалось сложное реконструктивное лечение, которое в Сирии провести не могли.\n\n«Мишель оказался в России по просьбе Блаженнейшего Патриарха Великой Антиохии и всего Востока Иоанна X к Святейшему Патриарху Московскому и всея Руси Кириллу. Столичная церковная больница Святителя Алексия славится сильным травматологическим отделением», – отметил главный врач больницы А.Ю. Заров.\n\n22 августа пациент был прооперирован. Руководитель Центра микрохирургии кисти, реконструктивной и пластической хирургии больницы Святителя Алексия, врач-травматолог В.А. Калантырская выполнила сложную операцию на костях и мягких тканях левого предплечья, поврежденных в результате ранения.\n\nРусская Православная Церковь регулярно оказывает содействие Антиохийской Православной Церкви в вопросах, связанных с медицинской помощью пострадавшим. В частности, в 2022 году при Подворье Русской Православной Церкви в Дамаске при участии Фонда поддержки христианской культуры и наследия был открыт Центр детской реабилитации и протезирования для маленьких пациентов, получивших ранения в ходе боевых действий. В том же году больница Святителя Алексия принимала делегацию врачей Патриаршего госпиталя «Аль-Хосн» из Сирии.\n\n**Справка**\n\n22 июня 2025 года во время воскресного богослужения в православном храме пророка Илии в Дамаске террорист-смертник открыл огонь по молящимся прихожанам, после чего совершил самоподрыв. В результате теракта погибли 25 человек, более 60 ранены.","manual":"Отдел внешних церковных связей (ОВЦС) Московского Патриархата при финансовом содействии Фонда поддержки христианской культуры и наследия организовал приезд и пребывание пострадавшего в Москве.\n\nВ результате теракта 22 июня 2025 года в православном храме пророка Илии в Дамаске 21-летний Мишель получил тяжелейший оскольчатый перелом руки. Ему требовалось сложное реконструктивное лечение, которое в Сирии провести не могли.\n\n«Мишель оказался в России по просьбе Блаженнейшего Патриарха Великой Антиохии и всего Востока Иоанна X к Святейшему Патриарху Московскому и всея Руси Кириллу. Столичная церковная больница Святителя Алексия славится сильным травматологическим отделением», – отметил главный врач больницы А.Ю. Заров.\n\n22 августа пациент был прооперирован. Руководитель Центра микрохирургии кисти, реконструктивной и пластической хирургии больницы Святителя Алексия, врач-травматолог В.А. Калантырская выполнила сложную операцию на костях и мягких тканях левого предплечья, поврежденных в результате ранения.\n\nРусская Православная Церковь регулярно оказывает содействие Антиохийской Православной Церкви в вопросах, связанных с медицинской помощью пострадавшим. В частности, в 2022 году при Подворье Русской Православной Церкви в Дамаске при участии Фонда поддержки христианской культуры и наследия был открыт Центр детской реабилитации и протезирования для маленьких пациентов, получивших ранения в ходе боевых действий. В том же году больница Святителя Алексия принимала делегацию врачей Патриаршего госпиталя «Аль-Хосн» из Сирии.\n\n**Справка**\n\n22 июня 2025 года во время воскресного богослужения в православном храме пророка Илии в Дамаске террорист-смертник открыл огонь по молящимся прихожанам, после чего совершил самоподрыв. В результате теракта погибли 25 человек, более 60 ранены."},"sr":{"auto":"Одсек за спољне црквене везе (ОВЦС) Московског патријархата уз финансијску помоћ Фонда за подршку хришћанске културе и наслеђа организовао је долазак и боравак жртве у Москви.\n\nУ терористичком нападу 22.јуна 2025. године у православном храму пророка Илије у Дамаску, 21-годишњи Мишел је добио најтежи осколчани прелом руке. Било му је потребно сложено реконструктивно лечење, које у Сирији нису могли да спроведу.\n\nМишел је био у Русији по захтеву Блаженијег Патријарха Велике Антиохије и целог Истока Јована X светом Патријарху Московском и целе Русије Кирилу. Столична црквена болница светитеља Алексија позната је по јаком трауматолошком одељењу\", рекао је главни лекар болнице а.\n\n22. августа пацијент је оперисан. Руководитељ Центра за микрохирургију кисти, реконструктивну и пластичну хирургију болнице светитеља Алексија, лекар-травматолог В.А. Калантырска је извршила сложену операцију на костима и меким ткивима леве предплеће, оштећеним услед ране.\n\nРуска православна црква редовно пружа помоћ Антиохијској Православној Цркви у питањима везаним за медицинску помоћ жртвама. У част, 2022.године, при дворишту Руске Православне Цркве у Дамаску, уз учешће Фонда за подршку хришћанске културе и наслеђа, отворен је центар за дечју рехабилитацију и протезирање за мале пацијенте који су рањени током ратних акција. Исте године болница светитеља Алексија примила је делегацију лекара Патријаршијске болнице Ал-Хосн из Сирије.\n\n**Помоћ**\n\n22.јуна 2025. године, током недељне богослужења у православном храму пророка Илије у Дамаску, терорист-самоубица отворио је ватру на молитвене приходнике, након чега је извршио самоподрив. У терористичком нападу је погинуло 25 људи, а више од 60 је рањено."},"tr":{"auto":"Moskova Patrikhanesi'nin Dış Kilise ilişkileri Departmanı (UZC), Hıristiyan Kültürünü ve Mirasını Destekleme Fonu'nun mali yardımı ile kurbanın Moskova'ya gelişini ve kalışını organize etti.\n\n22 Haziran 2025'te Şam'daki İlyas Peygamberi Ortodoks Kilisesi'nde düzenlenen terör saldırısı sonucunda 21 yaşındaki Michel, kolunda en ciddi kırığa uğradı. Suriye'de yapılamayan karmaşık rekonstrüktif tedaviye ihtiyacı vardı.\n\n\"Michel, Büyük Antakya'nın en Kutsanmış Patriğinin ve X. John'un tüm Doğusunun, Moskova'nın en Kutsal Patriğine ve tüm Rusya'nın Kiril'e olan isteği üzerine Rusya'daydı. Başkentin Aziz Aleksiy Kilisesi Hastanesi, güçlü travma departmanı ile ünlüdür, \"dedi hastanenin başhekimi A.Yu. Zarov.\n\n22 Ağustos'ta hasta ameliyat edildi. Aziz Aleksiy Hastanesi El Mikrocerrahi, Rekonstrüktif ve Plastik Cerrahi Merkezi Başkanı travmatolog V.A. Kalantyrskaya, yaradan zarar gören sol ön kolun kemikleri ve yumuşak dokuları üzerinde karmaşık bir ameliyat gerçekleştirdi.\n\nRus Ortodoks Kilisesi, etkilenenlere tıbbi yardımla ilgili konularda düzenli olarak Antakya Ortodoks Kilisesi'ne yardım etmektedir. Özellikle 2022 yılında Şam'daki Rus Ortodoks Kilisesi'nin Avlusunda, Hıristiyan Kültürünü ve Mirasını Destekleme Vakfı'nın katılımıyla, düşmanlıklar sırasında yaralanan küçük hastalar için Çocuk Rehabilitasyon ve Protez Merkezi açıldı. Aynı yıl Aziz Aleksiy Hastanesi, Suriye'den Ataerkil El-Hüsn Hastanesi'nin doktorlarından oluşan bir heyeti ağırladı.\n\n**Bilgi**\n\n22 Haziran 2025'te Şam'daki İlyas Peygamberi Ortodoks Kilisesi'nde Pazar ayini sırasında bir intihar bombacısı dua eden cemaatçilere ateş açtı ve ardından kendi kendini cesaretlendirdi. Saldırıda 25 kişi öldü, 60'tan fazla kişi yaralandı."}}},"component":"content-flow"},{"images":[{"title":{},"width":1620,"chosen":false,"height":911,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_af2e47f7-5ae9-4ce2-96e7-f126afcc7539","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_70875bc3-fb03-4b5d-90b4-4b0161be4a17"},{"title":{},"width":1682,"chosen":false,"height":946,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_44f84df4-cc5c-453e-8f0c-9e8b0c1d25b4","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_1fca9ea0-30ed-46b9-9df0-1fc5f29e65ec"}],"heading":{},"component":"image-gallery"}],"seo":{"og":{},"html":{}},"settings":{"type":"base","source":{"url":"https://mospat.ru/ru/news/93506/","title":{"ae":{"auto":"الموقع الإلكتروني لبطريركية موسكو"},"al":{"auto":"FAQJA E INTERNETIT E Decr E Patriarkanës Së Moskës"},"cn":{"auto":"莫斯科宗主教的网站"},"el":{"auto":"Ιστοσελίδα του ΤΕΕΣ του Πατριαρχείου Μόσχας"},"en":{"auto":"DECR website of the Moscow Patriarchate"},"fr":{"auto":"Site du DREE du Patriarcat de Moscou"},"ge":{"auto":"მოსკოვის საპატრიარქოს DECR ვებგვერდი"},"he":{"auto":"אתר משרד החקלאות של פטריארכיית מוסקבה"},"ja":{"auto":"モスクワ総主教区のDECRウェブサイト"},"ru":{"auto":"Сайт ОВЦС Московского Патриархата","manual":"Сайт ОВЦС Московского Патриархата"},"sr":{"auto":"Сајт Овцс Московског патријархата"},"tr":{"auto":"Moskova Patrikhanesi OVTS Web Sitesi"}}}},"type":"Content::News","country":{"name":{"ae":{"auto":"روسيا"},"al":{"auto":"Rusia"}," ји за подршку хришћанској култури и наслеђу"},"tr":{"auto":"Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'na teşekkür ederiz"}},"breakpoint":"main"}],"published_at":"2025-08-28T10:52:23+00:00","updated_at":"2025-09-01T10:22:16.510005+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"src":"","breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"خلال اجتماع وفد الإكسرخسية البطريركية الإفريقية مع قداسة البطريرك كيريل من موسكو وعموم روسيا في 27 أغسطس 2025 ، شكر المطران قسطنطين من القاهرة وشمال إفريقيا قيادة إدارة العلاقات الكنسية الخارجية بطريركية موسكو ومؤسسة دعم الثقافة والتراث المسيحي ، بمساعدة 71 من الإكليريكيين من إفريقيا يدرسون في تسع مدارس لاهوتية تابعة للكنيسة الأرثوذكسية الروسية ، بالإضافة إلى العديد من المبادرات الأخرى التي يتم تنفيذها.\n\nثم أجاب رئيس الكنيسة الأرثوذكسية الروسية على أسئلة رجال الدين الأفارقة بالتفصيل.\n\nفي نهاية المحادثة ، قدم رجال الدين في الإكسرخسية البطريركية لقداسته هدايا لا تنسى ، بما في ذلك طاقم مصنوع من نحاتين خشبيين من أوغندا وأيقونة لوالدة الإله \"العاطفة\" ، صنعت بتقنية إنتارسيا بواسطة حرفيين من جزيرة موريشيوس.\n\nسلم قداسة البطريرك كيريل كتابه\" الحرية والمسؤولية \" باللغة الإنجليزية إلى رجال الدين الأفارقة. كما تم منح الميداليات التذكارية لرجال الدين.\n\nكرم الرئيسيات رجال الدين في إكسرخسية إفريقيا البطريركية بجوائز الكنيسة.\n\nقدم قداسة البطريرك كيريل أيقونة القديس جورج المنتصر إلى المدير التنفيذي للمؤسسة ، إيجور سكوبينكو.\n\n**مساعدة**\n\nبمباركة البطريرك كيريل ، يقوم ثلاثون من رجال الدين – عمداء أحياء الكنيسة وكبار الكهنة الذين يمثلون 22 دولة أفريقية-بالحج إلى روسيا في الفترة من 21 إلى 29 أغسطس."},"al":{"auto":"Gjatë takimit të delegacionit Të Ekzarkatit Patriarkal Të Afrikës me Shenjtërinë E tij Patriarkun Kirill të Moskës dhe Të Gjithë Rusisë më 27 gusht 2025, Mitropoliti Konstantin I Kajros dhe Afrikës Së Veriut falënderoi udhëheqjen e Departamentit Për Marrëdhëniet E Jashtme Të Kishës Patriarkana E Moskës dhe Fondacioni Për Mbështetjen e Kulturës Dhe Trashëgimisë Së Krishterë, me ndihmën e të cilit 71 seminaristë nga afrika studiojnë në nëntë shkolla teologjike të Kishës Ortodokse ruse, si dhe shumë iniciativa të tjera po zbatohen.\n\nPastaj Primati i Kishës Ortodokse ruse iu përgjigj pyetjeve të klerit Afrikan në detaje.\n\nNë fund të bisedës, klerikët E Ekzarkatit Patriarkal i paraqitën Shenjtërisë së tij dhurata të paharrueshme, duke përfshirë një staf të bërë nga gdhendës druri nga Uganda dhe një ikonë të Nënës së Zotit \"Pasioni\", e bërë në teknikën e intarsia nga mjeshtrit nga ishulli I Mauritius.\n\nPatriarku I Shenjtërisë Së tij Kirill ia dorëzoi librin e tij \"Liria dhe Përgjegjësia\" në anglisht klerit Afrikan. Gjithashtu, klerikëve iu dhanë medalje përkujtimore.\n\nPrimati nderoi klerikët E Ekzarkatit Patriarkal të Afrikës me çmime të kishës.\n\nShenjtëria E tij Patriarku Kirill i paraqiti ikonën E Dëshmorit Të Shenjtë Të Madh George Fitimtar Drejtorit Ekzekutiv të Fondacionit, Egor Skopenko.\n\n**Ndihmë**\n\nMe bekimin e Patriarkut Kirill, tridhjetë klerikë – dekanë të rretheve kishtare dhe priftërinj të lartë që përfaqësojnë 22 vende Afrikane – po bëjnë një pelegrinazh në Rusi nga 21 deri më 29 gusht."},"cn":{"auto":"2025年8月27日，在非洲宗主教代表团与莫斯科和全俄罗斯宗主教基里尔举行的会议上，开罗和北非的康斯坦丁大都会感谢莫斯科宗主教对外教会关系部和支持基督教文化和遗产基金会的领导，在该基金会的协助下，71名非洲神学院学生在俄罗斯东正教会的九所神学院学习，以及许多其他倡议正在实施中。\n\n然后俄罗斯东正教会的灵长类动物详细回答了非洲神职人员的问题。\n\n在谈话结束时,宗主教的神职人员向教皇赠送了令人难忘的礼物,其中包括乌干达木雕工制作的一根杖和毛里求斯岛工匠用intarsia技术制作的上帝之母\"激情\"的图标。\n\n尊者族长基里尔将他的英文着作《自由与责任》交给了非洲神职人员。 还向神职人员颁发了纪念奖章。\n\n灵长类动物向非洲宗主教的神职人员颁发了教会奖。\n\n教皇陛下基里尔向基金会执行主任叶戈尔*斯科潘科赠送了胜利的圣乔治圣像。\n\n**帮助**\n\n在基里尔族长的祝福下，30名神职人员--代表22个非洲国家的教会区院长和高级牧师--将于8月21日至29日前往俄罗斯朝圣。"},"el":{"auto":"Κατά τη συνάντηση της αντιπροσωπείας της Πατριαρχικής Εξαρχίας Αφρικής με τον Αγιώτατο Πατριάρχη Μόσχας και Πασών των Ρωσσιών Κύριλλο στις 27 Αυγούστου 2025, ο Μητροπολίτης Καΐρου και Βορείου Αφρικής Κωνσταντίνος ευχαρίστησε την ηγεσία του Τμήματος Εξωτερικών Εκκλησιαστικών Σχέσεων του Πατριαρχείου Μόσχας και του Ιδρύματος Χριστιανικού Πολιτισμού και κληρονομιάς, με τη συνδρομή των οποίων 71 ιεροδιδάσκαλοι από την Αφρική σπουδάζουν σε εννέα Θεολογικές Σχολές της Ρωσική Ορθόδοξη Εκκλησία. καθώς και πολλές άλλες πρωτοβουλίες υλοποιούνται.\n\nΣτη συνέχεια, ο Προκαθήμενος της Ρωσική Ορθόδοξη Εκκλησία απάντησε λεπτομερώς στις ερωτήσεις του αφρικανικού κλήρου.\n\nΣτο τέλος της συνομιλίας, οι κληρικοί της Πατριαρχικής Εξαρχίας παρουσίασαν στην Αγιότητά του αξέχαστα δώρα, συμπεριλαμβανομένου ενός προσωπικού από ξυλογλυπτών από την Ουγκάντα και μια εικόνα της Μητέρας του Θεού \"πάθος\", φτιαγμένη με την τεχνική της intarsia από τεχνίτες από το νησί του Μαυρίκιου.\n\nΟ Αγιώτατος Πατριάρχης Κύριλλος παρέδωσε το βιβλίο του\" Ελευθερία και ευθύνη \" στα αγγλικά στον αφρικανικό κλήρο. Αναμνηστικά μετάλλια απονεμήθηκαν επίσης στον κλήρο.\n\nΟ Προκαθήμενος τίμησε τον κλήρο της Πατριαρχικής Εξαρχίας της Αφρικής με εκκλησιαστικά βραβεία.\n\nΟ Αγιώτατος Πατριάρχης Κύριλλος παρουσίασε την εικόνα του Αγίου Μεγαλομάρτυρος Γεωργίου του Νικηφόρου στον Εκτελεστικό Διευθυντή του Ιδρύματος, Έγκορ Σκοπένκο.\n\n**Βοήθεια**\n\nΜε την ευλογία του Πατριάρχη Κυρίλλου, τριάντα κληρικοί-κοσμήτορες εκκλησιαστικών περιοχών και ανώτεροι ιερείς που εκπροσωπούν 22 αφρικανικές χώρες – πραγματοποιούν προσκύνημα στη Ρωσία από τις 21 έως τις 29 Αυγούστου."},"en":{"auto":"During the meeting of the delegation of the Patriarchal Exarchate of Africa with His Holiness Patriarch Kirill of Moscow and All Russia on August 27, 2025, Metropolitan Konstantin of Cairo and North Africa thanked the leadership of the Department for External Church Relations The Moscow Patriarchate and the Foundation for the Support of Christian Culture and Heritage, with the assistance of which 71 seminarians from Africa study at nine theological schools of the Russian Orthodox Church, as well as many other initiatives are being implemented.\n\nThen the Primate of the Russian Orthodox Church answered the questions of the African clergy in detail.\n\nAt the end of the conversation, the clerics of the Patriarchal Exarchate presented His Holiness with memorable gifts, including a staff made by wood carvers from Uganda and an icon of the Mother of God \"Passion\", made in the technique of intarsia by craftsmen from the island of Mauritius.\n\nHis Holiness Patriarch Kirill handed over his book \"Freedom and Responsibility\" in English to the African clergy. Commemorative medals were also awarded to the clergy.\n\nThe Primate honored the clergy of the Patriarchal Exarchate of Africa with church awards.\n\nHis Holiness Patriarch Kirill presented the icon of the Holy Great Martyr George the Victorious to the Executive Director of the Foundation, Egor Skopenko.\n\n**Help**\n\nWith the blessing of Patriarch Kirill, thirty clerics – deans of church districts and senior priests representing 22 African countries – are making a pilgrimage to Russia from August 21 to 29."},"fr":{"auto":"Dans le cadre de la réunion de la délégation de l'Exarchat patriarcal d'Afrique avec sa Sainteté le Patriarche Cyrille de Moscou et de toute la Russie le 27 août 2025, le métropolite Constantin du Caire et d'Afrique du Nord a remercié la direction du département des relations ecclésiastiques extérieures du Patriarcat de Moscou et le Fonds de soutien à la culture et au patrimoine chrétiens, avec l'aide duquel 71 séminaristes africains sont formés dans neuf écoles spirituelles de l'Église orthodoxe russe, ainsi que de nombreuses autres initiatives.\n\nLe Primat de l'Église orthodoxe russe a ensuite répondu aux questions des prêtres africains.\n\nÀ la fin de la conversation, les clercs de l'Exarchat patriarcal ont offert à sa Sainteté des cadeaux mémorables, notamment un bâton fabriqué par des sculpteurs sur bois ougandais et l'icône de la mère de Dieu «Passionnée», réalisée dans la technique de l'intarsia par des artisans de l'île Maurice.\n\nLe Patriarche Cyrille a remis aux prêtres africains son livre «Liberté et responsabilité» en anglais. Des médailles commémoratives ont également été remises au clergé.\n\nLe Primat a décerné des récompenses ecclésiastiques au clergé de l'Exarchat patriarcal d'Afrique.\n\nAu directeur exécutif de la Fondation Egor skopenko, le Patriarche Cyrille a présenté l'icône du Saint grand martyr George le victorieux.\n\n**Attestation**\n\nAvec la bénédiction du Patriarche Cyrille, trente clercs – les dignitaires des districts ecclésiastiques et les prêtres principaux représentant 22 pays d'Afrique – font du 21 au 29 août un voyage de pèlerinage en Russie."},"ge":{"auto":"2025 წლის 27 აგვისტოს, აფრიკის საპატრიარქო ეგზარქატის დელეგაციის შეხვედრის დროს, მოსკოვისა და სრულიად რუსეთის უწმინდესმა პატრიარქმა კირილმა, კაიროსა და ჩრდილოეთ აფრიკის მიტროპოლიტმა კონსტანტინემ მადლობა გადაუხადა საგარეო საეკლესიო ურთიერთობების დეპარტამენტის ხელმძღვანელობას (DECR) მოსკოვის საპატრიარქო და ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდი, რომელთა დახმარებით 71 სემინარიელი აფრიკიდან სწავლობს რუსეთის მართლმადიდებლური ეკლესიის ცხრა სასულიერო სკოლაში, ასევე ხორციელდება მრავალი სხვა ინიციატივა.\n\nშემდეგ რუსეთის მართლმადიდებელი ეკლესიის წინამძღვარმა დეტალურად უპასუხა აფრიკელი სასულიერო პირების კითხვებს.\n\nსაუბრის ბოლოს, საპატრიარქო ეგზარქატის სასულიერო პირებმა მის უწმინდესობას სამახსოვრო საჩუქრები გადასცეს, მათ შორის უგანდიდან ხის კვერთხებით დამზადებული პერსონალი და ღვთისმშობლის ხატი \"ვნება\", რომელიც დამზადებულია ინტარსიის ტექნიკით ხელოსნების მიერ კუნძულ მავრიკიდან.\n\nუწმინდესმა პატრიარქმა კირილმა აფრიკელ სასულიერო პირებს ინგლისურ ენაზე გადასცა წიგნი \"თავისუფლება და პასუხისმგებლობა\". სასულიერო პირებს სამახსოვრო მედლებიც გადაეცათ.\n\nწინამძღვარმა აფრიკის საპატრიარქო ეგზარქატის სასულიერო პირებს საეკლესიო ჯილდოები გადასცა.\n\nუწმინდესმა პატრიარქმა კირილმა ფონდის აღმასრულებელ დირექტორს, ეგორ სკოპენკოს წმინდა გიორგი გამარჯვებულის ხატი გადასცა.\n\n**დახმარება**\n\nპატრიარქ კირილის კურთხევით, ოცდაათი სასულიერო პირი-საეკლესიო ოლქების დეკანები და 22 აფრიკული ქვეყნის წარმომადგენელი უფროსი მღვდლები – 21-დან 29 აგვისტომდე რუსეთში მომლოცველობენ."},"he":{"auto":"במסגרת פגישת משלחת האקסרכיה הפטריארכלית של אפריקה עם הפטריארך הקדוש ביותר של מוסקבה וכל רוסיה, קיריל, ב-27 באוגוסט 2025, הודה מטרופוליטן קהיר וצפון אפריקה קונסטנטין למנהיגות המחלקה ליחסי כנסיות חיצוניים (OSCS) של הפטריארכיה של מוסקבה וקרן לתמיכה בתרבות ומורשת נוצרית, שבסיועם 71 סמינרים מאפריקה לומדים בתשעה בתי ספר תיאולוגיים של הכנסייה האורתודוכסית הרוסית, כמו גם יוזמות רבות אחרות.\n\nלאחר מכן, ראש הכנסייה האורתודוקסית הרוסית ענה על שאלות של כמרים אפריקאים.\n\nלאחר סיום השיחה, אנשי הדת של האקסארכאט הפטריארכי העניקו לקדושתו מתנות זיכרון, כולל מקל שנעשה על ידי חוטבי עץ מאוגנדה, ואייקון של האם של אלוהים \"תשוקה\", שנעשה בטכניקה של אינטרסיה על ידי אומנים מהאי מאוריקיוס.\n\nהפטריארך הקדוש קיריל העביר לכמרים אפריקאים את ספרו \"חופש ואחריות\" באנגלית. כמו כן, הוענקו לכמרים מדליות זיכרון.\n\nראש הכנסייה העניק פרסים לכמורה של האקסארכאט הפטריארכי של אפריקה.\n\nלמנכ \"ל הקרן יגור סקופנקו, הפטריארך הקדוש קיריל נתן את האייקון של הקדוש השהיד הגדול ג' ורג ' המנצח.\n\n**עזרה**\n\nעל פי ברכתו של הפטריארך קירל, שלושים אנשי דת, אנשי דת של מחוזות הכנסייה וכמרים בכירים, המייצגים 22 מדינות באפריקה, מבצעים מסע צליינים לרוסיה בין ה-21 ל-29 באוגוסט."},"ja":{"auto":"2025年8月27日、モスクワ総主教キリルと全ロシア総主教とのアフリカ総主教管区の代表団の会合で、カイロと北アフリカのメトロポリタンコンスタンティンは、モスクワ総主教区とキリスト教文化と遺産支援財団のリーダーシップに感謝し、アフリカからの71人の神学校がロシア正教会の9つの神学学校で学び、他の多くのイニシアチブが実施されています。\n\nそれからロシア正教会の霊長類はアフリカの聖職者の質問に詳細に答えました。\n\n会話の終わりに、家父長制の聖職者は、ウガンダの木彫り師によって作られたスタッフと、モーリシャス島の職人によってintarsiaの技術で作られた神の母「情熱」のアイコンを含む、思い出に残る贈り物で彼の聖さを提示しました。\n\n彼のホーリネス総主教キリルは、英語で彼の本「自由と責任」をアフリカの聖職者に渡しました。 記念メダルも聖職者に授与されました。\n\n霊長類は、アフリカの総主教管区の聖職者に教会賞を授与しました。\n\n彼の聖なる総主教キリルは、聖ジョージの勝利のアイコンを財団のエグゼクティブディレクターであるエゴール・スコペンコに贈りました。\n\n*•ヘルプ**\n\nキリル総主教の祝福を受けて、22のアフリカ諸国を代表する30人の聖職者–教会地区の学部長と上級司祭–が8月21日から29日までロシアへの巡礼を行"},"ru":{"auto":"В рамках встречи делегации Патриаршего экзархата Африки со Святейшим Патриархом Московским и всея Руси Кириллом 27 августа 2025 года митрополит Каирский и Северо-Африканский Константин поблагодарил руководство Отдела внешних церковных связей (ОВЦС) Московского Патриархата и Фонд поддержки христианской культуры и наследия, при содействии которого 71 семинарист из Африки обучается в девяти духовных школах Русской Православной Церкви, а также осуществляются многие другие инициативы.\n\nЗатем Предстоятель Русской Православной Церкви развернуто ответил на вопросы африканских священнослужителей.\n\nПо окончании беседы клирики Патриаршего экзархата преподнесли Его Святейшеству памятные подарки, в том числе посох, изготовленный резчиками по дереву из Уганды, и икону Божией Матери «Страстная», выполненную в технике интарсии мастерами с острова Маврикий.\n\nСвятейший Патриарх Кирилл передал африканским священнослужителям свою книгу «Свобода и ответственность» на английском языке. Также духовенству были вручены памятные медали.\n\nПредстоятель удостоил церковных наград духовенство Патриаршего экзархата Африки.\n\nИсполнительному директору Фонда Егору Скопенко Святейший Патриарх Кирилл подарил икону святого великомученика Георгия Победоносца.\n\n**Справка**\n\nПо благословению Патриарха Кирилла тридцать клириков – благочинных церковных округов и старших священников, представляющих 22 страны Африки, – с 21 по 29 августа совершают паломническую поездку в Россию.","manual":"В рамках встречи делегации Патриаршего экзархата Африки со Святейшим Патриархом Московским и всея Руси Кириллом 27 августа 2025 года митрополит Каирский и Северо-Африканский Константин поблагодарил руководство Отдела внешних церковных связей (ОВЦС) Московского Патриархата и Фонд поддержки христианской культуры и наследия, при содействии которого 71 семинарист из Африки обучается в девяти духовных школах Русской Православной Церкви, а также осуществляются многие другие инициативы.\n\nЗатем Предстоятель Русской Православной Церкви развернуто ответил на вопросы африканских священнослужителей.\n\nПо окончании беседы клирики Патриаршего экзархата преподнесли Его Святейшеству памятные подарки, в том числе посох, изготовленный резчиками по дереву из Уганды, и икону Божией Матери «Страстная», выполненную в технике интарсии мастерами с острова Маврикий.\n\nСвятейший Патриарх Кирилл передал африканским священнослужителям свою книгу «Свобода и ответственность» на английском языке. Также духовенству были вручены памятные медали.\n\nПредстоятель удостоил церковных наград духовенство Патриаршего экзархата Африки.\n\nИсполнительному директору Фонда Егору Скопенко Святейший Патриарх Кирилл подарил икону святого великомученика Георгия Победоносца.\n\n**Справка**\n\nПо благословению Патриарха Кирилла тридцать клириков – благочинных церковных округов и старших священников, представляющих 22 страны Африки, – с 21 по 29 августа совершают паломническую поездку в Россию."},"sr":{"auto":"У оквиру састанка делегације Патријаршијског егзархата Африке са Светим патријархом Московским и целе Русије Кирилом 27.августа 2025. митрополит Каирски и северноафрички Константин захвалио се руководству одељења за спољне црквене везе (ОВЦС) Московске Патријаршије и Фонд за подршку хришћанској култури и наслеђу, уз помоћ којег се 71 семинариста из Африке обучава у девет духовних школа Руске Православне Цркве, а спроводе се и многе друге иницијативе.\n\nТада је поглавар Руске Православне Цркве развргнуто одговорио на питања афричких свештеника.\n\nПо завршетку разговора, клирици Патријаршких екзархата поклонили су Његовој Светости памћене поклоне, укључујући штап који су резачи направили по дрвету из Уганде, и икону Божије мајке Страстна, коју су у техници интарсије израдили мајстори са острва Маврикиј.\n\nНајсветији Патријарх Кирил предао је афричким свештеницима своју књигу \"слобода и одговорност\" на енглеском језику. Такође, свештеницима су уручене памћене медаље.\n\nПредстоятељ је црквеним наградама удостојио свештенство Патријаршких екзархата Африке.\n\nИзвршном директору Фонда Егору Скопенку свети патријарх Кирил је поклонио икону Светог великомученика Георгија Победоносеца.\n\n**Помоћ**\n\nПо благослову патријарха Кирила, тридесет клирика благочинних црквених округа и старијих свештеника који представљају 22 земље Африке, од 21.до 29. августа обављају ходочаснички пут у Русију."},"tr":{"auto":"Afrika Ataerkil Eksarhlığı delegasyonunun Moskova ve Tüm Rusya'nın en Kutsal Patriği Kirill ile 27 Ağustos 2025 tarihinde Kahire Büyükşehir ve Kuzey Afrika Konstantin ile yaptığı toplantı çerçevesinde, Moskova Patrikhanesi'nin Dış Kilise İlişkileri Bölümünün (UZC) liderliğine ve yardımlarıyla Hıristiyan Kültürünü ve Mirasını Destekleme Fonu'na teşekkür etti.\n\nArdından Rus Ortodoks Kilisesi'nin primatı, Afrikalı din adamlarının sorularını kapsamlı bir şekilde yanıtladı.\n\nKonuşmanın sonunda, Ataerkil Eksarhlığın din adamları, Ugandalı ağaç oymacıları tarafından yapılan bir personel ve Mauritius adasından ustalar tarafından kakmacılık tekniğiyle yapılan Tanrı'nın Annesi «Tutkulu» simgesi de dahil olmak üzere Hazretlerine unutulmaz hediyeler sundular.\n\nEn Kutsal Patrik Cyril, «Özgürlük ve Sorumluluk» adlı kitabını Afrikalı din adamlarına ingilizce olarak verdi. Din adamlarına da hatıra madalyaları takdim edildi.\n\nPrimat, Afrika Ataerkil Eksarhlığının din adamlarına dini ödüller verdi.\n\nEn kutsal Patrik Kirill, Fonun icra direktörü Yegor Skopenko'ya Muzaffer Aziz Büyük Şehit George'un bir ikonunu sundu.\n\n**Bilgi**\n\nPatrik Cyril'in kutsamasıyla, Afrika'daki 22 ülkeyi temsil eden dini bölgelerin dekanları ve kıdemli rahipler olan otuz din adamı, 21-29 Ağustos tarihleri arasında Rusya'ya hac ziyareti yapıyor."}}},"component":"content-flow"},{"images":[{"title":{},"width":1452,"chosen":false,"height":817,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_0ea21b44-9f30-4833-b6a6-1cd236559094","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/09/01/image-name_fe7e129a-e29f-4cbd-8e2f-7cd375b3458d"}],"heading":{},"component":"image-gallery"}],"seo":{"og":{},"html":{}},"settin ој култури и наслеђу."},"tr":{"auto":"Çocuk kampı, Rus Ortodoks Kilisesi ve Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'nın desteğiyle düzenlendi."}}},"picture":[{"alt":{"ae":{"auto":"أقيم معسكر الأطفال \"الحاج\" في تركيا"},"al":{"auto":"Kampi i fëmijëve \"Pilgrim\" u mbajt Në Turqi"},"cn":{"auto":"儿童营\"朝圣者\"在土耳其举行"},"el":{"auto":"Το παιδικό στρατόπεδο \"Pilgrim\" πραγματοποιήθηκε στην Τουρκία"},"en":{"auto":"The children's camp \"Pilgrim\" was held in Turkey"},"fr":{"auto":"Le camp des enfants \"Pilgrim\" a eu lieu en Turquie"},"ge":{"auto":"თურქეთში ბავშვთა ბანაკი \"პილიგრიმი\" გაიმართა"},"he":{"auto":"מחנה הילדים \"צליינים\" נערך בטורקיה"},"ja":{"auto":"子供のキャンプ\"巡礼者\"はトルコで開催されました"},"ru":{"auto":"Детский лагерь «Пилигрим» прошел в Турции","manual":"Детский лагерь «Пилигрим» прошел в Турции"},"sr":{"auto":"Дечији камп \"Пилгрим\" одржан је у Турској"},"tr":{"auto":"Hacım Çocuk Kampı Türkiye'de düzenlendi"}},"src":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_cdeacae8-8158-4a6d-b8e6-b9353917ade4","title":{"ae":{"auto":"أقيم معسكر الأطفال \"الحاج\" في تركيا"},"al":{"auto":"Kampi i fëmijëve \"Pilgrim\" u mbajt Në Turqi"},"cn":{"auto":"儿童营\"朝圣者\"在土耳其举行"},"el":{"auto":"Το παιδικό στρατόπεδο \"Pilgrim\" πραγματοποιήθηκε στην Τουρκία"},"en":{"auto":"The children's camp \"Pilgrim\" was held in Turkey"},"fr":{"auto":"Le camp des enfants \"Pilgrim\" a eu lieu en Turquie"},"ge":{"auto":"თურქეთში ბავშვთა ბანაკი \"პილიგრიმი\" გაიმართა"},"he":{"auto":"מחנה הילדים \"צליינים\" נערך בטורקיה"},"ja":{"auto":"子供のキャンプ\"巡礼者\"はトルコで開催されました"},"ru":{"auto":"Детский лагерь «Пилигрим» прошел в Турции","manual":"Детский лагерь «Пилигрим» прошел в Турции"},"sr":{"auto":"Дечији камп \"Пилгрим\" одржан је у Турској"},"tr":{"auto":"Hacım Çocuk Kampı Türkiye'de düzenlendi"}},"breakpoint":"main"}],"published_at":"2025-08-27T11:32:50+00:00","updated_at":"2025-08-27T13:36:24.063496+00:00","original_lang":"ru","sections":[{"media":{"0":{"picture":{"0":{"alt":{"ru":{}},"title":{"ru":{}}}}},"items":[{"picture":[{"breakpoint":"main"}]}]},"heading":{"description":{"ae":{"auto":"استضافت جمعية اللغة والثقافة الروسية الروسية في إزمير ، التي نظمتها جمعية دراسة اللغة والثقافة الروسية بدعم من الكنيسة الأرثوذكسية الروسية ومؤسسة دعم الثقافة والتراث المسيحي ، بنجاح مخيم أطفال الحاج للمرة الخامسة في 15-25 أغسطس بالقرب من بلدة جيكلي قبالة ساحل بحر إيجة في تركيا.\n\nفي عام 2025 ، شارك 60 فتى وفتاة في المشروع. درس الأطفال اللغة والثقافة الروسية ، وأساسيات الإيمان الأرثوذكسي ، وشاركوا في التدريب البدني العام ، وتعلموا كيفية تقديم الإسعافات الأولية ، وممارسة الرماية ، ورمي الرمح ، والتوجيه ، والمشاركة في المشي لمسافات طويلة ، واكتسبوا مهارات الدفاع عن النفس. تم تنظيم ورشة مسرحية تقليديا في المخيم ، حيث درس الأطفال أساسيات التحدث أمام الجمهور والتمثيل. هذا العام ، أعد المشاركون في المناوبة الكرة وحملوها لأول مرة.\n\nوكان من بين المعسكر ليس فقط أبناء المواطنين الذين يعيشون في تركيا ، ولكن أيضا الأطفال من الأسر التركية. كما شارك الفائزون في مسابقة رسم الأطفال المعجزة 12 في عيد الفصح في أعمال \"الحاج\".\n\nفي 23 أغسطس ، احتفل الكاهن جورجي سيرجييف ، المسؤول عن رعاية المؤمنين من بطريركية موسكو في أراضي جمهورية تركيا ، بالقداس الإلهي على أراضي المخيم. تلقى الأطفال والمعلمين بالتواصل من أسرار المسيح المقدسة. بعد الخدمة ، عقد الكاهن اجتماعا مع \"الحجاج\" الشباب وأجاب على أسئلتهم العديدة."},"al":{"auto":"Shoqata ruse e Gjuhës dhe Kulturës ruse në Izmir organizoi me sukses kampin E Fëmijëve Pilgrim për herë të pestë më 15-25 gusht në afërsi të qytetit Geyikli në brigjet E Egjeut në Turqi me mbështetjen e Kishës Ortodokse ruse dhe Fondacionit Për Mbështetjen E Kulturës Dhe Trashëgimisë Së Krishterë.\n\nNë vitin 2025, 60 djem dhe vajza morën pjesë në projekt. Fëmijët studiuan gjuhën dhe kulturën ruse, bazat e besimit Ortodoks, u angazhuan në stërvitje të përgjithshme fizike, mësuan se si të siguronin ndihmën e parë, praktikuan gjuajtjen me hark, hedhjen e shtizës, orientimin, morën pjesë në mini-rritje dhe fituan aftësi vetëmbrojtëse. Një punëtori teatri u organizua tradicionalisht në kamp, ku fëmijët studiuan bazat e të folurit dhe aktrimit publik. Këtë vit, pjesëmarrësit e ndërrimit përgatitën dhe mbajtën një top për herë të parë.\n\nNë mesin e kampistëve nuk ishin vetëm fëmijët e bashkatdhetarëve që jetonin në Turqi, por edhe fëmijët nga familjet turke. Fituesit e KONKURSIT XII Të vizatimit Të Fëmijëve Të Mrekullisë SË Pashkëve morën pjesë gjithashtu në punën e \"Pilgrim\".\n\nMë 23 gusht, Prifti Georgy Sergeyev, përgjegjës për kujdesin e besimtarëve të Patriarkanës Së Moskës në territorin e Republikës së Turqisë, festoi Liturgjinë Hyjnore në territorin e kampit. Fëmijët dhe mësuesit morën kungimin e Mistereve të Shenjta të Krishtit. Pas shërbimit, prifti mbajti një takim me\" pelegrinët \" e rinj dhe iu përgjigj pyetjeve të tyre të shumta."},"cn":{"auto":"在俄罗斯东正教会和基督教文化和遗产支持基金会的支持下，伊兹密尔的俄罗斯俄语语言和文化协会于8月15日至25日在土耳其爱琴海沿岸的Geyikli镇附近第五次成功组织了朝圣者儿童营。\n\n在2025中，60男孩和女孩参与了该项目。 孩子们学习俄语和文化，正统信仰的基础知识，从事一般的体能训练，学习如何提供急救，练习射箭，标枪投掷，定向越野，参加小型徒步旅行，并获得自卫技能。 传统上在营地组织了一个戏剧讲习班，孩子们在那里学习公共演讲和表演的基础知识。 今年，轮班参与者首次准备并举行了一场舞会。\n\n露营者中不仅有居住在土耳其的同胞的孩子，还有来自土耳其家庭的孩子。 第十二届复活节奇迹儿童绘画比赛的优胜者也参加了\"朝圣者\"的工作。\n\n8月23，负责照顾土耳其共和国境内莫斯科宗主教忠实信徒的Georgy Sergeyev牧师在营地领土上庆祝了神圣的礼拜仪式。 孩子们和老师领受了基督神圣奥秘的圣餐. 仪式结束后，牧师与年轻的\"朝圣者\"举行了一次会议，并回答了他们的众多问题。"},"el":{"auto":"Η ρωσική Ρωσική Ένωση γλώσσας και Πολιτισμού στη Σμύρνη διοργάνωσε με επιτυχία την παιδική κατασκήνωση προσκυνητών για πέμπτη φορά στις 15-25 Αυγούστου στην περιοχή της πόλης Geyikli στα ανοικτά των ακτών του Αιγαίου στην Τουρκία με την υποστήριξη της Ρωσική Ορθόδοξη Εκκλησία και το Ίδρυμα για την υποστήριξη του Χριστιανικού Πολιτισμού και κληρονομιάς.\n\nΤο 2025, 60 αγόρια και κορίτσια συμμετείχαν στο έργο. Τα παιδιά μελέτησαν τη ρωσική γλώσσα και τον πολιτισμό, τα βασικά της ορθόδοξης πίστης, ασχολήθηκαν με τη γενική σωματική άσκηση, έμαθαν πώς να παρέχουν πρώτες βοήθειες, ασκούσαν τοξοβολία, ρίψη Ακοντίου, προσανατολισμό, συμμετείχαν σε μίνι πεζοπορίες και απέκτησαν δεξιότητες αυτοάμυνας. Ένα Εργαστήριο Θεάτρου οργανώθηκε παραδοσιακά στο στρατόπεδο, όπου τα παιδιά μελέτησαν τα βασικά της δημόσιας ομιλίας και της δράσης. Φέτος, οι συμμετέχοντες στη βάρδια προετοίμασαν και κράτησαν μια μπάλα για πρώτη φορά.\n\nΜεταξύ των κατασκηνωτών δεν ήταν μόνο τα παιδιά συμπατριωτών που ζούσαν στην Τουρκία, αλλά και παιδιά από τουρκικές οικογένειες. Οι νικητές του 12ου διαγωνισμού παιδικής ζωγραφικής θαύματος του Πάσχα συμμετείχαν επίσης στο έργο Του \"προσκυνητή\".\n\nΣτις 23 Αυγούστου, ο ιερέας Γκεόργκι Σεργκέγιεφ, υπεύθυνος για τη φροντίδα των πιστών του Πατριαρχείου Μόσχας στο έδαφος της Δημοκρατίας της Τουρκίας, γιόρτασε τη Θεία Λειτουργία στο έδαφος του στρατοπέδου. Τα παιδιά και οι δάσκαλοι έλαβαν κοινωνία των Αγίων Μυστηρίων του Χριστού. Μετά την υπηρεσία, ο ιερέας πραγματοποίησε μια συνάντηση με τους νέους \"προσκυνητές\" και απάντησε στις πολυάριθμες ερωτήσεις τους."},"en":{"auto":"Russian Russian Language and Culture Association in Izmir successfully organized the Pilgrim Children's camp for the fifth time on August 15-25 in the vicinity of the town of Geyikli off the Aegean coast in Turkey with the support of the Russian Orthodox Church and the Foundation for the Support of Christian Culture and Heritage.\n\nIn 2025, 60 boys and girls participated in the project. The children studied Russian language and culture, the basics of the Orthodox faith, engaged in general physical training, learned how to provide first aid, practiced archery, javelin throwing, orienteering, participated in mini-hikes, and gained self-defense skills. A theater workshop was traditionally organized in the camp, where the children studied the basics of public speaking and acting. This year, the shift participants prepared and held a ball for the first time.\n\nAmong the campers were not only the children of compatriots living in Turkey, but also children from Turkish families. The winners of the 12TH Easter Miracle children's drawing contest also took part in the work of \"Pilgrim\".\n\nOn August 23, Priest Georgy Sergeyev, responsible for the care of the faithful of the Moscow Patriarchate in the territory of the Republic of Turkey, celebrated the Divine Liturgy on the territory of the camp. The children and teachers received communion of the Holy Mysteries of Christ. After the service, the priest held a meeting with the young \"pilgrims\" and answered their numerous questions."},"fr":{"auto":"Du 15 au 25 août, dans les environs de la ville de Geikli, au large de la mer Égée, en Turquie, s'est tenu pour la cinquième fois avec succès le camp des enfants «Pilgrim», organisé par l'Association pour l'étude de la langue et de la culture russes à Izmir, avec le soutien de l'Église orthodoxe russe et de La Fondation pour la culture et le patrimoine chrétiens.\n\nEn 2025, 60 garçons et filles ont participé au projet. Les enfants ont étudié la langue et la culture russes, les bases de la foi orthodoxe, se sont engagés dans l'entraînement physique général, ont appris à fournir les premiers soins médicaux, ont pratiqué le tir à l'arc, le lancer du javelot, l'orientation sportive, ont participé à des mini-randonnées, ont reçu des compétences d'autodéfense. Dans le camp, un atelier de théâtre était traditionnellement organisé, où les gars pratiquaient les rudiments de l'oratoire et du théâtre. Cette année, les participants ont préparé et organisé un bal pour la première fois.\n\nParmi les vacanciers dans le camp, il y avait non seulement des enfants de compatriotes vivant en Turquie, mais aussi des enfants de familles turques. Les lauréats du XII concours de dessin pour enfants» miracle de Pâques «ont également participé au travail du»pèlerin\".\n\nLe 23 août, le prêtre Gueorgui Sergeev, responsable de l'alimentation des fidèles du Patriarcat de Moscou sur le territoire de la République Turque, a célébré la divine liturgie sur le territoire du camp. Les enfants et les éducateurs ont pris part aux Saints mystères du Christ. Après le culte, le clergé a rencontré les jeunes» pèlerins \" et a répondu à leurs nombreuses questions."},"ge":{"auto":"რუსული ენისა და კულტურის ასოციაციამ იზმირში წარმატებით მოაწყო პილიგრიმის ბავშვთა ბანაკი მეხუთედ 15-25 აგვისტოს თურქეთის ეგეოსის სანაპიროზე მდებარე ქალაქ გეიკლის სიახლოვეს, რუსეთის მართლმადიდებლური ეკლესიის მხარდაჭერით და ქრისტიანული კულტურისა და მემკვიდრეობის მხარდაჭერის ფონდი.\n\n2025 წელს პროექტში 60 ბიჭი და გოგონა მონაწილეობდა. ბავშვებმა შეისწავლეს რუსული ენა და კულტურა, მართლმადიდებლური რწმენის საფუძვლები, ჩაერთნენ ზოგად ფიზიკურ მომზადებაში, ისწავლეს პირველადი დახმარების გაწევა, ივარჯიშეს მშვილდოსნობაში, თოფების სროლაში, ორიენტაციაში, მონაწილეობა მიიღეს მინი ლაშქრობებში და მოიპოვეს თავდაცვის უნარები. ბანაკში ტრადიციულად მოეწყო თეატრალური სემინარი, სადაც ბავშვებმა შეისწავლეს საჯარო გამოსვლისა და სამსახიობო საფუძვლები. წელს ცვლის მონაწილეებმა პირველად მოამზადეს და გამართეს ბურთი.\n\nბანაკის წევრებს შორის იყვნენ არა მხოლოდ თურქეთში მცხოვრები თანამემამულეების შვილები, არამედ თურქული ოჯახების ბავშვებიც. \"პილიგრიმის\"მუშაობაში მონაწილეობა მიიღეს XII სააღდგომო სასწაულის ბავშვთა ხატვის კონკურსის გამარჯვებულებმაც.\n\n23 აგვისტოს, მღვდელმა გიორგი სერგეევმა, რომელიც პასუხისმგებელია თურქეთის რესპუბლიკის ტერიტორიაზე მოსკოვის საპატრიარქოს ერთგულებზე ზრუნვაზე, ბანაკის ტერიტორიაზე საღმრთო ლიტურგია აღავლინა. ბავშვებმა და მასწავლებლებმა მიიღეს ქრისტეს წმინდა საიდუმლოებების ზიარება. მსახურების შემდეგ მღვდელმა შეხვედრა გამართა ახალგაზრდა \"მომლოცველებთან\" და უპასუხა მათ მრავალრიცხოვან კითხვებს."},"he":{"auto":"ב-15-25 באוגוסט, בסביבת העיר גייקלי, מול חוף הים האגאי בטורקיה, נערך בהצלחה בפעם החמישית מחנה הילדים \"פילגרים\", שאורגן על ידי האגודה לחקר השפה והתרבות הרוסית באיזמיר, בתמיכת הכנסייה האורתודוכסית הרוסית והקרן לתמיכה בתרבות ומורשת נוצרית.\n\nבשנת 2025 השתתפו בפרויקט 60 בנים ובנות. הילדים למדו את השפה והתרבות הרוסית, את יסודות האמונה האורתודוכסית, עסקו באימונים גופניים כלליים, למדו לספק עזרה רפואית ראשונה, התאמנו בחץ וקשת, זריקת כידון, התמצאות ספורטיבית, השתתפו במיני טיולים וקיבלו כישורי הגנה עצמית. במחנה הוקמה באופן מסורתי סדנת תיאטרון, שבה הילדים עוסקים ביסודות אמנות הנאום ובמיומנות המשחק. השנה, משתתפי המשמרת הכינו וערכו כדור לראשונה.\n\nבין הנופשים במחנה היו לא רק ילדים של בני ארצו שגרו בטורקיה, אלא גם ילדים ממשפחות טורקיות. בעבודתו של \" פילגרים \"השתתפו גם הזוכים בתחרות xii של ציור ילדים\"נס הפסחא\".\n\nב-23 באוגוסט, הכומר ג ' ורג ' י סרגייב, שהיה אחראי להאכיל את המאמינים בפטריארכיית מוסקבה בטריטוריה של הרפובליקה הטורקית, ביצע את הליטורגיה האלוהית בטריטוריה של המחנה. ילדים ומחנכים קידשו את המסתורין הקדוש של ישו. לאחר הטקס, הכומר פגש את \"הפילגרים\" הצעירים וענה על שאלותיהם הרבות."},"ja":{"auto":"ロシア語イズミルのロシア語と文化協会は、ロシア正教会とキリスト教文化と遺産の支援のための財団の支援を受けて、トルコのエーゲ海沿岸沖Geyikliの町の近くで月15-25に巡礼者の子供たちのキャンプを成功裏に組織しました。\n\n2025年には、60人の男の子と女の子がプロジェクトに参加しました。 子供たちはロシア語と文化、正統派の信仰の基礎を学び、一般的な身体訓練に従事し、応急処置を提供する方法を学び、アーチェリー、やり投げ、オリエンテーリンを練習し、ミニハイキングに参加し、自己防衛のスキルを獲得しました。 キャンプでは伝統的に演劇ワークショップが開催され、子供たちは人前で話すことと演技の基礎を学びました。 今年は、シフト参加者が初めてボールを準備し、開催しました。\n\nキャンパーの中には、トルコに住む同胞の子供たちだけでなく、トルコの家族の子供たちもいました。 第12回イースターミラクルチルドレンズドローイングコンテストの受賞者も「ピルグリム」の作品に参加しました。\n\n8月23日、トルコ共和国の領土でモスクワ総主教区の忠実な人の世話を担当している司祭Georgy Sergeyevは、キャンプの領土で神の典礼を祝いました。 子供たちと教師はキリストの聖なる謎の聖体拝領を受けました。 礼拝の後、司祭は若い「巡礼者」との会合を開き、彼らの多くの質問に答えました。"},"ru":{"auto":"15-25 августа в окрестностях города Гейикли у побережья Эгейского моря в Турции в пятый раз успешно прошел детский лагерь «Пилигрим», организованный Ассоциацией изучения русского языка и культуры в Измире при поддержке Русской Православной Церкви и Фонда поддержки христианской культуры и наследия.\n\nВ 2025 году участниками проекта стали 60 мальчиков и девочек. Дети изучали русский язык и культуру, основы православной веры, занимались общей физической подготовкой, учились оказывать первую медицинскую помощь, упражнялись в стрельбе из лука, метании копья, спортивном ориентировании, участвовали в мини-походах, получали навыки самообороны. В лагере традиционно была организована театральная мастерская, где ребята занимались основами ораторского искусства и актерским мастерством. В этом году участники смены впервые подготовили и провели бал.\n\nСреди отдыхавших в лагере были не только дети соотечественников, проживающих в Турции, но и ребята из турецких семей. В работе «Пилигрима» также приняли участие победители XII конкурса детского рисунка «Пасхальное чудо».\n\n23 августа ответственный за окормление верующих Московского Патриархата на территории Турецкой Республики священник Георгий Сергеев совершил на территории лагеря Божественную литургию. Дети и воспитатели причастились Святых Христовых Таин. После богослужения священнослужитель провел встречу с юными «пилигримами» и ответил на их многочисленные вопросы.","manual":"15-25 августа в окрестностях города Гейикли у побережья Эгейского моря в Турции в пятый раз успешно прошел детский лагерь «Пилигрим», организованный Ассоциацией изучения русского языка и культуры в Измире при поддержке Русской Православной Церкви и Фонда поддержки христианской культуры и наследия.\n\nВ 2025 году участниками проекта стали 60 мальчиков и девочек. Дети изучали русский язык и культуру, основы православной веры, занимались общей физической подготовкой, учились оказывать первую медицинскую помощь, упражнялись в стрельбе из лука, метании копья, спортивном ориентировании, участвовали в мини-походах, получали навыки самообороны. В лагере традиционно была организована театральная мастерская, где ребята занимались основами ораторского искусства и актерским мастерством. В этом году участники смены впервые подготовили и провели бал.\n\nСреди отдыхавших в лагере были не только дети соотечественников, проживающих в Турции, но и ребята из турецких семей. В работе «Пилигрима» также приняли участие победители XII конкурса детского рисунка «Пасхальное чудо».\n\n23 августа ответственный за окормление верующих Московского Патриархата на территории Турецкой Республики священник Георгий Сергеев совершил на территории лагеря Божественную литургию. Дети и воспитатели причастились Святых Христовых Таин. После богослужения священнослужитель провел встречу с юными «пилигримами» и ответил на их многочисленные вопросы."},"sr":{"auto":"15.и 25. августа у околини града Гейикли код обале Егејског мора у Турској пети пут је успешно прошао дечји камп Пилигрим, који је организовало Удружење за проучавање руског језика и културе у Измиру уз подршку Руске Православне Цркве и Фонда за подршку хришћанске културе и наслеђа.\n\nУ 2025.години, учесници пројекта су били 60 дечака и девојчица. Деца су учила руски језик и културу, основе православне вере, занимала се општем физичком припремом, учила да пружају прву медицинску помоћ, вежбала су стрељање луком, бацање копља, спортско оријентисање, учествовала у мини-походима, добијала вештине самоодбране. У логору је традиционално организована театарска радионица, где су се момци бавили основама ораторске уметности и глумачком вештином. Ове године учесници смене су први пут припремили и одржали бал.\n\nМеђу онима који су се одмарали у логору нису била само деца сународника који су живели у Турској, већ и деца из турских породица. У раду\" Пилигрима \"учествовали су и победници XII конкурса дечјег цртежа\"Пасхално чудо\".\n\n23.августа, свештеник Георгиј Сергеев, одговоран за храњење верника Московског патријархата на територији Турске Републике, извршио је Божанску Литургију на територији логора. Деца и васпитачи су причастили Свете Христове Таине. Након богослужења, свештеник је одржао састанак са младим \"ходочасницима\" и одговорио на њихова бројна питања."},"tr":{"auto":"İzmir'de Rus Dili ve Kültürü Çalışmaları Derneği tarafından Rus Ortodoks Kilisesi ve Hıristiyan Kültürü ve Mirasını Destekleme Vakfı'nın desteğiyle düzenlenen Hacım Çocuk Kampı, 15-25 Ağustos tarihlerinde Türkiye'nin Ege kıyılarındaki Geyikli kasabası yakınlarında beşinci kez başarıyla düzenlendi.\n\n2025 yılında projeye 60 erkek ve kız katılımcı oldu. Çocuklar Rus dilini ve kültürünü, Ortodoks inancının temellerini öğrendiler, genel beden eğitimi aldılar, ilk yardım sağlamayı öğrendiler, okçuluk, cirit atma, oryantiring alıştırmaları yaptılar, mini kampanyalara katıldılar, kendini savunma becerileri kazandılar. Kampta geleneksel olarak, erkeklerin hitabet ve oyunculuğun temellerini ele aldığı bir tiyatro atölyesi düzenlenmişti. Bu yıl vardiyaya katılanlar ilk kez baloyu hazırlayıp düzenlediler.\n\nKampta tatil yapanlar arasında sadece Türkiye'de yaşayan yurttaşların çocukları değil, Türk ailelerinden çocuklar da vardı. «Paskalya Mucizesi» çocuk çizimi için XII yarışmasının kazananları da «Hacılar» ın çalışmalarına katıldı.\n\n23 Ağustos'ta, Türkiye Cumhuriyeti topraklarındaki Moskova Patrikhanesi sadıklarının beslenmesinden sorumlu olan Rahip Georgy Sergeev, kamp alanında İlahi Ayini kutladı. Çocuklar ve eğitimciler, Mesih'in Kutsallarının Kutsallarına katıldılar. Ayinden sonra din adamı genç «hacılar» ile bir toplantı yaptı ve onların birçok sorusunu yanıtladı."}}},"component":"content-flow"},{"images":[{"title":{},"width":1280,"chosen":false,"height":720,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_ce752b75-b79d-468c-9169-73c815e34221","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_ee3e813d-b6ef-4ddf-83c4-2b98c79f8c7a"},{"title":{},"width":598,"chosen":false,"height":336,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_eca06713-725e-4bc0-97c4-78ca6e47ae77","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_9731bef2-9783-4cfe-9986-5d00da701c62"},{"title":{},"width":674,"chosen":false,"height":379,"original":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_e2449a0c-808b-423a-8107-6249c2bbe21f","selected":false,"thumbnail":"https://storage.yandexcloud.net/fscch-uploads/content/2025/08/27/image-name_5976c793-50cb-4916-a60f-aee02f3c87dd"},{"title":{},"width":598,"chosen":false,"height":336,"original":"https://storage.yandexcloud.net/fs
